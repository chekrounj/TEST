        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attFilterEmp'))}</label>
          <select id="rec_emp" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">—</option>
            ${employees.map(e => `<option value="${e.id}">${escapeHtml(e.nom)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attFromDate'))}</label>
          <input id="rec_from" type="date" value="${defaultFrom}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attToDate'))}</label>
          <input id="rec_to" type="date" value="${defaultTo}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div class="flex items-end">
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="rec_only" type="checkbox" class="w-4 h-4">
            ${escapeHtml(t('recOnlyDiff'))}
          </label>
        </div>
      </div>
      <div id="listBody"></div>
    </div>
  `;

  const draw = () => {
    const fEmp = $('#rec_emp').value;
    const fFrom = $('#rec_from').value;
    const fTo = $('#rec_to').value;
    const onlyDiff = $('#rec_only').checked;

    // Build (employeId,date) pairs from both stores
    const pairs = new Map();
    const key = (e, d) => `${e}__${d}`;
    const addPair = (e, d) => { if (e && d) pairs.set(key(e, d), { employeId: Number(e), date: d }); };
    attendance.forEach(a => addPair(a.employeId, a.date));
    timeEntries.forEach(te => addPair(te.employeId, te.date));

    // Aggregate
    const attMap = new Map();
    attendance.forEach(a => attMap.set(key(a.employeId, a.date), Number(a.totalHeures || 0)));
    const projMap = new Map();
    timeEntries.forEach(te => {
      const k = key(te.employeId, te.date);
      projMap.set(k, (projMap.get(k) || 0) + (Number(te.heures) || 0));
    });

    const rows = [];
    for (const { employeId, date } of pairs.values()) {
      if (fEmp && Number(fEmp) !== employeId) continue;
      if (fFrom && date < fFrom) continue;
      if (fTo && date > fTo) continue;
      const pres = attMap.has(key(employeId, date)) ? attMap.get(key(employeId, date)) : null;
      const proj = projMap.get(key(employeId, date)) || 0;
      let ecart = null, applied = seuil, status = 'na';
      if (pres != null) {
        ecart = Math.abs(proj - pres);
        applied = seuilType === 'pourcentage' ? (seuil / 100) * (pres || 1) : seuil;
        if (ecart > applied) status = 'bad';
        else if (ecart > applied * 0.5) status = 'warn';
        else status = 'ok';
      }
      if (onlyDiff && (status === 'ok' || status === 'na')) continue;
      rows.push({ employeId, date, pres, proj, ecart, status });
    }
    rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const badge = (status) => {
      if (status === 'ok')   return `<span class="px-2 py-0.5 rounded-full bg-green-100 text-green-800 text-xs">${escapeHtml(t('recStatusOk'))}</span>`;
      if (status === 'warn') return `<span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 text-xs">${escapeHtml(t('recStatusWarn'))}</span>`;
      if (status === 'bad')  return `<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-800 text-xs">${escapeHtml(t('recStatusBad'))}</span>`;
      return `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs">${escapeHtml(t('recNoAttendance'))}</span>`;
    };

    const html = rows.map(r => `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3">${escapeHtml(r.date)}</td>
        <td class="px-4 py-3">${escapeHtml(empById[r.employeId]?.nom || '?')}</td>
        <td class="px-4 py-3 text-slate-600">${r.pres == null ? '—' : fmt(r.pres)}</td>
        <td class="px-4 py-3 text-slate-600">${fmt(r.proj)}</td>
        <td class="px-4 py-3 ${r.status === 'bad' ? 'text-red-700 font-medium' : r.status === 'warn' ? 'text-orange-700' : 'text-slate-600'}">${r.ecart == null ? '—' : fmt(r.ecart)}</td>
        <td class="px-4 py-3">${badge(r.status)}</td>
      </tr>
    `).join('');

    $('#listBody').innerHTML = tableEl(
      [t('attDate'), t('timeEmployee'), t('recPresence'), t('recProjects'), t('recDiff'), t('recStatus')],
      html
    );
  };

  ['rec_emp','rec_from','rec_to','rec_only'].forEach(id => {
    $('#' + id).onchange = draw;
    if ($('#' + id).type !== 'checkbox') $('#' + id).oninput = draw;
  });
  draw();
}

/* ----- DASHBOARD ----- */
async function renderDashboard() {
  const session = Auth.getSession();
  if (!session) { showAuthShell(); return; }
  const role = session.role;
  const [employees, submissions, timeEntries, missions, recurrences, clients] = await Promise.all([
    DB.getAll('employees'), DB.getAll('submissions'), DB.getAll('timeEntries'),
    DB.getAll('missions'), DB.getAll('recurrences'), DB.getAll('clients')
  ]);
  const monthStart = new Date(); monthStart.setDate(1);
  const monthStartIso = monthStart.toISOString().slice(0,10);
  const today = new Date().toISOString().slice(0,10);
  const empById = Object.fromEntries(employees.map(e => [e.id, e]));

  PAGE.innerHTML = `<h1 class="text-2xl font-bold text-slate-900 mb-6">${escapeHtml(t('dashTitle'))}</h1><div id="dashBody"></div>`;

  if (role === 'admin') {
    await renderAdminTypeChart(employees, timeEntries);
  } else if (role === 'manager') {
    const teamIds = new Set([session.employeId, ...employees.filter(e => Number(e.managerId) === Number(session.employeId)).map(e => e.id)]);
    const pending = submissions.filter(s => s.statut === 'soumis' && teamIds.has(Number(s.employeId))).length;
    const teamMissions = missions.filter(m => teamIds.has(Number(m.assigneEmployeId)));
    const lateTeam = teamMissions.filter(m => m.statut !== 'effectuee' && m.statut !== 'annulee' && (m.dateRealisationDemandee || '') < today);
    // Top 5 employees by late count
    const lateByEmp = {};
    for (const m of lateTeam) lateByEmp[m.assigneEmployeId] = (lateByEmp[m.assigneEmployeId] || 0) + 1;
    const topLate = Object.entries(lateByEmp).sort((a,b) => b[1] - a[1]).slice(0, 5);
    // Top 5 urgent pending
    const urgent = teamMissions
      .filter(m => m.priorite === 'urgente' && m.statut !== 'effectuee' && m.statut !== 'annulee')
      .sort((a,b) => (a.dateRealisationDemandee || '').localeCompare(b.dateRealisationDemandee || ''))
      .slice(0, 5);
    $('#dashBody').innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        ${statCard('✅', t('statToValidate'), pending, 'bg-blue-50 text-blue-800', 'mgr_pending')}
        ${statCard('🔥', t('statTeamMissionsLate'), lateTeam.length, 'bg-red-50 text-red-800', 'mgr_late')}
        <div class="bg-white rounded-xl border border-slate-200 p-5 flex items-center justify-center gap-3">
          <button id="goValidations" class="px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm">${escapeHtml(t('goToValidations'))}</button>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">${escapeHtml(t('statTopLateEmployees'))}</div>
          ${topLate.length === 0 ? '<div class="text-sm text-slate-400">—</div>' :
            topLate.map(([eid, n]) => `<div class="flex justify-between text-sm py-1"><span>${escapeHtml(empById[eid]?.nom || '?')}</span><span class="font-medium text-red-700">${n}</span></div>`).join('')}
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">${escapeHtml(t('statTopUrgent'))}</div>
          ${urgent.length === 0 ? '<div class="text-sm text-slate-400">—</div>' :
            urgent.map(m => `<div data-mid="${m.id}" class="text-sm py-1 cursor-pointer hover:bg-slate-50 rounded px-2"><span class="font-medium">${escapeHtml(m.libelle)}</span> · ${escapeHtml(empById[m.assigneEmployeId]?.nom || '?')} · <span class="text-slate-500">${escapeHtml(m.dateRealisationDemandee || '')}</span></div>`).join('')}
        </div>
      </div>`;
    $('#goValidations')?.addEventListener('click', () => navigate('validations'));
    // Top-5 urgent entries — clickable to detail
    $$('#dashBody [data-mid]').forEach(el => el.onclick = () => showMissionDetail(Number(el.dataset.mid)));

    // Manager: clickable detail cards
    const teamSubs = submissions.filter(s => s.statut === 'soumis' && teamIds.has(Number(s.employeId)));
    const mgrHandlers = {
      mgr_pending: () => showListModal(t('statToValidate'),
        [t('timeEmployee'), t('period'), t('submissionDate')],
        teamSubs.map(s => `<tr><td class="px-3 py-2">${escapeHtml(empById[s.employeId]?.nom||'?')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(s.periodeDebut||'')} → ${escapeHtml(s.periodeFin||'')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(s.dateSubmission||'')}</td></tr>`)),
      mgr_late: () => showListModal(t('statTeamMissionsLate'),
        [t('missionLibelle'), t('missionAssignee'), t('missionDateDemandee')],
        lateTeam.map(m => `<tr class="cursor-pointer hover:bg-slate-50" data-mid="${m.id}"><td class="px-3 py-2">${escapeHtml(m.libelle)}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(empById[m.assigneEmployeId]?.nom||'?')}</td><td class="px-3 py-2 text-red-700">${escapeHtml(m.dateRealisationDemandee||'')}</td></tr>`))
    };
    $$('[data-detail]').forEach(el => {
      const fn = mgrHandlers[el.dataset.detail];
      if (fn) el.onclick = () => {
        fn();
        setTimeout(() => $$('#modalBody [data-mid]').forEach(tr => tr.onclick = () => showMissionDetail(Number(tr.dataset.mid))), 0);
      };
    });
  } else {
    // EMPLOYEE: missions cards FIRST, then existing stats
    await renderEmployeeMissions(session.employeId, clients, missions);

    const myDraft = timeEntries.filter(e => Number(e.employeId) === Number(session.employeId) && (e.statutValidation || 'brouillon') === 'brouillon');
    const draftHours = myDraft.reduce((s, e) => s + (Number(e.heures) || 0), 0);
    const mySubs = submissions.filter(s => Number(s.employeId) === Number(session.employeId)).sort((a,b) => (b.dateSubmission||'').localeCompare(a.dateSubmission||''));
    const last = mySubs[0];
    const lastTxt = last
      ? `${escapeHtml(last.dateSubmission || '')} — <span class="font-medium">${escapeHtml(submissionStatusLabel(last.statut))}</span>${last.statut === 'rejete' && last.commentaire ? `<div class="mt-1 text-xs text-red-700">${escapeHtml(last.commentaire)}</div>` : ''}`
      : '—';
    const extra = document.createElement('div');
    extra.className = 'grid grid-cols-1 md:grid-cols-2 gap-4 mt-6';
    extra.innerHTML = `
      ${statCard('📝', t('statHoursDraft'), fmt(draftHours), 'bg-slate-100 text-slate-800', 'emp_drafts')}
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-xs uppercase tracking-wide text-slate-500 mb-1">${escapeHtml(t('statLastSubmission'))}</div>
        <div class="text-sm">${lastTxt}</div>
        <button id="goMySubs" class="mt-3 px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">${escapeHtml(t('goToMySubs'))}</button>
      </div>
    `;
    $('#dashBody').appendChild(extra);
    $('#goMySubs')?.addEventListener('click', () => navigate('mySubmissions'));

    // Employee: drafts card → list modal
    const empCli = Object.fromEntries((await DB.getAll('clients')).map(c => [c.id, c]));
    const empPro = Object.fromEntries((await DB.getAll('projects')).map(p => [p.id, p]));
    $('[data-detail="emp_drafts"]')?.addEventListener('click', () => {
      showListModal(t('statHoursDraft'),
        [t('timeDate'), t('timeClient'), t('timeProject'), t('timeHours')],
        myDraft.sort((a,b)=>(b.date||'').localeCompare(a.date||''))
          .map(en => `<tr><td class="px-3 py-2">${escapeHtml(en.date)}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(empCli[en.clientId]?.nom||'')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(empPro[en.projectId]?.nom||'')}</td><td class="px-3 py-2 font-medium">${en.heures}</td></tr>`));
    });

    if (last && last.statut === 'rejete') {
      showBanner(fillTpl(t('submissionRejected'), { date: last.dateSubmission || '' }), 'error');
    }
  }
}

/* ----- Employee mission cards (dashboard section) ----- */
async function renderEmployeeMissions(employeId, clients, allMissions) {
  const clientById = Object.fromEntries(clients.map(c => [c.id, c]));
  const allEmps = await DB.getAll('employees');
  const empByIdLocal = Object.fromEntries(allEmps.map(e => [e.id, e]));
  renderEmployeeMissions._empById = empByIdLocal;
  const myMissions = allMissions.filter(m => Number(m.assigneEmployeId) === Number(employeId));
  // Don't show effectuees older than 24h
  const cutoff = Date.now() - 24 * 3600 * 1000;
  const visible = myMissions.filter(m => {
    if (m.statut !== 'effectuee') return m.statut !== 'annulee';
    return m.dateRealisation && Date.parse(m.dateRealisation) >= cutoff;
  });

  // State: sort + filter + clientFilter
  renderEmployeeMissions._sort   = renderEmployeeMissions._sort   || 'due';
  renderEmployeeMissions._filter = renderEmployeeMissions._filter || 'all';
  renderEmployeeMissions._client = renderEmployeeMissions._client || '';

  const wrap = document.createElement('div');
  wrap.className = 'mb-6';
  wrap.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-slate-900">📋 ${escapeHtml(t('myMissions'))}</h2>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 text-sm">
        <span class="text-slate-500">${escapeHtml(t('sortBy'))}</span>
        <div id="emSort" class="flex gap-1">
          ${[
            ['client',  t('sortClient')],
            ['urgency', t('sortUrgency')],
            ['due',     t('sortDue')]
          ].map(([k,l]) => `<button data-k="${k}" class="px-2.5 py-1 rounded text-xs border ${renderEmployeeMissions._sort===k?'bg-blue-700 text-white border-blue-700':'border-slate-300 text-slate-700 hover:bg-slate-50'}">${escapeHtml(l)}</button>`).join('')}
        </div>
      </div>
      <div id="emFilter" class="flex gap-1">
        ${[
          ['all',         t('filterAll')],
          ['a_faire',     t('filterTodo')],
          ['en_cours',    t('filterInProgress')],
          ['late',        t('filterLate')]
        ].map(([k,l]) => `<button data-f="${k}" class="px-2.5 py-1 rounded text-xs border ${renderEmployeeMissions._filter===k?'bg-blue-700 text-white border-blue-700':'border-slate-300 text-slate-700 hover:bg-slate-50'}">${escapeHtml(l)}</button>`).join('')}
      </div>
      <select id="emClient" class="ms-auto px-3 py-1.5 border border-slate-300 rounded text-sm">
        <option value="">${escapeHtml(t('filterClient'))}</option>
        ${clients.filter(c => c.actif !== false).map(c => `<option value="${c.id}" ${String(c.id)===String(renderEmployeeMissions._client)?'selected':''}>${escapeHtml(c.nom)}</option>`).join('')}
      </select>
    </div>
    <div id="emCards"></div>
  `;
  $('#dashBody').appendChild(wrap);

  $$('#emSort [data-k]').forEach(b => b.onclick = () => { renderEmployeeMissions._sort = b.dataset.k; redraw(); });
  $$('#emFilter [data-f]').forEach(b => b.onclick = () => { renderEmployeeMissions._filter = b.dataset.f; redraw(); });
  $('#emClient').onchange = (e) => { renderEmployeeMissions._client = e.target.value; redraw(); };

  function redraw() {
    // Re-sync button highlights
    $$('#emSort [data-k]').forEach(b => {
      const sel = b.dataset.k === renderEmployeeMissions._sort;
      b.className = `px-2.5 py-1 rounded text-xs border ${sel?'bg-blue-700 text-white border-blue-700':'border-slate-300 text-slate-700 hover:bg-slate-50'}`;
    });
    $$('#emFilter [data-f]').forEach(b => {
      const sel = b.dataset.f === renderEmployeeMissions._filter;
      b.className = `px-2.5 py-1 rounded text-xs border ${sel?'bg-blue-700 text-white border-blue-700':'border-slate-300 text-slate-700 hover:bg-slate-50'}`;
    });

    const today = new Date().toISOString().slice(0,10);
    const f = renderEmployeeMissions._filter;
    const cf = renderEmployeeMissions._client;
    const list = visible.filter(m => {
      if (cf && Number(m.clientId) !== Number(cf)) return false;
      if (f === 'a_faire'  && m.statut !== 'a_faire') return false;
      if (f === 'en_cours' && m.statut !== 'en_cours') return false;
      if (f === 'late'     && !(m.statut !== 'effectuee' && m.statut !== 'annulee' && (m.dateRealisationDemandee||'') < today)) return false;
      return true;
    });

    // Sort
    const priOrder = { urgente: 0, normale: 1, basse: 2 };
    const sortFn = renderEmployeeMissions._sort === 'urgency'
      ? (a,b) => (priOrder[a.priorite] ?? 1) - (priOrder[b.priorite] ?? 1) || (a.dateRealisationDemandee||'').localeCompare(b.dateRealisationDemandee||'')
      : renderEmployeeMissions._sort === 'client'
      ? (a,b) => (clientById[a.clientId]?.nom||'').localeCompare(clientById[b.clientId]?.nom||'') || (a.dateRealisationDemandee||'').localeCompare(b.dateRealisationDemandee||'')
      : (a,b) => (a.dateRealisationDemandee||'').localeCompare(b.dateRealisationDemandee||'');
    list.sort(sortFn);

    if (list.length === 0) {
      $('#emCards').innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500">${escapeHtml(t('noMissions'))}</div>`;
      return;
    }

    const renderCard = (m) => {
      const isDone = m.statut === 'effectuee';
      const isLate = !isDone && m.statut !== 'annulee' && (m.dateRealisationDemandee||'') < today;
      const dueCls = dueDateClass(m.dateRealisationDemandee, m.statut);
      let bottom = '';
      if (m.statut === 'a_faire') {
        bottom = `
          <button data-act="start" data-id="${m.id}" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-xs">${escapeHtml(t('markStarted'))}</button>
          <button data-act="done"  data-id="${m.id}" class="px-3 py-1.5 rounded-lg bg-green-600 text-white hover:bg-green-700 text-xs">${escapeHtml(t('markDone'))}</button>
        `;
      } else if (m.statut === 'en_cours') {
        bottom = `
          <button data-act="undo" data-id="${m.id}" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-xs">${escapeHtml(t('cancelStart'))}</button>
          <button data-act="done" data-id="${m.id}" class="px-3 py-1.5 rounded-lg bg-green-600 text-white hover:bg-green-700 text-xs">${escapeHtml(t('markDone'))}</button>
        `;
      } else if (isDone) {
        const days = m.delaiRealisationMs != null ? Math.max(0, Math.round(m.delaiRealisationMs / 86400000)) : '?';
        const txt = fillTpl(t('completedOn'), { date: (m.dateRealisation||'').slice(0,16).replace('T',' '), n: days });
        bottom = `<div class="text-xs text-slate-500">${escapeHtml(txt)}</div>`;
      }
      const empById = renderEmployeeMissions._empById || {};
      const assignedBy = m.creePar ? (empById[m.creePar]?.nom || '?') : null;
      return `
        <div data-mid="${m.id}" class="cursor-pointer bg-white rounded-xl ${priorityBorderClass(m.priorite)} border border-slate-200 p-4 ${isDone ? 'opacity-60' : ''} hover:shadow-md transition-shadow">
          <div class="font-semibold text-slate-900">${escapeHtml(m.libelle)}</div>
          <div class="mt-1"><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs">${escapeHtml(clientById[m.clientId]?.nom || '?')}</span> ${priorityBadge(m.priorite)} ${missionStatusBadge(m.statut)}</div>
          <div class="mt-2 text-sm ${dueCls}">${escapeHtml(t('forDate'))} ${escapeHtml(m.dateRealisationDemandee || '?')}${isLate ? ' ⚠' : ''}</div>
          ${assignedBy ? `<div class="mt-1 text-xs text-slate-500">${escapeHtml(t('assignedBy'))} ${escapeHtml(assignedBy)}</div>` : ''}
          ${m.description ? `<div class="mt-2 text-sm text-slate-600 line-clamp-2">${escapeHtml(m.description)}</div>` : ''}
          ${bottom ? `<div class="mt-3 flex gap-2 flex-wrap">${bottom}</div>` : ''}
        </div>`;
    };

    if (renderEmployeeMissions._sort === 'client') {
      // Group by client
      const groups = {};
      for (const m of list) {
        const k = clientById[m.clientId]?.nom || '?';
        (groups[k] = groups[k] || []).push(m);
      }
      const html = Object.entries(groups).map(([name, ms]) => `
        <div class="mb-5">
          <div class="text-sm font-semibold text-slate-700 mb-2">${escapeHtml(name)} <span class="text-slate-400 font-normal">(${ms.length})</span></div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">${ms.map(renderCard).join('')}</div>
        </div>`).join('');
      $('#emCards').innerHTML = html;
    } else {
      $('#emCards').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-3">${list.map(renderCard).join('')}</div>`;
    }

    $$('#emCards [data-mid]').forEach(card => {
      card.onclick = (ev) => {
        if (ev.target.closest('[data-act]')) return; // ignore action buttons
        const mid = Number(card.dataset.mid);
        showMissionDetail(mid);
      };
    });
    $$('#emCards [data-act]').forEach(b => b.onclick = async () => {
      const id = Number(b.dataset.id);
      const act = b.dataset.act;
      if (act === 'start') {
        await DB.update('missions', id, { statut: 'en_cours' });
        renderDashboard();
      } else if (act === 'undo') {
        await DB.update('missions', id, { statut: 'a_faire' });
        renderDashboard();
      } else if (act === 'done') {
        const updated = await DB.marquerMissionEffectuee(id);
        const days = updated.delaiRealisationMs != null ? Math.max(0, Math.round(updated.delaiRealisationMs / 86400000)) : 0;
        if (updated.respectDelaiDemande === false) {
          // Late: compute late days
          const lateDays = Math.max(1, Math.ceil((Date.parse(updated.dateRealisation) - Date.parse(updated.dateRealisationDemandee + 'T23:59:59')) / 86400000));
          showBanner(fillTpl(t('completedLate'), { n: lateDays }), 'warn');
        } else {
          toast(fillTpl(t('completedInTime'), { n: days }));
        }
        renderDashboard();
      }
    });
  }

  redraw();
}

async function renderAdminTypeChart(employees, timeEntries) {
  // Previous full calendar month
  const today = new Date();
  const firstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  const lastDay  = new Date(today.getFullYear(), today.getMonth(), 0);
  const startIso = firstDay.toISOString().slice(0, 10);
  const endIso   = lastDay.toISOString().slice(0, 10);
  const localeBcp = LANG === 'fr' ? 'fr-FR' : LANG === 'he' ? 'he-IL' : 'en-US';
  const monthLabel = firstDay.toLocaleDateString(localeBcp, { month: 'long', year: 'numeric' });

  const [allClients, allProjects] = await Promise.all([DB.getAll('clients'), DB.getAll('projects')]);
  const cById = Object.fromEntries(allClients.map(c => [c.id, c.nom]));
  const pById = Object.fromEntries(allProjects.map(p => [p.id, p]));
  const eFull = Object.fromEntries(employees.map(e => [e.id, e]));

  const lastMonthEntries = timeEntries.filter(en => (en.date || '') >= startIso && (en.date || '') <= endIso);

  const byType = {};
  for (const en of lastMonthEntries) {
    const proj = pById[en.projectId];
    const type = proj?.typeProjet || t('untyped');
    const hours = Number(en.heures) || 0;
    const rate  = Number(eFull[en.employeId]?.tauxHoraire) || 0;
    const cost  = hours * rate;
    if (!byType[type]) byType[type] = { hours: 0, cost: 0, byClient: {} };
    byType[type].hours += hours;
    byType[type].cost  += cost;
    const cName = cById[en.clientId] || '—';
    if (!byType[type].byClient[cName]) byType[type].byClient[cName] = { hours: 0, cost: 0 };
    byType[type].byClient[cName].hours += hours;
    byType[type].byClient[cName].cost  += cost;
  }
  const sorted = Object.entries(byType).sort((a, b) => b[1].hours - a[1].hours);

  const chartHeight = Math.max(80, sorted.length * 26);
  $('#dashBody').innerHTML = `
    <div class="bg-white rounded-xl border border-slate-200 p-4 max-w-2xl">
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-1">${escapeHtml(t('chartHoursByType'))}</div>
      <div class="text-sm font-semibold text-slate-800 mb-3">${escapeHtml(monthLabel)}</div>
      ${sorted.length === 0
        ? `<p class="text-sm text-slate-500">${escapeHtml(t('noResults'))}</p>`
        : `<canvas id="ch_typeMain" height="${chartHeight}" style="max-width:320px"></canvas>
           <p class="text-xs text-slate-500 mt-3">${escapeHtml(t('clickForDetail'))}</p>`}
    </div>
  `;

  if (!sorted.length || typeof Chart === 'undefined') return;

  const inst = Chart.getChart('ch_typeMain');
  if (inst) inst.destroy();

  new Chart($('#ch_typeMain'), {
    type: 'bar',
    data: {
      labels: sorted.map(([type, d]) => `${type} · ${d.hours.toFixed(1)} h`),
      datasets: [{
        data: sorted.map(([, d]) => +d.hours.toFixed(2)),
        backgroundColor: '#4f46e5',
        borderRadius: 3
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: (ctx) => {
            const [, d] = sorted[ctx.dataIndex];
            return `${d.hours.toFixed(2)} h · ${d.cost.toFixed(2)}`;
          }
        } }
      },
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 0, bottom: 0 } },
      scales: {
        x: { display: false, beginAtZero: true },
        y: { grid: { display: false }, ticks: { font: { size: 11 } }, border: { display: false } }
      },
      datasets: { bar: { categoryPercentage: 0.95, barPercentage: 0.95 } },
      onClick: (ev, elements) => {
        if (!elements.length) return;
        const idx = elements[0].index;
        const [type, data] = sorted[idx];
        const rows = Object.entries(data.byClient)
          .sort((a, b) => b[1].hours - a[1].hours)
          .map(([cName, d]) => `<tr><td class="px-3 py-2">${escapeHtml(cName)}</td><td class="px-3 py-2 text-end font-medium">${d.hours.toFixed(2)}</td><td class="px-3 py-2 text-end font-medium">${d.cost.toFixed(2)}</td></tr>`);
        // Add total row
        rows.push(`<tr class="bg-slate-50 font-semibold border-t border-slate-200"><td class="px-3 py-2">${escapeHtml(t('reportTotalHours'))}/${escapeHtml(t('reportTotalCost'))}</td><td class="px-3 py-2 text-end">${data.hours.toFixed(2)}</td><td class="px-3 py-2 text-end">${data.cost.toFixed(2)}</td></tr>`);
        showListModal(`${type} — ${monthLabel}`, [t('timeClient'), t('colHours'), t('colCost')], rows);
      }
    }
  });
}

async function drawAdminCharts(employees, missions, timeEntries) {
  if (typeof Chart === 'undefined') return;
  // Destroy any previous chart instances on these canvases (Chart.js holds a registry)
  ['ch_client','ch_emp','ch_miss','ch_typeH','ch_typeC'].forEach(id => {
    const inst = Chart.getChart(id);
    if (inst) inst.destroy();
  });
  const clients = await DB.getAll('clients');
  const projects = await DB.getAll('projects');
  const cById = Object.fromEntries(clients.map(c => [c.id, c.nom]));
  const eFull = Object.fromEntries(employees.map(e => [e.id, e]));
  const eById = Object.fromEntries(employees.map(e => [e.id, e.nom]));
  const pById = Object.fromEntries(projects.map(p => [p.id, p]));

  const today = new Date(); today.setHours(0,0,0,0);
  const since = new Date(today.getTime() - 30 * 86400000);
  const sinceIso = since.toISOString().slice(0,10);
  const recent = timeEntries.filter(en => (en.date || '') >= sinceIso);

  // 1) Hours by client — previous full calendar month, top 5
  const lastMonthStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  const lastMonthEnd   = new Date(today.getFullYear(), today.getMonth(), 0);
  const startIsoLM = lastMonthStart.toISOString().slice(0,10);
  const endIsoLM   = lastMonthEnd.toISOString().slice(0,10);
  const lastMonthEntries = timeEntries.filter(en => (en.date || '') >= startIsoLM && (en.date || '') <= endIsoLM);
  const byClient = {};
  for (const en of lastMonthEntries) {
    const k = cById[en.clientId] || '—';
    byClient[k] = (byClient[k] || 0) + (Number(en.heures) || 0);
  }
  const cliEntries = Object.entries(byClient).sort((a,b) => b[1] - a[1]).slice(0, 5);
  // Compact "comparative" horizontal bar style:
  // - axes hidden (no absolute scale shown — bars sized relative to each other)
  // - values shown inline in the label so we don't lose information
  // - bars fill the canvas height (flex thickness), almost no gap
  const compactBarOpts = {
    plugins: { legend: { display: false }, tooltip: { enabled: true } },
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 0, bottom: 0 } },
    scales: {
      x: { display: false, beginAtZero: true },
      y: { grid: { display: false }, ticks: { font: { size: 11 }, padding: 2 }, border: { display: false } }
    },
    datasets: { bar: { categoryPercentage: 0.98, barPercentage: 0.95 } }
  };

  if ($('#ch_client')) new Chart($('#ch_client'), {
    type: 'bar',
    data: {
      labels: cliEntries.map(x => `${x[0]} · ${(+x[1]).toFixed(1)} h`),
      datasets: [{ label: 'h', data: cliEntries.map(x => +x[1].toFixed(2)), backgroundColor: '#3b82f6', borderRadius: 3 }]
    },
    options: compactBarOpts
  });

  // 2) Hours by employee — same compact comparative look, top 5
  const byEmp = {};
  for (const en of recent) {
    const k = eById[en.employeId] || '—';
    byEmp[k] = (byEmp[k] || 0) + (Number(en.heures) || 0);
  }
  const empEntries = Object.entries(byEmp).sort((a,b) => b[1] - a[1]).slice(0, 5);
  if ($('#ch_emp')) new Chart($('#ch_emp'), {
    type: 'bar',
    data: {
      labels: empEntries.map(x => `${x[0]} · ${(+x[1]).toFixed(1)} h`),
      datasets: [{ label: 'h', data: empEntries.map(x => +x[1].toFixed(2)), backgroundColor: '#10b981', borderRadius: 3 }]
    },
    options: compactBarOpts
  });

  // 3) Mission status distribution
  const statusKeys = [
    ['a_faire',   'missionStatusAFaire'],
    ['en_cours',  'missionStatusEnCours'],
    ['effectuee', 'missionStatusEffectuee'],
    ['annulee',   'missionStatusAnnulee']
  ];
  const counts = statusKeys.map(([s]) => missions.filter(m => m.statut === s).length);
  if ($('#ch_miss')) new Chart($('#ch_miss'), {
    type: 'doughnut',
    data: { labels: statusKeys.map(([, k]) => t(k)),
      datasets: [{ data: counts, backgroundColor: ['#94a3b8','#f59e0b','#10b981','#cbd5e1'], borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '60%',
      plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 } } } }
    }
  });

  // 4+5) Last 3 months × project type → hours and cost
  const now = new Date();
  const months = []; // [{label:'2025-04', y:2025, m:3}, ...] last-3-months including current
  for (let i = 2; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ y: d.getFullYear(), m: d.getMonth(), label: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` });
  }
  const earliest = new Date(months[0].y, months[0].m, 1);
  const earliestIso = earliest.toISOString().slice(0,10);
  const recent3m = timeEntries.filter(en => (en.date || '') >= earliestIso);

  // Aggregate (month, type) → { hours, cost }
  const agg = {}; // type → { 'YYYY-MM': { h, c } }
  const typeSet = new Set();
  for (const en of recent3m) {
    const proj = pById[en.projectId];
    const type = proj?.typeProjet || t('untyped');
    typeSet.add(type);
    const dt = new Date(en.date + 'T00:00:00');
    const lbl = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    const hours = Number(en.heures) || 0;
    const rate = Number(eFull[en.employeId]?.tauxHoraire) || 0;
    if (!agg[type]) agg[type] = {};
    if (!agg[type][lbl]) agg[type][lbl] = { h: 0, c: 0 };
    agg[type][lbl].h += hours;
    agg[type][lbl].c += hours * rate;
  }
  const types = Array.from(typeSet);
  const palette = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#ec4899','#84cc16','#0ea5e9'];
  const datasetsHours = types.map((type, i) => ({
    label: type,
    data: months.map(m => +(agg[type]?.[m.label]?.h || 0).toFixed(2)),
    backgroundColor: palette[i % palette.length]
  }));
  const datasetsCost = types.map((type, i) => ({
    label: type,
    data: months.map(m => +(agg[type]?.[m.label]?.c || 0).toFixed(2)),
    backgroundColor: palette[i % palette.length]
  }));
  const stackedOpts = {
    responsive: true, maintainAspectRatio: false,
    layout: { padding: 2 },
    plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, padding: 8, font: { size: 10 } } } },
    scales: {
      x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } }, border: { display: false } },
      y: { stacked: true, ticks: { font: { size: 9 }, maxTicksLimit: 4 }, grid: { color: 'rgba(0,0,0,.04)' }, border: { display: false } }
    },
    datasets: { bar: { categoryPercentage: 0.7, barPercentage: 0.95 } }
  };
  if ($('#ch_typeH')) new Chart($('#ch_typeH'), {
    type: 'bar', data: { labels: months.map(m => m.label), datasets: datasetsHours }, options: stackedOpts
  });
  if ($('#ch_typeC')) new Chart($('#ch_typeC'), {
    type: 'bar', data: { labels: months.map(m => m.label), datasets: datasetsCost }, options: stackedOpts
  });
}

function wireAdminDashboardClicks(employees, submissions, missions, recurrences) {
  const empById = Object.fromEntries(employees.map(e => [e.id, e]));
  const today = new Date().toISOString().slice(0,10);
  const monthIso = (() => { const d = new Date(); d.setDate(1); return d.toISOString().slice(0,10); })();
  const handlers = {
    activeEmployees: () => showListModal(t('statActiveEmployees'),
      [t('empName'), t('empEmail'), t('role')],
      employees.filter(e => e.actif !== false)
        .map(e => `<tr><td class="px-3 py-2">${escapeHtml(e.nom)}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(e.email||'')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(roleLabel(e.role||'employe'))}</td></tr>`)),
    pendingSubs: () => showListModal(t('statPendingSubs'),
      [t('timeEmployee'), t('period'), t('submissionDate')],
      submissions.filter(s => s.statut === 'soumis')
        .map(s => `<tr><td class="px-3 py-2">${escapeHtml(empById[s.employeId]?.nom||'?')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(s.periodeDebut||'')} → ${escapeHtml(s.periodeFin||'')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(s.dateSubmission||'')}</td></tr>`)),
    rejectedSubs: () => showListModal(t('statRejectedThisMonth'),
      [t('timeEmployee'), t('period'), 'Commentaire'],
      submissions.filter(s => s.statut === 'rejete' && (s.dateValidation||'') >= monthIso)
        .map(s => `<tr><td class="px-3 py-2">${escapeHtml(empById[s.employeId]?.nom||'?')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(s.periodeDebut||'')} → ${escapeHtml(s.periodeFin||'')}</td><td class="px-3 py-2 text-red-700 text-sm">${escapeHtml(s.commentaire||'')}</td></tr>`)),
    activeMissions: () => showListModal(t('statActiveMissions'),
      [t('missionLibelle'), t('missionAssignee'), t('missionDateDemandee'), t('missionStatut')],
      missions.filter(m => m.statut !== 'effectuee' && m.statut !== 'annulee')
        .map(m => `<tr class="cursor-pointer hover:bg-slate-50" data-mid="${m.id}"><td class="px-3 py-2">${escapeHtml(m.libelle)}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(empById[m.assigneEmployeId]?.nom||'?')}</td><td class="px-3 py-2 ${dueDateClass(m.dateRealisationDemandee, m.statut)}">${escapeHtml(m.dateRealisationDemandee||'')}</td><td class="px-3 py-2">${missionStatusBadge(m.statut)}</td></tr>`)),
    lateMissions: () => showListModal(t('statTeamMissionsLate'),
      [t('missionLibelle'), t('missionAssignee'), t('missionDateDemandee')],
      missions.filter(m => m.statut !== 'effectuee' && m.statut !== 'annulee' && (m.dateRealisationDemandee||'') < today)
        .map(m => `<tr class="cursor-pointer hover:bg-slate-50" data-mid="${m.id}"><td class="px-3 py-2">${escapeHtml(m.libelle)}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(empById[m.assigneEmployeId]?.nom||'?')}</td><td class="px-3 py-2 text-red-700">${escapeHtml(m.dateRealisationDemandee||'')}</td></tr>`)),
    activeRecs: () => showListModal(t('statActiveRecurrences'),
      [t('missionLibelle'), t('missionAssignee'), t('recPeriodicity')],
      recurrences.filter(r => r.actif !== false)
        .map(r => `<tr><td class="px-3 py-2">${escapeHtml(r.libelle)}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(empById[r.assigneEmployeId]?.nom||'?')}</td><td class="px-3 py-2 text-slate-600">${escapeHtml(summarizeRecurrence(r))}</td></tr>`)),
    respectRate: () => {
      const done = missions.filter(m => m.statut === 'effectuee');
      const grouped = {};
      for (const m of done) {
        const k = m.assigneEmployeId;
        if (!grouped[k]) grouped[k] = { total: 0, ok: 0 };
        grouped[k].total++;
        if (m.respectDelaiDemande === true) grouped[k].ok++;
      }
      const rows = Object.entries(grouped).map(([eid, v]) => {
        const pct = v.total ? Math.round(100 * v.ok / v.total) : 0;
        return `<tr><td class="px-3 py-2">${escapeHtml(empById[eid]?.nom||'?')}</td><td class="px-3 py-2 text-slate-600">${v.total}</td><td class="px-3 py-2 ${pct >= 80 ? 'text-green-700' : pct >= 50 ? 'text-amber-700' : 'text-red-700'} font-medium">${pct}%</td></tr>`;
      });
      showListModal(t('statRespectRate'), [t('timeEmployee'), t('totalHours'), '%'], rows);
    }
  };
  $$('[data-detail]').forEach(el => el.onclick = () => {
    const fn = handlers[el.dataset.detail];
    if (fn) {
      fn();
      // Make rows with data-mid clickable for mission detail.
      setTimeout(() => {
        $$('#modalBody [data-mid]').forEach(tr => tr.onclick = () => showMissionDetail(Number(tr.dataset.mid)));
      }, 0);
    }
  });
}

function showListModal(title, headers, rows) {

    ? `<table class="w-full text-sm">

    onSave: async () => true
  });

}

/* ----- VALIDATIONS (manager queue) ----- */
async function renderValidations() {
  const session = Auth.getSession();
  if (!session) return;
  const [employees, submissions, timeEntries, attendance] = await Promise.all([
    DB.getAll('employees'), DB.getAll('submissions'),
    DB.getAll('timeEntries'), DB.getAll('attendance')
  ]);
  const empById = Object.fromEntries(employees.map(e => [e.id, e]));
  const isAdmin = session.role === 'admin';
  const teamIds = new Set([session.employeId, ...employees.filter(e => Number(e.managerId) === Number(session.employeId)).map(e => e.id)]);
  const visible = submissions.filter(s => s.statut === 'soumis' && (isAdmin || teamIds.has(Number(s.employeId))))
    .sort((a,b) => (a.dateSubmission || '').localeCompare(b.dateSubmission || ''));

  PAGE.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-900">${escapeHtml(t('submissionsTitle'))}</h1>
      <button id="subsExportBtn" class="px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">📊 ${escapeHtml(t('exportExcel'))}</button>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
      <div id="listBody"></div>
    </div>
  `;
  $('#subsExportBtn').onclick = () => exportEntity('submissions');

  const rows = await Promise.all(visible.map(async s => {
    const entries = timeEntries.filter(e => Number(e.submissionId) === Number(s.id));
    const total = entries.reduce((sum, e) => sum + (Number(e.heures) || 0), 0);
    // discrepancy (sum across period)
    const att = attendance.filter(a => Number(a.employeId) === Number(s.employeId) && a.date >= s.periodeDebut && a.date <= s.periodeFin);
    const presence = att.reduce((sum, a) => sum + (Number(a.totalHeures) || 0), 0);
    const ecart = att.length ? Math.abs(total - presence) : null;
    return `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3">${escapeHtml(empById[s.employeId]?.nom || '?')}</td>
        <td class="px-4 py-3">${escapeHtml(s.periodeDebut)} → ${escapeHtml(s.periodeFin)}</td>
        <td class="px-4 py-3">${escapeHtml(s.dateSubmission || '')}</td>
        <td class="px-4 py-3 font-medium">${fmt(total)}</td>
        <td class="px-4 py-3 text-slate-600">${ecart == null ? '—' : fmt(ecart) + ' h'}</td>
        <td class="px-4 py-3"><button data-act="review" data-id="${s.id}" class="text-blue-700 hover:underline text-sm">${escapeHtml(t('review'))}</button></td>
      </tr>`;
  }));
  $('#listBody').innerHTML = tableEl(
    [t('timeEmployee'), t('period'), t('submissionDate'), t('totalHours'), t('recDiff'), t('actions')],
    rows.join('')
  );

  $$('#listBody [data-act="review"]').forEach(b => b.onclick = () => reviewSubmission(Number(b.dataset.id)));
}

async function reviewSubmission(submissionId) {
  const sub = await DB.getById('submissions', submissionId);
  if (!sub) return;
  if (!await Auth.canValidate(sub.employeId)) {
    toast(t('forbidden'));
    return;
  }
  const [employees, allEntries, projects, tasks, clients] = await Promise.all([
    DB.getAll('employees'), DB.getAll('timeEntries'),
    DB.getAll('projects'), DB.getAll('tasks'), DB.getAll('clients')
  ]);
  const emp = employees.find(e => e.id === sub.employeId);
  const projectById = Object.fromEntries(projects.map(p => [p.id, p]));
  const taskById = Object.fromEntries(tasks.map(x => [x.id, x]));
  const clientById = Object.fromEntries(clients.map(c => [c.id, c]));
  const entries = allEntries.filter(e => Number(e.submissionId) === Number(submissionId));
  const total = entries.reduce((s, e) => s + (Number(e.heures) || 0), 0);

  const grouped = {};
  for (const e of entries) {
    const key = `${projectById[e.projectId]?.nom || '?'} / ${taskById[e.taskId]?.nom || '?'}`;
    grouped[key] = (grouped[key] || 0) + (Number(e.heures) || 0);
  }

  const detailRows = entries.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e => `
    <tr>
      <td class="px-3 py-2 text-sm">${escapeHtml(e.date)}</td>
      <td class="px-3 py-2 text-sm">${escapeHtml(clientById[e.clientId]?.nom || '')}</td>
      <td class="px-3 py-2 text-sm">${escapeHtml(projectById[e.projectId]?.nom || '')}</td>
      <td class="px-3 py-2 text-sm">${escapeHtml(taskById[e.taskId]?.nom || '')}</td>
      <td class="px-3 py-2 text-sm font-medium">${e.heures}</td>
      <td class="px-3 py-2 text-sm text-slate-600">${escapeHtml(e.description || '')}</td>
    </tr>`).join('');
  const groupRows = Object.entries(grouped).map(([k, v]) => `
    <tr><td class="px-3 py-1.5 text-sm">${escapeHtml(k)}</td><td class="px-3 py-1.5 text-sm font-medium">${fmt(v)}</td></tr>`).join('');

  openModal({
    title: `${t('review')} — ${emp?.nom || ''} (${sub.periodeDebut} → ${sub.periodeFin})`,
    bodyHtml: `
      <div class="space-y-4 max-h-[70vh] overflow-y-auto">
        <div class="bg-slate-50 border border-slate-200 rounded p-3 text-sm">
          <strong>${escapeHtml(t('totalHours'))}:</strong> ${fmt(total)}
        </div>
        <div>
          <p class="text-sm font-medium text-slate-700 mb-1">${escapeHtml(t('timeProject'))} / ${escapeHtml(t('timeTask'))}</p>
          <table class="w-full border border-slate-200 rounded"><tbody class="divide-y divide-slate-100">${groupRows}</tbody></table>
        </div>
        <div>
          <p class="text-sm font-medium text-slate-700 mb-1">${escapeHtml(t('recentEntries'))}</p>
          <table class="w-full border border-slate-200 rounded">
            <thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr>
              <th class="px-3 py-1.5 text-start">${escapeHtml(t('timeDate'))}</th>
              <th class="px-3 py-1.5 text-start">${escapeHtml(t('timeClient'))}</th>
              <th class="px-3 py-1.5 text-start">${escapeHtml(t('timeProject'))}</th>
              <th class="px-3 py-1.5 text-start">${escapeHtml(t('timeTask'))}</th>
              <th class="px-3 py-1.5 text-start">${escapeHtml(t('timeHours'))}</th>
              <th class="px-3 py-1.5 text-start">${escapeHtml(t('timeDescription'))}</th>
            </tr></thead>
            <tbody class="divide-y divide-slate-100">${detailRows}</tbody>
          </table>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('rejectComment'))}</label>
          <textarea id="rev_comment" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>
        <div class="flex gap-2 justify-end">
          <button id="rev_reject" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 text-sm">${escapeHtml(t('reject'))}</button>
          <button id="rev_validate" class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 text-sm">${escapeHtml(t('validate'))}</button>
        </div>
      </div>`,
    hideSave: true,
    onSave: async () => true
  });

  $('#rev_validate').onclick = async () => {
    await DB.update('submissions', sub.id, {
      statut: 'valide',
      validePar: Auth.getSession().employeId,
      dateValidation: new Date().toISOString().slice(0,10),
      commentaire: $('#rev_comment').value.trim() || ''
    });
    for (const e of entries) {
      await DB.update('timeEntries', e.id, { statutValidation: 'valide', verrouille: true });
    }
    toast(t('submissionValidated'));
    $('#modalClose').click();
    renderValidations();
  };
  $('#rev_reject').onclick = async () => {
    const c = $('#rev_comment').value.trim();
    if (!c) { toast(t('commentRequired')); return; }
    await DB.update('submissions', sub.id, {
      statut: 'rejete',
      validePar: Auth.getSession().employeId,
      dateValidation: new Date().toISOString().slice(0,10),
      commentaire: c
    });
    for (const e of entries) {
      await DB.update('timeEntries', e.id, { statutValidation: 'rejete', verrouille: false });
    }
    toast(t('saved'));
    $('#modalClose').click();
    renderValidations();
  };
}

/* ----- MISSIONS helpers ----- */
function priorityBadge(p) {
  const cls = p === 'urgente' ? 'bg-red-100 text-red-800'
            : p === 'basse'   ? 'bg-slate-100 text-slate-600'
            : 'bg-blue-100 text-blue-800';
  const lbl = p === 'urgente' ? t('priorityUrgente') : p === 'basse' ? t('priorityBasse') : t('priorityNormale');
  return `<span class="px-2 py-0.5 rounded-full text-xs ${cls}">${escapeHtml(lbl)}</span>`;
}
function priorityBorderClass(p) {
  return p === 'urgente' ? 'border-l-4 border-red-500'
       : p === 'basse'   ? 'border-l-4 border-slate-400'
       : 'border-l-4 border-blue-500';
}
function missionStatusBadge(s) {
  const map = {
    a_faire:   { lbl: t('missionStatusAFaire'),   cls: 'bg-slate-100 text-slate-700' },
    en_cours:  { lbl: t('missionStatusEnCours'),  cls: 'bg-amber-100 text-amber-800' },
    effectuee: { lbl: t('missionStatusEffectuee'),cls: 'bg-green-100 text-green-800' },
    annulee:   { lbl: t('missionStatusAnnulee'),  cls: 'bg-slate-200 text-slate-500' }
  };
  const x = map[s] || map.a_faire;
  return `<span class="px-2 py-0.5 rounded-full text-xs ${x.cls}">${escapeHtml(x.lbl)}</span>`;
}
function dueDateClass(due, statut) {
  if (statut === 'effectuee' || statut === 'annulee') return 'text-slate-500';
  if (!due) return 'text-slate-700';
  const today = new Date().toISOString().slice(0,10);
  if (due < today) return 'text-red-700 font-medium';
  const d2 = new Date(); d2.setDate(d2.getDate() + 2);
  if (due <= d2.toISOString().slice(0,10)) return 'text-orange-700';
  return 'text-slate-700';
}
function summarizeRecurrence(rec) {
  if (rec.periodicite === 'quotidien') {
    const n = Number(rec.parametre?.tousLesNJours) || 1;
    return n === 1 ? (LANG === 'fr' ? 'Tous les jours' : LANG === 'he' ? 'כל יום' : 'Every day')
                   : `${t('recDailyEvery')} ${n} ${t('recDays')}`;
  }
  if (rec.periodicite === 'hebdomadaire') {
    const dn = ['weekDayMonFull','weekDayTueFull','weekDayWedFull','weekDayThuFull','weekDayFriFull','weekDaySatFull','weekDaySunFull'];
    const days = (rec.parametre?.joursSemaine || []).map(n => t(dn[n - 1])).join(', ');
    return days || '—';
  }
  if (rec.periodicite === 'mensuel') {
    const jm = rec.parametre?.jourDuMois;
    if (jm === 'dernier') return t('recMonthlyLast');
    return `${t('recMonthlyDay')} ${jm} ${t('recMonthlyDayEnd')}`;
  }
  return '';
}
async function visibleEmployeesForMissions() {
  const sess = Auth.getSession();
  const all = await DB.getAll('employees');
  const active = all.filter(e => e.actif !== false);
  if (!sess) return active;
  if (sess.role === 'admin') return active;
  if (sess.role === 'manager') {
    const mid = Number(sess.employeId);
    return active.filter(e => e.id === mid || Number(e.managerId) === mid);
  }
  // employe: self + any explicitly granted by admin via peutAssignerA
  const me = active.find(e => e.id === Number(sess.employeId));
  const allowedIds = new Set((me?.peutAssignerA || []).map(Number));
  allowedIds.add(Number(sess.employeId));
  return active.filter(e => allowedIds.has(Number(e.id)));
}
async function canManageMissionForEmployee(employeeId, allEmployees) {
  const sess = Auth.getSession();
  if (!sess) return false;
  if (sess.role === 'admin') return true;
  // Self-assign is always allowed
  if (Number(employeeId) === Number(sess.employeId)) return true;
  if (sess.role === 'manager') {
    const emp = allEmployees.find(e => e.id === Number(employeeId));
    if (!emp) return false;
    return Number(emp.managerId) === Number(sess.employeId);
  }
  // employe: only if explicitly listed in their peutAssignerA
  const me = allEmployees.find(e => e.id === Number(sess.employeId));
  return Array.isArray(me?.peutAssignerA) && me.peutAssignerA.map(Number).includes(Number(employeeId));
}

      if (fEmp && Number(m.assigneEmployeId) !== Number(fEmp)) return false;
      if (fCli && Number(m.clientId) !== Number(fCli)) return false;
      if (fSta && m.statut !== fSta) return false;
      if (fPri && m.priorite !== fPri) return false;
      if (q && !((m.libelle||'').toLowerCase().includes(q) || (m.description||'').toLowerCase().includes(q))) return false;
      return true;
    }).sort((a,b) => (a.dateRealisationDemandee||'').localeCompare(b.dateRealisationDemandee||''));
    const rows = list.map(m => {
      let delai = '—';
      if (m.statut === 'effectuee' && m.delaiRealisationMs != null) {
        delai = (m.delaiRealisationMs / 86400000).toFixed(1) + ' j';
      }
      const respect = m.respectDelaiDemande === true ? '<span class="text-green-700">✓</span>'
                    : m.respectDelaiDemande === false ? '<span class="text-red-700">✗</span>'
                    : '<span class="text-slate-400">—</span>';
      return `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-3">${escapeHtml(m.libelle)}</td>
          <td class="px-4 py-3 text-slate-600">${escapeHtml(clientById[m.clientId]?.nom || '')}</td>
          <td class="px-4 py-3 text-slate-600">${escapeHtml(empById[m.assigneEmployeId]?.nom || '?')}</td>
          <td class="px-4 py-3 text-slate-500 text-sm">${escapeHtml(empById[m.creePar]?.nom || '—')}</td>
          <td class="px-4 py-3">${priorityBadge(m.priorite)}</td>
          <td class="px-4 py-3 ${dueDateClass(m.dateRealisationDemandee, m.statut)}">${escapeHtml(m.dateRealisationDemandee || '')}</td>
          <td class="px-4 py-3">${missionStatusBadge(m.statut)}</td>
          <td class="px-4 py-3 text-slate-600 text-sm">${delai}</td>
          <td class="px-4 py-3 text-center">${respect}</td>
          <td class="px-4 py-3">
            <button data-act="view"   data-id="${m.id}" class="text-slate-700 hover:underline text-sm">${escapeHtml(t('viewDetails'))}</button>
            <button data-act="edit"   data-id="${m.id}" class="text-blue-700 hover:underline text-sm ms-3">${escapeHtml(t('edit'))}</button>
            <button data-act="delete" data-id="${m.id}" class="text-red-600 hover:underline text-sm ms-3">${escapeHtml(t('delete'))}</button>
          </td>
        </tr>`;
    }).join('');
    $('#mp_body').innerHTML = tableEl(
      [t('missionLibelle'), t('timeClient'), t('missionAssignee'), t('creePar'), t('missionPriorite'),
       t('missionDateDemandee'), t('missionStatut'), t('missionDelai'), t('missionRespect'), t('actions')],
      rows
    );
    $$('#mp_body [data-act]').forEach(b => b.onclick = async () => {
      const id = Number(b.dataset.id);
      if (b.dataset.act === 'view') showMissionDetail(id);
      else if (b.dataset.act === 'edit') missionForm(await DB.getById('missions', id));
      else if (b.dataset.act === 'delete') {
        if (await confirmModal(t('confirmDelete'))) {
          await DB.remove('missions', id);
          toast(t('deleted'));
          renderMissionsPonctuelles();
        }
      }
    });
  };
  ['mp_emp','mp_client','mp_statut','mp_pri','mp_search'].forEach(id => {
    $('#' + id).oninput = draw;
    $('#' + id).onchange = draw;
  });
  draw();
}

async function missionForm(rec) {
  const [allEmployees, clients] = await Promise.all([DB.getAll('employees'), DB.getAll('clients')]);
  const visibleEmps = await visibleEmployeesForMissions();
  const r = rec || {
    libelle: '', description: '', clientId: '', assigneEmployeId: '',
    priorite: 'normale', dateRealisationDemandee: '', notes: ''
  };
  const priOpts = [
    { value: 'urgente', label: t('priorityUrgente') },
    { value: 'normale', label: t('priorityNormale') },
    { value: 'basse',   label: t('priorityBasse') }
  ];
  // For new missions, allow multi-select. For edits, a single record is bound to one assignee.
  const isNew = !rec;
  const preselected = new Set(rec ? [Number(rec.assigneEmployeId)] : []);

  openModal({
    title: rec ? t('edit') : t('newMission'),
    bodyHtml: `
      <div class="space-y-3">
        ${field('libelle', t('missionLibelle'), r.libelle, 'text', true)}
        ${textarea('description', t('taskDesc'), r.description)}
        ${selectField('clientId', t('timeClient'), clients.filter(c => c.actif !== false).map(c => ({ value: c.id, label: c.nom })), r.clientId, true)}
        ${isNew ? `
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-sm text-slate-600">${escapeHtml(t('selectAssignees'))} <span class="text-red-600">*</span></label>
              <div class="text-xs flex gap-2">
                <button type="button" id="selAll" class="text-blue-700 hover:underline">${escapeHtml(t('selectAll'))}</button>
                <button type="button" id="selNone" class="text-slate-500 hover:underline">${escapeHtml(t('selectNone'))}</button>
              </div>
            </div>
            <div id="empBoxes" class="border border-slate-300 rounded-lg p-2 max-h-40 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-1">
              ${visibleEmps.map(e => `<label class="inline-flex items-center gap-2 text-sm px-2 py-1 rounded hover:bg-slate-50"><input type="checkbox" class="emp-pick w-4 h-4" value="${e.id}">${escapeHtml((e.numeroEmploye ? e.numeroEmploye + ' — ' : '') + e.nom)}</label>`).join('')}
            </div>
            <p class="text-xs text-slate-500 mt-1"><span id="selCount">0</span> ${escapeHtml(t('selected'))} — ${escapeHtml(t('multiAssign'))}</p>
          </div>
        ` : selectField('assigneEmployeId', t('missionAssignee'), visibleEmps.map(e => ({ value: e.id, label: e.nom })), r.assigneEmployeId, true)}

        ${textarea('notes', t('missionNotes'), r.notes)}
      </div>`,
    onSave: async () => {
      const data = {
        libelle: $('#f_libelle').value.trim(),
        description: $('#f_description').value.trim(),
        clientId: Number($('#f_clientId').value) || null,
        priorite: $('#f_priorite').value,
        dateRealisationDemandee: $('#f_dateRealisationDemandee').value,
        notes: $('#f_notes').value.trim()
      };
      if (!data.libelle || !data.clientId || !data.dateRealisationDemandee) return false;
      if (rec) {
        const assignee = Number($('#f_assigneEmployeId').value) || null;
        if (!assignee) return false;
        if (!await canManageMissionForEmployee(assignee, allEmployees)) { toast(t('forbidden')); return false; }
        await DB.update('missions', rec.id, { ...data, assigneEmployeId: assignee });
        toast(t('saved'));
      } else {
        const ids = Array.from(document.querySelectorAll('.emp-pick:checked')).map(c => Number(c.value));
        if (!ids.length) return false;
        for (const id of ids) {
          if (!await canManageMissionForEmployee(id, allEmployees)) { toast(t('forbidden')); return false; }
        }
        for (const id of ids) {
          await DB.creerMission({ ...data, assigneEmployeId: id });
        }
        toast(fillTpl(t('nMissionsCreated'), { n: ids.length }));
      }
      renderMissionsPonctuelles();
    }
  });

  if (isNew) {
    const updateCount = () => {
      const n = document.querySelectorAll('.emp-pick:checked').length;
      const c = $('#selCount'); if (c) c.textContent = String(n);
    };
    document.querySelectorAll('.emp-pick').forEach(c => c.onchange = updateCount);
    $('#selAll').onclick = () => { document.querySelectorAll('.emp-pick').forEach(c => c.checked = true); updateCount(); };
    $('#selNone').onclick = () => { document.querySelectorAll('.emp-pick').forEach(c => c.checked = false); updateCount(); };
    updateCount();
  }
}

async function renderMissionsRecurrences() {
  const [allEmployees, clients, recurrences, missions] = await Promise.all([
    DB.getAll('employees'), DB.getAll('clients'),
    DB.getAll('recurrences'), DB.getAll('missions')
  ]);
  const visibleEmps = await visibleEmployeesForMissions();
  const visibleEmpIds = new Set(visibleEmps.map(e => e.id));
  const empById = Object.fromEntries(allEmployees.map(e => [e.id, e]));
  const clientById = Object.fromEntries(clients.map(c => [c.id, c]));
  const recs = recurrences.filter(r => visibleEmpIds.has(Number(r.assigneEmployeId)));

  const counts = {};
  for (const m of missions) {
    if (m.recurrenceId) counts[m.recurrenceId] = (counts[m.recurrenceId] || 0) + 1;
  }

  const rows = recs.map(r => `
    <tr class="hover:bg-slate-50">
      <td class="px-4 py-3">${escapeHtml(r.libelle)}</td>
      <td class="px-4 py-3 text-slate-600">${escapeHtml(clientById[r.clientId]?.nom || '')}</td>
      <td class="px-4 py-3 text-slate-600">${escapeHtml(empById[r.assigneEmployeId]?.nom || '?')}</td>
      <td class="px-4 py-3 text-slate-600">${escapeHtml(summarizeRecurrence(r))}</td>
      <td class="px-4 py-3 text-slate-600 text-sm">${escapeHtml(r.dateDebut || '')} → ${escapeHtml(r.dateFin || '∞')}</td>
      <td class="px-4 py-3">${r.actif === false ? '<span class="px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 text-xs">—</span>' : '<span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-xs">●</span>'}</td>
      <td class="px-4 py-3 text-slate-600">${counts[r.id] || 0}</td>
      <td class="px-4 py-3">
        <button data-act="edit"   data-id="${r.id}" class="text-blue-700 hover:underline text-sm">${escapeHtml(t('edit'))}</button>
        <button data-act="toggle" data-id="${r.id}" class="text-slate-700 hover:underline text-sm ms-3">${escapeHtml(r.actif === false ? t('activate') : t('deactivate'))}</button>
        <button data-act="delete" data-id="${r.id}" class="text-red-600 hover:underline text-sm ms-3">${escapeHtml(t('delete'))}</button>
      </td>
    </tr>`).join('');

  $('#missionsTabBody').innerHTML = `
    <div class="flex justify-end gap-2 mb-4">
      <button id="recExportBtn" class="px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">📊 ${escapeHtml(t('exportExcel'))}</button>
      <button id="newRecBtn" class="px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm font-medium">+ ${escapeHtml(t('newRecurrence'))}</button>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
      ${tableEl(
        [t('missionLibelle'), t('timeClient'), t('missionAssignee'), t('recPeriodicity'),
         `${t('recStartDate')} / ${t('recEndDate')}`, t('recActif'), t('recGenerated'), t('actions')],
        rows
      )}
    </div>
  `;

  $('#newRecBtn').onclick = () => recurrenceForm();
  $('#recExportBtn').onclick = () => exportEntity('recurrences');
  $$('[data-act]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.id);
    const act = b.dataset.act;
    if (act === 'edit') recurrenceForm(await DB.getById('recurrences', id));
    else if (act === 'toggle') {
      const r = await DB.getById('recurrences', id);
      await DB.update('recurrences', id, { actif: !(r.actif !== false) });
      toast(t('saved'));
      renderMissionsRecurrences();
    } else if (act === 'delete') {
      if (!await confirmModal(t('confirmDelete'))) return;
      const alsoMissions = await confirmModal(t('recDeleteAlsoMissions'));
      await DB.remove('recurrences', id);
      if (alsoMissions) {
        const ms = await DB.getAll('missions');
        for (const m of ms) {
          if (Number(m.recurrenceId) === id && m.statut !== 'effectuee') {
            await DB.remove('missions', m.id);
          }
        }
      }
      toast(t('deleted'));
      renderMissionsRecurrences();
    }
  });
}

            <button type="button" data-per="hebdomadaire" class="px-3 py-2 rounded-lg border text-sm ${r.periodicite==='hebdomadaire'?'bg-blue-700 text-white border-blue-700':'border-slate-300'}">${escapeHtml(t('recWeekly'))}</button>

        if (!ids.length) return false;
        for (const id of ids) {
          if (!await canManageMissionForEmployee(id, allEmployees)) { toast(t('forbidden')); return false; }
        }
        const sess = Auth.getSession();
        for (const id of ids) {
          await DB.add('recurrences', { ...baseData, assigneEmployeId: id, derniereGeneration: null, creePar: sess?.employeId || null });
        }
        toast(fillTpl(t('nRecurrencesCreated'), { n: ids.length }));
      }
      renderMissionsRecurrences();
    }
  });

    $('#recSelAll').onclick = () => { document.querySelectorAll('.rec-emp-pick').forEach(c => c.checked = true); updateRecCount(); };
    $('#recSelNone').onclick = () => { document.querySelectorAll('.rec-emp-pick').forEach(c => c.checked = false); updateRecCount(); };
    updateRecCount();
  }

  // Param sub-form rendering + preview wiring
  const renderParam = (per) => {
    if (per === 'quotidien') {
      const n = Number(r.parametre?.tousLesNJours) || 1;
      $('#recParam').innerHTML = `
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600">${escapeHtml(t('recDailyEvery'))}</span>
          <input id="f_perN" type="number" min="1" value="${n}" class="w-20 px-2 py-1 border border-slate-300 rounded text-sm">
          <span class="text-sm text-slate-600">${escapeHtml(t('recDays'))}</span>
        </div>`;
      $('#f_perN').oninput = updatePreview;
    } else if (per === 'hebdomadaire') {
      const dayKeys = ['weekDayMon','weekDayTue','weekDayWed','weekDayThu','weekDayFri','weekDaySat','weekDaySun'];
      $('#recParam').innerHTML = `
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('recWeeklyDays'))}</label>
          <div class="flex gap-2 flex-wrap">
            ${dayKeys.map((k, i) => {
              const d = i + 1;
              const sel = selectedDays.has(d);
              return `<label class="inline-flex items-center gap-1 px-3 py-2 border rounded-lg text-sm cursor-pointer ${sel ? 'bg-blue-700 text-white border-blue-700' : 'border-slate-300'}">
                <input type="checkbox" data-dow="${d}" ${sel ? 'checked' : ''} class="hidden">
                ${escapeHtml(t(k))} <span class="text-xs opacity-70">${escapeHtml(dayLabels[i].slice(0,3))}</span>
              </label>`;
            }).join('')}
          </div>
        </div>`;
      $$('#recParam input[data-dow]').forEach(c => c.onchange = (e) => {
        const d = Number(e.target.dataset.dow);
        if (e.target.checked) selectedDays.add(d); else selectedDays.delete(d);
        e.target.parentElement.className = `inline-flex items-center gap-1 px-3 py-2 border rounded-lg text-sm cursor-pointer ${e.target.checked ? 'bg-blue-700 text-white border-blue-700' : 'border-slate-300'}`;
        updatePreview();
      });
    } else if (per === 'mensuel') {
      const isLast = r.parametre?.jourDuMois === 'dernier';
      $('#recParam').innerHTML = `
        <div class="flex items-center gap-3 flex-wrap">
          <label class="inline-flex items-center gap-2 text-sm">
            <span>${escapeHtml(t('recMonthlyDay'))}</span>
            <input id="f_jourMois" type="number" min="1" max="31" value="${isLast ? 1 : (r.parametre?.jourDuMois || 1)}" class="w-20 px-2 py-1 border border-slate-300 rounded text-sm" ${isLast ? 'disabled' : ''}>
            <span>${escapeHtml(t('recMonthlyDayEnd'))}</span>
          </label>
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="f_lastDay" type="checkbox" ${isLast ? 'checked' : ''} class="w-4 h-4">
            ${escapeHtml(t('recMonthlyLast'))}
          </label>
        </div>`;
      $('#f_jourMois').oninput = updatePreview;
      $('#f_lastDay').onchange = (e) => {
        $('#f_jourMois').disabled = e.target.checked;
        updatePreview();
      };
    }
  };

  function paramFromForm(per) {
    if (per === 'quotidien') return { tousLesNJours: Math.max(1, Number($('#f_perN')?.value) || 1) };
    if (per === 'hebdomadaire') return { joursSemaine: Array.from(selectedDays).sort((a,b)=>a-b) };
    if (per === 'mensuel') {
      const last = $('#f_lastDay')?.checked;
      return last ? { jourDuMois: 'dernier' } : { jourDuMois: Math.max(1, Math.min(31, Number($('#f_jourMois')?.value) || 1)) };
    }
    return {};
  }

  function currentPer() {
    return $('#recPerBtns [data-per].bg-blue-700')?.dataset.per || 'hebdomadaire';
  }

  function updatePreview() {
    const per = currentPer();
    const tmp = {
      periodicite: per,
      parametre: paramFromForm(per),
      dateDebut: $('#f_dateDebut').value || null,
      dateFin: $('#f_noEnd').checked ? null : ($('#f_dateFin').value || null)
    };
    const next = nextRecurrenceDates(tmp, 5);
    $('#recPrev').innerHTML = next.length
      ? next.map(d => `<div>• ${_ymd(d)}</div>`).join('')
      : '<div class="text-slate-400">—</div>';
  }

  $$('#recPerBtns [data-per]').forEach(b => b.onclick = () => {
    $$('#recPerBtns [data-per]').forEach(x => x.classList.remove('bg-blue-700','text-white','border-blue-700'));
    $$('#recPerBtns [data-per]').forEach(x => x.classList.add('border-slate-300'));
    b.classList.add('bg-blue-700','text-white','border-blue-700');
    b.classList.remove('border-slate-300');
    renderParam(b.dataset.per);
    updatePreview();
  });
  $('#f_dateDebut').oninput = updatePreview;
  $('#f_dateFin').oninput = updatePreview;
  $('#f_noEnd').onchange = updatePreview;

  renderParam(r.periodicite);
  updatePreview();
}

  { key: 'employee',    labelKey: 'colEmployee',    width: 120 },

  { key: 'rate',        labelKey: 'colRate',        width: 80,  num: true },
  { key: 'cost',        labelKey: 'colCost',        width: 90,  num: true },

async function renderReports() {
  const [employees, clients, projects, tasks, entries] = await Promise.all([
    DB.getAll('employees'), DB.getAll('clients'),
    DB.getAll('projects'), DB.getAll('tasks'),
    DB.getAll('timeEntries')
  ]);
