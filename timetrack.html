<!--
  =====================================================================
   TimeTrack — Application de suivi du temps (single-file)
  =====================================================================

  COMMENT UTILISER
  ----------------
  1. Ouvrez ce fichier `timetrack.html` directement dans un navigateur
     moderne (Chrome, Firefox, Edge, Safari) — aucun serveur requis.
  2. Toutes les données sont stockées dans IndexedDB (base TimeTrackDB)
     dans votre navigateur. Les données restent locales à votre machine.
  3. Le menu latéral donne accès aux pages :
       - Clients, Projets, Tâches, Employés : CRUD avec recherche
       - Saisie heures : sélection en cascade Client → Projet → Tâche
       - Paramètres : langue (EN/FR/HEB), import/export JSON, import Excel
  4. Pour changer la langue : Paramètres → Langue. L'hébreu bascule
     automatiquement l'interface en RTL.

  IMPORT EXCEL
  ------------
  Dans Paramètres → Import Excel : sélectionnez un fichier .xlsx avec
  une feuille par entité. Noms de feuilles attendus (insensibles à la
  casse) : "clients", "projects", "tasks".

  Colonnes attendues (en-têtes en première ligne) :
    Feuille "clients"  : nom, adresse, contact, actif
    Feuille "projects" : clientId, nom, code, tauxHoraire, budgetHeures,
                         actif, typeProjet, statutProjet
                         (clientId peut aussi être le NOM du client —
                          il sera résolu automatiquement.
                          statutProjet : active | paused | completed |
                          cancelled | draft.
                          Tout typeProjet inconnu sera ajouté
                          automatiquement à la liste gérable depuis
                          Paramètres → Types de projet.)
    Feuille "tasks"    : nom, description, statut, typeTask
                         (les tâches sont GLOBALES et réutilisables
                          sur n'importe quel projet — pas de projectId.)

  EMPLOYÉS
  --------
  Chaque employé peut avoir un numéro d'employé (numeroEmploye) en plus
  du nom, email, rôle et taux horaire.

  TYPES DE PROJET
  ---------------
  Gérez la liste des types depuis Paramètres → Types de projet.
  Le formulaire de projet propose ensuite cette liste en menu déroulant.

  STATUT DU PROJET
  ----------------
  Sélectionnez parmi : Actif, En pause, Terminé, Annulé, Brouillon.

  PRÉSENCES & CONCILIATION
  ------------------------
  Le menu "Présences" permet d'importer les heures de présence depuis
  un fichier Excel/CSV. Colonnes acceptées (souples, plusieurs noms
  reconnus pour chaque champ) :
    - identifiant employé : email | matricule | numeroEmploye | nom
    - date : JJ/MM/AAAA | AAAA-MM-JJ | date Excel native
    - heureEntree | entree | clockIn  (optionnel)
    - heureSortie | sortie | clockOut (optionnel)
    - pause (en minutes si >= 5, sinon en heures décimales)
    - totalHeures | heures | total    (prioritaire si présent)

  Si un employé n'est pas reconnu, la ligne n'est pas perdue : un
  rapport propose un mapping manuel à la fin de l'import.

  Le menu "Conciliation" affiche, par jour et par employé, le total
  des heures de présence vs. les heures saisies sur projets, avec un
  badge couleur (vert / orange / rouge) selon le seuil configuré.

  Paramètres → Conciliation : seuil d'écart toléré, type (absolu en
  heures ou pourcentage de la présence), blocage de la sauvegarde
  d'une saisie qui dépasserait le seuil.

  EXPORT / IMPORT JSON
  --------------------
  Sauvegarde complète : Paramètres → Exporter JSON (télécharge un .json).
  Restauration : Paramètres → Importer JSON (remplace les données).

  =====================================================================
-->

/* =====================================================================
   2. DB MODULE — IndexedDB wrapper
   ===================================================================== */
const DB = (() => {
  const DB_NAME = 'TimeTrackDB';
  const DB_VERSION = 4;
  let _dbPromise = null;

  function open() {
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => resolve(req.result);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        const upgradeTx = e.target.transaction;
        // v4: missions + recurrences stores. No existing data touched.
        if (!db.objectStoreNames.contains('missions')) {
          const s = db.createObjectStore('missions', { keyPath: 'id', autoIncrement: true });
          s.createIndex('assigneEmployeId', 'assigneEmployeId', { unique: false });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('statut', 'statut', { unique: false });
          s.createIndex('dateRealisationDemandee', 'dateRealisationDemandee', { unique: false });
          s.createIndex('recurrenceId', 'recurrenceId', { unique: false });
        }
        if (!db.objectStoreNames.contains('recurrences')) {
          const s = db.createObjectStore('recurrences', { keyPath: 'id', autoIncrement: true });
          s.createIndex('assigneEmployeId', 'assigneEmployeId', { unique: false });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        // v3: submissions store + role/PIN/managerId/actif on employees + statutValidation/submissionId/verrouille on timeEntries
        if (!db.objectStoreNames.contains('submissions')) {
          const s = db.createObjectStore('submissions', { keyPath: 'id', autoIncrement: true });
          s.createIndex('employeId', 'employeId', { unique: false });
          s.createIndex('statut', 'statut', { unique: false });
          s.createIndex('validePar', 'validePar', { unique: false });
        }
        if (e.oldVersion >= 1 && e.oldVersion < 3 && db.objectStoreNames.contains('employees')) {
          const empStore = upgradeTx.objectStore('employees');
          empStore.openCursor().onsuccess = (ev) => {
            const c = ev.target.result;
            if (!c) return;
            const v = c.value;
            if (v.role == null) v.role = 'employe';
            if (v.pin === undefined) v.pin = null;
            if (v.managerId === undefined) v.managerId = null;
            if (v.actif === undefined) v.actif = true;
            c.update(v);
            c.continue();
          };
        }
        if (e.oldVersion >= 1 && e.oldVersion < 3 && db.objectStoreNames.contains('timeEntries')) {
          const teStore = upgradeTx.objectStore('timeEntries');
          teStore.openCursor().onsuccess = (ev) => {
            const c = ev.target.result;
            if (!c) return;
            const v = c.value;
            if (v.statutValidation == null || v.statutValidation === 'draft') v.statutValidation = 'brouillon';
            if (v.submissionId === undefined) v.submissionId = null;
            if (v.verrouille === undefined) v.verrouille = false;
            c.update(v);
            c.continue();
          };
        }
        // v2: attendance store added without touching existing data
        if (!db.objectStoreNames.contains('attendance')) {
          const s = db.createObjectStore('attendance', { keyPath: 'id', autoIncrement: true });
          s.createIndex('employeId', 'employeId', { unique: false });
          s.createIndex('date', 'date', { unique: false });
          s.createIndex('employeId_date', ['employeId', 'date'], { unique: false });
        }
        if (!db.objectStoreNames.contains('clients')) {
          const s = db.createObjectStore('clients', { keyPath: 'id', autoIncrement: true });
          s.createIndex('nom', 'nom', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        if (!db.objectStoreNames.contains('projects')) {
          const s = db.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('code', 'code', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        if (!db.objectStoreNames.contains('tasks')) {
          const s = db.createObjectStore('tasks', { keyPath: 'id', autoIncrement: true });
          s.createIndex('projectId', 'projectId', { unique: false });
          s.createIndex('statut', 'statut', { unique: false });
        }
        if (!db.objectStoreNames.contains('employees')) {
          const s = db.createObjectStore('employees', { keyPath: 'id', autoIncrement: true });
          s.createIndex('email', 'email', { unique: false });
          s.createIndex('nom', 'nom', { unique: false });
        }
        if (!db.objectStoreNames.contains('timeEntries')) {
          const s = db.createObjectStore('timeEntries', { keyPath: 'id', autoIncrement: true });
          s.createIndex('employeId', 'employeId', { unique: false });
          s.createIndex('date', 'date', { unique: false });
          s.createIndex('projectId', 'projectId', { unique: false });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('taskId', 'taskId', { unique: false });
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'cle' });
        }
      };
    });
    return _dbPromise;
  }

  function tx(store, mode) {
    return open().then(db => db.transaction(store, mode).objectStore(store));
  }

  function reqToPromise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function add(storeName, record) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.add(record));
  }
  async function getAll(storeName) {
    const store = await tx(storeName, 'readonly');
    return reqToPromise(store.getAll());
  }
  async function getById(storeName, id) {
    const store = await tx(storeName, 'readonly');
    return reqToPromise(store.get(id));
  }
  async function update(storeName, id, updates) {
    const store = await tx(storeName, 'readwrite');
    const existing = await reqToPromise(store.get(id));
    if (!existing) throw new Error('Record not found: ' + id);
    const merged = { ...existing, ...updates, id: existing.id ?? id };
    return reqToPromise(store.put(merged));
  }
  async function put(storeName, record) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.put(record));
  }
  async function remove(storeName, id) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.delete(id));
  }
  async function clearStore(storeName) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.clear());
  }
  async function clearAll() {
    const stores = ['clients','projects','tasks','employees','timeEntries','attendance','submissions','missions','recurrences','settings'];
    await Promise.all(stores.map(s => clearStore(s)));
  }
  async function getSetting(cle, def = null) {
    const r = await getById('settings', cle);
    return r ? r.valeur : def;
  }
  async function setSetting(cle, valeur) {
    return put('settings', { cle, valeur });
  }

  async function getAttendanceForEmployeeDate(employeId, date) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const store = db.transaction('attendance', 'readonly').objectStore('attendance');
      const idx = store.index('employeId_date');
      const req = idx.get([Number(employeId), String(date)]);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function getProjectHoursForEmployeeDate(employeId, date) {
    const all = await getAll('timeEntries');
    return all
      .filter(e => Number(e.employeId) === Number(employeId) && e.date === date)
      .reduce((s, e) => s + (Number(e.heures) || 0), 0);
  }

  async function computeDiscrepancy(employeId, date, opts = {}) {
    const att = await getAttendanceForEmployeeDate(employeId, date);
    const heuresPresence = att ? Number(att.totalHeures || 0) : null;
    let heuresProjets = await getProjectHoursForEmployeeDate(employeId, date);
    if (opts.addedHours) heuresProjets += Number(opts.addedHours);
    const seuil = Number(await getSetting('seuilEcartHeures', 0.5));
    const type = await getSetting('seuilEcartType', 'absolu');
    let seuilApplique = seuil;
    let ecart = null;
    let depasse = false;
    if (heuresPresence != null) {
      ecart = Math.abs(heuresProjets - heuresPresence);
      if (type === 'pourcentage') {
        const ref = heuresPresence || 1;
        seuilApplique = (seuil / 100) * ref;
      }
      depasse = ecart > seuilApplique;
    }
    return { heuresPresence, heuresProjets, ecart, depasseSeuilOuiNon: depasse, seuilApplique };
  }

  /* ----- Missions helpers ----- */
  async function creerMission(data) {
    const sess = (() => { try { return JSON.parse(sessionStorage.getItem('sessionActive')); } catch { return null; } })();
    const record = {
      libelle: '', description: '', clientId: null, assigneEmployeId: null,
      priorite: 'normale', notes: '', recurrenceId: null,
      ...data,
      dateAssignation: new Date().toISOString(),
      dateRealisation: null,
      delaiRealisationMs: null,
      respectDelaiDemande: null,
      statut: data.statut || 'a_faire',
      creePar: data.creePar || sess?.employeId || null
    };
    return add('missions', record);
  }
  async function marquerMissionEffectuee(missionId) {
    const m = await getById('missions', missionId);
    if (!m) throw new Error('mission not found');
    const now = new Date();
    const due = m.dateRealisationDemandee ? new Date(m.dateRealisationDemandee + 'T23:59:59') : null;
    const updates = {
      statut: 'effectuee',
      dateRealisation: now.toISOString(),
      delaiRealisationMs: m.dateAssignation ? (now - new Date(m.dateAssignation)) : null,
      respectDelaiDemande: due ? (now <= due) : null
    };
    await update('missions', missionId, updates);
    return { ...m, ...updates };
  }
  async function getMissionsForEmployee(employeId, options = {}) {
    let all = await getAll('missions');
    all = all.filter(m => Number(m.assigneEmployeId) === Number(employeId));
    if (options.statut) all = all.filter(m => m.statut === options.statut);
    if (options.clientId) all = all.filter(m => Number(m.clientId) === Number(options.clientId));
    if (options.priorite) all = all.filter(m => m.priorite === options.priorite);
    if (options.depuis)   all = all.filter(m => (m.dateRealisationDemandee || '') >= options.depuis);
    if (options.jusqua)   all = all.filter(m => (m.dateRealisationDemandee || '') <= options.jusqua);
    return all;
  }
  async function getMissionsEnRetard(employeId) {
    const today = new Date().toISOString().slice(0,10);
    let all = await getAll('missions');
    if (employeId != null) all = all.filter(m => Number(m.assigneEmployeId) === Number(employeId));
    return all.filter(m =>
      m.statut !== 'effectuee' && m.statut !== 'annulee' &&
      (m.dateRealisationDemandee || '') < today
    );
  }
  async function getStatsMissionsEmploye(employeId, periode) {
    let all = await getAll('missions');
    all = all.filter(m => Number(m.assigneEmployeId) === Number(employeId));
    if (periode?.depuis) all = all.filter(m => (m.dateAssignation || '') >= periode.depuis);
    if (periode?.jusqua) all = all.filter(m => (m.dateAssignation || '') <= periode.jusqua);
    const today = new Date().toISOString().slice(0,10);
    const total = all.length;
    const aFaire = all.filter(m => m.statut === 'a_faire').length;
    const enCours = all.filter(m => m.statut === 'en_cours').length;
    const effectuees = all.filter(m => m.statut === 'effectuee');
    const enRetard = all.filter(m =>
      m.statut !== 'effectuee' && m.statut !== 'annulee' &&
      (m.dateRealisationDemandee || '') < today
    ).length;
    const delaiMoyenMs = effectuees.length
      ? effectuees.reduce((s, m) => s + (m.delaiRealisationMs || 0), 0) / effectuees.length
      : 0;
    const respectes = effectuees.filter(m => m.respectDelaiDemande === true).length;
    const tauxRespectDelai = effectuees.length ? respectes / effectuees.length : null;
    return { total, aFaire, enCours, effectuees: effectuees.length, enRetard, delaiMoyenMs, tauxRespectDelai };
  }

  return {
    add, getAll, getById, update, put, remove, clearStore, clearAll,
    getSetting, setSetting,
    getAttendanceForEmployeeDate, getProjectHoursForEmployeeDate, computeDiscrepancy,
    creerMission, marquerMissionEffectuee, getMissionsForEmployee,
    getMissionsEnRetard, getStatsMissionsEmploye
  };
})();

/* =====================================================================
   AUTH MODULE — local PIN authentication.
   ⚠ SECURITY NOTICE:
   PIN authentication here is a *local convenience* only, NOT real
   security. The data is fully accessible via browser DevTools and the
   IndexedDB inspector. Real multi-user security requires a backend.
   ===================================================================== */
const Auth = (() => {
  const SESSION_KEY = 'sessionActive';
  const failedAttempts = new Map(); // employeId -> { count, blockedUntil }

  async function hashPin(pin) {
    if (pin == null || pin === '') return null;
    const data = new TextEncoder().encode(String(pin));
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function getSession() {
    try {
      const v = sessionStorage.getItem(SESSION_KEY);
      return v ? JSON.parse(v) : null;
    } catch { return null; }
  }

  async function getCurrentUser() {
    const s = getSession();
    if (!s) return null;
    return await DB.getById('employees', s.employeId);
  }

  async function login(employeId, pin) {
    const id = Number(employeId);
    const emp = await DB.getById('employees', id);
    if (!emp) throw new Error('user');
    if (emp.actif === false) throw new Error('inactive');
    const tracker = failedAttempts.get(id) || { count: 0, blockedUntil: 0 };
    if (tracker.blockedUntil > Date.now()) throw new Error('blocked');
    if (emp.pin == null) throw new Error('nopin');
    const h = await hashPin(pin);
    if (h !== emp.pin) {
      tracker.count++;
      if (tracker.count >= 5) {
        tracker.blockedUntil = Date.now() + 30000;
        tracker.count = 0;
      }
      failedAttempts.set(id, tracker);
      throw new Error('badpin');
    }
    failedAttempts.delete(id);
    const session = { employeId: emp.id, role: emp.role, nom: emp.nom };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    return session;
  }

  function logout() {
    sessionStorage.removeItem(SESSION_KEY);
  }

  function requireRole(...roles) {
    const s = getSession();
    if (!s || !roles.includes(s.role)) {
      const err = new Error('forbidden');
      err.code = 'forbidden';
      throw err;
    }
  }

  async function canValidate(submissionEmployeId) {
    const s = getSession();
    if (!s) return false;
    if (s.role === 'admin') return true;
    if (s.role !== 'manager') return false;
    const emp = await DB.getById('employees', Number(submissionEmployeId));
    return !!emp && Number(emp.managerId) === Number(s.employeId);
  }

  return { hashPin, login, logout, getSession, getCurrentUser, requireRole, canValidate };
})();

/* =====================================================================
   RECURRENCE SCHEDULER — generates missions from recurring templates.
   ===================================================================== */
function _ymd(d) { return d.toISOString().slice(0,10); }
function _addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function _jsDow(d) { const x = d.getDay(); return x === 0 ? 7 : x; } // 1=Mon..7=Sun

function computeRecurrenceDates(rec, fromDate, toDate, limit) {
  const out = [];
  const start = new Date(fromDate); start.setHours(0,0,0,0);
  const end   = new Date(toDate);   end.setHours(0,0,0,0);
  const reachedLimit = () => limit != null && out.length >= limit;
  if (rec.periodicite === 'quotidien') {
    const step = Math.max(1, Number(rec.parametre?.tousLesNJours) || 1);
    const anchor = rec.dateDebut ? new Date(rec.dateDebut + 'T00:00:00') : start;
    anchor.setHours(0,0,0,0);
    // Walk from anchor forward in steps of `step` days
    let d = new Date(anchor);
    // Advance d to the first occurrence >= start
    if (d < start) {
      const diffDays = Math.ceil((start - d) / 86400000);
      const advance = Math.ceil(diffDays / step) * step;
      d = _addDays(d, advance);
    }
    while (d <= end && !reachedLimit()) {
      out.push(new Date(d));
      d = _addDays(d, step);
    }
  } else if (rec.periodicite === 'hebdomadaire') {
    const wd = (rec.parametre?.joursSemaine || []).map(Number);
    if (!wd.length) return out;
    let d = new Date(start);
    while (d <= end && !reachedLimit()) {
      if (wd.includes(_jsDow(d))) out.push(new Date(d));
      d = _addDays(d, 1);
    }
  } else if (rec.periodicite === 'mensuel') {
    const jm = rec.parametre?.jourDuMois;
    let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cursor <= end && !reachedLimit()) {
      const lastDay = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
      const day = (jm === 'dernier') ? lastDay : Math.min(Number(jm) || 1, lastDay);
      const candidate = new Date(cursor.getFullYear(), cursor.getMonth(), day);
      if (candidate >= start && candidate <= end) out.push(candidate);
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    }
  }
  return out;
}

function nextRecurrenceDates(rec, count = 5) {
  const today = new Date(); today.setHours(0,0,0,0);
  const startBase = rec.dateDebut ? new Date(rec.dateDebut + 'T00:00:00') : today;
  const from = startBase > today ? startBase : today;
  const endLimit = rec.dateFin ? new Date(rec.dateFin + 'T23:59:59') : _addDays(today, 365);
  return computeRecurrenceDates(rec, from, endLimit, count);
}

async function genererMissionsRecurrentes() {
  const recs = (await DB.getAll('recurrences')).filter(r => r.actif !== false);
  const today = new Date(); today.setHours(0,0,0,0);
  let created = 0;
  for (const rec of recs) {
    if (!rec.dateDebut || !rec.assigneEmployeId || !rec.clientId) continue;
    const fromDate = rec.derniereGeneration
      ? _addDays(new Date(rec.derniereGeneration + 'T00:00:00'), 1)
      : new Date(rec.dateDebut + 'T00:00:00');
    const endLimit = rec.dateFin ? new Date(rec.dateFin + 'T23:59:59') : today;
    const upTo = today < endLimit ? today : endLimit;
    if (fromDate > upTo) continue;
    const candidates = computeRecurrenceDates(rec, fromDate, upTo);
    if (!candidates.length) continue;
    // Skip duplicates (same recurrenceId + same generation date)
    const allMissions = await DB.getAll('missions');
    const existingByDate = new Set(
      allMissions
        .filter(m => Number(m.recurrenceId) === Number(rec.id) && m.dateAssignation)
        .map(m => m.dateAssignation.slice(0,10))
    );
    let lastGen = rec.derniereGeneration;
    for (const d of candidates) {
      const iso = _ymd(d);
      if (existingByDate.has(iso)) { lastGen = lastGen && lastGen > iso ? lastGen : iso; continue; }
      const due = _addDays(d, Number(rec.delaiRealisationJours) || 0);
      await DB.add('missions', {
        libelle: rec.libelle,
        description: rec.description || '',
        clientId: rec.clientId,
        assigneEmployeId: rec.assigneEmployeId,
        creePar: null,
        dateAssignation: d.toISOString(),
        dateRealisationDemandee: _ymd(due),
        priorite: rec.priorite || 'normale',
        statut: 'a_faire',
        dateRealisation: null,
        delaiRealisationMs: null,
        respectDelaiDemande: null,
        recurrenceId: rec.id,
        notes: rec.notes || ''
      });
      lastGen = (!lastGen || iso > lastGen) ? iso : lastGen;
      created++;
    }
    if (lastGen && lastGen !== rec.derniereGeneration) {
      await DB.update('recurrences', rec.id, { derniereGeneration: lastGen });
    }
  }
  return created;
}

/* =====================================================================
   3. UI HELPERS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function escapeHtml(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), 2200);
}

/* Modal helpers */
function openModal({ title, bodyHtml, onSave, hideSave = false }) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  const modal = $('#modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  const saveBtn = $('#modalSave');
  saveBtn.style.display = hideSave ? 'none' : '';
  saveBtn.textContent = t('save');
  $('#modalCancel').textContent = t('cancel');

  const close = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    saveBtn.replaceWith(saveBtn.cloneNode(true)); // remove listeners
    $('#modalClose').onclick = null;
    $('#modalCancel').onclick = null;
  };
  $('#modalClose').onclick = close;
  $('#modalCancel').onclick = close;
  $('#modalSave').onclick = async () => {
    try {
      const ok = await onSave?.();
      if (ok !== false) close();
    } catch (e) {
      console.error(e);
      toast(String(e.message || e));
    }
  };
  return { close };
}

function confirmModal(message) {
  return new Promise((resolve) => {
    const modal = $('#modal');
    $('#modalTitle').textContent = '';
    $('#modalBody').innerHTML = `<p class="text-slate-700">${escapeHtml(message)}</p>`;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    const saveBtn = $('#modalSave');
    saveBtn.textContent = t('yes');
    $('#modalCancel').textContent = t('no');
    const close = (val) => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      saveBtn.replaceWith(saveBtn.cloneNode(true));
      $('#modalClose').onclick = null;
      $('#modalCancel').onclick = null;
      resolve(val);
    };
    $('#modalClose').onclick = () => close(false);
    $('#modalCancel').onclick = () => close(false);
    $('#modalSave').onclick = () => close(true);
  });
}

function fmt(n) { return (Math.round(Number(n) * 100) / 100).toString(); }
function fillTpl(s, vars) {
  return Object.entries(vars).reduce((acc, [k, v]) => acc.replaceAll(`{${k}}`, v), s);
}
async function filterTimeEntriesByRole(entries, allEmployees) {
  const s = Auth.getSession();
  if (!s || s.role === 'admin') return entries;
  if (s.role === 'manager') {
    const teamIds = new Set([s.employeId, ...(allEmployees || []).filter(e => Number(e.managerId) === Number(s.employeId)).map(e => e.id)]);
    return entries.filter(e => teamIds.has(Number(e.employeId)));
  }
  // employe
  return entries.filter(e => Number(e.employeId) === Number(s.employeId));
}

/* ----- Per-entity Excel templates + import ----- */
const ENTITY_IMPORTS = {
  clients: {
    template: {
      headers: ['nom', 'adresse', 'contact', 'actif'],
      sample: [['Acme Corp', '1 rue de Paris, 75001', 'contact@acme.fr', true]]
    },
    buildContext: async () => ({ all: await DB.getAll('clients') }),
    importRow: async (row, ctx) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      const incoming = {
        nom,
        adresse: String(row.adresse || '').trim(),
        contact: String(row.contact || '').trim(),
        actif: row.actif === '' || row.actif == null ? undefined : parseBool(row.actif, true)
      };
      const existing = ctx.all.find(c => (c.nom || '').toLowerCase() === nom.toLowerCase());
      if (existing) {
        const { merged, touched } = fillEmpty(existing, incoming);
        if (!touched) return false;
        await DB.update('clients', existing.id, merged);
        return 'updated';
      }
      await DB.add('clients', {
        nom,
        adresse: incoming.adresse,
        contact: incoming.contact,
        actif: incoming.actif === undefined ? true : incoming.actif
      });
      ctx.all = await DB.getAll('clients');
      return true;
    }
  },
  projects: {
    template: {
      headers: ['clientId', 'nom', 'code', 'tauxHoraire', 'budgetHeures', 'actif', 'typeProjet', 'statutProjet', 'prix', 'typeFacturation'],
      sample: [['Acme Corp', 'Site web v2', 'WEB-2025', 80, 120, true, 'Forfait', 'active', 5000, 'mensuel']]
    },
    buildContext: async () => {
      const clients = await DB.getAll('clients');
      return {
        clients,
        byName: Object.fromEntries(clients.map(c => [c.nom.toLowerCase(), c.id])),
        existingProjects: await DB.getAll('projects'),
        knownTypes: new Set((await getProjectTypes()).map(s => s.toLowerCase())),
        newTypes: []
      };
    },
    importRow: async (row, ctx) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      let cid = Number(row.clientId);
      if (!cid && row.clientId) cid = ctx.byName[String(row.clientId).toLowerCase().trim()] || null;
      const type = String(row.typeProjet || '').trim();
      if (type && !ctx.knownTypes.has(type.toLowerCase())) {
        ctx.knownTypes.add(type.toLowerCase());
        ctx.newTypes.push(type);
      }
      const code = String(row.code || '').trim();
      const incoming = {
        clientId: cid || undefined,
        nom,
        code,
        tauxHoraire: row.tauxHoraire === '' || row.tauxHoraire == null ? undefined : Number(row.tauxHoraire),
        budgetHeures: row.budgetHeures === '' || row.budgetHeures == null ? undefined : Number(row.budgetHeures),
        actif: row.actif === '' || row.actif == null ? undefined : parseBool(row.actif, true),
        typeProjet: type,
        statutProjet: String(row.statutProjet || '').trim(),
        prix: row.prix === '' || row.prix == null ? undefined : Number(row.prix),
        typeFacturation: String(row.typeFacturation || '').trim()
      };
      // Match existing by code (case-insensitive) or (clientId + nom) lowercase
      const existing = ctx.existingProjects.find(p =>
        (code && p.code && p.code.toLowerCase() === code.toLowerCase())
        || (cid && (p.nom || '').toLowerCase() === nom.toLowerCase() && Number(p.clientId) === cid)
      );
      if (existing) {
        const { merged, touched } = fillEmpty(existing, incoming);
        if (!touched) return false;
        await DB.update('projects', existing.id, merged);
        return 'updated';
      }
      await DB.add('projects', {
        clientId: cid || null,
        nom,
        code,
        tauxHoraire: incoming.tauxHoraire ?? null,
        budgetHeures: incoming.budgetHeures ?? null,
        actif: incoming.actif === undefined ? true : incoming.actif,

        statutProjet: incoming.statutProjet || 'active',
        prix: incoming.prix ?? null,
        typeFacturation: incoming.typeFacturation
      });
      ctx.existingProjects = await DB.getAll('projects');
      return true;
    },
    finalize: async (ctx) => {
      if (ctx.newTypes.length) {
        const cur = await getProjectTypes();
        await setProjectTypes([...cur, ...ctx.newTypes]);
      }
    }
  },
  tasks: {
    template: {
      headers: ['nom', 'description', 'statut', 'typeTask'],
      sample: [['Réunion hebdo', 'Stand-up équipe', 'open', 'Réunion']]
    },
    buildContext: async () => ({ all: await DB.getAll('tasks') }),
    importRow: async (row, ctx) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      const incoming = {
        nom,
        description: String(row.description || '').trim(),
        statut: String(row.statut || '').trim(),
        typeTask: String(row.typeTask || '').trim()
      };
      const existing = ctx.all.find(x => (x.nom || '').toLowerCase() === nom.toLowerCase());
      if (existing) {
        const { merged, touched } = fillEmpty(existing, incoming);
        if (!touched) return false;
        await DB.update('tasks', existing.id, merged);
        return 'updated';
      }
      await DB.add('tasks', { ...incoming, statut: incoming.statut || 'open' });
      ctx.all = await DB.getAll('tasks');
      return true;
    }
  },
  employees: {
    template: {
      headers: ['numeroEmploye', 'nom', 'email', 'role', 'tauxHoraire'],
      sample: [['EMP001', 'Jean Dupont', 'jean.dupont@example.com', 'Développeur', 50]]
    },
    buildContext: async () => ({ all: await DB.getAll('employees') }),
    importRow: async (row, ctx) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      const num = String(row.numeroEmploye || '').trim();
      const email = String(row.email || '').trim();
      const incoming = {
        numeroEmploye: num,
        nom,
        email,
        role: String(row.role || '').trim(),
        tauxHoraire: row.tauxHoraire === '' || row.tauxHoraire == null ? undefined : Number(row.tauxHoraire)
      };
      const lc = (s) => String(s || '').toLowerCase();
      const existing = ctx.all.find(e =>
        (num && lc(e.numeroEmploye) === lc(num))
        || (email && lc(e.email) === lc(email))
        || lc(e.nom) === lc(nom)
      );
      if (existing) {
        const { merged, touched } = fillEmpty(existing, incoming);
        if (!touched) return false;
        await DB.update('employees', existing.id, merged);
        return 'updated';
      }
      await DB.add('employees', {
        numeroEmploye: num, nom, email,
        role: incoming.role || 'employe',
        tauxHoraire: incoming.tauxHoraire ?? null,
        actif: true
      });
      ctx.all = await DB.getAll('employees');
      return true;
    }
  },
  timeEntries: {
    template: {
      // Identification de l'employé : fournissez de préférence numeroEmploye + nom.
      // email est accepté en alternative. Le matching essaie dans l'ordre :
      // numeroEmploye → email → nom (insensible à la casse et aux accents).
      headers: ['numeroEmploye', 'nom', 'email', 'client', 'projet', 'tache', 'date', 'heures', 'description'],
      sample: [
        ['EMP001', 'Jean Dupont', 'jean.dupont@example.com', 'Acme Corp', 'WEB-2025', 'Réunion hebdo', '2025-05-01', 1.5, 'Stand-up du lundi'],
        ['EMP002', 'Carla Dev',   '',                        'Acme Corp', 'WEB-2025', 'Développement', '2025-05-01', 6,   'Implémentation login']
      ]
    },
    buildContext: async () => {
      const [employees, clients, projects, tasks, existingEntries] = await Promise.all([
        DB.getAll('employees'), DB.getAll('clients'),
        DB.getAll('projects'), DB.getAll('tasks'),
        DB.getAll('timeEntries')
      ]);
      return {
        employees, clients, projects, tasks, existingEntries,
        clientByName: Object.fromEntries(clients.map(c => [c.nom.toLowerCase(), c.id])),
        projectByCode: Object.fromEntries(projects.filter(p => p.code).map(p => [p.code.toLowerCase(), p.id])),
        projectByName: Object.fromEntries(projects.map(p => [p.nom.toLowerCase(), p.id])),
        taskByName: Object.fromEntries(tasks.map(x => [x.nom.toLowerCase(), x.id]))
      };
    },
    importRow: async (row, ctx) => {
      const date = parseAttDate(row.date);
      const heures = Number(row.heures);
      if (!date || !heures) return false;
      const empIdent = pickCol(row, 'numeroEmploye', 'matricule', 'email', 'nom', 'employe', 'employee', 'name');
      const emp = matchEmployee(ctx.employees, empIdent);
      if (!emp) return false;
      let cid = Number(row.client);
      if (!cid && row.client) cid = ctx.clientByName[String(row.client).toLowerCase().trim()] || null;
      let pid = Number(row.projet);
      if (!pid && row.projet) {
        const k = String(row.projet).toLowerCase().trim();
        pid = ctx.projectByCode[k] || ctx.projectByName[k] || null;
      }
      let tid = Number(row.tache);
      if (!tid && row.tache) tid = ctx.taskByName[String(row.tache).toLowerCase().trim()] || null;
      const incoming = {
        employeId: emp.id,
        clientId: cid || undefined,
        projectId: pid || undefined,
        taskId: tid || undefined,
        date, heures,
        description: String(row.description || '').trim()
      };
      // Match: same employee + date + project + task (when both keys present)
      const existing = ctx.existingEntries.find(e =>
        Number(e.employeId) === emp.id && e.date === date
        && Number(e.projectId || 0) === Number(pid || 0)
        && Number(e.taskId || 0) === Number(tid || 0)
      );
      if (existing) {
        const { merged, touched } = fillEmpty(existing, incoming);
        if (!touched) return false;
        await DB.update('timeEntries', existing.id, merged);
        return 'updated';
      }
      await DB.add('timeEntries', {
        employeId: emp.id,
        clientId: cid || null,
        projectId: pid || null,
        taskId: tid || null,
        date, heures,
        description: incoming.description,
        statutValidation: 'brouillon',
        submissionId: null,
        verrouille: false
      });
      ctx.existingEntries = await DB.getAll('timeEntries');
      return true;
    }
  },
  attendance: {
    // Template covers ALL accepted entry fields. Provide an employee
    // identifier in any of: email | numeroEmploye (matricule) | nom.
    // pause is in hours (1.5 = 1h30) but values >= 5 are interpreted
    // as minutes by the importer. totalHeures takes precedence over
    // entrée/sortie when present; otherwise it is computed.
    template: {
      headers: ['email', 'numeroEmploye', 'nom', 'date', 'heureEntree', 'heureSortie', 'pause', 'totalHeures', 'source'],
      sample: [
        ['jean.dupont@example.com', 'EMP001', 'Jean Dupont', '2025-05-01', '09:00', '17:30', 0.5, 8, 'import'],
        ['', 'EMP002', 'Carla Dev',                          '2025-05-01', '08:30', '17:00', 30,  '',  'import']
      ]
    }
    // NOTE: actual import handled by importAttendanceHandler (richer report).
  }
};

async function downloadTemplate(entity) {
  const tpl = ENTITY_IMPORTS[entity]?.template;
  if (!tpl) return;
  const ws = XLSX.utils.aoa_to_sheet([tpl.headers, ...tpl.sample]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, entity);
  XLSX.writeFile(wb, `template-${entity}.xlsx`);
}

// Merge only empty fields of `existing` from `updates`. Never overwrite
// a value that's already populated. Empty = null | undefined | '' | [].
function fillEmpty(existing, updates) {
  const out = { ...existing };
  let touched = false;
  for (const [k, v] of Object.entries(updates)) {
    if (v == null || v === '') continue; // ignore empty incoming values
    const cur = out[k];
    const empty = cur == null || cur === '' || (Array.isArray(cur) && cur.length === 0);
    if (empty) { out[k] = v; touched = true; }
  }
  return { merged: out, touched };
}

async function importEntityFile(entity, file) {
  const cfg = ENTITY_IMPORTS[entity];
  if (!cfg || !cfg.importRow) throw new Error('No importer for ' + entity);
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  const ctx = cfg.buildContext ? await cfg.buildContext() : {};
  let imported = 0, ignored = 0, updated = 0;
  for (const row of rows) {
    try {
      const r = await cfg.importRow(row, ctx);
      if (r === 'updated') updated++;
      else if (r) imported++;
      else ignored++;
    } catch (e) {
      console.warn('import row failed', e, row);
      ignored++;
    }
  }
  if (cfg.finalize) await cfg.finalize(ctx);
  return { imported, ignored, updated };
}

function exportListToExcel(filename, sheetName, headers, rows) {
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename + '.xlsx');
}

async function exportEntity(entity) {
  const fn = ENTITY_EXPORTERS[entity];
  if (!fn) { toast('!'); return; }
  const { headers, rows } = await fn();
  const today = new Date().toISOString().slice(0,10);
  exportListToExcel(`export-${entity}-${today}`, entity, headers, rows);
  toast(t('exported'));
}

function wireImportBar(refreshFn) {
  $$('[data-export]').forEach(b => b.onclick = () => exportEntity(b.dataset.export));
  $$('[data-tpl]').forEach(b => b.onclick = () => downloadTemplate(b.dataset.tpl));
  $$('[data-import]').forEach(inp => {
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const { imported, ignored, updated } = await importEntityFile(inp.dataset.import, file);
        toast(`${imported} ${t('linesImported')} · ${updated} ${t('linesUpdated')} · ${ignored} ${t('linesIgnored')}`);
      } catch (err) {
        console.error(err);
        toast(t('importErr') + ': ' + err.message);
      } finally {
        e.target.value = '';
        refreshFn?.();
      }
    };
  });
}

function clientForm(rec) {
  const r = rec || { nom: '', adresse: '', contact: '', actif: true };
  openModal({
    title: rec ? t('edit') : t('add'),
    bodyHtml: `
      <div class="space-y-3">
        ${field('nom', t('clientName'), r.nom, 'text', true)}
        ${field('adresse', t('clientAddress'), r.adresse)}
        ${field('contact', t('clientContact'), r.contact)}
        ${checkbox('actif', t('clientActive'), r.actif)}
      </div>`,
    onSave: async () => {
      const data = {
        nom: $('#f_nom').value.trim(),
        adresse: $('#f_adresse').value.trim(),
        contact: $('#f_contact').value.trim(),
        actif: $('#f_actif').checked
      };
      if (!data.nom) return false;
      if (rec) await DB.update('clients', rec.id, data);
      else await DB.add('clients', data);
      toast(t('saved'));
      renderClients();
    }
  });
}

/* ----- BILLING TYPES ----- */
async function renderBillingTypes() {
  const list = await getBillingTypes();
  PAGE.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-900">💲 ${escapeHtml(t('billingTypesTitle'))}</h1>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-2xl">
      <div class="flex gap-2 mb-4">
        <input id="newBtInput" type="text" placeholder="${escapeHtml(t('billingTypeName'))}" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
        <button id="addBtBtn" class="px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm">+ ${escapeHtml(t('addBillingType'))}</button>
      </div>
      <div id="btList">
        ${list.length === 0
          ? `<p class="text-sm text-slate-500">${escapeHtml(t('noBillingTypes'))}</p>`
          : `<ul class="divide-y divide-slate-100 border border-slate-200 rounded-lg">
              ${list.map((tp, i) => `
                <li class="flex items-center justify-between px-3 py-2 text-sm">
                  <span>${escapeHtml(tp)}</span>
                  <button data-idx="${i}" class="del-bt text-red-600 hover:underline text-xs">${escapeHtml(t('delete'))}</button>
                </li>`).join('')}
            </ul>`}
      </div>
    </div>
  `;

  $('#addBtBtn').onclick = async () => {
    const input = $('#newBtInput');
    const v = input.value.trim();
    if (!v) return;
    const cur = await getBillingTypes();
    if (cur.some(x => x.toLowerCase() === v.toLowerCase())) {
      toast(t('typeAlreadyExists'));
      return;
    }
    cur.push(v);
    await setBillingTypes(cur);
    input.value = '';
    toast(t('saved'));
    renderBillingTypes();
  };
  $('#newBtInput').onkeydown = (e) => { if (e.key === 'Enter') $('#addBtBtn').click(); };
  $$('#btList .del-bt').forEach(b => b.onclick = async () => {
    const idx = Number(b.dataset.idx);
    const cur = await getBillingTypes();
    cur.splice(idx, 1);
    await setBillingTypes(cur);
    toast(t('deleted'));
    renderBillingTypes();
  });
}

/* ----- EMPLOYEES ----- */
async function renderEmployees() {
  renderListShell({
    title: t('employeesTitle'),
    addLabel: t('add'),
    searchPlaceholder: t('search'),
    onAdd: () => employeeForm(),
    entity: 'employees',
    refreshFn: renderEmployees
  });
  const isAdmin = Auth.getSession()?.role === 'admin';
  const draw = async () => {
    const all = await DB.getAll('employees');
    const empById = Object.fromEntries(all.map(e => [e.id, e]));
    const q = $('#searchInput').value.trim().toLowerCase();
    const filtered = all.filter(e => !q
      || (e.nom||'').toLowerCase().includes(q)
      || (e.email||'').toLowerCase().includes(q)
      || (e.numeroEmploye||'').toLowerCase().includes(q));
    const rows = filtered.map(e => {
      const mgr = e.managerId ? empById[e.managerId]?.nom : '';
      const actBadge = e.actif === false
        ? `<span class="px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 text-xs">—</span>`
        : `<span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-xs">●</span>`;
      const adminBtns = isAdmin ? `
        <button data-act="resetpin" data-id="${e.id}" class="text-blue-700 hover:underline text-sm ms-3">${escapeHtml(t('resetPin'))}</button>
        <button data-act="toggle"   data-id="${e.id}" class="text-slate-700 hover:underline text-sm ms-3">${escapeHtml(e.actif === false ? t('activate') : t('deactivate'))}</button>
        <button data-act="unlock"   data-id="${e.id}" class="text-amber-700 hover:underline text-sm ms-3">${escapeHtml(t('unlockEntries'))}</button>
      ` : '';
      const editDel = isAdmin
        ? rowActions(e.id)
        : `<span class="text-slate-400 text-xs">${escapeHtml(t('forbidden'))}</span>`;
      return `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3 text-slate-600">${escapeHtml(e.numeroEmploye || '')}</td>
        <td class="px-4 py-3">${escapeHtml(e.nom)}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(e.email || '')}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(roleLabel(e.role || 'employe'))}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(mgr || '')}</td>
        <td class="px-4 py-3">${actBadge}</td>
        <td class="px-4 py-3 text-slate-600">${e.tauxHoraire ?? ''}</td>
        <td class="px-4 py-3">${editDel}${adminBtns}</td>
      </tr>`;
    }).join('');
    $('#listBody').innerHTML = tableEl(
      [t('empNumber'), t('empName'), t('empEmail'), t('role'), t('manager'), t('actif'), t('empRate'), t('actions')],
      rows
    );
    $$('#listBody [data-act]').forEach(b => b.onclick = async () => {
      const id = Number(b.dataset.id);
      const act = b.dataset.act;
      if (act === 'edit') {
        if (!isAdmin) return;
        employeeForm(await DB.getById('employees', id));
      } else if (act === 'delete') {
        if (!isAdmin) return;
        if (await confirmModal(t('confirmDelete'))) {
          await DB.remove('employees', id);
          toast(t('deleted'));
          draw();
        }
      } else if (act === 'resetpin') {
        if (!isAdmin) return;
        resetPinForm(id);
      } else if (act === 'toggle') {
        if (!isAdmin) return;
        const emp = await DB.getById('employees', id);
        await DB.update('employees', id, { actif: !(emp.actif !== false) });
        toast(t('saved'));
        draw();
      } else if (act === 'unlock') {
        if (!isAdmin) return;
        if (!await confirmModal(t('confirmUnlock'))) return;
        const entries = await DB.getAll('timeEntries');
        let n = 0;
        for (const en of entries.filter(x => Number(x.employeId) === id && x.verrouille)) {
          await DB.update('timeEntries', en.id, { verrouille: false, statutValidation: 'brouillon', submissionId: null });
          n++;
        }
        toast(`${n} ${t('entriesUnlocked')}`);
      }
    });
  };
  $('#searchInput').oninput = draw;
  await draw();
}

async function employeeForm(rec) {
  const allEmps = await DB.getAll('employees');
  const managers = allEmps.filter(e => e.role === 'manager' || e.role === 'admin');
  const r = rec || { numeroEmploye: '', nom: '', email: '', role: 'employe', tauxHoraire: '', managerId: null, actif: true, peutAssignerA: [] };

    { value: 'admin',   label: t('roleAdmin') },

    title: rec ? t('edit') : t('add'),

        </div>
        ${field('tauxHoraire', t('empRate'), r.tauxHoraire, 'number')}
        ${rec ? '' : `
          ${field('pin1', t('pin'), '', 'password')}
          ${field('pin2', t('confirmPin'), '', 'password')}
          <p class="text-xs text-slate-500">${escapeHtml(t('pinRequired'))}</p>
        `}
        ${checkbox('actif', t('actif'), r.actif !== false)}
        ${isAdmin ? `
          <div id="assignWrap" class="border-t border-slate-200 pt-3">
            <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('canAssignTo'))}</label>
            <p class="text-xs text-slate-500 mb-2">${escapeHtml(t('selfAssignAlwaysHint'))}</p>
            <div class="border border-slate-300 rounded-lg p-2 max-h-40 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-1">
              ${others.length === 0
                ? `<p class="text-xs text-slate-400 px-2 py-1">${escapeHtml(t('noResults'))}</p>`
                : others.map(e => `<label class="inline-flex items-center gap-2 text-sm px-2 py-1 rounded hover:bg-slate-50">
                    <input type="checkbox" class="ee-can-assign w-4 h-4" value="${e.id}" ${preChecked.has(Number(e.id)) ? 'checked' : ''}>
                    ${escapeHtml((e.numeroEmploye ? e.numeroEmploye + ' — ' : '') + e.nom)}
                  </label>`).join('')}
            </div>
          </div>` : ''}
      </div>`,
    onSave: async () => {
      const role = $('#f_role').value;
      const data = {
        numeroEmploye: $('#f_numeroEmploye').value.trim(),
        nom: $('#f_nom').value.trim(),
        email: $('#f_email').value.trim(),
        role,
        managerId: role === 'employe' ? (Number($('#f_managerId').value) || null) : null,
        tauxHoraire: $('#f_tauxHoraire').value === '' ? null : Number($('#f_tauxHoraire').value),
        actif: $('#f_actif').checked
      };
      if (isAdmin) {
        data.peutAssignerA = Array.from(document.querySelectorAll('.ee-can-assign:checked')).map(c => Number(c.value));
      }
      if (!data.nom) return false;
      if (!rec) {
        const p1 = $('#f_pin1').value.trim();
        const p2 = $('#f_pin2').value.trim();
        if (!p1 || p1.length < 4) { toast(t('pinRequired')); return false; }
        if (p1 !== p2) { toast(t('pinMismatch')); return false; }
        data.pin = await Auth.hashPin(p1);
        await DB.add('employees', data);
      } else {
        await DB.update('employees', rec.id, data);
      }
      toast(t('saved'));
      renderEmployees();
    }
  });
  // Hide manager select if role isn't 'employe'
  const updateMgrVis = () => {
    $('#mgr_wrap').style.display = $('#f_role').value === 'employe' ? '' : 'none';
  };
  $('#f_role').onchange = updateMgrVis;
  updateMgrVis();

/* ----- ATTENDANCE helpers ----- */
function normName(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}
function pickCol(row, ...names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const k = keys.find(x => x.toLowerCase().trim() === n.toLowerCase());
    if (k != null && row[k] !== '') return row[k];
  }
  return undefined;
}
function parseAttDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if (!isNaN(d)) return d.toISOString().slice(0, 10);
  }
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function parseAttTime(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const total = (v - Math.floor(v)) * 24;
    const h = Math.floor(total);
    const min = Math.round((total - h) * 60);
    return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : null;
}
function diffHours(entree, sortie, pauseHours = 0) {
  if (!entree || !sortie) return null;
  const [eh, em] = entree.split(':').map(Number);
  const [sh, sm] = sortie.split(':').map(Number);
  let h = (sh + sm/60) - (eh + em/60);
  if (h < 0) h += 24;
  return Math.max(0, h - (pauseHours || 0));
}
function timeAdd(timeStr, hoursToAdd) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const totalMin = h * 60 + m + Math.round(Number(hoursToAdd) * 60);
  const wrapped = ((totalMin % 1440) + 1440) % 1440;
  const nh = Math.floor(wrapped / 60);
  const nm = wrapped % 60;
  return String(nh).padStart(2,'0') + ':' + String(nm).padStart(2,'0');
}
function parsePauseHours(v) {
  if (v == null || v === '') return 0;
  const n = Number(v);
  if (isNaN(n)) return 0;
  // heuristic: values >= 5 treated as minutes, else hours
  return n >= 5 ? n / 60 : n;
}
function matchEmployee(employees, idValue) {
  if (idValue == null || idValue === '') return null;
  const v = String(idValue).trim();
  let e = employees.find(x => x.email && String(x.email).toLowerCase() === v.toLowerCase());
  if (e) return e;
  e = employees.find(x => x.numeroEmploye && String(x.numeroEmploye).toLowerCase() === v.toLowerCase());
  if (e) return e;
  e = employees.find(x => x.nom === v);
  if (e) return e;
  const nv = normName(v);
  return employees.find(x => normName(x.nom) === nv) || null;
}

async function attendanceForm(rec) {

    bodyHtml: `
      <div class="space-y-3">
        ${selectField('employeId', t('timeEmployee'), employees.map(e => ({ value: e.id, label: (e.numeroEmploye ? e.numeroEmploye + ' — ' : '') + e.nom })), r.employeId, true)}
        ${field('date', t('attDate'), r.date, 'date', true)}
        <div class="grid grid-cols-2 gap-3">
          ${field('heureEntree', t('attClockIn'), r.heureEntree, 'time')}
          ${field('heureSortie', t('attClockOut'), r.heureSortie, 'time')}
        </div>
        <div class="grid grid-cols-2 gap-3">
          ${field('pause', t('attBreak') + ' (h)', r.pause ?? 0, 'number')}
          ${field('totalHeures', t('attTotal'), r.totalHeures, 'number')}
        </div>
        <p class="text-xs text-slate-500">${escapeHtml(t('attTotal'))} ⇄ ${escapeHtml(t('attClockOut'))} : ${LANG === 'fr' ? "saisissez l'un, l'autre se calcule" : LANG === 'he' ? 'הזן אחד, השני יחושב' : 'enter one, the other is computed'}.</p>
      </div>`,
    onSave: async () => {
      const employeId = Number($('#f_employeId').value) || null;
      const date = $('#f_date').value;
      if (!employeId || !date) return false;
      const heureEntree = $('#f_heureEntree').value || null;
      const heureSortie = $('#f_heureSortie').value || null;
      const pause = Number($('#f_pause').value) || 0;
      let totalHeures = $('#f_totalHeures').value === '' ? null : Number($('#f_totalHeures').value);
      if (totalHeures == null) totalHeures = diffHours(heureEntree, heureSortie, pause);
      const data = {
        employeId, date, heureEntree, heureSortie, pause,
        totalHeures: totalHeures == null ? 0 : Number(totalHeures),
        source: rec ? rec.source : 'manuel',
        importeLe: rec ? rec.importeLe : new Date().toISOString()
      };
      if (rec) await DB.update('attendance', rec.id, data);
      else await DB.add('attendance', data);
      toast(t('saved'));
      renderAttendance();
    }
  });

  // Live auto-compute: typing end recomputes total; typing total recomputes end.
  const fEntree = $('#f_heureEntree');
  const fSortie = $('#f_heureSortie');
  const fPause  = $('#f_pause');
  const fTotal  = $('#f_totalHeures');
  const recomputeTotal = () => {
    if (!fEntree.value || !fSortie.value) return;
    const h = diffHours(fEntree.value, fSortie.value, Number(fPause.value) || 0);
    if (h != null) fTotal.value = fmt(h);
  };
  const recomputeSortie = () => {
    if (!fEntree.value || !fTotal.value) return;
    fSortie.value = timeAdd(fEntree.value, Number(fTotal.value) + (Number(fPause.value) || 0));
  };
  fSortie.addEventListener('input', recomputeTotal);
  fTotal.addEventListener('input', recomputeSortie);
  fEntree.addEventListener('input', () => {
    if (fSortie.value) recomputeTotal();
    else if (fTotal.value) recomputeSortie();
  });
  fPause.addEventListener('input', () => {
    if (fSortie.value && !fTotal.value) recomputeTotal();
    else if (fTotal.value) recomputeSortie();
    else if (fSortie.value) recomputeTotal();
  });
}

/* ----- ATTENDANCE EXCEL IMPORT ----- */
async function importAttendanceHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheetName = wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
    const employees = await DB.getAll('employees');

    let imported = 0, updated = 0, ignored = 0;
    const errors = []; // { row, raw, parsed }
    const importedAt = new Date().toISOString();

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const idVal = pickCol(r, 'email', 'matricule', 'numeroEmploye', 'nom', 'employe', 'employee', 'name');
      const dateVal = pickCol(r, 'date');
      const inVal = pickCol(r, 'heureEntree', 'entree', 'entrée', 'clockIn', 'in', 'start');
      const outVal = pickCol(r, 'heureSortie', 'sortie', 'clockOut', 'out', 'end');
      const pauseVal = pickCol(r, 'pause', 'break');
      const totalVal = pickCol(r, 'totalHeures', 'heures', 'total', 'hours');

      const date = parseAttDate(dateVal);
      if (!date) { ignored++; continue; }

      const emp = matchEmployee(employees, idVal);
      const heureEntree = parseAttTime(inVal);
      const heureSortie = parseAttTime(outVal);
      const pauseH = parsePauseHours(pauseVal);
      let totalHeures = totalVal === '' || totalVal == null ? null : Number(totalVal);
      if (totalHeures == null) totalHeures = diffHours(heureEntree, heureSortie, pauseH);
      totalHeures = totalHeures == null ? 0 : Number(totalHeures);

      const record = {
        date, heureEntree, heureSortie, pause: pauseH,
        totalHeures, source: 'import', importeLe: importedAt
      };

      if (!emp) {
        errors.push({ rowIndex: i + 2, raw: idVal, record });
        continue;
      }

      record.employeId = emp.id;
      const existing = await DB.getAttendanceForEmployeeDate(emp.id, date);
      if (existing) {
        // Only fill empty fields; don't overwrite existing values.
        const { merged, touched } = fillEmpty(existing, record);
        if (touched) {
          await DB.update('attendance', existing.id, merged);
          updated++;
        }
      } else {
        await DB.add('attendance', record);
        imported++;
      }
    }

    showImportReport({ imported, updated, ignored, errors, employees });
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

function showImportReport({ imported, updated, ignored, errors, employees }) {
  const empOptions = employees.map(e => `<option value="${e.id}">${escapeHtml((e.numeroEmploye ? e.numeroEmploye + ' — ' : '') + e.nom)}</option>`).join('');
  const errorRows = errors.map((e, i) => `
    <tr class="text-sm">
      <td class="px-2 py-1 text-slate-500">${escapeHtml(t('rowLabel'))} ${e.rowIndex}</td>
      <td class="px-2 py-1">${escapeHtml(e.raw == null ? '' : String(e.raw))}</td>
      <td class="px-2 py-1">${escapeHtml(e.record.date)}</td>
      <td class="px-2 py-1">
        <select data-err-idx="${i}" class="px-2 py-1 border border-slate-300 rounded text-xs">
          <option value="">—</option>${empOptions}
        </select>
      </td>
    </tr>
  `).join('');

  const body = `
    <div class="space-y-3 text-sm">
      <p><span class="font-medium text-green-700">${imported}</span> ${escapeHtml(t('linesImported'))},
         <span class="font-medium text-blue-700">${updated}</span> ${escapeHtml(t('linesUpdated'))},
         <span class="font-medium text-orange-700">${errors.length + ignored}</span> ${escapeHtml(t('linesIgnored'))}</p>
      ${errors.length ? `
        <div>
          <p class="font-medium text-slate-700 mb-2">${escapeHtml(t('unknownEmployee'))} (${errors.length})</p>
          <div class="border border-slate-200 rounded overflow-hidden max-h-72 overflow-y-auto">
            <table class="w-full">
              <thead class="bg-slate-50 text-xs text-slate-500"><tr>
                <th class="px-2 py-1 text-start">${escapeHtml(t('rowLabel'))}</th>
                <th class="px-2 py-1 text-start">${escapeHtml(t('attFilterEmp'))}</th>
                <th class="px-2 py-1 text-start">${escapeHtml(t('attDate'))}</th>
                <th class="px-2 py-1 text-start">${escapeHtml(t('mapEmployee'))}</th>
              </tr></thead>
              <tbody>${errorRows}</tbody>
            </table>
          </div>
        </div>` : ''}
    </div>
  `;

  openModal({
    title: t('importReport'),
    bodyHtml: body,
    hideSave: errors.length === 0,
    onSave: async () => {
      let added = 0;
      for (let i = 0; i < errors.length; i++) {
        const sel = document.querySelector(`[data-err-idx="${i}"]`);
        if (!sel || !sel.value) continue;
        const empId = Number(sel.value);
        const rec = { ...errors[i].record, employeId: empId };
        const existing = await DB.getAttendanceForEmployeeDate(empId, rec.date);
        if (existing) {
          const { merged, touched } = fillEmpty(existing, rec);
          if (touched) await DB.update('attendance', existing.id, merged);
        } else {
          await DB.add('attendance', rec);
        }
        added++;
      }
      if (added) toast(`${added} ${t('applyMapping')}`);
      renderAttendance();
    }
  });
}
