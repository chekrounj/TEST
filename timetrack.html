  const cById = Object.fromEntries(clients.map(c => [c.id, c]));
  const pById = Object.fromEntries(projects.map(p => [p.id, p]));
  const tById = Object.fromEntries(tasks.map(x => [x.id, x]));

  const today = new Date();
  const monthAgo = new Date(today.getTime() - 30 * 86400000);
  const defaultFrom = monthAgo.toISOString().slice(0,10);
  const defaultTo = today.toISOString().slice(0,10);

  PAGE.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-900">📈 ${escapeHtml(t('reportsTitle'))}</h1>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-4 no-print">
      <h2 class="font-semibold text-slate-900 mb-3">${escapeHtml(t('reportFilters'))}</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attFromDate'))}</label>
          <input id="rp_from" type="date" value="${defaultFrom}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attToDate'))}</label>
          <input id="rp_to" type="date" value="${defaultTo}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div></div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('timeClient'))}</label>
          <select id="rp_client" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">—</option>
            ${clients.map(c => `<option value="${c.id}">${escapeHtml(c.nom)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('timeProject'))}</label>
          <select id="rp_project" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">—</option>
            ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.nom)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('timeEmployee'))}</label>
          <select id="rp_emp" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">—</option>
            ${employees.map(e => `<option value="${e.id}">${escapeHtml(e.nom)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('reportGroupBy'))}</label>
          <select id="rp_group" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">${escapeHtml(t('reportNoGroup'))}</option>
            <option value="client">${escapeHtml(t('colClient'))}</option>
            <option value="project">${escapeHtml(t('colProject'))}</option>
            <option value="projectType">${escapeHtml(t('colProjectType'))}</option>
            <option value="employee">${escapeHtml(t('colEmployee'))}</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('reportSortBy'))}</label>
          <select id="rp_sort" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="date">${escapeHtml(t('colDate'))}</option>
            <option value="employee">${escapeHtml(t('colEmployee'))}</option>
            <option value="client">${escapeHtml(t('colClient'))}</option>
            <option value="project">${escapeHtml(t('colProject'))}</option>
            <option value="projectType">${escapeHtml(t('colProjectType'))}</option>
            <option value="hours">${escapeHtml(t('colHours'))}</option>
            <option value="cost">${escapeHtml(t('colCost'))}</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('reportColumns'))}</label>
        <div class="flex flex-wrap gap-2">
          ${REPORT_COLUMNS.map(c => `
            <label class="inline-flex items-center gap-1 px-2 py-1 rounded border border-slate-300 text-sm cursor-pointer hover:bg-slate-50">
              <input type="checkbox" data-col="${c.key}" class="w-4 h-4" ${['date','employee','client','project','hours','cost'].includes(c.key) ? 'checked' : ''}>
              ${escapeHtml(t(c.labelKey))}
            </label>`).join('')}
        </div>
      </div>
      <div class="mt-4 flex flex-wrap gap-2 justify-end">
        <button id="rp_expandAll"   class="px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">▼ ${escapeHtml(t('expandAll'))}</button>
        <button id="rp_collapseAll" class="px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">▶ ${escapeHtml(t('collapseAll'))}</button>
        <button id="rp_generate" class="px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm">${escapeHtml(t('reportGenerate'))}</button>
        <button id="rp_export"   class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">📊 ${escapeHtml(t('exportExcel'))}</button>
        <button id="rp_print"    class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">🖨 ${escapeHtml(t('reportPrint'))}</button>
      </div>
    </div>

    <div id="printArea" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <h2 class="text-lg font-bold text-slate-900 mb-1">📈 ${escapeHtml(t('reportsTitle'))}</h2>
      <div id="rp_meta" class="text-sm text-slate-500 mb-3"></div>
      <div id="rp_body"></div>
    </div>
  `;

  // Helper that produces flat rows + grouped structure
  const computeRows = () => {
    const fFrom = $('#rp_from').value;
    const fTo   = $('#rp_to').value;
    const fCli  = $('#rp_client').value;
    const fPrj  = $('#rp_project').value;
    const fEmp  = $('#rp_emp').value;
    const groupBy = $('#rp_group').value;
    const sortBy  = $('#rp_sort').value;

    let list = entries.slice();
    if (fFrom) list = list.filter(en => (en.date || '') >= fFrom);
    if (fTo)   list = list.filter(en => (en.date || '') <= fTo);
    if (fCli)  list = list.filter(en => Number(en.clientId) === Number(fCli));
    if (fPrj)  list = list.filter(en => Number(en.projectId) === Number(fPrj));
    if (fEmp)  list = list.filter(en => Number(en.employeId) === Number(fEmp));

    const enriched = list.map(en => {
      const emp = eById[en.employeId] || {};
      const proj = pById[en.projectId] || {};
      const rate = Number(emp.tauxHoraire) || 0;
      const hours = Number(en.heures) || 0;
      return {
        date: en.date || '',
        employee: emp.nom || '?',
        client: cById[en.clientId]?.nom || '',
        project: proj.nom || '',
        projectType: proj.typeProjet || t('untyped'),
        task: tById[en.taskId]?.nom || '',
        hours,
        rate,
        cost: hours * rate,
        description: en.description || ''
      };
    });

    const cmp = (a, b) => {
      const va = a[sortBy], vb = b[sortBy];
      if (typeof va === 'number') return vb - va; // numeric desc
      return String(va || '').localeCompare(String(vb || ''));
    };
    enriched.sort(cmp);

    return { rows: enriched, groupBy, fFrom, fTo };
  };

  const draw = () => {
    const { rows, groupBy, fFrom, fTo } = computeRows();
    const cols = REPORT_COLUMNS.filter(c => $(`#printArea-cols`)
      ? false
      : (document.querySelector(`[data-col="${c.key}"]`)?.checked));
    const totalHours = rows.reduce((s, r) => s + r.hours, 0);
    const totalCost  = rows.reduce((s, r) => s + r.cost, 0);

    const headerRow = `<tr class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">${
      cols.map(c => `<th class="px-3 py-2 text-start font-medium">${escapeHtml(t(c.labelKey))}</th>`).join('')
    }</tr>`;

    const dataRowHtml = (r) => `<tr class="border-t border-slate-100">${
      cols.map(c => {
        const v = r[c.key];
        const txt = c.num ? (v == null ? '' : (Math.round(v * 100) / 100).toString()) : (v ?? '');
        return `<td class="px-3 py-2 ${c.num ? 'text-end font-medium' : ''}">${escapeHtml(String(txt))}</td>`;
      }).join('')
    }</tr>`;

    let bodyHtml = '';
    if (groupBy) {
      const groups = {};
      for (const r of rows) {
        const k = r[groupBy] || '?';
        (groups[k] = groups[k] || []).push(r);
      }
      const sortedKeys = Object.keys(groups).sort();
      bodyHtml = sortedKeys.map(k => {
        const gh = groups[k].reduce((s, r) => s + r.hours, 0);
        const gc = groups[k].reduce((s, r) => s + r.cost, 0);
        const open = renderReports._expanded.has(k);
        const arrow = open ? '▼' : '▶';
        return `
          <tr class="bg-blue-50 cursor-pointer hover:bg-blue-100" data-group-key="${escapeHtml(k)}">
            <td colspan="${cols.length}" class="px-3 py-2 font-semibold text-blue-900">
              <span class="inline-block w-4 text-blue-700">${arrow}</span>
              ${escapeHtml(k)} <span class="text-blue-700 text-xs">— ${groups[k].length} · ${fmt(gh)} h · ${fmt(gc)}</span>
            </td>
          </tr>
          ${open ? groups[k].map(dataRowHtml).join('') : ''}
        `;
      }).join('');
      // Stash for expand/collapse-all buttons
      renderReports._allKeys = sortedKeys;
    } else {
      bodyHtml = rows.map(dataRowHtml).join('');
      renderReports._allKeys = [];
    }

    const totalRow = `
      <tr class="bg-slate-100 font-semibold border-t-2 border-slate-300">
        <td colspan="${Math.max(1, cols.length - 2)}" class="px-3 py-2 text-end">${escapeHtml(t('reportTotalHours'))} / ${escapeHtml(t('reportTotalCost'))}</td>
        ${cols.find(c => c.key === 'hours') ? `<td class="px-3 py-2 text-end">${fmt(totalHours)}</td>` : ''}
        ${cols.find(c => c.key === 'cost')  ? `<td class="px-3 py-2 text-end">${fmt(totalCost)}</td>` : ''}
      </tr>`;

    $('#rp_meta').textContent = `${t('reportPeriod')}: ${fFrom || '—'} → ${fTo || '—'} · ${rows.length} ${t('linesImported')}`;
    $('#rp_body').innerHTML = rows.length
      ? `<div class="overflow-x-auto"><table class="w-full text-sm border border-slate-200 rounded">
          <thead>${headerRow}</thead>
          <tbody>${bodyHtml}</tbody>
          <tfoot>${cols.find(c => c.key === 'hours' || c.key === 'cost') ? totalRow : ''}</tfoot>
        </table></div>`
      : `<p class="text-sm text-slate-500">${escapeHtml(t('noResults'))}</p>`;
  };

  // Init expanded set (per render)
  if (!renderReports._expanded) renderReports._expanded = new Set();
  // Hook group toggle clicks (delegated)
  $('#rp_body').addEventListener('click', (ev) => {
    const tr = ev.target.closest('[data-group-key]');
    if (!tr) return;
    const k = tr.dataset.groupKey;
    if (renderReports._expanded.has(k)) renderReports._expanded.delete(k);
    else renderReports._expanded.add(k);
    draw();
  });
  $('#rp_expandAll').onclick = () => {
    renderReports._expanded = new Set(renderReports._allKeys || []);
    draw();
  };
  $('#rp_collapseAll').onclick = () => {
    renderReports._expanded = new Set();
    draw();
  };

  $('#rp_generate').onclick = () => { renderReports._expanded = new Set(); draw(); };
  $('#rp_export').onclick = () => {
    const { rows, groupBy } = computeRows();
    const cols = REPORT_COLUMNS.filter(c => document.querySelector(`[data-col="${c.key}"]`)?.checked);
    const headers = cols.map(c => t(c.labelKey));
    const data = rows.map(r => cols.map(c => c.num ? (Math.round((r[c.key]||0) * 100) / 100) : (r[c.key] ?? '')));
    // Append totals
    const totalHours = rows.reduce((s, r) => s + r.hours, 0);
    const totalCost  = rows.reduce((s, r) => s + r.cost, 0);
    const totalsRow = cols.map(c => c.key === 'hours' ? totalHours : c.key === 'cost' ? totalCost : '');
    data.push([]);
    data.push([`${t('reportTotalHours')} / ${t('reportTotalCost')}`, ...new Array(cols.length - 1).fill('')]);
    data.push(totalsRow);
    const today = new Date().toISOString().slice(0,10);
    exportListToExcel(`rapport-${today}`, 'Rapport', headers, data);
    toast(t('exported'));
  };
  $('#rp_print').onclick = () => window.print();

  // First render
  draw();
}

    };
  }
  if ($('#logoRemove')) {
    $('#logoRemove').onclick = async () => {
      await DB.setSetting('companyLogo', null);
      await applyCompanyLogo();
      toast(t('deleted'));
      renderSettings();
    };
  }

  $('#reco_seuil').onchange = async (e) => {
    await DB.setSetting('seuilEcartHeures', Number(e.target.value) || 0);
    toast(t('saved'));
  };
  $('#reco_type').onchange = async (e) => {
    await DB.setSetting('seuilEcartType', e.target.value);
    toast(t('saved'));
  };
  $('#reco_block').onchange = async (e) => {
    await DB.setSetting('bloquerSiDepassement', !!e.target.checked);
    toast(t('saved'));
  };

  $('#addTypeBtn').onclick = async () => {
    const input = $('#newTypeInput');
    const v = input.value.trim();
    if (!v) return;
    const list = await getProjectTypes();
    if (list.some(x => x.toLowerCase() === v.toLowerCase())) {
      toast(t('typeAlreadyExists'));
      return;
    }
    list.push(v);
    await setProjectTypes(list);
    input.value = '';
    toast(t('saved'));
    renderSettings();
  };
  $$('#typesList .del-type').forEach(b => b.onclick = async () => {
    const idx = Number(b.dataset.idx);
    const list = await getProjectTypes();
    list.splice(idx, 1);
    await setProjectTypes(list);
    toast(t('deleted'));
    renderSettings();
  });

  $('#exportJson') && ($('#exportJson').onclick = exportJson);
  $('#importJsonFile') && ($('#importJsonFile').onchange = importJsonHandler);
  $('#importXlsxFile') && ($('#importXlsxFile').onchange = importXlsxHandler);
  $('#clearAllBtn') && ($('#clearAllBtn').onclick = async () => {
    if (await confirmModal(t('confirmClearAll'))) {
      await DB.clearAll();
      await DB.setSetting('lang', LANG);
      Auth.logout();
      toast(t('cleared'));
      boot();
    }
  });
}

function field(name, label, value = '', type = 'text', required = false) {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}${required ? ' *' : ''}</label>
      <input id="f_${name}" type="${type}" value="${value == null ? '' : escapeHtml(value)}"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>`;
}
function textarea(name, label, value = '') {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}</label>
      <textarea id="f_${name}" rows="3"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${escapeHtml(value || '')}</textarea>
    </div>`;
}
function checkbox(name, label, checked) {
  return `
    <div class="flex items-center gap-2">
      <input id="f_${name}" type="checkbox" ${checked ? 'checked' : ''} class="w-4 h-4">
      <label for="f_${name}" class="text-sm text-slate-700">${escapeHtml(label)}</label>
    </div>`;
}
function selectField(name, label, options, value = '', required = false) {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}${required ? ' *' : ''}</label>
      <select id="f_${name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        <option value="">—</option>
        ${options.map(o => `<option value="${escapeHtml(o.value)}" ${String(o.value)===String(value)?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
    </div>`;
}

/* =====================================================================
   6. IMPORT / EXPORT
   ===================================================================== */
async function exportJson() {
  const data = {
    clients: await DB.getAll('clients'),
    projects: await DB.getAll('projects'),
    tasks: await DB.getAll('tasks'),
    employees: await DB.getAll('employees'),
    timeEntries: await DB.getAll('timeEntries'),
    attendance: await DB.getAll('attendance'),
    submissions: await DB.getAll('submissions'),
    missions: await DB.getAll('missions'),
    recurrences: await DB.getAll('recurrences'),
    settings: await DB.getAll('settings'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `timetrack-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(t('exported'));
}

async function importJsonHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!await confirmModal(t('importConfirm'))) { e.target.value = ''; return; }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    await DB.clearAll();
    const stores = ['clients','projects','tasks','employees','timeEntries','attendance','submissions','missions','recurrences','settings'];
    for (const s of stores) {
      if (Array.isArray(data[s])) {
        for (const r of data[s]) await DB.put(s, r);
      }
    }
    LANG = await DB.getSetting('lang', LANG);
    applyI18n();
    toast(t('imported'));
    navigate(currentPage);
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

async function importXlsxHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    let total = 0;

    // Build sheet name index (case-insensitive)
    const sheetMap = {};
    wb.SheetNames.forEach(n => sheetMap[n.toLowerCase()] = n);

    // Clients
    if (sheetMap['clients']) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['clients']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        await DB.add('clients', {
          nom: String(r.nom).trim(),
          adresse: String(r.adresse || '').trim(),
          contact: String(r.contact || '').trim(),
          actif: parseBool(r.actif, true)
        });
        total++;
      }
    }

    // Projects (resolve clientId by name if needed; auto-add unknown project types)
    if (sheetMap['projects']) {
      const allClients = await DB.getAll('clients');
      const byName = Object.fromEntries(allClients.map(c => [c.nom.toLowerCase(), c.id]));
      const knownTypes = new Set((await getProjectTypes()).map(s => s.toLowerCase()));
      const newTypes = [];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['projects']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        let cid = Number(r.clientId);
        if (!cid && r.clientId) cid = byName[String(r.clientId).toLowerCase().trim()] || null;
        const type = String(r.typeProjet || '').trim();
        if (type && !knownTypes.has(type.toLowerCase())) {
          knownTypes.add(type.toLowerCase());
          newTypes.push(type);
        }
        await DB.add('projects', {
          clientId: cid || null,
          nom: String(r.nom).trim(),
          code: String(r.code || '').trim(),
          tauxHoraire: r.tauxHoraire === '' ? null : Number(r.tauxHoraire),
          budgetHeures: r.budgetHeures === '' ? null : Number(r.budgetHeures),
          actif: parseBool(r.actif, true),
          typeProjet: type,
          statutProjet: String(r.statutProjet || 'active').trim()
        });
        total++;
      }
      if (newTypes.length) {
        const current = await getProjectTypes();
        await setProjectTypes([...current, ...newTypes]);
      }
    }

    // Tasks (global — reusable across projects)
    if (sheetMap['tasks']) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['tasks']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        await DB.add('tasks', {
          nom: String(r.nom).trim(),
          description: String(r.description || '').trim(),
          statut: String(r.statut || 'open').trim(),
          typeTask: String(r.typeTask || '').trim()
        });
        total++;
      }
    }

    toast(`${total} ${t('importedRows')}`);
    navigate(currentPage);
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

function parseBool(v, def = false) {
  if (v === '' || v == null) return def;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  const s = String(v).trim().toLowerCase();
  return ['1','true','vrai','oui','yes','y','כן','פעיל'].includes(s);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
/* =====================================================================
   AUTH UI — login screen + first-run admin creation
   ===================================================================== */
function showAuthShell() {
  $('#authShell').classList.remove('hidden');
  $('#appShell').classList.add('hidden');
}
function showAppShell() {
  $('#authShell').classList.add('hidden');
  $('#appShell').classList.remove('hidden');
}

async function renderAdminInit() {
  showAuthShell();
  $('#authBody').innerHTML = `
    <h2 class="text-lg font-semibold text-slate-900 mb-2">${escapeHtml(t('initAdminTitle'))}</h2>
    <p class="text-sm text-slate-600 mb-4">${escapeHtml(t('initAdminInfo'))}</p>
    <div class="space-y-3">
      ${field('a_nom', t('empName'), '', 'text', true)}
      ${field('a_email', t('empEmail'), '', 'email')}
      ${field('a_pin', t('pin'), '', 'password', true)}
      ${field('a_pin2', t('confirmPin'), '', 'password', true)}
    </div>
    <button id="createAdminBtn" class="mt-5 w-full px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm font-medium">${escapeHtml(t('create'))}</button>
    <p id="initErr" class="hidden mt-3 text-sm text-red-600"></p>
  `;
  $('#createAdminBtn').onclick = async () => {
    const nom = $('#f_a_nom').value.trim();
    const email = $('#f_a_email').value.trim();
    const pin = $('#f_a_pin').value.trim();
    const pin2 = $('#f_a_pin2').value.trim();
    const err = $('#initErr');
    err.classList.add('hidden');
    if (!nom) { err.textContent = '!'; err.classList.remove('hidden'); return; }
    if (!pin || pin.length < 4) { err.textContent = t('pinRequired'); err.classList.remove('hidden'); return; }
    if (pin !== pin2) { err.textContent = t('pinMismatch'); err.classList.remove('hidden'); return; }
    const id = await DB.add('employees', {
      nom, email,
      role: 'admin',
      pin: await Auth.hashPin(pin),
      managerId: null,
      actif: true,
      numeroEmploye: '',
      tauxHoraire: null,
      role_legacy: ''
    });
    sessionStorage.setItem('sessionActive', JSON.stringify({ employeId: id, role: 'admin', nom }));
    await bootApp();
  };
}

async function renderLogin() {
  showAuthShell();
  const employees = (await DB.getAll('employees')).filter(e => e.actif !== false);
  $('#authBody').innerHTML = `
    <h2 class="text-lg font-semibold text-slate-900 mb-4">${escapeHtml(t('login'))}</h2>
    <div class="space-y-3">
      <div>
        <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeEmployee'))}</label>
        <select id="login_user" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
          <option value="">${escapeHtml(t('selectUser'))}</option>
          ${employees.map(e => `<option value="${e.id}">${escapeHtml((e.numeroEmploye ? e.numeroEmploye + ' — ' : '') + e.nom + ' (' + roleLabel(e.role) + ')')}</option>`).join('')}
        </select>
      </div>
      ${field('login_pin', t('pin'), '', 'password', true)}
    </div>
    <button id="loginBtn" class="mt-5 w-full px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm font-medium">${escapeHtml(t('login'))}</button>
    <p id="loginErr" class="hidden mt-3 text-sm text-red-600"></p>
  `;
  const submit = async () => {
    const id = $('#login_user').value;
    const pin = $('#f_login_pin').value;
    const err = $('#loginErr');
    err.classList.add('hidden');
    if (!id) return;
    try {
      await Auth.login(id, pin);
      await bootApp();
    } catch (e) {
      let msg = t('incorrectPin');
      if (e.message === 'blocked') msg = t('accountBlocked');
      else if (e.message === 'nopin') msg = t('noPinSet');
      else if (e.message === 'inactive') msg = t('accountInactive');
      err.textContent = msg;
      err.classList.remove('hidden');
    }
  };
  $('#loginBtn').onclick = submit;
  $('#f_login_pin').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
}

function roleLabel(r) {
  if (r === 'admin') return t('roleAdmin');
  if (r === 'manager') return t('roleManager');
  return t('roleEmploye');
}

async function applyCompanyLogo() {
  const url = await DB.getSetting('companyLogo', null);
  $$('[data-brand-logo]').forEach(el => {
    if (url) {
      el.classList.remove('bg-blue-700', 'text-white', 'font-bold', 'grid', 'place-items-center');
      el.classList.add('bg-white', 'border', 'border-slate-200');
      el.innerHTML = `<img src="${url}" alt="logo" class="w-full h-full object-contain">`;
    } else {
      el.classList.add('bg-blue-700', 'text-white', 'font-bold', 'grid', 'place-items-center');
      el.classList.remove('bg-white', 'border', 'border-slate-200');
      el.textContent = 'TT';
    }
  });
}

async function seedDefaultSettings() {
  if (await DB.getSetting('seuilEcartHeures', null) == null) {
    await DB.setSetting('seuilEcartHeures', 0.5);
  }
  if (await DB.getSetting('seuilEcartType', null) == null) {
    await DB.setSetting('seuilEcartType', 'absolu');
  }
  if (await DB.getSetting('bloquerSiDepassement', null) == null) {
    await DB.setSetting('bloquerSiDepassement', false);
  }
}

async function boot() {
  try {
    LANG = await DB.getSetting('lang', 'fr');
    await seedDefaultSettings();
  } catch (e) {
    console.warn('DB init issue', e);
  }
  applyI18n();
  await applyCompanyLogo();

  // Close modal on backdrop click
  $('#modal').onclick = (e) => {
    if (e.target.id === 'modal') {
      $('#modal').classList.add('hidden');
      $('#modal').classList.remove('flex');
    }
  };

  // Gate by auth: forced admin init OR login OR app
  const employees = await DB.getAll('employees');
  const hasAdmin = employees.some(e => e.role === 'admin' && e.actif !== false);
  if (!hasAdmin) {
    await renderAdminInit();
    return;
  }
  if (!Auth.getSession()) {
    await renderLogin();
    return;
  }
  await bootApp();
}

async function bootApp() {
  showAppShell();
  // Load this user's preferred language (per-user), fall back to global.
  const sessUser = await Auth.getCurrentUser();
  if (sessUser?.lang && I18N[sessUser.lang]) {
    LANG = sessUser.lang;
  }
  applyI18n();
  // Auto-generate any missed recurring missions on every login.
  try { await genererMissionsRecurrentes(); } catch (e) { console.warn('scheduler', e); }

  // Wire nav (idempotent — re-bind in case sidebar was rebuilt)
  await applyRoleVisibility();
  $$('#nav .nav-item').forEach(b => {
    b.onclick = () => navigate(b.dataset.page);
  });
  $$('#nav .nav-group-toggle').forEach(b => {
    b.onclick = () => b.closest('.nav-group').classList.toggle('open');
  });

  $('#logoutBtn').onclick = () => {
    Auth.logout();
    boot();
  };
  const s = Auth.getSession();
  if (s) {
    $('#userBadge').textContent = `${t('welcomeBack')} ${s.nom} · ${roleLabel(s.role)}`;
  }

  // Language switcher (per-user): persist on the employee record.
  const flagFor = (l) => l === 'fr' ? '🇫🇷' : l === 'en' ? '🇬🇧' : '🇮🇱';
  $('#langFlag').textContent = flagFor(LANG);
  $('#langBtn').onclick = (ev) => {
    ev.stopPropagation();
    $('#langMenu').classList.toggle('hidden');
  };
  document.addEventListener('click', () => $('#langMenu')?.classList.add('hidden'));
  $$('#langMenu .lang-opt').forEach(btn => btn.onclick = async () => {
    const newLang = btn.dataset.lang;
    if (!newLang || newLang === LANG) { $('#langMenu').classList.add('hidden'); return; }
    LANG = newLang;
    if (s?.employeId) await DB.update('employees', s.employeId, { lang: newLang });
    $('#langFlag').textContent = flagFor(LANG);
    $('#langMenu').classList.add('hidden');
    applyI18n();
    navigate(currentPage);
  });

  // Default landing page based on role
  const role = s?.role;
  const start = role === 'employe' ? 'mySubmissions' : 'dashboard';
  await navigate(start);
}

boot();
</script>
