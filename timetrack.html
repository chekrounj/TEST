<!--
  =====================================================================
   TimeTrack — Application de suivi du temps (single-file)
  =====================================================================

  COMMENT UTILISER
  ----------------
  1. Ouvrez ce fichier `timetrack.html` directement dans un navigateur
     moderne (Chrome, Firefox, Edge, Safari) — aucun serveur requis.
  2. Toutes les données sont stockées dans IndexedDB (base TimeTrackDB)
     dans votre navigateur. Les données restent locales à votre machine.
  3. Le menu latéral donne accès aux pages :
       - Clients, Projets, Tâches, Employés : CRUD avec recherche
       - Saisie heures : sélection en cascade Client → Projet → Tâche
       - Paramètres : langue (EN/FR/HEB), import/export JSON, import Excel
  4. Pour changer la langue : Paramètres → Langue. L'hébreu bascule
     automatiquement l'interface en RTL.

  IMPORT EXCEL
  ------------
  Dans Paramètres → Import Excel : sélectionnez un fichier .xlsx avec
  une feuille par entité. Noms de feuilles attendus (insensibles à la
  casse) : "clients", "projects", "tasks".

  Colonnes attendues (en-têtes en première ligne) :
    Feuille "clients"  : nom, adresse, contact, actif
    Feuille "projects" : clientId, nom, code, tauxHoraire, budgetHeures,
                         actif, typeProjet, statutProjet
                         (clientId peut aussi être le NOM du client —
                          il sera résolu automatiquement.
                          statutProjet : active | paused | completed |
                          cancelled | draft.
                          Tout typeProjet inconnu sera ajouté
                          automatiquement à la liste gérable depuis
                          Paramètres → Types de projet.)
    Feuille "tasks"    : nom, description, statut, typeTask
                         (les tâches sont GLOBALES et réutilisables
                          sur n'importe quel projet — pas de projectId.)

  EMPLOYÉS
  --------
  Chaque employé peut avoir un numéro d'employé (numeroEmploye) en plus
  du nom, email, rôle et taux horaire.

  TYPES DE PROJET
  ---------------
  Gérez la liste des types depuis Paramètres → Types de projet.
  Le formulaire de projet propose ensuite cette liste en menu déroulant.

  STATUT DU PROJET
  ----------------
  Sélectionnez parmi : Actif, En pause, Terminé, Annulé, Brouillon.

  PRÉSENCES & CONCILIATION
  ------------------------
  Le menu "Présences" permet d'importer les heures de présence depuis
  un fichier Excel/CSV. Colonnes acceptées (souples, plusieurs noms
  reconnus pour chaque champ) :
    - identifiant employé : email | matricule | numeroEmploye | nom
    - date : JJ/MM/AAAA | AAAA-MM-JJ | date Excel native
    - heureEntree | entree | clockIn  (optionnel)
    - heureSortie | sortie | clockOut (optionnel)
    - pause (en minutes si >= 5, sinon en heures décimales)
    - totalHeures | heures | total    (prioritaire si présent)

  Si un employé n'est pas reconnu, la ligne n'est pas perdue : un
  rapport propose un mapping manuel à la fin de l'import.

  Le menu "Conciliation" affiche, par jour et par employé, le total
  des heures de présence vs. les heures saisies sur projets, avec un
  badge couleur (vert / orange / rouge) selon le seuil configuré.

  Paramètres → Conciliation : seuil d'écart toléré, type (absolu en
  heures ou pourcentage de la présence), blocage de la sauvegarde
  d'une saisie qui dépasserait le seuil.

  EXPORT / IMPORT JSON
  --------------------
  Sauvegarde complète : Paramètres → Exporter JSON (télécharge un .json).
  Restauration : Paramètres → Importer JSON (remplace les données).

  =====================================================================
-->

/* =====================================================================
   2. DB MODULE — IndexedDB wrapper
   ===================================================================== */
const DB = (() => {
  const DB_NAME = 'TimeTrackDB';
  const DB_VERSION = 2;
  let _dbPromise = null;

  function open() {
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => resolve(req.result);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        // v2: attendance store added without touching existing data
        if (!db.objectStoreNames.contains('attendance')) {
          const s = db.createObjectStore('attendance', { keyPath: 'id', autoIncrement: true });
          s.createIndex('employeId', 'employeId', { unique: false });
          s.createIndex('date', 'date', { unique: false });
          s.createIndex('employeId_date', ['employeId', 'date'], { unique: false });
        }
        if (!db.objectStoreNames.contains('clients')) {
          const s = db.createObjectStore('clients', { keyPath: 'id', autoIncrement: true });
          s.createIndex('nom', 'nom', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        if (!db.objectStoreNames.contains('projects')) {
          const s = db.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('code', 'code', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        if (!db.objectStoreNames.contains('tasks')) {
          const s = db.createObjectStore('tasks', { keyPath: 'id', autoIncrement: true });
          s.createIndex('projectId', 'projectId', { unique: false });
          s.createIndex('statut', 'statut', { unique: false });
        }
        if (!db.objectStoreNames.contains('employees')) {
          const s = db.createObjectStore('employees', { keyPath: 'id', autoIncrement: true });
          s.createIndex('email', 'email', { unique: false });
          s.createIndex('nom', 'nom', { unique: false });
        }
        if (!db.objectStoreNames.contains('timeEntries')) {
          const s = db.createObjectStore('timeEntries', { keyPath: 'id', autoIncrement: true });
          s.createIndex('employeId', 'employeId', { unique: false });
          s.createIndex('date', 'date', { unique: false });
          s.createIndex('projectId', 'projectId', { unique: false });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('taskId', 'taskId', { unique: false });
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'cle' });
        }
      };
    });
    return _dbPromise;
  }

  function tx(store, mode) {
    return open().then(db => db.transaction(store, mode).objectStore(store));
  }

  function reqToPromise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function add(storeName, record) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.add(record));
  }
  async function getAll(storeName) {
    const store = await tx(storeName, 'readonly');
    return reqToPromise(store.getAll());
  }
  async function getById(storeName, id) {
    const store = await tx(storeName, 'readonly');
    return reqToPromise(store.get(id));
  }
  async function update(storeName, id, updates) {
    const store = await tx(storeName, 'readwrite');
    const existing = await reqToPromise(store.get(id));
    if (!existing) throw new Error('Record not found: ' + id);
    const merged = { ...existing, ...updates, id: existing.id ?? id };
    return reqToPromise(store.put(merged));
  }
  async function put(storeName, record) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.put(record));
  }
  async function remove(storeName, id) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.delete(id));
  }
  async function clearStore(storeName) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.clear());
  }
  async function clearAll() {
    const stores = ['clients','projects','tasks','employees','timeEntries','attendance','settings'];
    await Promise.all(stores.map(s => clearStore(s)));
  }
  async function getSetting(cle, def = null) {
    const r = await getById('settings', cle);
    return r ? r.valeur : def;
  }
  async function setSetting(cle, valeur) {
    return put('settings', { cle, valeur });
  }

  async function getAttendanceForEmployeeDate(employeId, date) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const store = db.transaction('attendance', 'readonly').objectStore('attendance');
      const idx = store.index('employeId_date');
      const req = idx.get([Number(employeId), String(date)]);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function getProjectHoursForEmployeeDate(employeId, date) {
    const all = await getAll('timeEntries');
    return all
      .filter(e => Number(e.employeId) === Number(employeId) && e.date === date)
      .reduce((s, e) => s + (Number(e.heures) || 0), 0);
  }

  async function computeDiscrepancy(employeId, date, opts = {}) {
    const att = await getAttendanceForEmployeeDate(employeId, date);
    const heuresPresence = att ? Number(att.totalHeures || 0) : null;
    let heuresProjets = await getProjectHoursForEmployeeDate(employeId, date);
    if (opts.addedHours) heuresProjets += Number(opts.addedHours);
    const seuil = Number(await getSetting('seuilEcartHeures', 0.5));
    const type = await getSetting('seuilEcartType', 'absolu');
    let seuilApplique = seuil;
    let ecart = null;
    let depasse = false;
    if (heuresPresence != null) {
      ecart = Math.abs(heuresProjets - heuresPresence);
      if (type === 'pourcentage') {
        const ref = heuresPresence || 1;
        seuilApplique = (seuil / 100) * ref;
      }
      depasse = ecart > seuilApplique;
    }
    return { heuresPresence, heuresProjets, ecart, depasseSeuilOuiNon: depasse, seuilApplique };
  }

  return {
    add, getAll, getById, update, put, remove, clearStore, clearAll,
    getSetting, setSetting,
    getAttendanceForEmployeeDate, getProjectHoursForEmployeeDate, computeDiscrepancy
  };
})();

function escapeHtml(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

/* Modal helpers */
function openModal({ title, bodyHtml, onSave, hideSave = false }) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  const modal = $('#modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  const saveBtn = $('#modalSave');
  saveBtn.style.display = hideSave ? 'none' : '';
  saveBtn.textContent = t('save');
  $('#modalCancel').textContent = t('cancel');

  const close = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    saveBtn.replaceWith(saveBtn.cloneNode(true)); // remove listeners
    $('#modalClose').onclick = null;
    $('#modalCancel').onclick = null;
  };
  $('#modalClose').onclick = close;
  $('#modalCancel').onclick = close;
  $('#modalSave').onclick = async () => {
    try {
      const ok = await onSave?.();
      if (ok !== false) close();
    } catch (e) {
      console.error(e);
      toast(String(e.message || e));
    }
  };
  return { close };
}

function confirmModal(message) {
  return new Promise((resolve) => {
    const modal = $('#modal');
    $('#modalTitle').textContent = '';
    $('#modalBody').innerHTML = `<p class="text-slate-700">${escapeHtml(message)}</p>`;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    const saveBtn = $('#modalSave');
    saveBtn.textContent = t('yes');
    $('#modalCancel').textContent = t('no');
    const close = (val) => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      saveBtn.replaceWith(saveBtn.cloneNode(true));
      $('#modalClose').onclick = null;
      $('#modalCancel').onclick = null;
      resolve(val);
    };
    $('#modalClose').onclick = () => close(false);
    $('#modalCancel').onclick = () => close(false);
    $('#modalSave').onclick = () => close(true);
  });
}

const ENTITY_IMPORTS = {
  clients: {
    template: {
      headers: ['nom', 'adresse', 'contact', 'actif'],
      sample: [['Acme Corp', '1 rue de Paris, 75001', 'contact@acme.fr', true]]
    },
    importRow: async (row) => {

      if (!nom) return false;
      await DB.add('clients', {
        nom,
        adresse: String(row.adresse || '').trim(),
        contact: String(row.contact || '').trim(),
        actif: parseBool(row.actif, true)
      });
      return true;
    }
  },
  projects: {
    template: {
      headers: ['clientId', 'nom', 'code', 'tauxHoraire', 'budgetHeures', 'actif', 'typeProjet', 'statutProjet'],
      sample: [['Acme Corp', 'Site web v2', 'WEB-2025', 80, 120, true, 'Forfait', 'active']]
    },
    buildContext: async () => {
      const clients = await DB.getAll('clients');
      return {
        clients,
        byName: Object.fromEntries(clients.map(c => [c.nom.toLowerCase(), c.id])),
        knownTypes: new Set((await getProjectTypes()).map(s => s.toLowerCase())),
        newTypes: []
      };
    },
    importRow: async (row, ctx) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      let cid = Number(row.clientId);
      if (!cid && row.clientId) cid = ctx.byName[String(row.clientId).toLowerCase().trim()] || null;
      const type = String(row.typeProjet || '').trim();
      if (type && !ctx.knownTypes.has(type.toLowerCase())) {
        ctx.knownTypes.add(type.toLowerCase());
        ctx.newTypes.push(type);
      }
      await DB.add('projects', {
        clientId: cid || null,
        nom,
        code: String(row.code || '').trim(),
        tauxHoraire: row.tauxHoraire === '' ? null : Number(row.tauxHoraire),
        budgetHeures: row.budgetHeures === '' ? null : Number(row.budgetHeures),
        actif: parseBool(row.actif, true),
        typeProjet: type,
        statutProjet: String(row.statutProjet || 'active').trim()
      });
      return true;
    },
    finalize: async (ctx) => {
      if (ctx.newTypes.length) {
        const cur = await getProjectTypes();
        await setProjectTypes([...cur, ...ctx.newTypes]);
      }
    }
  },
  tasks: {
    template: {
      headers: ['nom', 'description', 'statut', 'typeTask'],
      sample: [['Réunion hebdo', 'Stand-up équipe', 'open', 'Réunion']]
    },
    importRow: async (row) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      await DB.add('tasks', {
        nom,
        description: String(row.description || '').trim(),
        statut: String(row.statut || 'open').trim(),
        typeTask: String(row.typeTask || '').trim()
      });
      return true;
    }
  },
  employees: {
    template: {
      headers: ['numeroEmploye', 'nom', 'email', 'role', 'tauxHoraire'],
      sample: [['EMP001', 'Jean Dupont', 'jean.dupont@example.com', 'Développeur', 50]]
    },
    importRow: async (row) => {
      const nom = String(row.nom || '').trim();
      if (!nom) return false;
      await DB.add('employees', {
        numeroEmploye: String(row.numeroEmploye || '').trim(),
        nom,
        email: String(row.email || '').trim(),
        role: String(row.role || '').trim(),
        tauxHoraire: row.tauxHoraire === '' ? null : Number(row.tauxHoraire)
      });
      return true;
    }
  },
  timeEntries: {
    template: {
      headers: ['employe', 'client', 'projet', 'tache', 'date', 'heures', 'description'],
      sample: [['jean.dupont@example.com', 'Acme Corp', 'WEB-2025', 'Réunion hebdo', '2025-05-01', 1.5, 'Stand-up du lundi']]
    },
    buildContext: async () => {
      const [employees, clients, projects, tasks] = await Promise.all([
        DB.getAll('employees'), DB.getAll('clients'),
        DB.getAll('projects'), DB.getAll('tasks')
      ]);
      return {
        employees, clients, projects, tasks,
        clientByName: Object.fromEntries(clients.map(c => [c.nom.toLowerCase(), c.id])),
        projectByCode: Object.fromEntries(projects.filter(p => p.code).map(p => [p.code.toLowerCase(), p.id])),
        projectByName: Object.fromEntries(projects.map(p => [p.nom.toLowerCase(), p.id])),

  }

async function downloadTemplate(entity) {
  const tpl = ENTITY_IMPORTS[entity]?.template;
  if (!tpl) return;
  const ws = XLSX.utils.aoa_to_sheet([tpl.headers, ...tpl.sample]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, entity);
  XLSX.writeFile(wb, `template-${entity}.xlsx`);
}

async function importEntityFile(entity, file) {
  const cfg = ENTITY_IMPORTS[entity];
  if (!cfg || !cfg.importRow) throw new Error('No importer for ' + entity);
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  const ctx = cfg.buildContext ? await cfg.buildContext() : {};
  let imported = 0, ignored = 0;
  for (const row of rows) {
    try {
      const ok = await cfg.importRow(row, ctx);
      if (ok) imported++; else ignored++;
    } catch (e) {
      console.warn('import row failed', e, row);
      ignored++;
    }
  }
  if (cfg.finalize) await cfg.finalize(ctx);
  return { imported, ignored };
}

function wireImportBar(refreshFn) {
  $$('[data-tpl]').forEach(b => b.onclick = () => downloadTemplate(b.dataset.tpl));
  $$('[data-import]').forEach(inp => {
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const { imported, ignored } = await importEntityFile(inp.dataset.import, file);
        toast(`${imported} ${t('linesImported')} · ${ignored} ${t('linesIgnored')}`);
      } catch (err) {
        console.error(err);
        toast(t('importErr') + ': ' + err.message);
      } finally {
        e.target.value = '';
        refreshFn?.();
      }
    };
  });
}

/* ----- ATTENDANCE helpers ----- */
function normName(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}
function pickCol(row, ...names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const k = keys.find(x => x.toLowerCase().trim() === n.toLowerCase());
    if (k != null && row[k] !== '') return row[k];
  }
  return undefined;
}
function parseAttDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if (!isNaN(d)) return d.toISOString().slice(0, 10);
  }
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function parseAttTime(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const total = (v - Math.floor(v)) * 24;
    const h = Math.floor(total);
    const min = Math.round((total - h) * 60);
    return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : null;
}
function diffHours(entree, sortie, pauseHours = 0) {
  if (!entree || !sortie) return null;
  const [eh, em] = entree.split(':').map(Number);
  const [sh, sm] = sortie.split(':').map(Number);
  let h = (sh + sm/60) - (eh + em/60);
  if (h < 0) h += 24;
  return Math.max(0, h - (pauseHours || 0));
}
function parsePauseHours(v) {
  if (v == null || v === '') return 0;
  const n = Number(v);
  if (isNaN(n)) return 0;
  // heuristic: values >= 5 treated as minutes, else hours
  return n >= 5 ? n / 60 : n;
}
function matchEmployee(employees, idValue) {
  if (idValue == null || idValue === '') return null;
  const v = String(idValue).trim();
  let e = employees.find(x => x.email && String(x.email).toLowerCase() === v.toLowerCase());
  if (e) return e;
  e = employees.find(x => x.numeroEmploye && String(x.numeroEmploye).toLowerCase() === v.toLowerCase());
  if (e) return e;
  e = employees.find(x => x.nom === v);
  if (e) return e;
  const nv = normName(v);
  return employees.find(x => normName(x.nom) === nv) || null;
}

/* ----- ATTENDANCE EXCEL IMPORT ----- */
async function importAttendanceHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheetName = wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
    const employees = await DB.getAll('employees');

    let imported = 0, updated = 0, ignored = 0;
    const errors = []; // { row, raw, parsed }
    const importedAt = new Date().toISOString();

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const idVal = pickCol(r, 'email', 'matricule', 'numeroEmploye', 'nom', 'employe', 'employee', 'name');
      const dateVal = pickCol(r, 'date');
      const inVal = pickCol(r, 'heureEntree', 'entree', 'entrée', 'clockIn', 'in', 'start');
      const outVal = pickCol(r, 'heureSortie', 'sortie', 'clockOut', 'out', 'end');
      const pauseVal = pickCol(r, 'pause', 'break');
      const totalVal = pickCol(r, 'totalHeures', 'heures', 'total', 'hours');

      const date = parseAttDate(dateVal);
      if (!date) { ignored++; continue; }

      const emp = matchEmployee(employees, idVal);
      const heureEntree = parseAttTime(inVal);
      const heureSortie = parseAttTime(outVal);
      const pauseH = parsePauseHours(pauseVal);
      let totalHeures = totalVal === '' || totalVal == null ? null : Number(totalVal);
      if (totalHeures == null) totalHeures = diffHours(heureEntree, heureSortie, pauseH);
      totalHeures = totalHeures == null ? 0 : Number(totalHeures);

      const record = {
        date, heureEntree, heureSortie, pause: pauseH,
        totalHeures, source: 'import', importeLe: importedAt
      };

      if (!emp) {
        errors.push({ rowIndex: i + 2, raw: idVal, record });
        continue;
      }

      record.employeId = emp.id;
      const existing = await DB.getAttendanceForEmployeeDate(emp.id, date);
      if (existing) {
        await DB.update('attendance', existing.id, record);
        updated++;
      } else {
        await DB.add('attendance', record);
        imported++;
      }
    }

    showImportReport({ imported, updated, ignored, errors, employees });
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

function showImportReport({ imported, updated, ignored, errors, employees }) {
  const empOptions = employees.map(e => `<option value="${e.id}">${escapeHtml((e.numeroEmploye ? e.numeroEmploye + ' — ' : '') + e.nom)}</option>`).join('');
  const errorRows = errors.map((e, i) => `
    <tr class="text-sm">
      <td class="px-2 py-1 text-slate-500">${escapeHtml(t('rowLabel'))} ${e.rowIndex}</td>
      <td class="px-2 py-1">${escapeHtml(e.raw == null ? '' : String(e.raw))}</td>
      <td class="px-2 py-1">${escapeHtml(e.record.date)}</td>
      <td class="px-2 py-1">
        <select data-err-idx="${i}" class="px-2 py-1 border border-slate-300 rounded text-xs">
          <option value="">—</option>${empOptions}
        </select>
      </td>
    </tr>
  `).join('');

  const body = `
    <div class="space-y-3 text-sm">
      <p><span class="font-medium text-green-700">${imported}</span> ${escapeHtml(t('linesImported'))},
         <span class="font-medium text-blue-700">${updated}</span> ${escapeHtml(t('linesUpdated'))},
         <span class="font-medium text-orange-700">${errors.length + ignored}</span> ${escapeHtml(t('linesIgnored'))}</p>
      ${errors.length ? `
        <div>
          <p class="font-medium text-slate-700 mb-2">${escapeHtml(t('unknownEmployee'))} (${errors.length})</p>
          <div class="border border-slate-200 rounded overflow-hidden max-h-72 overflow-y-auto">
            <table class="w-full">
              <thead class="bg-slate-50 text-xs text-slate-500"><tr>
                <th class="px-2 py-1 text-start">${escapeHtml(t('rowLabel'))}</th>
                <th class="px-2 py-1 text-start">${escapeHtml(t('attFilterEmp'))}</th>
                <th class="px-2 py-1 text-start">${escapeHtml(t('attDate'))}</th>
                <th class="px-2 py-1 text-start">${escapeHtml(t('mapEmployee'))}</th>
              </tr></thead>
              <tbody>${errorRows}</tbody>
            </table>
          </div>
        </div>` : ''}
    </div>
  `;

  openModal({
    title: t('importReport'),
    bodyHtml: body,
    hideSave: errors.length === 0,
    onSave: async () => {
      let added = 0;
      for (let i = 0; i < errors.length; i++) {
        const sel = document.querySelector(`[data-err-idx="${i}"]`);
        if (!sel || !sel.value) continue;
        const empId = Number(sel.value);
        const rec = { ...errors[i].record, employeId: empId };
        const existing = await DB.getAttendanceForEmployeeDate(empId, rec.date);
        if (existing) await DB.update('attendance', existing.id, rec);
        else await DB.add('attendance', rec);
        added++;
      }
      if (added) toast(`${added} ${t('applyMapping')}`);
      renderAttendance();
    }
  });
}

async function renderReconciliation() {
  const [employees, attendance, timeEntries] = await Promise.all([
    DB.getAll('employees'), DB.getAll('attendance'), DB.getAll('timeEntries')
  ]);
  const empById = Object.fromEntries(employees.map(e => [e.id, e]));
  const seuil = Number(await DB.getSetting('seuilEcartHeures', 0.5));
  const seuilType = await DB.getSetting('seuilEcartType', 'absolu');

  const today = new Date();
  const monthAgo = new Date(today.getTime() - 30 * 86400000);
  const defaultFrom = monthAgo.toISOString().slice(0,10);
  const defaultTo = today.toISOString().slice(0,10);

  PAGE.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-900 mb-6">${escapeHtml(t('recTitle'))}</h1>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
      <div class="p-4 border-b border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attFilterEmp'))}</label>
          <select id="rec_emp" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">—</option>
            ${employees.map(e => `<option value="${e.id}">${escapeHtml(e.nom)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attFromDate'))}</label>
          <input id="rec_from" type="date" value="${defaultFrom}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">${escapeHtml(t('attToDate'))}</label>
          <input id="rec_to" type="date" value="${defaultTo}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div class="flex items-end">
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="rec_only" type="checkbox" class="w-4 h-4">
            ${escapeHtml(t('recOnlyDiff'))}
          </label>
        </div>
      </div>
      <div id="listBody"></div>
    </div>
  `;

  const draw = () => {
    const fEmp = $('#rec_emp').value;
    const fFrom = $('#rec_from').value;
    const fTo = $('#rec_to').value;
    const onlyDiff = $('#rec_only').checked;

    // Build (employeId,date) pairs from both stores
    const pairs = new Map();
    const key = (e, d) => `${e}__${d}`;
    const addPair = (e, d) => { if (e && d) pairs.set(key(e, d), { employeId: Number(e), date: d }); };
    attendance.forEach(a => addPair(a.employeId, a.date));
    timeEntries.forEach(te => addPair(te.employeId, te.date));

    // Aggregate
    const attMap = new Map();
    attendance.forEach(a => attMap.set(key(a.employeId, a.date), Number(a.totalHeures || 0)));
    const projMap = new Map();
    timeEntries.forEach(te => {
      const k = key(te.employeId, te.date);
      projMap.set(k, (projMap.get(k) || 0) + (Number(te.heures) || 0));
    });

    const rows = [];
    for (const { employeId, date } of pairs.values()) {
      if (fEmp && Number(fEmp) !== employeId) continue;
      if (fFrom && date < fFrom) continue;
      if (fTo && date > fTo) continue;
      const pres = attMap.has(key(employeId, date)) ? attMap.get(key(employeId, date)) : null;
      const proj = projMap.get(key(employeId, date)) || 0;
      let ecart = null, applied = seuil, status = 'na';
      if (pres != null) {
        ecart = Math.abs(proj - pres);
        applied = seuilType === 'pourcentage' ? (seuil / 100) * (pres || 1) : seuil;
        if (ecart > applied) status = 'bad';
        else if (ecart > applied * 0.5) status = 'warn';
        else status = 'ok';
      }
      if (onlyDiff && (status === 'ok' || status === 'na')) continue;
      rows.push({ employeId, date, pres, proj, ecart, status });
    }
    rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const badge = (status) => {
      if (status === 'ok')   return `<span class="px-2 py-0.5 rounded-full bg-green-100 text-green-800 text-xs">${escapeHtml(t('recStatusOk'))}</span>`;
      if (status === 'warn') return `<span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 text-xs">${escapeHtml(t('recStatusWarn'))}</span>`;
      if (status === 'bad')  return `<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-800 text-xs">${escapeHtml(t('recStatusBad'))}</span>`;
      return `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs">${escapeHtml(t('recNoAttendance'))}</span>`;
    };

    const html = rows.map(r => `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3">${escapeHtml(r.date)}</td>
        <td class="px-4 py-3">${escapeHtml(empById[r.employeId]?.nom || '?')}</td>
        <td class="px-4 py-3 text-slate-600">${r.pres == null ? '—' : fmt(r.pres)}</td>
        <td class="px-4 py-3 text-slate-600">${fmt(r.proj)}</td>
        <td class="px-4 py-3 ${r.status === 'bad' ? 'text-red-700 font-medium' : r.status === 'warn' ? 'text-orange-700' : 'text-slate-600'}">${r.ecart == null ? '—' : fmt(r.ecart)}</td>
        <td class="px-4 py-3">${badge(r.status)}</td>
      </tr>
    `).join('');

    $('#listBody').innerHTML = tableEl(
      [t('attDate'), t('timeEmployee'), t('recPresence'), t('recProjects'), t('recDiff'), t('recStatus')],
      html
    );
  };

  ['rec_emp','rec_from','rec_to','rec_only'].forEach(id => {
    $('#' + id).onchange = draw;
    if ($('#' + id).type !== 'checkbox') $('#' + id).oninput = draw;
  });
  draw();
}

        <label class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm cursor-pointer">
          ${escapeHtml(t('importJson'))}
          <input type="file" id="importJsonFile" accept="application/json" class="hidden">
        </label>
        <label class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm cursor-pointer">
          ${escapeHtml(t('importExcel'))}
          <input type="file" id="importXlsxFile" accept=".xlsx,.xls,.csv" class="hidden">
        </label>
      </div>
      <p class="text-xs text-slate-500 mt-3">${escapeHtml(t('importExcelHint'))}</p>
    </div>

    <div class="bg-white rounded-xl border border-red-200 shadow-sm p-6">
      <h2 class="font-semibold text-red-700 mb-4">${escapeHtml(t('dangerZone'))}</h2>
      <button id="clearAllBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 text-sm">${escapeHtml(t('clearAll'))}</button>
    </div>
  `;

  $('#langSel').onchange = async (e) => {
    LANG = e.target.value;
    await DB.setSetting('lang', LANG);
    applyI18n();
    navigate(currentPage);
  };

  $('#reco_seuil').onchange = async (e) => {
    await DB.setSetting('seuilEcartHeures', Number(e.target.value) || 0);
    toast(t('saved'));
  };
  $('#reco_type').onchange = async (e) => {
    await DB.setSetting('seuilEcartType', e.target.value);
    toast(t('saved'));
  };
  $('#reco_block').onchange = async (e) => {
    await DB.setSetting('bloquerSiDepassement', !!e.target.checked);
    toast(t('saved'));
  };

  $('#addTypeBtn').onclick = async () => {
    const input = $('#newTypeInput');
    const v = input.value.trim();
    if (!v) return;
    const list = await getProjectTypes();
    if (list.some(x => x.toLowerCase() === v.toLowerCase())) {
      toast(t('typeAlreadyExists'));
      return;
    }
    list.push(v);
    await setProjectTypes(list);
    input.value = '';
    toast(t('saved'));
    renderSettings();
  };
  $$('#typesList .del-type').forEach(b => b.onclick = async () => {
    const idx = Number(b.dataset.idx);
    const list = await getProjectTypes();
    list.splice(idx, 1);
    await setProjectTypes(list);
    toast(t('deleted'));
    renderSettings();
  });

  $('#exportJson').onclick = exportJson;
  $('#importJsonFile').onchange = importJsonHandler;
  $('#importXlsxFile').onchange = importXlsxHandler;
  $('#clearAllBtn').onclick = async () => {
    if (await confirmModal(t('confirmClearAll'))) {
      await DB.clearAll();
      await DB.setSetting('lang', LANG);
      toast(t('cleared'));
      navigate('clients');
    }
  };
}

/* =====================================================================
   5. FORM HELPERS
   ===================================================================== */
function field(name, label, value = '', type = 'text', required = false) {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}${required ? ' *' : ''}</label>
      <input id="f_${name}" type="${type}" value="${value == null ? '' : escapeHtml(value)}"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>`;
}
function textarea(name, label, value = '') {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}</label>
      <textarea id="f_${name}" rows="3"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${escapeHtml(value || '')}</textarea>
    </div>`;
}
function checkbox(name, label, checked) {
  return `
    <div class="flex items-center gap-2">
      <input id="f_${name}" type="checkbox" ${checked ? 'checked' : ''} class="w-4 h-4">
      <label for="f_${name}" class="text-sm text-slate-700">${escapeHtml(label)}</label>
    </div>`;
}
function selectField(name, label, options, value = '', required = false) {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}${required ? ' *' : ''}</label>
      <select id="f_${name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        <option value="">—</option>
        ${options.map(o => `<option value="${escapeHtml(o.value)}" ${String(o.value)===String(value)?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
    </div>`;
}

/* =====================================================================
   6. IMPORT / EXPORT
   ===================================================================== */
async function exportJson() {
  const data = {
    clients: await DB.getAll('clients'),
    projects: await DB.getAll('projects'),
    tasks: await DB.getAll('tasks'),
    employees: await DB.getAll('employees'),
    timeEntries: await DB.getAll('timeEntries'),
    attendance: await DB.getAll('attendance'),
    settings: await DB.getAll('settings'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `timetrack-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(t('exported'));
}

async function importJsonHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!await confirmModal(t('importConfirm'))) { e.target.value = ''; return; }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    await DB.clearAll();
    const stores = ['clients','projects','tasks','employees','timeEntries','attendance','settings'];
    for (const s of stores) {
      if (Array.isArray(data[s])) {
        for (const r of data[s]) await DB.put(s, r);
      }
    }
    LANG = await DB.getSetting('lang', LANG);
    applyI18n();
    toast(t('imported'));
    navigate(currentPage);
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

async function importXlsxHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    let total = 0;

    // Build sheet name index (case-insensitive)
    const sheetMap = {};
    wb.SheetNames.forEach(n => sheetMap[n.toLowerCase()] = n);

    // Clients
    if (sheetMap['clients']) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['clients']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        await DB.add('clients', {
          nom: String(r.nom).trim(),
          adresse: String(r.adresse || '').trim(),
          contact: String(r.contact || '').trim(),
          actif: parseBool(r.actif, true)
        });
        total++;
      }
    }

    // Projects (resolve clientId by name if needed; auto-add unknown project types)
    if (sheetMap['projects']) {
      const allClients = await DB.getAll('clients');
      const byName = Object.fromEntries(allClients.map(c => [c.nom.toLowerCase(), c.id]));
      const knownTypes = new Set((await getProjectTypes()).map(s => s.toLowerCase()));
      const newTypes = [];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['projects']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        let cid = Number(r.clientId);
        if (!cid && r.clientId) cid = byName[String(r.clientId).toLowerCase().trim()] || null;
        const type = String(r.typeProjet || '').trim();
        if (type && !knownTypes.has(type.toLowerCase())) {
          knownTypes.add(type.toLowerCase());
          newTypes.push(type);
        }
        await DB.add('projects', {
          clientId: cid || null,
          nom: String(r.nom).trim(),
          code: String(r.code || '').trim(),
          tauxHoraire: r.tauxHoraire === '' ? null : Number(r.tauxHoraire),
          budgetHeures: r.budgetHeures === '' ? null : Number(r.budgetHeures),
          actif: parseBool(r.actif, true),
          typeProjet: type,
          statutProjet: String(r.statutProjet || 'active').trim()
        });
        total++;
      }
      if (newTypes.length) {
        const current = await getProjectTypes();
        await setProjectTypes([...current, ...newTypes]);
      }
    }

    // Tasks (global — reusable across projects)
    if (sheetMap['tasks']) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['tasks']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        await DB.add('tasks', {
          nom: String(r.nom).trim(),
          description: String(r.description || '').trim(),
          statut: String(r.statut || 'open').trim(),
          typeTask: String(r.typeTask || '').trim()
        });
        total++;
      }
    }

    toast(`${total} ${t('importedRows')}`);
    navigate(currentPage);
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

function parseBool(v, def = false) {
  if (v === '' || v == null) return def;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  const s = String(v).trim().toLowerCase();
  return ['1','true','vrai','oui','yes','y','כן','פעיל'].includes(s);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
async function seedDefaultSettings() {
  if (await DB.getSetting('seuilEcartHeures', null) == null) {
    await DB.setSetting('seuilEcartHeures', 0.5);
  }
  if (await DB.getSetting('seuilEcartType', null) == null) {
    await DB.setSetting('seuilEcartType', 'absolu');
  }
  if (await DB.getSetting('bloquerSiDepassement', null) == null) {
    await DB.setSetting('bloquerSiDepassement', false);
  }
}

async function boot() {
  try {
    LANG = await DB.getSetting('lang', 'fr');
    await seedDefaultSettings();
  } catch (e) {
    console.warn('DB init issue', e);
  }
  applyI18n();

  $$('#nav .nav-item').forEach(b => {
    b.onclick = () => navigate(b.dataset.page);
  });
  $$('#nav .nav-group-toggle').forEach(b => {
    b.onclick = () => b.closest('.nav-group').classList.toggle('open');
  });

  // Close modal on backdrop click
  $('#modal').onclick = (e) => {
    if (e.target.id === 'modal') {
      $('#modal').classList.add('hidden');
      $('#modal').classList.remove('flex');
    }
  };

  await navigate('clients');
}

boot();
</script>
