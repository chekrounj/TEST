<!--
  =====================================================================
   TimeTrack — Application de suivi du temps (single-file)
  =====================================================================

  COMMENT UTILISER
  ----------------
  1. Ouvrez ce fichier `timetrack.html` directement dans un navigateur
     moderne (Chrome, Firefox, Edge, Safari) — aucun serveur requis.
  2. Toutes les données sont stockées dans IndexedDB (base TimeTrackDB)
     dans votre navigateur. Les données restent locales à votre machine.
  3. Le menu latéral donne accès aux pages :
       - Clients, Projets, Tâches, Employés : CRUD avec recherche
       - Saisie heures : sélection en cascade Client → Projet → Tâche
       - Paramètres : langue (EN/FR/HEB), import/export JSON, import Excel
  4. Pour changer la langue : Paramètres → Langue. L'hébreu bascule
     automatiquement l'interface en RTL.

  IMPORT EXCEL
  ------------
  Dans Paramètres → Import Excel : sélectionnez un fichier .xlsx avec
  une feuille par entité. Noms de feuilles attendus (insensibles à la
  casse) : "clients", "projects", "tasks".

  Colonnes attendues (en-têtes en première ligne) :
    Feuille "clients"  : nom, adresse, contact, actif
    Feuille "projects" : clientId, nom, code, tauxHoraire, budgetHeures,
                         actif, typeProjet
                         (clientId peut aussi être le NOM du client —
                          il sera résolu automatiquement)
    Feuille "tasks"    : projectId, nom, description, statut, typeTask
                         (projectId peut aussi être le code ou le nom
                          du projet)

  EXPORT / IMPORT JSON
  --------------------
  Sauvegarde complète : Paramètres → Exporter JSON (télécharge un .json).
  Restauration : Paramètres → Importer JSON (remplace les données).

  =====================================================================
-->

/* =====================================================================
   2. DB MODULE — IndexedDB wrapper
   ===================================================================== */
const DB = (() => {
  const DB_NAME = 'TimeTrackDB';
  const DB_VERSION = 1;
  let _dbPromise = null;

  function open() {
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => resolve(req.result);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('clients')) {
          const s = db.createObjectStore('clients', { keyPath: 'id', autoIncrement: true });
          s.createIndex('nom', 'nom', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        if (!db.objectStoreNames.contains('projects')) {
          const s = db.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('code', 'code', { unique: false });
          s.createIndex('actif', 'actif', { unique: false });
        }
        if (!db.objectStoreNames.contains('tasks')) {
          const s = db.createObjectStore('tasks', { keyPath: 'id', autoIncrement: true });
          s.createIndex('projectId', 'projectId', { unique: false });
          s.createIndex('statut', 'statut', { unique: false });
        }
        if (!db.objectStoreNames.contains('employees')) {
          const s = db.createObjectStore('employees', { keyPath: 'id', autoIncrement: true });
          s.createIndex('email', 'email', { unique: false });
          s.createIndex('nom', 'nom', { unique: false });
        }
        if (!db.objectStoreNames.contains('timeEntries')) {
          const s = db.createObjectStore('timeEntries', { keyPath: 'id', autoIncrement: true });
          s.createIndex('employeId', 'employeId', { unique: false });
          s.createIndex('date', 'date', { unique: false });
          s.createIndex('projectId', 'projectId', { unique: false });
          s.createIndex('clientId', 'clientId', { unique: false });
          s.createIndex('taskId', 'taskId', { unique: false });
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'cle' });
        }
      };
    });
    return _dbPromise;
  }

  function tx(store, mode) {
    return open().then(db => db.transaction(store, mode).objectStore(store));
  }

  function reqToPromise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function add(storeName, record) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.add(record));
  }
  async function getAll(storeName) {
    const store = await tx(storeName, 'readonly');
    return reqToPromise(store.getAll());
  }
  async function getById(storeName, id) {
    const store = await tx(storeName, 'readonly');
    return reqToPromise(store.get(id));
  }
  async function update(storeName, id, updates) {
    const store = await tx(storeName, 'readwrite');
    const existing = await reqToPromise(store.get(id));
    if (!existing) throw new Error('Record not found: ' + id);
    const merged = { ...existing, ...updates, id: existing.id ?? id };
    return reqToPromise(store.put(merged));
  }
  async function put(storeName, record) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.put(record));
  }
  async function remove(storeName, id) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.delete(id));
  }
  async function clearStore(storeName) {
    const store = await tx(storeName, 'readwrite');
    return reqToPromise(store.clear());
  }
  async function clearAll() {
    const stores = ['clients','projects','tasks','employees','timeEntries','settings'];
    await Promise.all(stores.map(s => clearStore(s)));
  }
  async function getSetting(cle, def = null) {
    const r = await getById('settings', cle);
    return r ? r.valeur : def;
  }
  async function setSetting(cle, valeur) {
    return put('settings', { cle, valeur });
  }

  return { add, getAll, getById, update, put, remove, clearStore, clearAll, getSetting, setSetting };
})();

/* =====================================================================
   3. UI HELPERS

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function escapeHtml(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), 2200);
}

/* Modal helpers */
function openModal({ title, bodyHtml, onSave, hideSave = false }) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  const modal = $('#modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  const saveBtn = $('#modalSave');
  saveBtn.style.display = hideSave ? 'none' : '';
  saveBtn.textContent = t('save');
  $('#modalCancel').textContent = t('cancel');

  const close = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    saveBtn.replaceWith(saveBtn.cloneNode(true)); // remove listeners
    $('#modalClose').onclick = null;
    $('#modalCancel').onclick = null;
  };
  $('#modalClose').onclick = close;
  $('#modalCancel').onclick = close;
  $('#modalSave').onclick = async () => {
    try {
      const ok = await onSave?.();
      if (ok !== false) close();
    } catch (e) {
      console.error(e);
      toast(String(e.message || e));
    }
  };
  return { close };
}

function confirmModal(message) {
  return new Promise((resolve) => {
    const modal = $('#modal');
    $('#modalTitle').textContent = '';
    $('#modalBody').innerHTML = `<p class="text-slate-700">${escapeHtml(message)}</p>`;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    const saveBtn = $('#modalSave');
    saveBtn.textContent = t('yes');
    $('#modalCancel').textContent = t('no');
    const close = (val) => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      saveBtn.replaceWith(saveBtn.cloneNode(true));
      $('#modalClose').onclick = null;
      $('#modalCancel').onclick = null;
      resolve(val);
    };
    $('#modalClose').onclick = () => close(false);
    $('#modalCancel').onclick = () => close(false);
    $('#modalSave').onclick = () => close(true);
  });
}

let currentPage = 'clients';

async function navigate(page) {
  currentPage = page;
  $$('#nav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  if (page === 'clients')   await renderClients();
  else if (page === 'projects') await renderProjects();
  else if (page === 'tasks')    await renderTasks();
  else if (page === 'employees') await renderEmployees();
  else if (page === 'time')      await renderTimeEntries();
  else if (page === 'settings')  await renderSettings();
}

async function renderTimeEntries() {
  const [clients, projects, tasks, employees, entries] = await Promise.all([
    DB.getAll('clients'), DB.getAll('projects'), DB.getAll('tasks'),
    DB.getAll('employees'), DB.getAll('timeEntries')
  ]);
  const clientById = Object.fromEntries(clients.map(c => [c.id, c]));
  const projectById = Object.fromEntries(projects.map(p => [p.id, p]));
  const taskById = Object.fromEntries(tasks.map(x => [x.id, x]));
  const empById = Object.fromEntries(employees.map(e => [e.id, e]));

  PAGE.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-900 mb-6">${escapeHtml(t('timeTitle'))}</h1>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 mb-6">
      <h2 class="font-semibold text-slate-900 mb-4">${escapeHtml(t('timeAdd'))}</h2>
      <form id="timeForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeEmployee'))}</label>
          <select id="te_emp" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">${escapeHtml(t('selectEmployee'))}</option>
            ${employees.map(e => `<option value="${e.id}">${escapeHtml(e.nom)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeDate'))}</label>
          <input type="date" id="te_date" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" value="${new Date().toISOString().slice(0,10)}">
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeClient'))}</label>
          <select id="te_client" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">${escapeHtml(t('selectClient'))}</option>
            ${clients.map(c => `<option value="${c.id}">${escapeHtml(c.nom)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeProject'))}</label>
          <select id="te_project" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" disabled>
            <option value="">${escapeHtml(t('selectProject'))}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeTask'))}</label>
          <select id="te_task" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" disabled>
            <option value="">${escapeHtml(t('selectTask'))}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeHours'))}</label>
          <input type="number" step="0.25" min="0" id="te_hours" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="0.00">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm text-slate-600 mb-1">${escapeHtml(t('timeDescription'))}</label>
          <textarea id="te_desc" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>
        <div class="md:col-span-2 flex justify-end">
          <button type="submit" class="px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800 text-sm font-medium">${escapeHtml(t('save'))}</button>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-semibold text-slate-900">${escapeHtml(t('recentEntries'))}</h2>
        <input id="searchInput" type="search" placeholder="${escapeHtml(t('search'))}" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">
      </div>
      <div id="listBody"></div>
    </div>
  `;

  // Cascading selects
  const selClient = $('#te_client');
  const selProject = $('#te_project');
  const selTask = $('#te_task');

  selClient.onchange = () => {
    const cid = Number(selClient.value);
    selProject.disabled = !cid;
    const projs = projects.filter(p => p.clientId === cid);
    selProject.innerHTML = `<option value="">${escapeHtml(t('selectProject'))}</option>` +
      projs.map(p => `<option value="${p.id}">${escapeHtml(p.nom)}</option>`).join('');
    selTask.disabled = true;
    selTask.innerHTML = `<option value="">${escapeHtml(t('selectTask'))}</option>`;
  };
  selProject.onchange = () => {
    const pid = Number(selProject.value);
    selTask.disabled = !pid;
    const ts = tasks.filter(x => x.projectId === pid);
    selTask.innerHTML = `<option value="">${escapeHtml(t('selectTask'))}</option>` +
      ts.map(x => `<option value="${x.id}">${escapeHtml(x.nom)}</option>`).join('');
  };

  $('#timeForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {
      employeId: Number($('#te_emp').value) || null,
      clientId: Number($('#te_client').value) || null,
      projectId: Number($('#te_project').value) || null,
      taskId: Number($('#te_task').value) || null,
      date: $('#te_date').value,
      heures: Number($('#te_hours').value) || 0,
      description: $('#te_desc').value.trim(),
      statutValidation: 'draft'
    };
    if (!data.employeId || !data.clientId || !data.date || !data.heures) {
      toast('!');
      return;
    }
    await DB.add('timeEntries', data);
    toast(t('saved'));
    e.target.reset();
    selProject.disabled = true; selTask.disabled = true;
    $('#te_date').value = new Date().toISOString().slice(0,10);
    drawList();
  };

  const drawList = async () => {
    const all = await DB.getAll('timeEntries');
    all.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    const q = $('#searchInput').value.trim().toLowerCase();
    const filtered = all.filter(en => {
      if (!q) return true;
      const blob = [
        empById[en.employeId]?.nom, clientById[en.clientId]?.nom,
        projectById[en.projectId]?.nom, taskById[en.taskId]?.nom,
        en.description, en.date
      ].join(' ').toLowerCase();
      return blob.includes(q);
    });
    const rows = filtered.map(en => `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3">${escapeHtml(en.date)}</td>
        <td class="px-4 py-3">${escapeHtml(empById[en.employeId]?.nom || '')}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(clientById[en.clientId]?.nom || '')}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(projectById[en.projectId]?.nom || '')}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(taskById[en.taskId]?.nom || '')}</td>
        <td class="px-4 py-3 font-medium">${en.heures}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(en.description || '')}</td>
        <td class="px-4 py-3"><button data-act="delete" data-id="${en.id}" class="text-red-600 hover:underline text-sm">${escapeHtml(t('delete'))}</button></td>
      </tr>`).join('');
    $('#listBody').innerHTML = tableEl(
      [t('timeDate'), t('timeEmployee'), t('timeClient'), t('timeProject'), t('timeTask'), t('timeHours'), t('timeDescription'), t('actions')],
      rows
    );
    $$('#listBody [data-act="delete"]').forEach(b => b.onclick = async () => {
      if (await confirmModal(t('confirmDelete'))) {
        await DB.remove('timeEntries', Number(b.dataset.id));
        toast(t('deleted'));
        drawList();
      }
    });
  };
  $('#searchInput').oninput = drawList;
  await drawList();
}

function field(name, label, value = '', type = 'text', required = false) {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}${required ? ' *' : ''}</label>
      <input id="f_${name}" type="${type}" value="${value == null ? '' : escapeHtml(value)}"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>`;
}
function textarea(name, label, value = '') {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}</label>
      <textarea id="f_${name}" rows="3"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${escapeHtml(value || '')}</textarea>
    </div>`;
}
function checkbox(name, label, checked) {
  return `
    <div class="flex items-center gap-2">
      <input id="f_${name}" type="checkbox" ${checked ? 'checked' : ''} class="w-4 h-4">
      <label for="f_${name}" class="text-sm text-slate-700">${escapeHtml(label)}</label>
    </div>`;
}
function selectField(name, label, options, value = '', required = false) {
  return `
    <div>
      <label class="block text-sm text-slate-600 mb-1">${escapeHtml(label)}${required ? ' *' : ''}</label>
      <select id="f_${name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        <option value="">—</option>
        ${options.map(o => `<option value="${escapeHtml(o.value)}" ${String(o.value)===String(value)?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
    </div>`;
}

/* =====================================================================
   6. IMPORT / EXPORT
   ===================================================================== */
async function exportJson() {
  const data = {
    clients: await DB.getAll('clients'),
    projects: await DB.getAll('projects'),
    tasks: await DB.getAll('tasks'),
    employees: await DB.getAll('employees'),
    timeEntries: await DB.getAll('timeEntries'),
    settings: await DB.getAll('settings'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `timetrack-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(t('exported'));
}

async function importJsonHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!await confirmModal(t('importConfirm'))) { e.target.value = ''; return; }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    await DB.clearAll();
    const stores = ['clients','projects','tasks','employees','timeEntries','settings'];
    for (const s of stores) {
      if (Array.isArray(data[s])) {
        for (const r of data[s]) await DB.put(s, r);
      }
    }
    LANG = await DB.getSetting('lang', LANG);
    applyI18n();
    toast(t('imported'));
    navigate(currentPage);
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

async function importXlsxHandler(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    let total = 0;

    // Build sheet name index (case-insensitive)
    const sheetMap = {};
    wb.SheetNames.forEach(n => sheetMap[n.toLowerCase()] = n);

    // Clients
    if (sheetMap['clients']) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['clients']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        await DB.add('clients', {
          nom: String(r.nom).trim(),
          adresse: String(r.adresse || '').trim(),
          contact: String(r.contact || '').trim(),
          actif: parseBool(r.actif, true)
        });
        total++;
      }
    }

    // Projects (resolve clientId by name if needed)
    if (sheetMap['projects']) {
      const allClients = await DB.getAll('clients');
      const byName = Object.fromEntries(allClients.map(c => [c.nom.toLowerCase(), c.id]));
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['projects']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        let cid = Number(r.clientId);
        if (!cid && r.clientId) cid = byName[String(r.clientId).toLowerCase().trim()] || null;
        await DB.add('projects', {
          clientId: cid || null,
          nom: String(r.nom).trim(),
          code: String(r.code || '').trim(),
          tauxHoraire: r.tauxHoraire === '' ? null : Number(r.tauxHoraire),
          budgetHeures: r.budgetHeures === '' ? null : Number(r.budgetHeures),
          actif: parseBool(r.actif, true),
          typeProjet: String(r.typeProjet || '').trim()
        });
        total++;
      }
    }

    // Tasks (resolve projectId by code or name if needed)
    if (sheetMap['tasks']) {
      const allProjects = await DB.getAll('projects');
      const byCode = Object.fromEntries(allProjects.filter(p => p.code).map(p => [p.code.toLowerCase(), p.id]));
      const byName = Object.fromEntries(allProjects.map(p => [p.nom.toLowerCase(), p.id]));
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetMap['tasks']], { defval: '' });
      for (const r of rows) {
        if (!r.nom) continue;
        let pid = Number(r.projectId);
        if (!pid && r.projectId) {
          const k = String(r.projectId).toLowerCase().trim();
          pid = byCode[k] || byName[k] || null;
        }
        await DB.add('tasks', {
          projectId: pid || null,
          nom: String(r.nom).trim(),
          description: String(r.description || '').trim(),
          statut: String(r.statut || 'open').trim(),
          typeTask: String(r.typeTask || '').trim()
        });
        total++;
      }
    }

    toast(`${total} ${t('importedRows')}`);
    navigate(currentPage);
  } catch (err) {
    console.error(err);
    toast(t('importErr') + ': ' + err.message);
  } finally {
    e.target.value = '';
  }
}

function parseBool(v, def = false) {
  if (v === '' || v == null) return def;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  const s = String(v).trim().toLowerCase();
  return ['1','true','vrai','oui','yes','y','כן','פעיל'].includes(s);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
async function boot() {
  // Load language preference
  try {
    LANG = await DB.getSetting('lang', 'fr');
  } catch (e) {
    console.warn('DB init issue', e);
  }
  applyI18n();

  $$('#nav .nav-item').forEach(b => {
    b.onclick = () => navigate(b.dataset.page);
  });

  // Close modal on backdrop click
  $('#modal').onclick = (e) => {
    if (e.target.id === 'modal') {
      $('#modal').classList.add('hidden');
      $('#modal').classList.remove('flex');
    }
  };

  await navigate('clients');
}

boot();
</script>
