<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cashflow — Pilotage trésorerie cabinet</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { background: #fafaf9; }
  /* Hide number input spinners */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body class="bg-stone-50 text-stone-900 antialiased">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   Helpers
   ========================================================= */
const formatILS = (n) => {
  const v = Math.round(Number(n) || 0);
  const sign = v < 0 ? '-' : '';
  return sign + '₪ ' + Math.abs(v).toLocaleString('fr-FR');
};
const uid = () =>
  (crypto.randomUUID ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36));
const monthKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
const monthLabel = (y, m) => {
  const s = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
};

const emptyMonth = () => ({
  openingBalance: 0,
  targetBalance: 0,
  expenses: [],
  incomes: [],
});

const loadMonth = (key) => {
  try {
    const raw = localStorage.getItem('month:' + key);
    if (!raw) return emptyMonth();
    return { ...emptyMonth(), ...JSON.parse(raw) };
  } catch { return emptyMonth(); }
};
const saveMonth = (key, data) => {
  localStorage.setItem('month:' + key, JSON.stringify(data));
};

const expenseStatus = (e) => {
  const a = Number(e.amount) || 0, p = Number(e.paid) || 0;
  if (p <= 0) return 'unpaid';
  if (p < a) return 'partial';
  return 'paid';
};
const incomeStatus = (i) => {
  const a = Number(i.amount) || 0, r = Number(i.received) || 0;
  if (r <= 0) return 'pending';
  if (r < a) return 'partial';
  return 'received';
};

/* =========================================================
   SVG icons (lucide-style)
   ========================================================= */
const Svg = ({ children, className = "w-4 h-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const ChevronLeft  = (p) => <Svg {...p}><polyline points="15 18 9 12 15 6" /></Svg>;
const ChevronRight = (p) => <Svg {...p}><polyline points="9 18 15 12 9 6" /></Svg>;
const Plus  = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const Trash = (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Svg>;
const Check = (p) => <Svg {...p}><polyline points="20 6 9 17 4 12"/></Svg>;
const Sparkles = (p) => <Svg {...p}><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/><path d="M5 4l.5 1.5L7 6l-1.5.5L5 8l-.5-1.5L3 6l1.5-.5z"/></Svg>;
const Building = (p) => <Svg {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V14h6v8"/><line x1="8" y1="6" x2="8" y2="6"/><line x1="12" y1="6" x2="12" y2="6"/><line x1="16" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/></Svg>;
const CreditCard = (p) => <Svg {...p}><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></Svg>;
const Target = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Svg>;
const Wallet = (p) => <Svg {...p}><path d="M20 12V8H4a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></Svg>;
const TrendingUp = (p) => <Svg {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Svg>;
const Copy = (p) => <Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const ArrowRight = (p) => <Svg {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Svg>;

/* =========================================================
   Reusable inputs
   ========================================================= */
const TextInput = ({ value, onChange, placeholder, className = "" }) => (
  <input
    type="text" dir="auto" value={value || ''}
    onChange={e => onChange(e.target.value)}
    placeholder={placeholder}
    className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 " + className}
  />
);
const NumInput = ({ value, onChange, min, max, className = "", placeholder }) => (
  <input
    type="number" inputMode="decimal" value={value === 0 ? '' : value}
    onChange={e => onChange(e.target.value === '' ? 0 : Number(e.target.value))}
    min={min} max={max} placeholder={placeholder ?? '0'}
    className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 text-right tabular-nums " + className}
  />
);

/* =========================================================
   Status badges
   ========================================================= */
const Badge = ({ tone, children }) => {
  const tones = {
    gray:    'bg-stone-100 text-stone-600 ring-stone-200',
    amber:   'bg-amber-50 text-amber-700 ring-amber-200',
    emerald: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
  };
  return (
    <span className={"inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full ring-1 " + tones[tone]}>
      {children}
    </span>
  );
};
const ExpenseBadge = ({ status }) => {
  if (status === 'paid')    return <Badge tone="emerald"><Check className="w-3 h-3"/>Payé</Badge>;
  if (status === 'partial') return <Badge tone="amber">Partiel</Badge>;
  return <Badge tone="gray">À payer</Badge>;
};
const IncomeBadge = ({ status }) => {
  if (status === 'received') return <Badge tone="emerald"><Check className="w-3 h-3"/>Reçu</Badge>;
  if (status === 'partial')  return <Badge tone="amber">Partiel</Badge>;
  return <Badge tone="gray">Attendu</Badge>;
};

/* =========================================================
   Mode toggle (Banque / CB)
   ========================================================= */
const ModeToggle = ({ value, onChange, cardNumber, onCardChange }) => {
  const isCard = value === 'card';
  return (
    <div className="flex items-center gap-2">
      <button
        type="button"
        onClick={() => onChange(isCard ? 'bank' : 'card')}
        className={
          "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ring-1 transition " +
          (isCard
            ? "bg-violet-50 text-violet-700 ring-violet-200 hover:bg-violet-100"
            : "bg-sky-50 text-sky-700 ring-sky-200 hover:bg-sky-100")
        }
        title="Cliquer pour basculer banque / carte"
      >
        {isCard ? <CreditCard className="w-3.5 h-3.5"/> : <Building className="w-3.5 h-3.5"/>}
        {isCard ? 'CB' : 'Banque'}
      </button>
      {isCard && (
        <input
          type="text"
          value={cardNumber || ''}
          onChange={e => onCardChange(e.target.value)}
          placeholder="N°"
          className="w-16 px-2 py-1 text-xs rounded ring-1 ring-violet-200 bg-violet-50 text-violet-700 placeholder-violet-300 outline-none focus:bg-white focus:ring-violet-400 tabular-nums"
        />
      )}
    </div>
  );
};

/* =========================================================
   Expenses table
   ========================================================= */
const ExpensesTable = ({ expenses, onAdd, onUpdate, onRemove }) => {
  const totalPlanned   = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalPaid      = expenses.reduce((s, e) => s + (Number(e.paid)   || 0), 0);
  const totalRemaining = totalPlanned - totalPaid;

  return (
    <section className="bg-white rounded-xl ring-1 ring-stone-200 overflow-hidden">
      <header className="flex items-center justify-between px-4 py-3 border-b border-stone-200">
        <div>
          <h2 className="font-semibold text-stone-900">Postes de dépense</h2>
          <p className="text-xs text-stone-500 mt-0.5">{expenses.length} poste{expenses.length > 1 ? 's' : ''}</p>
        </div>
        <button
          onClick={onAdd}
          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-stone-900 text-white hover:bg-stone-800"
        >
          <Plus className="w-4 h-4"/>Ajouter
        </button>
      </header>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="text-left font-medium px-4 py-2">Fournisseur / poste</th>
              <th className="text-right font-medium px-2 py-2 w-28">Prévu</th>
              <th className="text-right font-medium px-2 py-2 w-16">Jour</th>
              <th className="text-left font-medium px-2 py-2 w-44">Mode</th>
              <th className="text-right font-medium px-2 py-2 w-28">Payé</th>
              <th className="text-left font-medium px-2 py-2 w-28">Statut</th>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-stone-100">
            {expenses.length === 0 && (
              <tr><td colSpan="7" className="px-4 py-6 text-center text-sm text-stone-400">
                Aucun poste pour ce mois.
              </td></tr>
            )}
            {expenses.map((e) => (
              <tr key={e.id} className="hover:bg-stone-50/60">
                <td className="px-2 py-1">
                  <TextInput value={e.name} onChange={v => onUpdate(e.id, { name: v })} placeholder="Nom du fournisseur"/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={e.amount} onChange={v => onUpdate(e.id, { amount: v })}/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={e.day} onChange={v => onUpdate(e.id, { day: Math.max(1, Math.min(31, v || 1)) })} min={1} max={31}/>
                </td>
                <td className="px-2 py-1">
                  <ModeToggle
                    value={e.mode}
                    onChange={v => onUpdate(e.id, { mode: v })}
                    cardNumber={e.cardNumber}
                    onCardChange={v => onUpdate(e.id, { cardNumber: v })}
                  />
                </td>
                <td className="px-2 py-1">
                  <NumInput value={e.paid} onChange={v => onUpdate(e.id, { paid: v })}/>
                </td>
                <td className="px-2 py-1"><ExpenseBadge status={expenseStatus(e)}/></td>
                <td className="px-2 py-1 text-right">
                  <button
                    onClick={() => onRemove(e.id)}
                    className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded"
                    title="Supprimer"
                  >
                    <Trash className="w-4 h-4"/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
          {expenses.length > 0 && (
            <tfoot className="bg-stone-50 text-sm">
              <tr className="font-medium">
                <td className="px-4 py-2 text-stone-600">Totaux</td>
                <td className="px-2 py-2 text-right tabular-nums">{formatILS(totalPlanned)}</td>
                <td></td><td></td>
                <td className="px-2 py-2 text-right tabular-nums">{formatILS(totalPaid)}</td>
                <td className="px-2 py-2 text-rose-700 tabular-nums">Reste {formatILS(totalRemaining)}</td>
                <td></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </section>
  );
};

/* =========================================================
   Incomes table
   ========================================================= */
const IncomesTable = ({ incomes, onAdd, onUpdate, onRemove }) => {
  const totalPlanned   = incomes.reduce((s, i) => s + (Number(i.amount)   || 0), 0);
  const totalReceived  = incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
  const totalRemaining = totalPlanned - totalReceived;

  return (
    <section className="bg-white rounded-xl ring-1 ring-stone-200 overflow-hidden">
      <header className="flex items-center justify-between px-4 py-3 border-b border-stone-200">
        <div>
          <h2 className="font-semibold text-stone-900">Encaissements clients prévus</h2>
          <p className="text-xs text-stone-500 mt-0.5">{incomes.length} encaissement{incomes.length > 1 ? 's' : ''}</p>
        </div>
        <button
          onClick={onAdd}
          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-stone-900 text-white hover:bg-stone-800"
        >
          <Plus className="w-4 h-4"/>Ajouter
        </button>
      </header>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="text-left font-medium px-4 py-2">Description</th>
              <th className="text-right font-medium px-2 py-2 w-28">Prévu</th>
              <th className="text-right font-medium px-2 py-2 w-16">Jour</th>
              <th className="text-right font-medium px-2 py-2 w-28">Reçu</th>
              <th className="text-left font-medium px-2 py-2 w-28">Statut</th>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-stone-100">
            {incomes.length === 0 && (
              <tr><td colSpan="6" className="px-4 py-6 text-center text-sm text-stone-400">
                Aucun encaissement prévu pour ce mois.
              </td></tr>
            )}
            {incomes.map((i) => (
              <tr key={i.id} className="hover:bg-stone-50/60">
                <td className="px-2 py-1">
                  <TextInput value={i.name} onChange={v => onUpdate(i.id, { name: v })} placeholder="Client / description"/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={i.amount} onChange={v => onUpdate(i.id, { amount: v })}/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={i.day} onChange={v => onUpdate(i.id, { day: Math.max(1, Math.min(31, v || 1)) })} min={1} max={31}/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={i.received} onChange={v => onUpdate(i.id, { received: v })}/>
                </td>
                <td className="px-2 py-1"><IncomeBadge status={incomeStatus(i)}/></td>
                <td className="px-2 py-1 text-right">
                  <button
                    onClick={() => onRemove(i.id)}
                    className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded"
                    title="Supprimer"
                  >
                    <Trash className="w-4 h-4"/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
          {incomes.length > 0 && (
            <tfoot className="bg-stone-50 text-sm">
              <tr className="font-medium">
                <td className="px-4 py-2 text-stone-600">Totaux</td>
                <td className="px-2 py-2 text-right tabular-nums">{formatILS(totalPlanned)}</td>
                <td></td>
                <td className="px-2 py-2 text-right tabular-nums">{formatILS(totalReceived)}</td>
                <td className="px-2 py-2 text-emerald-700 tabular-nums">Reste {formatILS(totalRemaining)}</td>
                <td></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </section>
  );
};

/* =========================================================
   Sidebar
   ========================================================= */
const Sidebar = ({ data, totals, onPatch }) => {
  const projectedPositive = totals.projected >= 0;
  const targetReached = totals.additionalNeeded <= 0;

  return (
    <aside className="space-y-4 lg:sticky lg:top-4 self-start">
      {/* Solde début de mois */}
      <div className="bg-white rounded-xl ring-1 ring-stone-200 p-4">
        <div className="flex items-center gap-2 text-stone-500 text-xs uppercase tracking-wide font-medium">
          <Wallet className="w-3.5 h-3.5"/> Solde début de mois
        </div>
        <div className="mt-2 flex items-baseline gap-1.5">
          <span className="text-stone-400 text-2xl">₪</span>
          <input
            type="number" inputMode="decimal"
            value={data.openingBalance === 0 ? '' : data.openingBalance}
            onChange={e => onPatch({ openingBalance: e.target.value === '' ? 0 : Number(e.target.value) })}
            placeholder="0"
            className="flex-1 text-3xl font-semibold tabular-nums bg-transparent outline-none focus:bg-stone-50 rounded px-1 -mx-1"
          />
        </div>
      </div>

      {/* Résumé du mois */}
      <div className="bg-white rounded-xl ring-1 ring-stone-200 p-4">
        <div className="flex items-center gap-2 text-stone-500 text-xs uppercase tracking-wide font-medium">
          <TrendingUp className="w-3.5 h-3.5"/> Résumé du mois
        </div>
        <dl className="mt-3 space-y-1.5 text-sm">
          <Row label="Solde début" value={formatILS(totals.opening)}/>
          <Row label="+ Encaissements reçus" value={formatILS(totals.incReceived)} valueClass="text-emerald-600"/>
          <Row label="− Dépenses payées"     value={formatILS(totals.expPaid)}     valueClass="text-rose-600"/>
          <div className="border-t border-stone-200 my-2"/>
          <Row label="Solde actuel" value={formatILS(totals.current)} bold/>
          <Row label="+ Encaissements à venir" value={formatILS(totals.incRemaining)} valueClass="text-emerald-500/80"/>
          <Row label="− Dépenses à payer"     value={formatILS(totals.expRemaining)} valueClass="text-rose-500/80"/>
        </dl>

        <div className={
          "mt-4 rounded-lg p-3 " +
          (projectedPositive ? "bg-emerald-50 ring-1 ring-emerald-200"
                             : "bg-rose-50 ring-1 ring-rose-200")
        }>
          <div className={"text-xs font-medium uppercase tracking-wide " + (projectedPositive ? "text-emerald-700" : "text-rose-700")}>
            Solde projeté fin de mois
          </div>
          <div className={"text-2xl font-bold tabular-nums mt-1 " + (projectedPositive ? "text-emerald-700" : "text-rose-700")}>
            {formatILS(totals.projected)}
          </div>
        </div>
      </div>

      {/* Objectif fin de mois */}
      <div className="bg-stone-900 text-white rounded-xl p-4">
        <div className="flex items-center gap-2 text-stone-400 text-xs uppercase tracking-wide font-medium">
          <Target className="w-3.5 h-3.5"/> Objectif fin de mois
        </div>
        <label className="block mt-3">
          <span className="text-xs text-stone-400">Solde cible</span>
          <div className="flex items-baseline gap-1.5 mt-1">
            <span className="text-stone-500 text-xl">₪</span>
            <input
              type="number" inputMode="decimal"
              value={data.targetBalance === 0 ? '' : data.targetBalance}
              onChange={e => onPatch({ targetBalance: e.target.value === '' ? 0 : Number(e.target.value) })}
              placeholder="0"
              className="flex-1 text-2xl font-semibold tabular-nums bg-transparent outline-none focus:bg-stone-800 rounded px-1 -mx-1 placeholder-stone-600"
            />
          </div>
        </label>

        <div className="mt-4 pt-3 border-t border-stone-800">
          <div className="text-xs text-stone-400">Encaissements supplémentaires nécessaires</div>
          <div className={
            "text-xl font-semibold tabular-nums mt-1 " +
            (targetReached ? "text-emerald-400" : "text-amber-400")
          }>
            {targetReached ? '✓ Objectif atteint' : formatILS(totals.additionalNeeded)}
          </div>
        </div>
      </div>

      {/* Chiffre d'affaires */}
      <div className="bg-white rounded-xl ring-1 ring-stone-200 p-4">
        <div className="text-stone-500 text-xs uppercase tracking-wide font-medium">
          Chiffre d'affaires
        </div>
        <dl className="mt-3 space-y-1.5 text-sm">
          <Row label="Total dépenses TTC" value={formatILS(totals.expPlanned)}/>
          <Row label="Net de Ma'am 18%" value={formatILS(totals.expPlanned / 1.18)} valueClass="text-stone-900 font-semibold"/>
        </dl>
      </div>
    </aside>
  );
};

const Row = ({ label, value, valueClass = "", bold = false }) => (
  <div className={"flex items-baseline justify-between " + (bold ? "font-semibold text-stone-900" : "text-stone-600")}>
    <dt>{label}</dt>
    <dd className={"tabular-nums " + valueClass}>{value}</dd>
  </div>
);

/* =========================================================
   Empty state
   ========================================================= */
const EmptyState = ({ onManual, onCopyPrev, onReportUnpaid }) => (
  <div className="bg-white rounded-xl ring-1 ring-stone-200 p-10 text-center">
    <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-50 text-amber-600 ring-1 ring-amber-200">
      <Sparkles className="w-6 h-6"/>
    </div>
    <h3 className="mt-4 text-lg font-semibold text-stone-900">Mois vide</h3>
    <p className="mt-1 text-sm text-stone-500 max-w-md mx-auto">
      Aucun poste de dépense ni encaissement saisi pour ce mois. Démarrez en saisissant manuellement, ou en reprenant le mois précédent.
    </p>
    <div className="mt-6 flex flex-wrap items-center justify-center gap-2">
      <button onClick={onManual}
        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-stone-900 text-white hover:bg-stone-800 text-sm">
        <Plus className="w-4 h-4"/>Saisir manuellement
      </button>
      <button onClick={onCopyPrev} disabled
        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white text-stone-400 ring-1 ring-stone-200 text-sm cursor-not-allowed">
        <Copy className="w-4 h-4"/>Copier mois précédent
      </button>
      <button onClick={onReportUnpaid} disabled
        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white text-stone-400 ring-1 ring-stone-200 text-sm cursor-not-allowed">
        <ArrowRight className="w-4 h-4"/>Reporter non-payés
      </button>
    </div>
  </div>
);

/* =========================================================
   Header
   ========================================================= */
const Header = ({ year, month, onPrev, onNext, saved }) => (
  <header className="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div>
      <h1 className="text-2xl font-bold text-stone-900 tracking-tight">Cashflow</h1>
      <p className="text-sm text-stone-500">Pilotage trésorerie cabinet</p>
    </div>

    <div className="flex items-center gap-3">
      <span
        className={
          "inline-flex items-center gap-1.5 text-xs font-medium transition-opacity duration-300 " +
          (saved ? "opacity-100 text-emerald-600" : "opacity-0")
        }
      >
        <Check className="w-3.5 h-3.5"/> Sauvegardé
      </span>

      <div className="inline-flex items-center bg-white ring-1 ring-stone-200 rounded-lg overflow-hidden">
        <button onClick={onPrev} className="p-2 hover:bg-stone-50 text-stone-600" aria-label="Mois précédent">
          <ChevronLeft className="w-4 h-4"/>
        </button>
        <div className="px-4 py-1.5 text-sm font-medium text-stone-900 min-w-[140px] text-center">
          {monthLabel(year, month)}
        </div>
        <button onClick={onNext} className="p-2 hover:bg-stone-50 text-stone-600" aria-label="Mois suivant">
          <ChevronRight className="w-4 h-4"/>
        </button>
      </div>
    </div>
  </header>
);

/* =========================================================
   App
   ========================================================= */
function App() {
  const today = new Date();
  const [year, setYear]   = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const key = monthKey(year, month);

  const [data, setData] = useState(() => loadMonth(key));
  const [saved, setSaved] = useState(false);
  const skipNextSave = useRef(true);

  // Recharger les données quand on change de mois
  useEffect(() => {
    skipNextSave.current = true;
    setData(loadMonth(key));
  }, [key]);

  // Auto-save (debounce 500ms)
  useEffect(() => {
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    const t = setTimeout(() => {
      saveMonth(key, data);
      setSaved(true);
      const f = setTimeout(() => setSaved(false), 1500);
      return () => clearTimeout(f);
    }, 500);
    return () => clearTimeout(t);
  }, [data, key]);

  // Navigation
  const prev = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); }
    else setMonth(m => m - 1);
  };
  const next = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); }
    else setMonth(m => m + 1);
  };

  // CRUD - Expenses
  const addExpense = () => setData(d => ({
    ...d,
    expenses: [...d.expenses, {
      id: uid(), name: '', amount: 0, day: 1, mode: 'bank', cardNumber: '', notes: '', paid: 0,
    }],
  }));
  const updateExpense = (id, patch) => setData(d => ({
    ...d, expenses: d.expenses.map(e => e.id === id ? { ...e, ...patch } : e),
  }));
  const removeExpense = (id) => setData(d => ({ ...d, expenses: d.expenses.filter(e => e.id !== id) }));

  // CRUD - Incomes
  const addIncome = () => setData(d => ({
    ...d,
    incomes: [...d.incomes, { id: uid(), name: '', amount: 0, day: 1, received: 0 }],
  }));
  const updateIncome = (id, patch) => setData(d => ({
    ...d, incomes: d.incomes.map(i => i.id === id ? { ...i, ...patch } : i),
  }));
  const removeIncome = (id) => setData(d => ({ ...d, incomes: d.incomes.filter(i => i.id !== id) }));

  const patchData = (patch) => setData(d => ({ ...d, ...patch }));

  // Computations
  const totals = useMemo(() => {
    const expPlanned   = data.expenses.reduce((s, e) => s + (Number(e.amount)   || 0), 0);
    const expPaid      = data.expenses.reduce((s, e) => s + (Number(e.paid)     || 0), 0);
    const expRemaining = expPlanned - expPaid;
    const incPlanned   = data.incomes.reduce((s, i) => s + (Number(i.amount)   || 0), 0);
    const incReceived  = data.incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
    const incRemaining = incPlanned - incReceived;
    const opening      = Number(data.openingBalance) || 0;
    const current      = opening + incReceived - expPaid;
    const projected    = current + incRemaining - expRemaining;
    const target       = Number(data.targetBalance) || 0;
    const additionalNeeded = Math.max(0, target - projected);
    return { expPlanned, expPaid, expRemaining, incPlanned, incReceived, incRemaining,
             opening, current, projected, target, additionalNeeded };
  }, [data]);

  const isEmpty = data.expenses.length === 0 && data.incomes.length === 0;

  return (
    <div className="min-h-screen">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">
        <Header year={year} month={month} onPrev={prev} onNext={next} saved={saved}/>

        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_360px] gap-6">
          <main className="space-y-6 min-w-0">
            {isEmpty ? (
              <EmptyState
                onManual={addExpense}
                onCopyPrev={() => {}}
                onReportUnpaid={() => {}}
              />
            ) : (
              <>
                <ExpensesTable
                  expenses={data.expenses}
                  onAdd={addExpense}
                  onUpdate={updateExpense}
                  onRemove={removeExpense}
                />
                <IncomesTable
                  incomes={data.incomes}
                  onAdd={addIncome}
                  onUpdate={updateIncome}
                  onRemove={removeIncome}
                />
              </>
            )}
          </main>

          <Sidebar data={data} totals={totals} onPatch={patchData}/>
        </div>

        <footer className="mt-10 pt-6 border-t border-stone-200 text-xs text-stone-400 text-center">
          Données stockées localement dans votre navigateur (localStorage).
          Clé du mois en cours : <code className="font-mono">month:{key}</code>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
