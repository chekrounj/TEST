};

const UnmatchedRow = ({ tx, onCreate, onIgnore, onLearnRule }) => {
  const isExp = tx.direction === 'out';
  const day = parseInt(tx.date.slice(8, 10), 10) || 1;
  const [creating, setCreating] = useState(false);
  const [learning, setLearning] = useState(false);
  const [draft, setDraft] = useState({
    name: buildPosteName(tx.description, tx.details),
    type: '',
    category: suggestCategory(buildPosteName(tx.description, tx.details), isExp ? 'expense' : 'income') || null,
    amount: Math.abs(tx.amount),
    day,
    mode: 'bank',
    cardNumber: '',
  });
  const [ruleDraft, setRuleDraft] = useState({
    pattern: tx.description || '',
    patternType: 'contains',
    targetName: '',
  });
  const monthItems = useMemo(() => {
    if (!learning) return [];
    const m = loadMonth(tx.monthKey);
    return isExp ? m.expenses : m.incomes;
  }, [learning, tx.monthKey, isExp]);

  return (
    <div className="px-3 py-2 text-xs">
      <div className="flex items-center gap-3">
        <span className="tabular-nums text-stone-500 w-12">{fmtDayFR(tx.date)}</span>
        <div className="flex-1 min-w-0">
          <div className="truncate text-stone-800" dir="auto" title={tx.description}>
            {tx.description || '—'}
          </div>
          {tx.details && (
            <div className="truncate text-[10px] text-stone-400" dir="auto" title={tx.details}>{tx.details}</div>
          )}
        </div>
        <span className={"tabular-nums font-medium w-24 text-right " +
          (isExp ? "text-rose-600" : "text-emerald-600")}>
          {isExp ? '−' : '+'} {formatNum(isExp ? tx.debit : tx.credit)}
        </span>
      </div>
      {!creating && !learning && (
        <div className="mt-1.5 flex items-center gap-1.5 justify-end">
          <button onClick={() => setCreating(true)}
            className="px-2 py-1 text-[11px] rounded ring-1 ring-stone-200 hover:bg-stone-50">
            Créer un poste
          </button>
          <button onClick={() => setLearning(true)}
            className="px-2 py-1 text-[11px] rounded ring-1 ring-stone-200 hover:bg-stone-50">
            Apprendre une règle
          </button>
          <button onClick={onIgnore}
            className="px-2 py-1 text-[11px] rounded ring-1 ring-stone-200 hover:bg-stone-50">
            Ignorer
          </button>
        </div>
      )}
      {learning && (
        <div className="mt-2 p-2 bg-stone-50 rounded ring-1 ring-stone-200 grid grid-cols-3 gap-1.5">
          <input type="text" dir="auto" placeholder="Pattern à reconnaître"
            value={ruleDraft.pattern}
            onChange={e => setRuleDraft(d => ({ ...d, pattern: e.target.value }))}
            className="col-span-3 px-2 py-1 text-xs ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400"/>
          <div className="col-span-3 flex items-center gap-3 text-[11px] text-stone-700">
            <label className="inline-flex items-center gap-1 cursor-pointer">
              <input type="radio" checked={ruleDraft.patternType === 'contains'}
                onChange={() => setRuleDraft(d => ({ ...d, patternType: 'contains' }))}/>
              Contient le texte
            </label>
            <label className="inline-flex items-center gap-1 cursor-pointer">
              <input type="radio" checked={ruleDraft.patternType === 'regex'}
                onChange={() => setRuleDraft(d => ({ ...d, patternType: 'regex' }))}/>
              Expression régulière
            </label>
          </div>
          <select value={ruleDraft.targetName}
            onChange={e => {
              if (e.target.value === '__create__') { setLearning(false); setCreating(true); return; }
              setRuleDraft(d => ({ ...d, targetName: e.target.value }));
            }}
            className="col-span-3 px-2 py-1 text-xs ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400">
            <option value="">— Choisir le poste cible —</option>
            {monthItems.map(it => <option key={it.id} value={it.name || ''}>{it.name || '(sans nom)'}</option>)}
            <option value="__create__">+ Créer un nouveau poste…</option>
          </select>
          <div className="col-span-3 flex items-center justify-end gap-1.5 mt-1">
            <button onClick={() => setLearning(false)}
              className="px-2 py-1 text-[11px] rounded text-stone-600 hover:bg-stone-100">
              Annuler
            </button>
            <button
              onClick={() => {
                const target = monthItems.find(it => (it.name || '') === ruleDraft.targetName);
                if (!target || !ruleDraft.pattern.trim()) return;
                onLearnRule(tx, ruleDraft, target);
                setLearning(false);
              }}
              disabled={!ruleDraft.pattern.trim() || !ruleDraft.targetName}
              className="px-2 py-1 text-[11px] rounded bg-stone-900 text-white hover:bg-stone-800 disabled:bg-stone-300 disabled:cursor-not-allowed">
              Sauvegarder et matcher
            </button>
          </div>
        </div>
      )}
      {creating && (
        <div className="mt-2 p-2 bg-stone-50 rounded ring-1 ring-stone-200 grid grid-cols-3 gap-1.5">
          <input type="text" dir="auto" placeholder="Nom"
            value={draft.name}
            onChange={e => setDraft(d => ({ ...d, name: e.target.value }))}
            className="col-span-3 px-2 py-1 text-xs ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400"/>
          <input type="text" dir="auto" placeholder="Type (ex. fournisseur)"
            value={draft.type}
            onChange={e => setDraft(d => ({ ...d, type: e.target.value }))}
            className="col-span-3 px-2 py-1 text-xs ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400"/>
          <div className="col-span-2">
            <BigNumInput value={draft.amount}
              onChange={v => setDraft(d => ({ ...d, amount: v }))}
              placeholder={isExp ? "Montant prévu" : "Montant attendu"}
              className="w-full px-2 py-1 text-xs ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400 tabular-nums"/>
          </div>
          <div className="col-span-1">
            <BigNumInput value={draft.day}
              onChange={v => setDraft(d => ({ ...d, day: Math.max(1, Math.min(31, v || 1)) }))}
              placeholder="Jour"
              className="w-full px-2 py-1 text-xs ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400 tabular-nums"/>
          </div>
          <div className="col-span-3 flex items-center justify-end gap-1.5 mt-1">
            <button onClick={() => setCreating(false)}
              className="px-2 py-1 text-[11px] rounded text-stone-600 hover:bg-stone-100">
              Annuler
            </button>
            <button onClick={() => { onCreate(draft); setCreating(false); }}
              disabled={!draft.name.trim()}
              className="px-2 py-1 text-[11px] rounded bg-stone-900 text-white hover:bg-stone-800 disabled:bg-stone-300 disabled:cursor-not-allowed">
              Créer et matcher
            </button>
          </div>
        </div>
      )}
    </div>
  );
};

const BankRecap = ({ result, onUpdate }) => {
  const { matched = [], unmatched = [], cardDebits = [], duplicates = [], dateRange, total } = result;
  const days = (dateRange?.from && dateRange?.to)
    ? Math.round((new Date(dateRange.to) - new Date(dateRange.from)) / 86400000) + 1
    : 0;

  const onCreatePost = (tx, draft) => {
    onUpdate(prev => ({
      ...prev,
      unmatched: prev.unmatched.filter(t => t.referenceKey !== tx.referenceKey),
      matched: [...prev.matched, {
        transaction: tx,
        monthKey: tx.monthKey,
        kind: tx.direction === 'out' ? 'expense' : 'income',
        expenseDraft: tx.direction === 'out' ? draft : undefined,
        incomeDraft:  tx.direction === 'in'  ? draft : undefined,
        appliedAmount: tx.direction === 'out' ? tx.debit : tx.credit,
        isNew: true,
      }],
    }));
  };
  const onIgnoreTx = (tx) => {
    onUpdate(prev => ({
      ...prev,
      unmatched: prev.unmatched.filter(t => t.referenceKey !== tx.referenceKey),
      ignored: [...(prev.ignored || []), tx],
    }));
  };
  const onLearnRule = (tx, ruleDraft, target) => {
    // Persist the rule with hitCount = 1 (this match is the first hit)
    const rules = loadMatchRules();
    rules.push({
      id: uid(),
      pattern: ruleDraft.pattern.trim(),
      patternType: ruleDraft.patternType,
      matchTo: {
        type: tx.direction === 'out' ? 'expense' : 'income',
        postName: target.name || '',
      },
      createdAt: new Date().toISOString(),
      hitCount: 1,
    });
    saveMatchRules(rules);
    // Move tx into matched
    onUpdate(prev => ({
      ...prev,
      unmatched: prev.unmatched.filter(t => t.referenceKey !== tx.referenceKey),
      matched: [...prev.matched, {
        transaction: tx,
        monthKey: tx.monthKey,
        kind: tx.direction === 'out' ? 'expense' : 'income',
        expenseId: tx.direction === 'out' ? target.id : undefined,
        incomeId:  tx.direction === 'in'  ? target.id : undefined,
        expenseName: tx.direction === 'out' ? target.name : undefined,
        incomeName:  tx.direction === 'in'  ? target.name : undefined,
        appliedAmount: tx.direction === 'out' ? tx.debit : tx.credit,
        viaRule: 'just-created',
      }],
    }));
  };

  return (
    <div className="space-y-3">
      <div className="rounded-lg bg-sky-50 ring-1 ring-sky-200 px-3 py-2 text-sm text-sky-800">
        <span className="font-medium">Période détectée :</span>{' '}
        <span className="tabular-nums">{fmtDateFR(dateRange?.from)} → {fmtDateFR(dateRange?.to)}</span>
        <span className="text-sky-600 ml-2">· {days} jour{days > 1 ? 's' : ''}</span>
        <span className="text-sky-600 ml-2">· {total} ligne{total > 1 ? 's' : ''}</span>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Matchées"      value={matched.length}    tone="emerald"/>
        <Stat label="Non matchées"  value={unmatched.length}  tone={unmatched.length > 0 ? "amber" : "gray"}/>
        <Stat label="Débits cartes" value={cardDebits.length} tone="violet"/>
        <Stat label="Doublons"      value={duplicates.length} tone="gray"/>
      </div>

      {/* 1. Matched (collapsable, fermée par défaut) */}
      <CollapsibleSection title="Transactions matchées automatiquement" count={matched.length} defaultOpen={false}>
        <div className="max-h-72 overflow-auto divide-y divide-stone-100">
          {matched.length === 0 ? (
            <div className="px-3 py-4 text-center text-xs text-stone-400">Aucun match automatique.</div>
          ) : matched.map((m, idx) => {
            const t = m.transaction;
            const isExp = m.kind === 'expense';
            const target = m.expenseName || m.incomeName
              || (m.expenseDraft?.name || m.incomeDraft?.name || '—');
            return (
              <div key={t.referenceKey || idx} className="px-3 py-2 text-xs flex items-center gap-3">
                <span className="tabular-nums text-stone-500 w-12">{fmtDayFR(t.date)}</span>
                <div className="flex-1 min-w-0">
                  <div className="truncate text-stone-800" dir="auto" title={t.description}>{t.description || '—'}</div>
                  <div className="truncate text-emerald-600 text-[10px] flex items-center gap-1" dir="auto">
                    <ArrowRight className="w-3 h-3 flex-none"/>
                    <span className="truncate">poste : {target}{m.isNew ? ' (nouveau)' : ''}</span>
                  </div>
                </div>
                <span className={"tabular-nums font-medium w-24 text-right " +
                  (isExp ? "text-rose-600" : "text-emerald-600")}>
                  {isExp ? '−' : '+'} {formatNum(m.appliedAmount)}
                </span>
              </div>
            );
          })}
        </div>
      </CollapsibleSection>

      {/* 2. Unmatched (ouverte par défaut, actions) */}
      <CollapsibleSection title="Transactions non matchées" count={unmatched.length} defaultOpen={true}>
        <div className="max-h-96 overflow-auto divide-y divide-stone-100">
          {unmatched.length === 0 ? (
            <div className="px-3 py-4 text-center text-xs text-stone-400">Aucune transaction à traiter.</div>
          ) : unmatched.map(tx => (
            <UnmatchedRow key={tx.referenceKey} tx={tx}
              onCreate={(draft) => onCreatePost(tx, draft)}
              onIgnore={() => onIgnoreTx(tx)}
              onLearnRule={onLearnRule}/>
          ))}
        </div>
      </CollapsibleSection>

      {/* 3. Card debits (informative, prompt 6) */}
      <CollapsibleSection title="Débits de cartes groupés" count={cardDebits.length} defaultOpen={false}>
        <div className="max-h-72 overflow-auto divide-y divide-stone-100">
          {cardDebits.length === 0 ? (
            <div className="px-3 py-4 text-center text-xs text-stone-400">Aucun débit groupé détecté.</div>
          ) : cardDebits.map(t => (
            <div key={t.referenceKey} className="px-3 py-2 text-xs flex items-center gap-3">
              <span className="tabular-nums text-stone-500 w-12">{fmtDayFR(t.date)}</span>
              <div className="flex-1 min-w-0">
                <div className="truncate text-stone-800" dir="auto">
                  Carte <span className="font-medium tabular-nums">{t.cardNumber}</span>
                  <span className="text-stone-400"> — </span>
                  <span dir="auto">{t.description}</span>
                </div>
              </div>
              <span className="tabular-nums font-medium text-violet-700 w-24 text-right">
                − {formatNum(t.debit)}
              </span>
            </div>
          ))}
        </div>
      </CollapsibleSection>
    </div>
  );
};

const CardRecap = ({ result }) => {
  const cards = result.cards || [];
  const warnings = result.warnings || [];
  return (
    <div className="space-y-3">
      {warnings.length > 0 && (
        <div className="rounded-lg bg-amber-50 ring-1 ring-amber-200 px-3 py-2 text-sm text-amber-800 space-y-0.5">
          {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
        </div>
      )}

      <div className="rounded-lg ring-1 ring-stone-200 overflow-hidden">
        <div className="px-3 py-2 bg-stone-50 text-xs font-medium text-stone-600 flex items-center justify-between">
          <span>Cartes détectées</span>
          <span className="tabular-nums text-stone-500">{cards.length}</span>
        </div>
        <div className="divide-y divide-stone-100">
          {cards.length === 0 ? (
            <div className="px-3 py-6 text-center text-sm text-stone-400">
              Aucune carte parsée. Vérifiez le format du fichier.
            </div>
          ) : cards.map(c => {
            const hasPrev = c.prevAmount != null;
            const delta = hasPrev ? (c.upcomingAmount - c.prevAmount) : 0;
            return (
              <div key={c.cardNumber} className="px-3 py-3 flex items-center gap-3">
                <CreditCard className="w-5 h-5 text-violet-600 flex-none"/>
                <div className="flex-1 min-w-0">
                  <div className="font-medium text-stone-900 tabular-nums">•••• {c.cardNumber}</div>
                  <div className="text-xs text-stone-500 mt-0.5">
                    Prochain débit : {fmtDateFR(c.debitDate)}
                    {hasPrev && c.prevDebitDate && c.prevDebitDate !== c.debitDate && (
                      <span className="text-stone-400"> (était {fmtDateFR(c.prevDebitDate)})</span>
                    )}
                  </div>
                </div>
                <div className="text-right">
                  <div className="font-semibold tabular-nums text-stone-900">
                    {formatNum(c.upcomingAmount)} ₪
                  </div>
                  {hasPrev && delta !== 0 && (
                    <div className={"text-[11px] tabular-nums " + (delta > 0 ? "text-rose-600" : "text-emerald-600")}>
                      {delta > 0 ? '+' : '−'}{formatNum(Math.abs(delta))} vs précédent
                    </div>
                  )}
                  {hasPrev && delta === 0 && (
                    <div className="text-[11px] text-stone-400">identique au précédent</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

/* =========================================================
   Import wizard (bank statements + credit cards)
   ========================================================= */
const ImportWizard = ({ open, onClose, onConfirmImport }) => {
  const [step, setStep] = useState(1);   // 1 = type, 2 = upload, 3 = parsing, 4 = recap
  const [type, setType] = useState(null); // 'bank' | 'card'
  const [file, setFile] = useState(null);
  const [parseResult, setParseResult] = useState(null);
  const [drag, setDrag] = useState(false);
  const fileRef = useRef(null);

  const reset = () => {
    setStep(1); setType(null); setFile(null); setParseResult(null); setDrag(false);
  };
  const cancelAll = () => { reset(); onClose(); };

  // Reset when reopened
  useEffect(() => { if (open) reset(); }, [open]);

  // Esc to close
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === 'Escape') cancelAll(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open]);

  // Trigger parsing as soon as we enter step 3
  useEffect(() => {
    if (!open || step !== 3 || !file || !type) return;
    let cancelled = false;
    const parser = type === 'bank' ? parseBankStatement : parseCardStatement;
    parser(file).then(res => {
      if (cancelled) return;
      setParseResult(res);
      setStep(4);
    }).catch(err => {
      if (cancelled) return;
      alert("Erreur de parsing : " + err.message);
      setStep(2);
    });
    return () => { cancelled = true; };
  }, [open, step, file, type]);

  const chooseType = (t) => { setType(t); setStep(2); };
  const acceptFile = (f) => {
    if (!f) return;
    if (!/\.(xlsx|xls|csv)$/i.test(f.name)) {
      alert("Format non supporté. Choisissez un fichier .xlsx, .xls ou .csv.");
      return;
    }
    setFile(f);
    setStep(3);
  };
  const confirmImport = () => {
    if (onConfirmImport && parseResult) onConfirmImport(parseResult);
    cancelAll();
  };

  if (!open) return null;

  const stepLabels = ["Type", "Fichier", "Analyse", "Récap"];
  const typeLabel = type === 'bank' ? 'Relevé bancaire Hapoalim'
                  : type === 'card' ? 'Cartes de crédit'
                  : '';

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center p-4"
         onClick={cancelAll}>
      <div className="bg-white rounded-xl shadow-xl ring-1 ring-stone-200 w-full max-w-xl flex flex-col max-h-[90vh]"
           onClick={e => e.stopPropagation()}>
        <header className="px-5 py-4 border-b border-stone-200 flex items-center justify-between">
          <div>
            <h3 className="font-semibold text-stone-900 text-lg">Importer un relevé</h3>
            {type && (
              <p className="text-xs text-stone-500 mt-0.5">{typeLabel}{file ? ` · ${file.name}` : ''}</p>
            )}
          </div>
          <button onClick={cancelAll}
            className="p-1.5 -m-1.5 rounded hover:bg-stone-100 text-stone-400 hover:text-stone-700">
            <X className="w-4 h-4"/>
          </button>
        </header>

        {/* Stepper */}
        <div className="px-5 py-3 border-b border-stone-100 flex items-center gap-2 text-xs">
          {stepLabels.map((label, i) => {
            const n = i + 1;
            const done = step > n, active = step === n;
            return (
              <React.Fragment key={label}>
                <div className={
                  "inline-flex items-center gap-1.5 " +
                  (active ? "text-stone-900 font-medium" : done ? "text-emerald-600" : "text-stone-400")
                }>
                  <span className={
                    "inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-semibold " +
                    (active ? "bg-stone-900 text-white"
                            : done ? "bg-emerald-100 text-emerald-700"
                                   : "bg-stone-100 text-stone-500")
                  }>
                    {done ? '✓' : n}
                  </span>
                  <span>{label}</span>
                </div>
                {i < stepLabels.length - 1 && <div className="flex-1 h-px bg-stone-200"/>}
              </React.Fragment>
            );
          })}
        </div>

        <div className="p-5 overflow-auto flex-1">
          {step === 1 && (
            <div>
              <p className="text-sm text-stone-600">Que voulez-vous importer ?</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                <button onClick={() => chooseType('bank')}
                  className="group p-5 rounded-xl ring-1 ring-stone-200 hover:ring-stone-900 hover:bg-stone-50 text-left transition">
                  <Building2 className="w-8 h-8 text-sky-600"/>
                  <div className="mt-3 font-semibold text-stone-900">Relevé bancaire</div>
                  <div className="text-xs text-stone-500 mt-0.5">Hapoalim — mouvements du compte</div>
                </button>
                <button onClick={() => chooseType('card')}
                  className="group p-5 rounded-xl ring-1 ring-stone-200 hover:ring-stone-900 hover:bg-stone-50 text-left transition">
                  <CreditCard className="w-8 h-8 text-violet-600"/>
                  <div className="mt-3 font-semibold text-stone-900">Cartes de crédit</div>
                  <div className="text-xs text-stone-500 mt-0.5">Débits prochains et détaillés</div>
                </button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <p className="text-sm text-stone-600">
                Sélectionnez le fichier <span className="font-medium text-stone-900">{typeLabel}</span> à importer (.xlsx, .xls, .csv).
              </p>
              <div
                onDragOver={e => { e.preventDefault(); setDrag(true); }}
                onDragLeave={() => setDrag(false)}
                onDrop={e => { e.preventDefault(); setDrag(false); acceptFile(e.dataTransfer.files?.[0]); }}
                className={
                  "mt-4 border-2 border-dashed rounded-xl p-10 text-center transition " +
                  (drag ? "border-stone-900 bg-stone-50" : "border-stone-200")
                }
              >
                <Upload className="w-10 h-10 mx-auto text-stone-400"/>
                <p className="mt-3 text-sm text-stone-700">Glissez-déposez votre fichier ici</p>
                <p className="text-xs text-stone-400 mt-1">ou</p>
                <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden"
                  onChange={e => acceptFile(e.target.files?.[0])}/>
                <button onClick={() => fileRef.current?.click()}
                  className="mt-3 inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-stone-900 text-white hover:bg-stone-800 text-sm">
                  <Upload className="w-4 h-4"/>Choisir un fichier
                </button>
                {file && (
                  <div className="mt-3 text-xs text-stone-500">Fichier sélectionné : <span className="font-medium text-stone-700">{file.name}</span></div>
                )}
              </div>
              <div className="mt-4 flex justify-between">
                <button onClick={() => { setType(null); setStep(1); }}
                  className="px-3 py-1.5 text-sm rounded-lg text-stone-600 hover:bg-stone-100">
                  ← Changer de type
                </button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div className="text-center py-12">
              <div className="inline-block w-10 h-10 border-2 border-stone-200 border-t-stone-900 rounded-full animate-spin"/>
              <p className="mt-4 text-sm font-medium text-stone-800">Analyse du fichier en cours…</p>
              <p className="text-xs text-stone-400 mt-1">{file?.name}</p>
            </div>
          )}

          {step === 4 && parseResult && parseResult.kind === 'bank' && (
            <BankRecap result={parseResult} onUpdate={(updater) =>
              setParseResult(prev => typeof updater === 'function' ? updater(prev) : updater)
            }/>
          )}
          {step === 4 && parseResult && parseResult.kind === 'card' && (
            <CardRecap result={parseResult}/>
          )}
        </div>

        {step === 4 && (() => {
          const newCount = parseResult?.kind === 'bank'
            ? (parseResult.matched?.length || 0)
              + (parseResult.unmatched?.length || 0)
              + (parseResult.cardDebits?.length || 0)
              + (parseResult.ignored?.length || 0)
            : (parseResult?.kind === 'card' ? (parseResult.cards?.length || 0) : null);
          const disabled = newCount === 0;
          return (
            <footer className="px-5 py-3 border-t border-stone-200 flex items-center justify-end gap-2">
              <button onClick={cancelAll}
                className="px-3 py-1.5 text-sm rounded-lg ring-1 ring-stone-200 hover:bg-stone-50">
                Annuler
              </button>
              <button onClick={confirmImport} disabled={disabled}
                className={
                  "px-3 py-1.5 text-sm rounded-lg " +
                  (disabled
                    ? "bg-stone-200 text-stone-400 cursor-not-allowed"
                    : "bg-stone-900 text-white hover:bg-stone-800")
                }>
                {newCount != null
                  ? (newCount === 0 ? 'Rien à importer' : `Confirmer l'import (${newCount})`)
                  : "Confirmer l'import"}
              </button>
            </footer>
          );
        })()}
      </div>
    </div>
  );
};

/* =========================================================
   App
   ========================================================= */
function App() {
  const today = new Date();
  const [year, setYear]   = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const key = monthKey(year, month);

  const [data, setData] = useState(() => loadMonth(key));
  const [saved, setSaved] = useState(false);
  const [pendingImport, setPendingImport] = useState(null); // { rows, cols }
  const [importToast, setImportToast] = useState(null);
  const [reportModal, setReportModal] = useState(null); // { items, fromKey }
  const [wizardOpen, setWizardOpen] = useState(false);
  const [postsImport, setPostsImport] = useState(null); // { expenses: [...] }
  const [generateOpen, setGenerateOpen] = useState(false);
  const [rulesOpen, setRulesOpen] = useState(false);
  const [history, setHistory] = useState({}); // { [monthKey]: { past:[], future:[] } }
  const [cardsSnapshot, setCardsSnapshot] = useState(() => loadCardsSnapshot());
  const [recurrenceRules, setRecurrenceRules] = useState(() => loadRecurrenceRules());
  const [categories, setCategories] = useState(() => loadCategories());
  const refreshCategories = () => setCategories(loadCategories());
  const addCategory = (cat) => {
    const list = [...loadCategories(), cat];
    saveCategories(list);
    setCategories(list);
  };
  const updateCategory = (id, patch) => {
    const list = loadCategories().map(c => c.id === id ? { ...c, ...patch } : c);
    saveCategories(list);
    setCategories(list);
  };
  const deleteCategory = (id) => {
    const list = loadCategories().filter(c => c.id !== id);
    saveCategories(list);
    setCategories(list);
  };
  const categoriesById = useMemo(() => {
    const m = new Map();
    for (const c of categories) m.set(c.id, c);
    return m;
  }, [categories]);
  const [recurrencesOpen, setRecurrencesOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [exportOpen, setExportOpen] = useState(false);
  const refreshRecurrenceRules = () => setRecurrenceRules(loadRecurrenceRules());
  const rulesById = useMemo(() => {
    const m = new Map();
    for (const r of recurrenceRules) m.set(r.id, r);
    return m;
  }, [recurrenceRules]);
  const postsFileRef = useRef(null);
  const skipNextSave = useRef(true);
  const prevDataRef = useRef(null);

  // Mois précédent
  const prevYM = month === 1 ? { y: year - 1, m: 12 } : { y: year, m: month - 1 };
  const prevKey = monthKey(prevYM.y, prevYM.m);
  const prevData = useMemo(() => loadMonth(prevKey), [prevKey, saved]);
  const hasPrevMonth = (prevData.expenses.length + prevData.incomes.length) > 0;
  const prevEndBalance = useMemo(() => {
    const opening  = Number(prevData.openingBalance) || 0;
    const received = prevData.incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
    const paid     = prevData.expenses.reduce((s, e) => s + (Number(e.paid)    || 0), 0);
    return opening + received - paid;
  }, [prevData]);
  const prevLabel = monthLabel(prevYM.y, prevYM.m);

  // Cartes : toutes (sidebar) et celles dont le débit tombe ce mois-ci (table + totaux)
  const cardsAll = useMemo(
    () => Object.entries(cardsSnapshot)
      .map(([cardNumber, c]) => ({ cardNumber, ...c }))
      .sort((a, b) => (a.debitDate || '').localeCompare(b.debitDate || '')),
    [cardsSnapshot]
  );
  const cardsForMonth = useMemo(
    () => cardsAll.filter(c => (c.debitDate || '').slice(0, 7) === key),
    [cardsAll, key]
  );
  const refreshCards = () => setCardsSnapshot(loadCardsSnapshot());

  // Recharger les données quand on change de mois (et générer les récurrences applicables)
  useEffect(() => {
    skipNextSave.current = true;
    const monthData = generateRecurrenceForMonth(year, month);
    refreshRecurrenceRules();
    setData(monthData);
  }, [key]);

  // Auto-save (debounce 500ms) + push history au même moment
  useEffect(() => {
    if (skipNextSave.current) {
      skipNextSave.current = false;
      prevDataRef.current = data;
      return;
    }
    const t = setTimeout(() => {
      saveMonth(key, data);
      setSaved(true);
      const f = setTimeout(() => setSaved(false), 1500);
      // Push history seulement si la modif vient d'une vraie édition
      // (l'undo/redo synchronise prevDataRef → ref-equality bypass)
      if (prevDataRef.current && prevDataRef.current !== data) {
        const prev = prevDataRef.current;
        setHistory(h => ({
          ...h,
          [key]: {
            past:   [...((h[key] && h[key].past) || []), prev].slice(-50),
            future: [],
          },
        }));
      }
      prevDataRef.current = data;
      // Roll-forward automatique sur les mois suivants (max 24 mois,
      // s'arrête au 1er mois manuel ou inexistant en localStorage).
      propagateRollForward(key);
      return () => clearTimeout(f);
    }, 500);
    return () => clearTimeout(t);
  }, [data, key]);

  // Undo / Redo
  const canUndo = !!(history[key] && history[key].past && history[key].past.length > 0);
  const canRedo = !!(history[key] && history[key].future && history[key].future.length > 0);
  const undo = () => {
    const cur = history[key];
    if (!cur || !cur.past.length) return;
    const previous = cur.past[cur.past.length - 1];
    const newPast = cur.past.slice(0, -1);
    const currentData = data;
    prevDataRef.current = previous; // bypass next history push
    setData(previous);
    setHistory(h => ({
      ...h,
      [key]: { past: newPast, future: [currentData, ...(cur.future || [])] },
    }));
  };
  const redo = () => {
    const cur = history[key];
    if (!cur || !cur.future.length) return;
    const nextState = cur.future[0];
    const newFuture = cur.future.slice(1);
    const currentData = data;
    prevDataRef.current = nextState;
    setData(nextState);
    setHistory(h => ({
      ...h,
      [key]: { past: [...(cur.past || []), currentData], future: newFuture },
    }));
  };

  // Raccourcis clavier
  useEffect(() => {
    const handler = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const t = e.target;
      const isField = t && (
        t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable
      );
      const k = e.key.toLowerCase();
      if (k === 'z') {
        if (isField) return; // laisser le navigateur gérer l'undo texte dans les champs
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      } else if (k === 'y') {
        if (isField) return;
        e.preventDefault();
        redo();
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [history, key, data]);

  // Navigation
  const prev = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); }
    else setMonth(m => m - 1);
  };
  const next = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); }
    else setMonth(m => m + 1);
  };

  // CRUD - Expenses
  const addExpense = () => setData(d => ({
    ...d,
    expenses: [{
      id: uid(), name: '', type: '', amount: 0, day: 1, mode: 'bank', cardNumber: '', notes: '', paid: 0,
    }, ...d.expenses],
  }));
  const updateExpense = (id, patch) => setData(d => ({
    ...d, expenses: d.expenses.map(e => e.id === id ? { ...e, ...patch } : e),
  }));
  const removeExpense = (id) => setData(d => ({ ...d, expenses: d.expenses.filter(e => e.id !== id) }));
  const removeManyExpenses = (ids) => {
    const set = new Set(ids);
    setData(d => ({ ...d, expenses: d.expenses.filter(e => !set.has(e.id)) }));
  };

  // CRUD - Incomes
  const addIncome = () => setData(d => ({
    ...d,
    incomes: [{ id: uid(), name: '', amount: 0, day: 1, received: 0 }, ...d.incomes],
  }));
  const updateIncome = (id, patch) => setData(d => ({
    ...d, incomes: d.incomes.map(i => i.id === id ? { ...i, ...patch } : i),
  }));
  const removeIncome = (id) => setData(d => ({ ...d, incomes: d.incomes.filter(i => i.id !== id) }));
  const removeManyIncomes = (ids) => {
    const set = new Set(ids);
    setData(d => ({ ...d, incomes: d.incomes.filter(i => !set.has(i.id)) }));
  };

  const patchData = (patch) => setData(d => ({ ...d, ...patch }));

  // ---- Import Excel ----
  const applyImport = (rows, colIdx) => {
    const { expenses, incomes } = parseSheetToMonth(rows, colIdx);
    if (expenses.length === 0 && incomes.length === 0) {
      alert("Aucune ligne exploitable détectée dans cette colonne.");
      return;
    }
    if (data.expenses.length || data.incomes.length) {
      const ok = confirm(
        `Le mois actuel contient déjà ${data.expenses.length} dépense(s) et ${data.incomes.length} encaissement(s). ` +
        `Remplacer par ${expenses.length} dépense(s) et ${incomes.length} encaissement(s) ?`
      );
      if (!ok) return;
    }
    setData(d => ({ ...d, expenses, incomes }));
    setImportToast(`${expenses.length} dépenses · ${incomes.length} encaissements importés`);
    setTimeout(() => setImportToast(null), 3000);
  };

  const handleImportFile = (rows) => {
    const cols = detectMonthColumns(rows);
    if (cols.length === 0) {
      alert("Aucune colonne de montants détectée dans ce fichier.");
      return;
    }
    if (cols.length === 1) {
      applyImport(rows, cols[0].index);
    } else {
      setPendingImport({ rows, cols });
    }
  };

  const handleChooseColumn = (colIdx) => {
    if (!pendingImport) return;
    applyImport(pendingImport.rows, colIdx);
    setPendingImport(null);
  };

  // ---- Sauvegarde / restauration JSON ----
  const exportBackup = () => {
    const dump = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('month:')) continue;
      try { dump[k] = JSON.parse(localStorage.getItem(k)); }
      catch { dump[k] = localStorage.getItem(k); }
    }
    const payload = {
      app: 'cashflow',
      version: 1,
      exportedAt: new Date().toISOString(),
      data: dump,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cashflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setImportToast(`Sauvegarde : ${Object.keys(dump).length} mois exportés`);
    setTimeout(() => setImportToast(null), 3000);
  };

  const restoreBackup = async (file) => {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const months = parsed?.data && typeof parsed.data === 'object' ? parsed.data : null;
      if (!months) { alert("Format de sauvegarde invalide."); return; }
      const monthKeys = Object.keys(months).filter(k => k.startsWith('month:'));
      if (monthKeys.length === 0) { alert("Aucun mois trouvé dans le fichier."); return; }
      if (!confirm(`Restaurer ${monthKeys.length} mois ? Les données existantes pour ces mois seront écrasées.`)) return;
      for (const k of monthKeys) {
        localStorage.setItem(k, JSON.stringify(months[k]));
      }
      skipNextSave.current = true;
      setData(loadMonth(key));
      setImportToast(`Restauration : ${monthKeys.length} mois importés`);
      setTimeout(() => setImportToast(null), 3000);
    } catch (err) {
      alert("Impossible de lire le fichier : " + err.message);
    }
  };

  // ---- Postes : export / import Excel (mois courant) ----
  const exportPostsExcel = () => {
    if (data.expenses.length === 0) {
      alert("Aucun poste à exporter pour ce mois.");
      return;
    }
    exportExpensesToExcel(data.expenses, key);
    setImportToast(`Export : ${data.expenses.length} postes (postes-${key}.xlsx)`);
    setTimeout(() => setImportToast(null), 3000);
  };

  const handlePostsFile = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (!f) return;
    try {
      const imported = await parseExpensesFromExcel(f);
      if (imported.length === 0) {
        alert("Aucun poste détecté dans le fichier.");
        return;
      }
      if (data.expenses.length === 0) {
        setData(d => ({ ...d, expenses: imported }));
        setImportToast(`${imported.length} poste${imported.length > 1 ? 's' : ''} importé${imported.length > 1 ? 's' : ''}`);
        setTimeout(() => setImportToast(null), 3000);
      } else {
        setPostsImport({ expenses: imported });
      }
    } catch (err) {
      alert("Erreur d'import : " + err.message);
    }
  };

  const applyPostsAppend = () => {
    if (!postsImport) return;
    const list = postsImport.expenses;
    setData(d => ({ ...d, expenses: [...list, ...d.expenses] }));
    setImportToast(`${list.length} poste${list.length > 1 ? 's' : ''} ajouté${list.length > 1 ? 's' : ''}`);
    setTimeout(() => setImportToast(null), 3000);
    setPostsImport(null);
  };
  const applyPostsReplace = () => {
    if (!postsImport) return;
    const list = postsImport.expenses;
    setData(d => ({ ...d, expenses: list }));
    setImportToast(`${list.length} poste${list.length > 1 ? 's' : ''} importé${list.length > 1 ? 's' : ''} (remplacement)`);
    setTimeout(() => setImportToast(null), 3000);
    setPostsImport(null);
  };

  // ---- Effacer l'index d'imports (banque + cartes) ----
  const clearAllImports = () => {
    const idx = loadImportedTx();
    const cards = loadCardsSnapshot();
    const txCount = Object.keys(idx).length;
    const cardCount = Object.keys(cards).length;
    if (txCount === 0 && cardCount === 0) {
      alert("Aucune transaction importée à effacer.");
      return;
    }
    if (!confirm(
      `Effacer ${txCount} transaction${txCount > 1 ? 's' : ''} et ${cardCount} snapshot${cardCount > 1 ? 's' : ''} de cartes ?\n\n` +
      `Les postes déjà créés dans vos mois ne sont pas concernés. ` +
      `Cette action permet de réimporter le même fichier comme s'il n'avait jamais été importé.`
    )) return;
    localStorage.removeItem('transactions:imported');
    localStorage.removeItem('cards:current');
    refreshCards();
    setImportToast(`Index effacé (${txCount} transaction${txCount > 1 ? 's' : ''}, ${cardCount} carte${cardCount > 1 ? 's' : ''})`);
    setTimeout(() => setImportToast(null), 3000);
  };

  // ---- Créer postes depuis transactions sélectionnées ----
  const applyCreatePostsFromTxs = (selectedTxs, mode, targetMonthKey) => {
    const target = targetMonthKey || key;
    const outs = selectedTxs.filter(t => Number(t.amount) > 0);
    const ins  = selectedTxs.filter(t => Number(t.amount) < 0);

    const outGroups = groupTxsForMode(outs, mode);
    const inGroups  = groupTxByDescription(ins);

    const newExpenses = outGroups.map(g => ({
      id: uid(),
      name: g.name,
      type: '',
      amount: Math.round(g.totalAmount),
      day: parseInt((g.firstDate || '').slice(8, 10), 10) || 1,
      mode,
      cardNumber: g.cardNumber || '',
      notes: '',
      paid: Math.round(g.totalAmount),
    }));
    const newIncomes = inGroups.map(g => ({
      id: uid(),
      name: g.name,
      amount: Math.round(g.totalAmount),
      day: parseInt((g.firstDate || '').slice(8, 10), 10) || 1,
      received: Math.round(g.totalAmount),
    }));

    const total = newExpenses.length + newIncomes.length;
    if (total === 0) { setGenerateOpen(false); return; }

    if (target === key) {
      // Mois courant : passe par setData → save + history normaux
      setData(d => ({
        ...d,
        expenses: [...newExpenses, ...d.expenses],
        incomes:  [...newIncomes,  ...d.incomes],
      }));
    } else {
      // Autre mois : écriture directe en localStorage
      const monthData = loadMonth(target);
      monthData.expenses = [...newExpenses, ...monthData.expenses];
      monthData.incomes  = [...newIncomes,  ...monthData.incomes];
      saveMonth(target, monthData);
    }

    setGenerateOpen(false);
    const [ty, tm] = target.split('-').map(Number);
    const targetLabel = monthLabel(ty, tm);
    const modeLabel = mode === 'card' ? 'carte' : 'banque';
    setImportToast(`${total} poste${total > 1 ? 's' : ''} créé${total > 1 ? 's' : ''} en ${modeLabel} dans ${targetLabel} (${newExpenses.length} sortie${newExpenses.length > 1 ? 's' : ''} · ${newIncomes.length} entrée${newIncomes.length > 1 ? 's' : ''})`);
    setTimeout(() => setImportToast(null), 3000);
  };

  // ---- Reporter non-payés ----
  const openReportModal = () => {
    const prev = loadMonth(prevKey);
    const unpaid = prev.expenses.filter(e => {
      const remaining = (Number(e.amount) || 0) - (Number(e.paid) || 0);
      return remaining > 0;
    });
    if (unpaid.length === 0) {
      alert("Tous les postes du mois précédent ont été payés.");
      return;
    }
    setReportModal({ items: unpaid, fromKey: prevKey });
  };

  const applyReportUnpaid = (selectedIds) => {
    if (!reportModal) return;
    const set = new Set(selectedIds);
    const fromKey = reportModal.fromKey;
    const newExpenses = reportModal.items
      .filter(it => set.has(it.id))
      .map(it => ({
        id: uid(),
        name: it.name,
        type: it.type || '',
        amount: Math.max(0, (Number(it.amount) || 0) - (Number(it.paid) || 0)),
        day: it.day,
        mode: it.mode,
        cardNumber: it.cardNumber || '',
        notes: it.notes || '',
        paid: 0,
        reportedFrom: fromKey,
      }));
    setData(d => ({ ...d, expenses: [...newExpenses, ...d.expenses] }));
    setReportModal(null);
    setImportToast(`${newExpenses.length} poste${newExpenses.length > 1 ? 's' : ''} reporté${newExpenses.length > 1 ? 's' : ''}`);
    setTimeout(() => setImportToast(null), 3000);
  };

  // ---- Copier mois précédent ----
  const applyCopyPrev = () => {
    const prev = loadMonth(prevKey);
    if (prev.expenses.length === 0 && prev.incomes.length === 0) {
      alert("Aucune donnée pour le mois précédent.");
      return;
    }
    const expenses = prev.expenses.map(e => ({
      id: uid(),
      name: e.name,
      type: e.type || '',
      amount: Number(e.amount) || 0,
      day: e.day,
      mode: e.mode,
      cardNumber: e.cardNumber || '',
      notes: e.notes || '',
      paid: 0,
    }));
    const incomes = prev.incomes.map(i => ({
      id: uid(),
      name: i.name,
      amount: Number(i.amount) || 0,
      day: i.day,
      received: 0,
    }));
    setData(d => ({
      ...d,
      openingBalance: 0,
      targetBalance: Number(prev.targetBalance) || 0,
      expenses,
      incomes,
    }));
    setImportToast(`Mois précédent copié : ${expenses.length} dépenses · ${incomes.length} encaissements`);
    setTimeout(() => setImportToast(null), 3000);
  };

  // Computations
  const totals = useMemo(() => {
    // Anti-double-comptage : si une carte du mois courant est dans cards:current,
    // les expenses mode='card' avec ce cardNumber sont "informatives" et NE
    // comptent PAS — elles sont remplacées par la ligne synthétique de la carte.
    const cardsByNumber = new Map(cardsForMonth.map(c => [String(c.cardNumber), c]));
    const isGrouped = (e) => e.mode === 'card' && cardsByNumber.has(String(e.cardNumber));

    let expPlanned = 0, expPaid = 0;
    for (const e of data.expenses) {
      if (isGrouped(e)) continue;
      expPlanned += Number(e.amount) || 0;
      expPaid    += Number(e.paid)   || 0;
    }
    for (const c of cardsForMonth) {
      const amt = Number(c.upcomingAmount) || 0;
      expPlanned += amt;
      if (c.paidAt) expPaid += amt;
    }
    const expRemaining = expPlanned - expPaid;
    const incPlanned   = data.incomes.reduce((s, i) => s + (Number(i.amount)   || 0), 0);
    const incReceived  = data.incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
    const incRemaining = incPlanned - incReceived;
    const opening      = Number(data.openingBalance) || 0;
    const unaffected   = Number(data.unaffectedExpenses) || 0;
    const current      = opening + incReceived - expPaid - unaffected;
    const projected    = current + incRemaining - expRemaining;
    const target       = Number(data.targetBalance) || 0;
    const additionalNeeded = Math.max(0, target - projected);
    // Variances : écart entre réel et prévu, sur les lignes effectivement payées/reçues
    // Les expenses regroupées sous une carte sont exclues (elles sont remplacées par la synthétique).
    let varExp = 0, varExpCount = 0;
    for (const e of data.expenses) {
      if (isGrouped(e)) continue;
      const p = Number(e.paid) || 0, a = Number(e.amount) || 0;
      if (p > 0) { varExp += (p - a); varExpCount++; }
    }
    let varInc = 0, varIncCount = 0;
    for (const i of data.incomes) {
      const r = Number(i.received) || 0, a = Number(i.amount) || 0;
      if (r > 0) { varInc += (r - a); varIncCount++; }
    }
    return { expPlanned, expPaid, expRemaining, incPlanned, incReceived, incRemaining,
             opening, unaffected, current, projected, target, additionalNeeded,
             varExp, varExpCount, varInc, varIncCount };
  }, [data, cardsForMonth]);

  const isEmpty = data.expenses.length === 0 && data.incomes.length === 0;

  return (
    <div className="min-h-screen">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">
        <Header year={year} month={month} onPrev={prev} onNext={next} saved={saved}
                onImportFile={handleImportFile}
                onExportBackup={exportBackup}
                onRestoreBackup={restoreBackup}
                onOpenImportWizard={() => setWizardOpen(true)}
                onUndo={undo} onRedo={redo}
                canUndo={canUndo} canRedo={canRedo}
                onGenerateFromImports={() => setGenerateOpen(true)}
                onClearImports={clearAllImports}
                onOpenRules={() => setRulesOpen(true)}
                onOpenRecurrences={() => setRecurrencesOpen(true)}
                onOpenSettings={() => setSettingsOpen(true)}
                onOpenExport={() => setExportOpen(true)}/>

        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_360px] gap-6">
          <main className="space-y-6 min-w-0">
            <CashflowChartSection
              year={year} month={month}
              openingBalance={data.openingBalance}
              expenses={data.expenses}
              incomes={data.incomes}
              cardsForMonth={cardsForMonth}
            />
            {isEmpty ? (
              <EmptyState
                onManual={addExpense}
                onCopyPrev={applyCopyPrev}
                onReportUnpaid={openReportModal}
                onImportFile={handleImportFile}
                hasPrevMonth={hasPrevMonth}
                onGenerateFromImports={() => setGenerateOpen(true)}
              />
            ) : (
              <>
                <ExpensesTable
                  expenses={data.expenses}
                  onAdd={addExpense}
                  onUpdate={updateExpense}
                  onRemove={removeExpense}
                  onRemoveMany={removeManyExpenses}
                  onReportUnpaid={openReportModal}
                  hasPrevMonth={hasPrevMonth}
                  onExportExcel={exportPostsExcel}
                  onImportExcel={() => postsFileRef.current?.click()}
                  cardsForMonth={cardsForMonth}
                  rulesById={rulesById}
                  categories={categories}
                  categoriesById={categoriesById}
                  onAddCategory={addCategory}
                />
                <IncomesTable
                  incomes={data.incomes}
                  onAdd={addIncome}
                  onUpdate={updateIncome}
                  onRemove={removeIncome}
                  onRemoveMany={removeManyIncomes}
                  rulesById={rulesById}
                />
              </>
            )}
          </main>

          <Sidebar data={data} totals={totals} onPatch={patchData}
                   prevEndBalance={prevEndBalance}
                   prevLabel={hasPrevMonth ? prevLabel : null}
                   cardsAll={cardsAll}
                   cardsForMonth={cardsForMonth}
                   categoriesById={categoriesById}/>
        </div>

        <footer className="mt-10 pt-6 border-t border-stone-200 text-xs text-stone-400 text-center">
          Données stockées localement dans votre navigateur (localStorage).
          Clé du mois en cours : <code className="font-mono">month:{key}</code>
        </footer>
      </div>

      <ImportModal
        pending={pendingImport}
        onChoose={handleChooseColumn}
        onCancel={() => setPendingImport(null)}
      />

      <ReportUnpaidModal
        open={!!reportModal}
        items={reportModal?.items || []}
        fromKey={reportModal?.fromKey}
        toLabel={monthLabel(year, month)}
        onCancel={() => setReportModal(null)}
        onConfirm={applyReportUnpaid}
      />

      <input ref={postsFileRef} type="file" accept=".xlsx,.xls,.csv"
        onChange={handlePostsFile} className="hidden"/>

      <ImportPostsModal
        open={!!postsImport}
        count={postsImport?.expenses.length || 0}
        currentCount={data.expenses.length}
        onCancel={() => setPostsImport(null)}
        onAppend={applyPostsAppend}
        onReplace={applyPostsReplace}
      />

      <ImportedTransactionsModal
        open={generateOpen}
        currentMonthKey={key}
        onClose={() => setGenerateOpen(false)}
        onCreate={applyCreatePostsFromTxs}
        onDeleted={(n) => {
          setImportToast(`${n} transaction${n > 1 ? 's' : ''} supprimée${n > 1 ? 's' : ''} de l'index`);
          setTimeout(() => setImportToast(null), 3000);
        }}
      />

      <SettingsModal
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        onOpenRules={() => setRulesOpen(true)}
      />

      <ExportOptionsModal
        open={exportOpen}
        onClose={() => setExportOpen(false)}
        monthLabelStr={monthLabel(year, month)}
        onConfirm={({ mode, sections }) => {
          const chartMode = loadSetting('chartMode', 'mixed');
          const threshold = Number(loadSetting('alertThreshold', 30000)) || 0;
          const series = computeDailySeries({
            openingBalance: data.openingBalance,
            expenses: data.expenses, incomes: data.incomes,
            cardsForMonth, mode: chartMode, year, month,
          });
          const cabinet = {
            name:    loadSetting('cabinetName', ''),
            address: loadSetting('cabinetAddress', ''),
          };
          const html = buildReportHTML({
            monthKey: key, year, month, data, totals,
            cardsForMonth, categoriesById,
            series, threshold, cabinet, sections,
          });
          if (mode === 'print') {
            openPrintPreview(html);
          } else {
            const fileName = `Rapport_${monthLabel(year, month).replace(/\s+/g, '_')}.pdf`;
            exportPDFFromHTML(html, fileName);
          }
          setExportOpen(false);
        }}
      />

      <RulesModal
        open={rulesOpen}
        onClose={() => setRulesOpen(false)}
      />

      <RecurrencesModal
        open={recurrencesOpen}
        onClose={() => setRecurrencesOpen(false)}
        defaultYear={year} defaultMonth={month}
        categories={categories}
        onChanged={() => {
          refreshRecurrenceRules();
          // Régénérer pour le mois courant si une nouvelle règle s'applique
          skipNextSave.current = true;
          const md = generateRecurrenceForMonth(year, month);
          setData(md);
        }}
      />

      <ImportWizard
        open={wizardOpen}
        onClose={() => setWizardOpen(false)}
        onConfirmImport={(result) => {
          if (result?.kind === 'bank') {
            const importedAt = new Date().toISOString();

            // 1) Charger chaque mois affecté en cache (lecture unique)
            const monthCache = new Map();
            const ensureMonth = (k) => {
              if (!monthCache.has(k)) monthCache.set(k, loadMonth(k));
              return monthCache.get(k);
            };

            // 2) Appliquer chaque match (existant ou nouveau)
            for (const m of result.matched || []) {
              const monthData = ensureMonth(m.monthKey);
              const applied = Number(m.appliedAmount) || 0;

              if (m.kind === 'expense') {
                if (m.expenseId) {
                  monthData.expenses = monthData.expenses.map(e => {
                    if (e.id !== m.expenseId) return e;
                    const amt = Number(e.amount) || 0;
                    const cap = amt > 0 ? amt * 1.5 : Infinity;
                    const newPaid = (Number(e.paid) || 0) + applied;
                    return { ...e, paid: Math.min(newPaid, cap) };
                  });
                } else if (m.expenseDraft) {
                  const d = m.expenseDraft;
                  monthData.expenses = [{
                    id: uid(),
                    name: d.name,
                    type: d.type || '',
                    category: d.category || null,
                    amount: Number(d.amount) || 0,
                    day: Number(d.day) || 1,
                    mode: d.mode || 'bank',
                    cardNumber: d.cardNumber || '',
                    notes: '',
                    paid: applied,
                  }, ...monthData.expenses];
                }
              } else if (m.kind === 'income') {
                if (m.incomeId) {
                  monthData.incomes = monthData.incomes.map(i => {
                    if (i.id !== m.incomeId) return i;
                    const amt = Number(i.amount) || 0;
                    const cap = amt > 0 ? amt * 1.5 : Infinity;
                    const newReceived = (Number(i.received) || 0) + applied;
                    return { ...i, received: Math.min(newReceived, cap) };
                  });
                } else if (m.incomeDraft) {
                  const d = m.incomeDraft;
                  monthData.incomes = [{
                    id: uid(),
                    name: d.name,
                    category: d.category || null,
                    amount: Number(d.amount) || 0,
                    day: Number(d.day) || 1,
                    received: applied,
                  }, ...monthData.incomes];
                }
              }
            }

            // 3) Persister chaque mois modifié (last-write-wins)
            for (const [k, d] of monthCache) {
              try { saveMonth(k, d); }
              catch (err) { console.error('saveMonth', k, err); }
            }

            // 4) Si le mois courant a été modifié, rafraîchir l'état React
            if (monthCache.has(key)) {
              skipNextSave.current = true;
              setData(monthCache.get(key));
            }

            // 5) Indexer TOUTES les nouvelles transactions (matched + unmatched + ignored + cardDebits)
            //    pour la déduplication des imports futurs.
            const idx = loadImportedTx();
            const allNew = [
              ...(result.matched   || []).map(m => m.transaction),
              ...(result.unmatched || []),
              ...(result.ignored   || []),
              ...(result.cardDebits|| []),
            ];
            for (const t of allNew) {
              if (!t?.referenceKey) continue;
              idx[t.referenceKey] = {
                date: t.date,
                amount: t.amount,
                description: t.description,
                details: t.details || '',
                importedAt,
                monthKey: t.date.slice(0, 7),
              };
            }
            saveImportedTx(idx);

            // Auto-match du débit groupé : pour chaque tx 'card-debit', chercher
            // une carte dans cards:current avec cardNumber=reference, debitDate ±2j,
            // amount à ±10%. Si match, marquer paidAt.
            const cardsSnap = loadCardsSnapshot();
            let cardsTouched = false;
            for (const cd of (result.cardDebits || [])) {
              const cardNum = String(cd.cardNumber || cd.reference || '');
              const c = cardsSnap[cardNum];
              if (!c || c.paidAt) continue;
              const dDate = new Date(c.debitDate), tDate = new Date(cd.date);
              const dayDiff = Math.abs((tDate - dDate) / 86400000);
              if (dayDiff > 2) continue;
              const upcoming = Number(c.upcomingAmount) || 0;
              const ratio = upcoming > 0
                ? Math.abs((Number(cd.debit) || 0) - upcoming) / upcoming
                : 1;
              if (ratio > 0.10) continue;
              cardsSnap[cardNum] = { ...c, paidAt: cd.date };
              cardsTouched = true;
            }
            if (cardsTouched) {
              saveCardsSnapshot(cardsSnap);
              refreshCards();
            }

            // Update rule hit counters
            if (result.ruleHits && Object.keys(result.ruleHits).length > 0) {
              const rules = loadMatchRules();
              let touched = false;
              for (const r of rules) {
                const h = result.ruleHits[r.id];
                if (h) { r.hitCount = (Number(r.hitCount) || 0) + h; touched = true; }
              }
              if (touched) saveMatchRules(rules);
            }

            const total    = allNew.length;
            const matched  = (result.matched || []).length;
            setImportToast(`${total} transaction${total > 1 ? 's' : ''} importée${total > 1 ? 's' : ''} · ${matched} matchée${matched > 1 ? 's' : ''}`);
          } else if (result?.kind === 'card') {
            const importedAt = new Date().toISOString();
            const snap = loadCardsSnapshot();
            for (const c of (result.cards || [])) {
              snap[c.cardNumber] = {
                upcomingAmount: c.upcomingAmount,
                debitDate: c.debitDate,
                lastImportedAt: importedAt,
                paidAt: undefined,
              };
            }
            saveCardsSnapshot(snap);
            refreshCards();
            const n = (result.cards || []).length;
            setImportToast(`${n} carte${n > 1 ? 's' : ''} mise${n > 1 ? 's' : ''} à jour`);
          }
          setTimeout(() => setImportToast(null), 3000);
        }}
      />

      {importToast && (
        <div className="fixed bottom-4 right-4 z-50 bg-emerald-600 text-white text-sm px-4 py-2 rounded-lg shadow-lg flex items-center gap-2">
          <Check className="w-4 h-4"/>{importToast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
