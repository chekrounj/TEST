    if (sourceFilter === 'bank') list = list.filter(t => !isCardDebit(t.description));
    if (sourceFilter === 'card') list = list.filter(t =>  isCardDebit(t.description));
    if (dirFilter === 'out') list = list.filter(t => Number(t.amount) > 0);
    if (dirFilter === 'in')  list = list.filter(t => Number(t.amount) < 0);
    if (sort.by) {
      const valueOf = (t, f) => {
        if (f === 'date')   return t.date;
        if (f === 'amount') return Math.abs(Number(t.amount) || 0);
        if (f === 'name')   return (t.description || '') + ' ' + (t.details || '');
        return t[f];
      };
      list = sortRows(list, sort, valueOf);
    } else {
      list.sort((a, b) => a.date.localeCompare(b.date));
    }
    return list;
  }, [allTxList, monthFilter, sourceFilter, dirFilter, sort]);

  const toggleOne = (refKey) => setSelected(prev => {
    const next = new Set(prev);
    next.has(refKey) ? next.delete(refKey) : next.add(refKey);
    return next;
  });
  const allSelected = filtered.length > 0 && filtered.every(t => selected.has(t.refKey));
  const toggleAll = () => setSelected(prev => {
    const next = new Set(prev);
    if (allSelected) for (const t of filtered) next.delete(t.refKey);
    else             for (const t of filtered) next.add(t.refKey);
    return next;
  });

  const selectedTxs = filtered.filter(t => selected.has(t.refKey));
  const selectedTotal = selectedTxs.reduce((s, t) => s + Math.abs(Number(t.amount) || 0), 0);

  const handleDelete = () => {
    if (selected.size === 0) return;
    const n = selected.size;
    if (!confirm(`Supprimer ${n} transaction${n > 1 ? 's' : ''} de l'index d'import ?\n\nVous pourrez les réimporter ensuite (elles ne seront plus considérées comme des doublons).`)) return;
    const idx = loadImportedTx();
    for (const refKey of selected) delete idx[refKey];
    saveImportedTx(idx);
    setAllTxs(idx);
    setSelected(new Set());
    onDeleted && onDeleted(n);
  };

  const monthIdx = availableMonths.indexOf(monthFilter);
  const goPrev = () => { if (monthIdx >= 0 && monthIdx < availableMonths.length - 1) {
    setMonthFilter(availableMonths[monthIdx + 1]); setSelected(new Set()); }};
  const goNext = () => { if (monthIdx > 0) {
    setMonthFilter(availableMonths[monthIdx - 1]); setSelected(new Set()); }};

  if (!open) return null;
  const targetLabel = (() => {
    if (!monthFilter) return '—';
    const [y, m] = monthFilter.split('-').map(Number);
    return monthLabel(y, m);
  })();

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl ring-1 ring-stone-200 w-full max-w-3xl flex flex-col max-h-[90vh]"
           onClick={e => e.stopPropagation()}>
        <header className="px-5 py-4 border-b border-stone-200 flex items-center justify-between gap-3 flex-wrap">
          <div className="min-w-0">
            <h3 className="font-semibold text-stone-900 text-lg">Transactions bancaires importées</h3>
            <p className="text-xs text-stone-500 mt-0.5">
              {availableMonths.length === 0
                ? "Aucune transaction indexée. Importez d'abord un relevé Hapoalim."
                : `${availableMonths.length} mois disponible${availableMonths.length > 1 ? 's' : ''} · les postes seront créés dans ${targetLabel}`}
            </p>
          </div>
          {availableMonths.length > 0 && (
            <div className="inline-flex items-center bg-white ring-1 ring-stone-200 rounded-lg overflow-hidden">
              <button onClick={goPrev} disabled={monthIdx === availableMonths.length - 1}
                className="p-1.5 text-stone-600 hover:bg-stone-50 disabled:text-stone-300 disabled:cursor-not-allowed">
                <ChevronLeft className="w-4 h-4"/>
              </button>
              <select value={monthFilter}
                onChange={e => { setMonthFilter(e.target.value); setSelected(new Set()); }}
                className="px-3 py-1 text-sm font-medium text-stone-900 bg-transparent outline-none cursor-pointer">
                {availableMonths.map(m => {
                  const [y, mm] = m.split('-').map(Number);
                  return <option key={m} value={m}>{monthLabel(y, mm)}</option>;
                })}
              </select>
              <button onClick={goNext} disabled={monthIdx <= 0}
                className="p-1.5 text-stone-600 hover:bg-stone-50 disabled:text-stone-300 disabled:cursor-not-allowed">
                <ChevronRight className="w-4 h-4"/>
              </button>
            </div>
          )}
        </header>

        <div className="px-5 py-3 border-b border-stone-100 flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-1.5">
            <span className="text-xs uppercase tracking-wide text-stone-500 font-medium mr-1">Source</span>
            <Pill active={sourceFilter === 'all'}  onClick={() => setSourceFilter('all')}>Toutes</Pill>
            <Pill active={sourceFilter === 'bank'} onClick={() => setSourceFilter('bank')}>Banque</Pill>
            <Pill active={sourceFilter === 'card'} onClick={() => setSourceFilter('card')}>Cartes</Pill>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="text-xs uppercase tracking-wide text-stone-500 font-medium mr-1">Direction</span>
            <Pill active={dirFilter === 'all'} onClick={() => setDirFilter('all')}>Toutes</Pill>
            <Pill active={dirFilter === 'out'} onClick={() => setDirFilter('out')}>Sorties</Pill>
            <Pill active={dirFilter === 'in'}  onClick={() => setDirFilter('in')}>Entrées</Pill>
          </div>
        </div>

        <div className="flex-1 overflow-auto">
          <table className="w-full text-sm">
            <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide sticky top-0 z-10">
              <tr>
                <th className="px-3 py-2 w-10">
                  <input type="checkbox" checked={allSelected} disabled={filtered.length === 0}
                    onChange={toggleAll}
                    className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer disabled:cursor-not-allowed"
                    aria-label="Tout sélectionner"/>
                </th>
                <SortableTh field="date"   label="Date"    sort={sort} onSort={onSort} className="text-left w-16"/>
                <SortableTh field="name"   label="Libellé" sort={sort} onSort={onSort} className="text-left"/>
                <SortableTh field="amount" label="Montant" sort={sort} onSort={onSort} className="text-right w-28"/>
              </tr>
            </thead>
            <tbody className="divide-y divide-stone-100">
              {filtered.length === 0 ? (
                <tr><td colSpan="4" className="px-4 py-10 text-center text-sm text-stone-400">
                  Aucune transaction avec ces filtres.
                </td></tr>
              ) : filtered.map(t => {
                const isOut = Number(t.amount) > 0;
                const isCard = isCardDebit(t.description);
                return (
                  <tr key={t.refKey}
                      onClick={() => toggleOne(t.refKey)}
                      className={"hover:bg-stone-50/70 cursor-pointer " + (selected.has(t.refKey) ? "bg-stone-50" : "")}>
                    <td className="px-3 py-1.5">
                      <input type="checkbox" checked={selected.has(t.refKey)}
                        onChange={() => toggleOne(t.refKey)}
                        onClick={e => e.stopPropagation()}
                        className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer"/>
                    </td>
                    <td className="px-2 py-1.5 tabular-nums text-stone-600 text-xs">{fmtDayFR(t.date)}</td>
                    <td className="px-2 py-1.5">
                      <div className="flex items-center gap-1.5 min-w-0">
                        {isCard && <CreditCard className="w-3 h-3 text-violet-500 flex-none"/>}
                        <span className="truncate text-stone-800" dir="auto" title={t.description}>{t.description || '—'}</span>
                      </div>
                      {t.details && (
                        <div className="truncate text-[10px] text-stone-400 mt-0.5" dir="auto" title={t.details}>
                          {t.details}
                        </div>
                      )}
                    </td>
                    <td className={"px-2 py-1.5 text-right tabular-nums font-medium text-xs " +
                      (isOut ? "text-rose-600" : "text-emerald-600")}>
                      {isOut ? '−' : '+'} {formatNum(t.amount)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <footer className="px-5 py-3 border-t border-stone-200 flex items-center justify-between gap-3 flex-wrap">
          <div className="text-sm text-stone-600">
            <span className="font-medium text-stone-900">{selected.size}</span> sélectionnée{selected.size > 1 ? 's' : ''}
            {selected.size > 0 && (
              <> · <span className="tabular-nums font-medium text-stone-900">{formatILS(selectedTotal)}</span></>
            )}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <button onClick={handleDelete} disabled={selected.size === 0}
              title="Supprimer les transactions sélectionnées de l'index (permet de les réimporter)"
              className={"inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg " +
                (selected.size === 0
                  ? "bg-stone-200 text-stone-400 cursor-not-allowed"
                  : "bg-rose-600 text-white hover:bg-rose-700")}>
              <Trash className="w-4 h-4"/>Supprimer ({selected.size})
            </button>
            <button onClick={onClose}
              className="px-3 py-1.5 text-sm rounded-lg ring-1 ring-stone-200 hover:bg-stone-50">
              Fermer
            </button>
            <button onClick={() => onCreate(selectedTxs, 'bank', monthFilter)}
              disabled={selected.size === 0}
              title="Créer des postes mode Banque"
              className={"inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg " +
                (selected.size === 0
                  ? "bg-stone-200 text-stone-400 cursor-not-allowed"
                  : "bg-sky-600 text-white hover:bg-sky-700")}>
              <Building className="w-4 h-4"/>Créer en banque ({selected.size})
            </button>
            <button onClick={() => onCreate(selectedTxs, 'card', monthFilter)}
              disabled={selected.size === 0}
              title="Créer des postes mode Carte"
              className={"inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg " +
                (selected.size === 0
                  ? "bg-stone-200 text-stone-400 cursor-not-allowed"
                  : "bg-violet-600 text-white hover:bg-violet-700")}>
              <CreditCard className="w-4 h-4"/>Créer en carte ({selected.size})
            </button>
          </div>
        </footer>
      </div>
    </div>
  );
};

/* =========================================================
   Daily cashflow chart (intra-month)
   ========================================================= */
// TODO: Si day tombe vendredi/samedi, considérer que le débit/crédit réel a
// lieu le dimanche suivant pour les paiements bancaires (Hapoalim ne traite
// pas le Shabbat). À implémenter quand on aura un calendrier hébraïque
// (lib hebcal).
const computeDailySeries = ({ openingBalance, expenses, incomes, cardsForMonth, mode, year, month }) => {
  const daysInMonth = new Date(year, month, 0).getDate();
  const cardsByNumber = new Map((cardsForMonth || []).map(c => [String(c.cardNumber), c]));
  const ymKey = `${year}-${String(month).padStart(2, '0')}`;

  // events[day] = [{ type, label, amount, isCard? }]
  const events = Array.from({ length: daysInMonth + 1 }, () => []);
  const clampDay = (d) => {
    const n = Math.max(1, Math.min(daysInMonth, Math.round(Number(d) || 1)));
    return n;
  };

  for (const e of expenses) {
    if (e.mode === 'card' && cardsByNumber.has(String(e.cardNumber))) continue; // regroupé sous CB
    const day = clampDay(e.day);
    const amount  = Number(e.amount) || 0;
    const paid    = Number(e.paid)   || 0;
    let value;
    if      (mode === 'real')    value = paid;
    else if (mode === 'planned') value = amount;
    else                         value = paid > 0 ? paid : amount;
    if (value > 0) events[day].push({ type: 'out', label: e.name || '—', amount: value });
  }
  for (const i of incomes) {
    const day = clampDay(i.day);
    const amount   = Number(i.amount)   || 0;
    const received = Number(i.received) || 0;
    let value;
    if      (mode === 'real')    value = received;
    else if (mode === 'planned') value = amount;
    else                         value = received > 0 ? received : amount;
    if (value > 0) events[day].push({ type: 'in', label: i.name || '—', amount: value });
  }
  for (const c of (cardsForMonth || [])) {
    const debitDay = clampDay((c.debitDate || '').slice(8, 10));
    let day = debitDay;
    if (c.paidAt && c.paidAt.slice(0, 7) === ymKey) {
      const pd = parseInt(c.paidAt.slice(8, 10), 10);
      if (pd) day = clampDay(pd);
    }
    if (mode === 'real' && !c.paidAt) continue; // pas de débit réel → on ignore
    const value = Number(c.upcomingAmount) || 0;
    if (value > 0) events[day].push({
      type: 'out', label: `Carte ${c.cardNumber} — débit groupé`,
      amount: value, isCard: true,
    });
  }

  let balance = Number(openingBalance) || 0;
  const series = [];
  for (let d = 1; d <= daysInMonth; d++) {
    for (const ev of events[d]) {
      balance += ev.type === 'in' ? ev.amount : -ev.amount;
    }
    series.push({ day: d, balance, events: events[d] });
  }
  return series;
};

const formatCompactILS = (n) => {
  const sign = n < 0 ? '−' : '';
  const a = Math.abs(n);
  if (a >= 1e6) return sign + '₪' + (a / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return sign + '₪' + Math.round(a / 1e3) + 'k';
  return sign + '₪' + Math.round(a);
};

const niceYTicks = (min, max, target = 5) => {
  const range = max - min;
  if (range <= 0) return [Math.round(min)];
  const rawStep = range / target;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / magnitude;
  let nice;
  if      (norm < 1.5) nice = 1;
  else if (norm < 3)   nice = 2;
  else if (norm < 7)   nice = 5;
  else                 nice = 10;
  const step = nice * magnitude;
  const start = Math.ceil(min / step) * step;
  const ticks = [];
  for (let v = start; v <= max + step * 1e-9; v += step) ticks.push(Math.round(v));
  return ticks;
};

const CashflowChart = ({ series, openingBalance, threshold, year, month }) => {
  const containerRef = useRef(null);
  const [hover, setHover] = useState(null); // { day, x, y }

  const W = 1000, H = 280;
  const PAD = { top: 30, right: 30, bottom: 40, left: 60 };
  const IW = W - PAD.left - PAD.right;
  const IH = H - PAD.top - PAD.bottom;
  const N = series.length;

  // Y range
  const balances = [Number(openingBalance) || 0, ...series.map(s => s.balance)];
  const rawMin = Math.min(0, ...balances);
  const rawMax = Math.max(0, ...balances);
  const rangePad = Math.max((rawMax - rawMin) * 0.1, 1000);
  const yMin = rawMin - rangePad;
  const yMax = rawMax + rangePad;

  const xScale = (day) => PAD.left + ((day - 1) / Math.max(1, N - 1)) * IW;
  const yScale = (val) => PAD.top + ((yMax - val) / (yMax - yMin)) * IH;

  // Path : step-after, démarre avec opening avant le jour 1
  let pathD = `M ${xScale(1)} ${yScale(Number(openingBalance) || 0)}`;
  for (let i = 0; i < N; i++) {
    const s = series[i];
    pathD += ` L ${xScale(s.day)} ${yScale(s.balance)}`;
    if (i < N - 1) pathD += ` L ${xScale(series[i + 1].day)} ${yScale(s.balance)}`;
  }

  const yTicks = niceYTicks(yMin, yMax, 5);
  const xTicks = [1, 5, 10, 15, 20, 25, 30].filter(d => d <= N);
  if (N > 28 && !xTicks.includes(N)) xTicks.push(N);

  // Today
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;
  const todayDay = isCurrentMonth ? today.getDate() : null;

  const handleMove = (e) => {
    const svg = e.currentTarget.ownerSVGElement || e.currentTarget;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const cur = pt.matrixTransform(ctm.inverse());
    const day = Math.max(1, Math.min(N, Math.round(((cur.x - PAD.left) / IW) * Math.max(1, N - 1)) + 1));
    const cont = containerRef.current?.getBoundingClientRect();
    if (!cont) return;
    setHover({ day, x: e.clientX - cont.left, y: e.clientY - cont.top });
  };
  const hideHover = () => setHover(null);

  const hovered = hover ? series[hover.day - 1] : null;
  const balanceColor = (b) => b < 0 ? "text-rose-600"
                              : b < threshold ? "text-amber-600"
                              : "text-emerald-600";

  return (
    <div ref={containerRef} className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" className="w-full h-auto select-none">
        {/* Zones */}
        {(() => {
          const yZero = yScale(0);
          const yThr  = yScale(threshold);
          const top   = PAD.top;
          const bot   = PAD.top + IH;
          const rects = [];
          // Rouge : Y < 0 (sous zéro)
          if (yZero < bot) rects.push(
            <rect key="r" x={PAD.left} y={Math.max(top, yZero)}
              width={IW} height={Math.max(0, bot - Math.max(top, yZero))}
              fill="#fecdd3" opacity="0.4"/>
          );
          // Ambre : 0 ≤ Y < threshold
          const ambTop = Math.max(top, yThr);
          const ambBot = Math.min(bot, yZero);
          if (ambBot > ambTop) rects.push(
            <rect key="a" x={PAD.left} y={ambTop} width={IW} height={ambBot - ambTop}
              fill="#fde68a" opacity="0.3"/>
          );
          // Vert : Y ≥ threshold
          const grnTop = top;
          const grnBot = Math.min(bot, yThr);
          if (grnBot > grnTop) rects.push(
            <rect key="g" x={PAD.left} y={grnTop} width={IW} height={grnBot - grnTop}
              fill="#a7f3d0" opacity="0.2"/>
          );
          return rects;
        })()}

        {/* Grille horizontale + labels Y */}
        {yTicks.map(t => (
          <g key={'y' + t}>
            <line x1={PAD.left} y1={yScale(t)} x2={PAD.left + IW} y2={yScale(t)}
              stroke="#e7e5e4" strokeWidth="0.5"/>
            <text x={PAD.left - 8} y={yScale(t)} textAnchor="end" dominantBaseline="middle"
              fontSize="11" fill="#78716c">{formatCompactILS(t)}</text>
          </g>
        ))}

        {/* Axe X labels */}
        {xTicks.map(d => (
          <g key={'x' + d}>
            <line x1={xScale(d)} y1={PAD.top + IH} x2={xScale(d)} y2={PAD.top + IH + 4}
              stroke="#a8a29e" strokeWidth="0.5"/>
            <text x={xScale(d)} y={PAD.top + IH + 18} textAnchor="middle"
              fontSize="11" fill="#78716c">{d}</text>
          </g>
        ))}

        {/* Ligne de seuil */}
        <line x1={PAD.left} y1={yScale(threshold)} x2={PAD.left + IW} y2={yScale(threshold)}
          stroke="#d97706" strokeDasharray="3 3" strokeWidth="1"/>
        <text x={PAD.left + IW} y={yScale(threshold) - 4} textAnchor="end"
          fontSize="10" fill="#b45309">Seuil {formatCompactILS(threshold)}</text>

        {/* Zéro */}
        <line x1={PAD.left} y1={yScale(0)} x2={PAD.left + IW} y2={yScale(0)}
          stroke="#78716c" strokeWidth="1"/>

        {/* Aujourd'hui */}
        {todayDay && (
          <g>
            <line x1={xScale(todayDay)} y1={PAD.top} x2={xScale(todayDay)} y2={PAD.top + IH}
              stroke="#a8a29e" strokeWidth="1" strokeDasharray="2 4"/>
            <text x={xScale(todayDay)} y={PAD.top - 8} textAnchor="middle"
              fontSize="10" fill="#78716c" fontWeight="500">Aujourd'hui</text>
          </g>
        )}

        {/* Courbe */}
        <path d={pathD} fill="none" stroke="#1c1917" strokeWidth="2.5" strokeLinejoin="round"/>

        {/* Points sur les jours avec événements */}
        {series.filter(s => s.events.length > 0).map(s => {
          const isCardDay = s.events.some(ev => ev.isCard);
          let color;
          if (isCardDay)             color = '#9333ea';
          else if (s.balance < 0)    color = '#e11d48';
          else if (s.balance < threshold) color = '#d97706';
          else                       color = '#10b981';
          return (
            <circle key={s.day} cx={xScale(s.day)} cy={yScale(s.balance)} r="4"
              fill={color} stroke="white" strokeWidth="1.5"/>
          );
        })}

        {/* Marqueur de hover */}
        {hovered && (
          <g pointerEvents="none">
            <line x1={xScale(hovered.day)} y1={PAD.top}
              x2={xScale(hovered.day)} y2={PAD.top + IH}
              stroke="#1c1917" strokeWidth="0.8" strokeDasharray="2 2" opacity="0.4"/>
            <circle cx={xScale(hovered.day)} cy={yScale(hovered.balance)} r="5"
              fill="#1c1917" stroke="white" strokeWidth="2"/>
          </g>
        )}

        {/* Capture mouse */}
        <rect x={PAD.left} y={PAD.top} width={IW} height={IH} fill="transparent"
          onMouseMove={handleMove} onMouseLeave={hideHover}/>
      </svg>

      {hover && hovered && (
        <div
          className="absolute pointer-events-none bg-stone-900 text-white text-xs rounded-lg shadow-lg px-3 py-2 min-w-[180px] transition-opacity"
          style={{
            left: Math.min(hover.x + 12, (containerRef.current?.clientWidth || 0) - 200),
            top: Math.max(hover.y - 12 - 80, 4),
          }}>
          <div className="text-stone-400 text-[10px] uppercase tracking-wide">
            Jour {String(hover.day).padStart(2, '0')}/{String(month).padStart(2, '0')}
          </div>
          <div className={"text-base font-semibold tabular-nums mt-0.5 " + balanceColor(hovered.balance).replace('text-', 'text-')}>
            <span className={
              hovered.balance < 0 ? "text-rose-300"
              : hovered.balance < threshold ? "text-amber-300"
              : "text-emerald-300"
            }>{formatILS(hovered.balance)}</span>
          </div>
          {hovered.events.length > 0 && (
            <div className="mt-1.5 space-y-0.5 border-t border-stone-700 pt-1.5">
              {hovered.events.slice(0, 5).map((ev, i) => (
                <div key={i} className="flex items-center justify-between gap-2 text-[11px]">
                  <span className={"truncate " + (ev.isCard ? "text-violet-300" : ev.type === 'in' ? "text-emerald-300" : "text-rose-300")}
                    dir="auto" title={ev.label}>
                    {ev.type === 'in' ? '+' : '−'} {ev.label}
                  </span>
                  <span className="tabular-nums opacity-90">{formatCompactILS(ev.amount)}</span>
                </div>
              ))}
              {hovered.events.length > 5 && (
                <div className="text-[10px] text-stone-400">+ {hovered.events.length - 5} autres…</div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const CashflowChartSection = ({ year, month, openingBalance, expenses, incomes, cardsForMonth }) => {
  const [collapsed, setCollapsed] = useState(() => loadSetting('chartCollapsed', false));
  const [mode, setMode]           = useState(() => loadSetting('chartMode', 'mixed'));
  const [threshold, setThreshold] = useState(() => Number(loadSetting('alertThreshold', 30000)) || 0);

  useEffect(() => { saveSetting('chartCollapsed', collapsed); }, [collapsed]);
  useEffect(() => { saveSetting('chartMode', mode); }, [mode]);
  useEffect(() => { saveSetting('alertThreshold', threshold); }, [threshold]);

  const series = useMemo(
    () => computeDailySeries({ openingBalance, expenses, incomes, cardsForMonth, mode, year, month }),
    [openingBalance, expenses, incomes, cardsForMonth, mode, year, month]
  );

  const stats = useMemo(() => {
    let red = 0, amber = 0, lowest = series[0] || null;
    for (const s of series) {
      if (s.balance < 0) red++;
      else if (s.balance < threshold) amber++;
      if (!lowest || s.balance < lowest.balance) lowest = s;
    }
    return { red, amber, lowest };
  }, [series, threshold]);

  const monthName = monthLabel(year, month);

  return (
    <section className="bg-white rounded-xl ring-1 ring-stone-200 overflow-hidden">
      <header className="px-4 py-3 border-b border-stone-200 flex items-center justify-between gap-3 flex-wrap">
        <div>
          <h2 className="font-semibold text-stone-900">Courbe de trésorerie · {monthName}</h2>
          <p className="text-xs text-stone-500 mt-0.5">
            {series.length} jours · solde fin :{' '}
            <span className="tabular-nums font-medium text-stone-700">
              {formatILS(series.length ? series[series.length - 1].balance : (Number(openingBalance) || 0))}
            </span>
          </p>
        </div>

        <div className="flex items-center gap-2 flex-wrap">
          <div className="inline-flex bg-stone-100 rounded-lg p-0.5">
            {[
              ['mixed',   'Réel + Prévu'],
              ['real',    'Réel seul'],
              ['planned', 'Prévu seul'],
            ].map(([v, label]) => (
              <button key={v} onClick={() => setMode(v)}
                className={
                  "px-2.5 py-1 text-xs rounded-md transition " +
                  (mode === v ? "bg-white text-stone-900 shadow-sm font-medium"
                              : "text-stone-600 hover:text-stone-900")
                }>{label}</button>
            ))}
          </div>
          <button onClick={() => setCollapsed(c => !c)}
            title={collapsed ? "Afficher la courbe" : "Masquer la courbe"}
            className="p-1.5 rounded-lg bg-white text-stone-600 ring-1 ring-stone-200 hover:bg-stone-50">
            {collapsed ? <ChevronDown className="w-4 h-4"/> : <ChevronUp className="w-4 h-4"/>}
          </button>
        </div>
      </header>

      {!collapsed && (
        <div className="px-4 py-3">
          <div className="flex items-center gap-2 flex-wrap mb-2 justify-end">
            <span className={
              "inline-flex items-center gap-1 text-xs px-2 py-1 rounded ring-1 " +
              (stats.red > 0 ? "bg-rose-50 text-rose-700 ring-rose-200"
                             : "bg-stone-50 text-stone-500 ring-stone-200")
            }>
              {stats.red} jour{stats.red > 1 ? 's' : ''} en zone rouge
            </span>
            <span className={
              "inline-flex items-center gap-1 text-xs px-2 py-1 rounded ring-1 " +
              (stats.amber > 0 ? "bg-amber-50 text-amber-700 ring-amber-200"
                               : "bg-stone-50 text-stone-500 ring-stone-200")
            }>
              {stats.amber} jour{stats.amber > 1 ? 's' : ''} sous seuil
            </span>
            {stats.lowest && (
              <span className="inline-flex items-center gap-1 text-xs px-2 py-1 rounded ring-1 bg-white text-stone-700 ring-stone-200">
                Plus bas :{' '}
                <span className={
                  "tabular-nums font-medium " +
                  (stats.lowest.balance < 0 ? "text-rose-700"
                   : stats.lowest.balance < threshold ? "text-amber-700"
                   : "text-emerald-700")
                }>{formatILS(stats.lowest.balance)}</span>
                <span className="text-stone-400 tabular-nums">le {String(stats.lowest.day).padStart(2,'0')}/{String(month).padStart(2,'0')}</span>
              </span>
            )}
          </div>

          <CashflowChart series={series} openingBalance={openingBalance}
            threshold={threshold} year={year} month={month}/>

          <div className="mt-3 flex items-center gap-2 text-xs text-stone-600">
            <span>Seuil d'alerte :</span>
            <span className="text-stone-400">₪</span>
            <BigNumInput value={threshold} onChange={v => setThreshold(v)}
              placeholder="30000"
              className="w-28 px-2 py-1 ring-1 ring-stone-200 rounded outline-none focus:ring-stone-400 tabular-nums text-right bg-white"/>
            <span className="text-stone-400">— en dessous, alerte ambre ; sous 0, alerte rouge.</span>
          </div>
        </div>
      )}
    </section>
  );
};

const TemplatesPicker = ({ defaultYear, defaultMonth, onSubmit, onCancel }) => {
  const [selected, setSelected] = useState(() => new Set());
  const [overrides, setOverrides] = useState({}); // index → { amount?, day? }

  const toggleAll = () =>
    setSelected(s => s.size === RECURRENCE_TEMPLATES.length
      ? new Set()
      : new Set(RECURRENCE_TEMPLATES.map((_, i) => i)));

  const start = (tpl) => {
    if (tpl.startMonthOffset === 'feb') return { startYear: defaultYear, startMonth: 2 };
    if (tpl.startMonthOffset === 'mar') return { startYear: defaultYear, startMonth: 3 };
    return { startYear: defaultYear, startMonth: defaultMonth };
  };

  const confirm = () => {
    const rules = [];
    for (const i of selected) {
      const tpl = RECURRENCE_TEMPLATES[i];
      const ov = overrides[i] || {};
      const s = start(tpl);
      rules.push({
        id: uid(),
        name: tpl.name, type: tpl.type,
        amount: Number(ov.amount ?? tpl.amount) || 0,
        day: Number(ov.day ?? tpl.day) || 1,
        mode: tpl.mode || 'bank',
        cardNumber: '',
        notes: '',
        frequency: tpl.frequency,
        startMonth: s.startMonth, startYear: s.startYear,
        endMonth: null, endYear: null,
        active: true,
        createdAt: new Date().toISOString(),
      });
    }
    onSubmit(rules);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs text-stone-500">
          Cochez les règles à créer. Les montants peuvent être ajustés ici ou plus tard.
        </p>
        <button onClick={toggleAll}
          className="text-xs px-2 py-1 rounded ring-1 ring-stone-200 hover:bg-stone-50">
          {selected.size === RECURRENCE_TEMPLATES.length ? 'Tout décocher' : 'Tout cocher'}
        </button>
      </div>
      <div className="rounded-lg ring-1 ring-stone-200 divide-y divide-stone-100 max-h-80 overflow-auto">
        {RECURRENCE_TEMPLATES.map((tpl, i) => {
          const isSel = selected.has(i);
          const ov = overrides[i] || {};
          return (
            <div key={i} className={"px-3 py-2 flex items-center gap-3 " + (isSel ? "bg-stone-50" : "")}>
              <input type="checkbox" checked={isSel}
                onChange={() => setSelected(s => {
                  const n = new Set(s);
                  n.has(i) ? n.delete(i) : n.add(i);
                  return n;
                })}
                className="w-4 h-4"/>
              <div className="flex-1 min-w-0">
                <div className="text-sm text-stone-900" dir="auto">{tpl.name}</div>
                <div className="text-[11px] text-stone-500">
                  {FREQUENCY_LABELS[tpl.frequency]} · jour {tpl.day} · {tpl.mode === 'card' ? 'CB' : 'Banque'}
                </div>
              </div>
              {isSel ? (
                <BigNumInput value={ov.amount ?? 0}
                  onChange={v => setOverrides(o => ({ ...o, [i]: { ...(o[i]||{}), amount: v } }))}
                  placeholder="Montant"
                  className="w-28 px-2 py-1 text-xs ring-1 ring-stone-200 rounded outline-none focus:ring-stone-400 tabular-nums text-right bg-white"/>
              ) : (
                <input type="text" disabled placeholder="Montant"
                  className="w-28 px-2 py-1 text-xs ring-1 ring-stone-200 rounded text-right bg-stone-50 text-stone-400"/>
              )}
            </div>
          );
        })}
      </div>
      <div className="mt-4 flex items-center justify-end gap-2">
        <button onClick={onCancel}
          className="px-3 py-1.5 text-sm rounded-lg ring-1 ring-stone-200 hover:bg-stone-50">
          Annuler
        </button>
        <button onClick={confirm} disabled={selected.size === 0}
          className={"px-3 py-1.5 text-sm rounded-lg " +
            (selected.size === 0
              ? "bg-stone-200 text-stone-400 cursor-not-allowed"
              : "bg-stone-900 text-white hover:bg-stone-800")}>
          Créer {selected.size > 0 ? `(${selected.size})` : ''}
        </button>
      </div>
    </div>
  );
};

const RecurrencesModal = ({ open, onClose, defaultYear, defaultMonth, onChanged, categories = [] }) => {
  const [rules, setRules] = useState([]);
  const [filter, setFilter] = useState('all'); // all | active | inactive | expense | income
  const [view, setView] = useState('list');    // 'list' | 'edit' | 'create' | 'templates'
  const [editing, setEditing] = useState(null);

  const reload = () => setRules(loadRecurrenceRules());
  useEffect(() => { if (open) { reload(); setView('list'); setEditing(null); setFilter('all'); } }, [open]);
  if (!open) return null;

  const filtered = rules.filter(r => {
    if (filter === 'active')   return r.active;
    if (filter === 'inactive') return !r.active;
    if (filter === 'expense')  return r.type === 'expense';
    if (filter === 'income')   return r.type === 'income';
    return true;
  });

  const handleSave = (data) => {
    const list = loadRecurrenceRules();
    if (editing && editing.id) {
      const idx = list.findIndex(r => r.id === editing.id);
      if (idx >= 0) list[idx] = { ...list[idx], ...data };
    } else {
      list.push({ id: uid(), createdAt: new Date().toISOString(), ...data });
    }
    saveRecurrenceRules(list);
    reload();
    setView('list'); setEditing(null);
    onChanged && onChanged();
  };
  const handleDelete = (rule) => {
    const occCount = countRuleOccurrences(rule.id);
    let alsoDelete = false;
    if (occCount > 0) {
      const txt = `Supprimer la règle « ${rule.name} » ?\n\n` +
                  `${occCount} occurrence${occCount > 1 ? 's' : ''} ` +
                  `existe${occCount > 1 ? 'nt' : ''} déjà dans vos mois.\n\n` +
                  `Cliquer sur OK = supprimer la règle ET les ${occCount} occurrence${occCount > 1 ? 's' : ''}.\n` +
                  `Cliquer sur Annuler = ne rien faire.`;
      if (!confirm(txt)) {
        // Offer alternative: delete rule only via second confirm
        if (!confirm("Supprimer uniquement la règle (et garder les occurrences déjà créées) ?")) return;
        alsoDelete = false;
      } else {
        alsoDelete = true;
      }
    } else {
      if (!confirm(`Supprimer la règle « ${rule.name} » ?`)) return;
    }
    const list = loadRecurrenceRules().filter(r => r.id !== rule.id);
    saveRecurrenceRules(list);
    if (alsoDelete) deleteAllOccurrencesOfRule(rule.id);
    reload();
    onChanged && onChanged();
  };
  const toggleActive = (rule) => {
    const list = loadRecurrenceRules().map(r => r.id === rule.id ? { ...r, active: !r.active } : r);
    saveRecurrenceRules(list);
    reload();
    onChanged && onChanged();
  };

  const fmtPeriod = (r) => {
    const start = `${MONTH_NAMES_FR[r.startMonth - 1]} ${r.startYear}`;
    if (r.endMonth && r.endYear) {
      return `${start} → ${MONTH_NAMES_FR[r.endMonth - 1]} ${r.endYear}`;
    }
    return `Depuis ${start}`;
  };

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl ring-1 ring-stone-200 w-full max-w-4xl flex flex-col max-h-[90vh]"
           onClick={e => e.stopPropagation()}>
        <header className="px-5 py-4 border-b border-stone-200 flex items-center justify-between gap-3 flex-wrap">
          <div>
            <h3 className="font-semibold text-stone-900 text-lg">Récurrences</h3>
            <p className="text-xs text-stone-500 mt-0.5">
              {rules.length} règle{rules.length > 1 ? 's' : ''} ·
              {' ' + rules.filter(r => r.active).length} active{rules.filter(r => r.active).length > 1 ? 's' : ''}
            </p>
          </div>
          <div className="flex items-center gap-2">
            {view === 'list' && (<>
              <button onClick={() => setView('templates')}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg ring-1 ring-stone-200 hover:bg-stone-50">
                <Sparkles className="w-4 h-4"/>Templates
              </button>
              <button onClick={() => { setEditing(null); setView('create'); }}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-stone-900 text-white hover:bg-stone-800">
                <Plus className="w-4 h-4"/>Nouvelle règle
              </button>
            </>)}
            <button onClick={onClose}
              className="p-1.5 rounded hover:bg-stone-100 text-stone-400 hover:text-stone-700">
              <X className="w-4 h-4"/>
            </button>
          </div>
        </header>

        {view === 'create' || view === 'edit' ? (
          <div className="p-5 overflow-auto flex-1">
            <h4 className="text-sm font-medium text-stone-800 mb-3">
              {view === 'create' ? 'Nouvelle règle de récurrence' : 'Modifier la règle'}
            </h4>
            <RecurrenceForm
              initial={view === 'edit' ? editing : null}
              defaultYear={defaultYear} defaultMonth={defaultMonth}
              categories={categories}
              onSubmit={handleSave}
              onCancel={() => { setView('list'); setEditing(null); }}
            />
          </div>
        ) : view === 'templates' ? (
          <div className="p-5 overflow-auto flex-1">
            <h4 className="text-sm font-medium text-stone-800 mb-3">Charger des règles types</h4>
            <TemplatesPicker
              defaultYear={defaultYear} defaultMonth={defaultMonth}
              onCancel={() => setView('list')}
              onSubmit={(newRules) => {
                const list = loadRecurrenceRules();
                for (const r of newRules) list.push(r);
                saveRecurrenceRules(list);
                reload();
                setView('list');
                onChanged && onChanged();
              }}/>
          </div>
        ) : (<>
          <div className="px-5 py-3 border-b border-stone-100 flex items-center gap-1.5 flex-wrap">
            <span className="text-xs uppercase tracking-wide text-stone-500 font-medium mr-1">Filtrer</span>
            <Pill active={filter === 'all'}      onClick={() => setFilter('all')}>Toutes</Pill>
            <Pill active={filter === 'active'}   onClick={() => setFilter('active')}>Actives</Pill>
            <Pill active={filter === 'inactive'} onClick={() => setFilter('inactive')}>Inactives</Pill>
            <Pill active={filter === 'expense'}  onClick={() => setFilter('expense')}>Dépenses</Pill>
            <Pill active={filter === 'income'}   onClick={() => setFilter('income')}>Encaissements</Pill>
          </div>
          <div className="flex-1 overflow-auto">
            <table className="w-full text-sm">
              <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide sticky top-0 z-10">
                <tr>
                  <th className="text-left font-medium px-3 py-2">Nom</th>
                  <th className="text-left font-medium px-3 py-2 w-24">Type</th>
                  <th className="text-right font-medium px-3 py-2 w-24">Montant</th>
                  <th className="text-right font-medium px-3 py-2 w-12">Jour</th>
                  <th className="text-left font-medium px-3 py-2 w-32">Fréquence</th>
                  <th className="text-left font-medium px-3 py-2 w-44">Période</th>
                  <th className="text-center font-medium px-3 py-2 w-20">Active</th>
                  <th className="w-20"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-stone-100">
                {filtered.length === 0 ? (
                  <tr><td colSpan="8" className="px-3 py-10 text-center text-sm text-stone-400">
                    {rules.length === 0
                      ? "Aucune règle. Créez-en une via « Nouvelle règle » ou « Templates »."
                      : "Aucune règle avec ce filtre."}
                  </td></tr>
                ) : filtered.map(r => (
                  <tr key={r.id} className={"hover:bg-stone-50/70 " + (!r.active ? "opacity-60" : "")}>
                    <td className="px-3 py-2 align-top">
                      <div className="text-stone-900" dir="auto">{r.name}</div>
                      {r.notes && <div className="text-[11px] text-stone-400 truncate max-w-xs" dir="auto">{r.notes}</div>}
                    </td>
                    <td className="px-3 py-2 text-xs">
                      <span className={r.type === 'expense' ? "text-rose-600" : "text-emerald-600"}>
                        {r.type === 'expense' ? 'Dépense' : 'Encaissement'}
                      </span>
                    </td>
                    <td className="px-3 py-2 text-right tabular-nums text-stone-700">{formatNum(r.amount)}</td>
                    <td className="px-3 py-2 text-right tabular-nums text-stone-700">{r.day}</td>
                    <td className="px-3 py-2">
                      <span className="text-[11px] px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 ring-1 ring-sky-200">
                        {FREQUENCY_LABELS[r.frequency] || r.frequency}
                      </span>
                    </td>
                    <td className="px-3 py-2 text-xs text-stone-600">{fmtPeriod(r)}</td>
                    <td className="px-3 py-2 text-center">
                      <button onClick={() => toggleActive(r)}
                        title={r.active ? 'Désactiver' : 'Activer'}
                        className={
                          "relative inline-flex w-9 h-5 rounded-full transition " +
                          (r.active ? "bg-stone-900" : "bg-stone-300")
                        }>
                        <span className={
                          "absolute top-0.5 w-4 h-4 bg-white rounded-full transition-transform " +
                          (r.active ? "translate-x-4" : "translate-x-0.5")
                        }/>
                      </button>
                    </td>
                    <td className="px-3 py-2">
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={() => { setEditing(r); setView('edit'); }}
                          title="Modifier"
                          className="p-1.5 text-stone-500 hover:text-stone-900 hover:bg-stone-100 rounded">
                          <Pencil className="w-3.5 h-3.5"/>
                        </button>
                        <button onClick={() => handleDelete(r)}
                          title="Supprimer"
                          className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded">
                          <Trash className="w-3.5 h-3.5"/>
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>)}
      </div>
    </div>
  );
};

const countRuleOccurrences = (ruleId) => {
  let n = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('month:')) continue;
    try {
      const m = JSON.parse(localStorage.getItem(k));
      n += (m.expenses || []).filter(it => it.recurrenceRuleId === ruleId).length;
      n += (m.incomes  || []).filter(it => it.recurrenceRuleId === ruleId).length;
    } catch {}
  }
  return n;
};

const buildReportHTML = ({
  monthKey, year, month, data, totals, cardsForMonth, categoriesById,
  series, threshold, cabinet, sections,
}) => {
  const monthLbl = monthLabel(year, month);
  const editedAt = new Date();
  const fmtNow = `${String(editedAt.getDate()).padStart(2,'0')}/${String(editedAt.getMonth()+1).padStart(2,'0')}/${editedAt.getFullYear()} ${String(editedAt.getHours()).padStart(2,'0')}:${String(editedAt.getMinutes()).padStart(2,'0')}`;
  const ils = (n) => formatILS(Math.round(Number(n) || 0));
  const prevEnd = (() => {
    const py = month === 1 ? year - 1 : year;
    const pm = month === 1 ? 12 : month - 1;
    return computeRealEndBalance(monthKey.replace(/^\d{4}-\d{2}$/, `${py}-${String(pm).padStart(2,'0')}`));
  })();

  // Synthèse
  const syntheseHTML = `
    <div class="keep-together">
      <h2>Synthèse financière</h2>
      <div class="grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat"><div class="label">Solde début de mois</div><div class="val">${ils(totals.opening)}</div></div>
        <div class="stat"><div class="label">Solde réel actuel</div><div class="val">${ils(totals.current)}</div></div>
        <div class="stat"><div class="label">Solde projeté fin de mois</div>
          <div class="val ${totals.projected >= 0 ? 'pos' : 'neg'}">${ils(totals.projected)}</div></div>
        <div class="stat"><div class="label">Total dépenses prévues</div>
          <div class="val">${ils(totals.expPlanned)}</div>
          <div class="meta">dont ${ils(totals.expPaid)} payés</div></div>
        <div class="stat"><div class="label">Total encaissements prévus</div>
          <div class="val">${ils(totals.incPlanned)}</div>
          <div class="meta">dont ${ils(totals.incReceived)} reçus</div></div>
        <div class="stat"><div class="label">Écart prévu / réel (sur lignes payées)</div>
          <div class="val ${totals.varExp > 0 ? 'neg' : (totals.varExp < 0 ? 'pos' : 'gray')}">${totals.varExp > 0 ? '+' : (totals.varExp < 0 ? '−' : '')}${ils(Math.abs(totals.varExp))}</div>
          <div class="meta">${totals.varExpCount} ligne(s) payée(s)</div></div>
      </div>
    </div>
  `;

  // Courbe : SVG statique petit (re-render compact)
  let chartHTML = '';
  if (sections.chart && series && series.length > 0) {
    const W = 700, H = 180, P = { l: 50, r: 16, t: 16, b: 28 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const balances = [Number(data.openingBalance) || 0, ...series.map(s => s.balance)];
    const yMin = Math.min(0, ...balances) - Math.max((Math.max(0, ...balances) - Math.min(0, ...balances)) * 0.1, 1000);
    const yMax = Math.max(0, ...balances) + Math.max((Math.max(0, ...balances) - Math.min(0, ...balances)) * 0.1, 1000);
    const xS = (d) => P.l + ((d - 1) / Math.max(1, series.length - 1)) * iw;
    const yS = (v) => P.t + ((yMax - v) / (yMax - yMin)) * ih;
    let path = `M ${xS(1)} ${yS(Number(data.openingBalance) || 0)}`;
    for (let i = 0; i < series.length; i++) {
      const s = series[i];
      path += ` L ${xS(s.day)} ${yS(s.balance)}`;
      if (i < series.length - 1) path += ` L ${xS(series[i+1].day)} ${yS(s.balance)}`;
    }
    let lowest = series[0];
    for (const s of series) if (s.balance < lowest.balance) lowest = s;
    chartHTML = `
      <div class="keep-together">
        <h2>Courbe de trésorerie</h2>
        <div class="chart">
          <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">
            <rect x="${P.l}" y="${Math.max(P.t, yS(0))}" width="${iw}" height="${Math.max(0, P.t + ih - Math.max(P.t, yS(0)))}" fill="#fecdd3" opacity="0.4"/>
            <line x1="${P.l}" y1="${yS(0)}" x2="${P.l + iw}" y2="${yS(0)}" stroke="#78716c" stroke-width="0.8"/>
            <line x1="${P.l}" y1="${yS(threshold)}" x2="${P.l + iw}" y2="${yS(threshold)}" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3 3"/>
            <text x="${P.l - 6}" y="${yS(yMax)}" text-anchor="end" font-size="9" fill="#78716c">${formatCompactILS(yMax)}</text>
            <text x="${P.l - 6}" y="${yS(yMin)}" text-anchor="end" font-size="9" fill="#78716c">${formatCompactILS(yMin)}</text>
            <text x="${P.l - 6}" y="${yS(0) + 3}" text-anchor="end" font-size="9" fill="#78716c">0</text>
            <path d="${path}" fill="none" stroke="#1c1917" stroke-width="2"/>
          </svg>
          <div class="meta">Plus bas du mois : <strong>${ils(lowest.balance)}</strong> le ${String(lowest.day).padStart(2,'0')}/${String(month).padStart(2,'0')}</div>
        </div>
      </div>
    `;
  }

  // Tableau dépenses
  let depHTML = '';
  if (sections.expenses) {
    const cardsByNum = new Map((cardsForMonth || []).map(c => [String(c.cardNumber), c]));
    const isGrouped = (e) => e.mode === 'card' && cardsByNum.has(String(e.cardNumber));
    const expRows = data.expenses.filter(e => !isGrouped(e));
    const synthRows = (cardsForMonth || []).map(c => ({
      synth: true, cardNumber: c.cardNumber, debitDate: c.debitDate,
      amount: c.upcomingAmount, paid: c.paidAt ? c.upcomingAmount : 0,
    }));
    let tbody = '';
    if (sections.expensesByCategory && categoriesById) {
      const byCat = new Map();
      for (const e of expRows) {
        const id = e.category && categoriesById.has(e.category) ? e.category : '__none';
        if (!byCat.has(id)) byCat.set(id, []);
        byCat.get(id).push(e);
      }
      const orderedCats = [...byCat.entries()]
        .map(([id, items]) => ({
          id, items,
          name: id === '__none' ? 'Non catégorisé' : (categoriesById.get(id)?.name || id),
          total: items.reduce((s, e) => s + (Number(e.amount) || 0), 0),
        }))
        .sort((a, b) => b.total - a.total);
      for (const g of orderedCats) {
        const sumP = g.items.reduce((s, e) => s + (Number(e.paid) || 0), 0);
        tbody += `<tr class="section"><td colspan="6">${escapeHtml(g.name)}</td><td class="num">${ils(g.total)}</td></tr>`;
        for (const e of g.items) {
          tbody += rowExp(e);
        }
        tbody += `<tr class="total"><td colspan="3" style="padding-left:24px;">Sous-total ${escapeHtml(g.name)}</td>
          <td class="num">${ils(g.total)}</td><td></td><td class="num">${ils(sumP)}</td><td></td></tr>`;
      }
      for (const s of synthRows) tbody += rowSynth(s);
    } else {
      const sorted = [...expRows].sort((a, b) => (a.day || 1) - (b.day || 1));
      for (const e of sorted) tbody += rowExp(e);
      for (const s of synthRows) tbody += rowSynth(s);
    }
    function rowExp(e) {
      const cat = e.category && categoriesById && categoriesById.get(e.category);
      const status = expenseStatus(e);
      const stTxt = status === 'paid' ? 'Payé' : status === 'partial' ? 'Partiel' : 'À payer';
      return `<tr>
        <td>${cat ? `<span class="badge">${escapeHtml(cat.name)}</span>` : '<span class="gray">—</span>'}</td>
        <td>${escapeHtml(e.name)}</td>
        <td class="num">${e.day || ''}</td>
        <td class="num">${ils(e.amount)}</td>
        <td>${e.mode === 'card' ? 'CB ' + escapeHtml(e.cardNumber || '') : 'B'}</td>
        <td class="num">${ils(e.paid)}</td>
        <td class="${status === 'paid' ? 'pos' : (status === 'unpaid' ? 'neg' : 'gray')}">${stTxt}</td>
      </tr>`;
    }
    function rowSynth(s) {
      return `<tr>
        <td><span class="badge">Carte ${escapeHtml(s.cardNumber)}</span></td>
        <td>Débit groupé carte ${escapeHtml(s.cardNumber)}</td>
        <td class="num">${(s.debitDate || '').slice(8, 10)}</td>
        <td class="num">${ils(s.amount)}</td>
        <td>CB</td>
        <td class="num">${ils(s.paid)}</td>
        <td class="${s.paid ? 'pos' : 'gray'}">${s.paid ? 'Débité' : 'Attendu'}</td>
      </tr>`;
    }
    depHTML = `
      <h2>Dépenses</h2>
      <table class="compact">
        <thead><tr>
          <th>Catégorie</th><th>Fournisseur / poste</th><th class="num">Jour</th>
          <th class="num">Prévu</th><th>Mode</th><th class="num">Payé</th><th>Statut</th>
        </tr></thead>
        <tbody>${tbody}</tbody>
        <tfoot><tr class="total">
          <td colspan="3">Totaux</td>
          <td class="num">${ils(totals.expPlanned)}</td><td></td>
          <td class="num">${ils(totals.expPaid)}</td>
          <td class="neg">Reste ${ils(totals.expRemaining)}</td>
        </tr></tfoot>
      </table>
    `;
  }

  // Tableau encaissements
  let incHTML = '';
  if (sections.incomes && data.incomes.length > 0) {
    const sorted = [...data.incomes].sort((a, b) => (a.day || 1) - (b.day || 1));
    let tbody = '';
    for (const i of sorted) {
      const status = incomeStatus(i);
      const stTxt = status === 'received' ? 'Reçu' : status === 'partial' ? 'Partiel' : 'Attendu';
      tbody += `<tr>
        <td>${escapeHtml(i.name)}</td>
        <td class="num">${i.day || ''}</td>
        <td class="num">${ils(i.amount)}</td>
        <td class="num">${ils(i.received)}</td>
        <td class="${status === 'received' ? 'pos' : 'gray'}">${stTxt}</td>
      </tr>`;
    }
    incHTML = `
      <h2>Encaissements</h2>
      <table class="compact">
        <thead><tr><th>Description</th><th class="num">Jour</th>
          <th class="num">Prévu</th><th class="num">Reçu</th><th>Statut</th></tr></thead>
        <tbody>${tbody}</tbody>
        <tfoot><tr class="total">
          <td>Totaux</td><td></td>
          <td class="num">${ils(totals.incPlanned)}</td>
          <td class="num">${ils(totals.incReceived)}</td>
          <td class="pos">Reste ${ils(totals.incRemaining)}</td>
        </tr></tfoot>
      </table>
    `;
  }

  // Cartes
  let cardsHTML = '';
  if (sections.cards && cardsForMonth && cardsForMonth.length > 0) {
    let tbody = '';
    for (const c of cardsForMonth) {
      tbody += `<tr>
        <td>•••• ${escapeHtml(c.cardNumber)}</td>
        <td class="num">${ils(c.upcomingAmount)}</td>
        <td>${(c.debitDate || '').split('-').reverse().join('/')}</td>
        <td class="${c.paidAt ? 'pos' : 'gray'}">${c.paidAt ? 'Débité le ' + (c.paidAt.split('-').reverse().join('/')) : 'En attente'}</td>
      </tr>`;
    }
    cardsHTML = `
      <h2>Cartes de crédit</h2>
      <table class="compact">
        <thead><tr><th>Carte</th><th class="num">Montant</th><th>Date prochaine</th><th>Statut</th></tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    `;
  }

  // Postes non payés à reporter
  let unpaidHTML = '';
  if (sections.unpaid) {
    const today = new Date();
    const nowDay = today.getDate();
    const isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;
    const showSection = !isCurrentMonth || nowDay >= 25;
    const unpaid = data.expenses.filter(e => {
      const remaining = (Number(e.amount) || 0) - (Number(e.paid) || 0);
      return remaining > 0;
    });
    if (showSection && unpaid.length > 0) {
      let tbody = '';
      for (const e of unpaid) {
        const remaining = (Number(e.amount) || 0) - (Number(e.paid) || 0);
        tbody += `<tr>
          <td>${escapeHtml(e.name)}</td>
          <td class="num">${e.day || ''}</td>
          <td class="num">${ils(e.amount)}</td>
          <td class="num">${ils(e.paid)}</td>
          <td class="num neg"><strong>${ils(remaining)}</strong></td>
        </tr>`;
      }
      unpaidHTML = `
        <h2>Postes non-payés à reporter</h2>
        <table class="compact">
          <thead><tr><th>Poste</th><th class="num">Jour</th>
            <th class="num">Prévu</th><th class="num">Payé</th><th class="num">Reste</th></tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      `;
    }
  }

  return `
<!DOCTYPE html><html lang="fr" dir="ltr"><head>
<meta charset="UTF-8"/>
<title>Rapport ${escapeHtml(monthLbl)}${cabinet?.name ? ' — ' + escapeHtml(cabinet.name) : ''}</title>
<style>${reportInlineCSS}</style>
</head><body>
  <header style="margin-bottom:12px;">
    ${cabinet?.name ? `<div class="meta" style="margin-bottom:4px;font-weight:600;">${escapeHtml(cabinet.name)}</div>` : ''}
    ${cabinet?.address ? `<div class="meta">${escapeHtml(cabinet.address).replace(/\n/g, '<br>')}</div>` : ''}
    <h1>Rapport mensuel de trésorerie</h1>
    <div class="meta">Mois : <strong>${escapeHtml(monthLbl)}</strong> · Édité le ${fmtNow}${prevEnd != null ? ` · Solde réel fin du mois précédent : <strong>${ils(prevEnd)}</strong>` : ''}</div>
  </header>
  ${sections.synthese ? syntheseHTML : ''}
  ${chartHTML}
  ${depHTML}
  ${incHTML}
  ${cardsHTML}
  ${unpaidHTML}
  <div class="footer">
    <span>Édité le ${fmtNow} · Confidentiel — Document interne au cabinet</span>
    <span class="no-print">Page imprimable</span>
  </div>
</body></html>`;
};

const openPrintPreview = (htmlString) => {
  const win = window.open('', '_blank');
  if (!win) {
    alert("Le navigateur a bloqué la popup. Autorisez les popups pour ce site.");
    return;
  }
  win.document.open();
  win.document.write(htmlString);
  win.document.close();
  // Laisser le temps au layout de se construire avant d'imprimer
  setTimeout(() => { try { win.focus(); win.print(); } catch {} }, 400);
};

const exportPDFFromHTML = async (htmlString, fileName) => {
  if (typeof html2canvas !== 'function' || !window.jspdf) {
    alert("Bibliothèques PDF en cours de chargement, réessayez dans un instant.");
    return;
  }
  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-99999px';
  container.style.top = '0';
  container.style.width = '794px';
  container.style.background = 'white';
  // On extrait juste le body du HTML composé (pour garder le CSS inline tags)
  container.innerHTML = htmlString.replace(/^[\s\S]*<body[^>]*>/i, '').replace(/<\/body>[\s\S]*$/i, '');
  // Insérer le CSS du rapport
  const style = document.createElement('style');
  style.textContent = reportInlineCSS;
  container.prepend(style);
  document.body.appendChild(container);
  try {
    const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = 210, pageH = 297;
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    const dataUrl = canvas.toDataURL('image/png');
    let position = 0;
    let heightLeft = imgH;
    pdf.addImage(dataUrl, 'PNG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0) {
      position -= pageH;
      pdf.addPage();
      pdf.addImage(dataUrl, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    pdf.save(fileName);
  } catch (err) {
    alert("Erreur lors de la génération du PDF : " + err.message);
  } finally {
    document.body.removeChild(container);
  }
};

// Détecte si le poste cible d'une règle existe dans au moins un mois enregistré.
const isRuleOrphan = (rule) => {
  const targetName = (rule?.matchTo?.postName || '').trim();
  if (!targetName) return true;
  const itemsKey = rule.matchTo.type === 'expense' ? 'expenses' : 'incomes';
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('month:')) continue;
    try {
      const m = JSON.parse(localStorage.getItem(k));
      const arr = (m && m[itemsKey]) || [];
      if (arr.some(it => (it.name || '').trim() === targetName)) return false;
    } catch {}
  }
  return true;
};

      const k = localStorage.key(i);
      if (!k || !k.startsWith('month:')) continue;
      try {
        const m = JSON.parse(localStorage.getItem(k));
        for (const it of (m && m[itemsKey]) || []) {

          <input type="radio" checked={patternType === 'contains'}

          <input type="radio" checked={patternType === 'regex'}

      <label className="text-xs font-medium text-stone-700">
        Direction

  const reload = () => setRules(loadMatchRules());
  useEffect(() => { if (open) { reload(); setEditing(null); setFilter('all'); } }, [open]);

  if (!open) return null;

  const annotated = rules.map(r => ({ ...r, orphan: isRuleOrphan(r) }));
  const filtered = annotated.filter(r => {
    if (filter === 'active') return !r.orphan;
    if (filter === 'orphan') return  r.orphan;
    return true;
  });

  const handleSave = (data) => {
    const list = loadMatchRules();
    if (editing && editing.id) {
      const idx = list.findIndex(r => r.id === editing.id);
      if (idx >= 0) list[idx] = { ...list[idx], ...data };
    } else {
      list.push({
        id: uid(),
        pattern: data.pattern,
        patternType: data.patternType,
        matchTo: data.matchTo,
        createdAt: new Date().toISOString(),
        hitCount: 0,
      });
    }
    saveMatchRules(list);
    reload();
    setEditing(null);

      <div className="text-[10px] uppercase tracking-wide opacity-70">{label}</div>

    </div>
  );
};

const CollapsibleSection = ({ title, count, defaultOpen = false, children }) => {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="rounded-lg ring-1 ring-stone-200 overflow-hidden bg-white">
      <button onClick={() => setOpen(o => !o)}
        className="w-full px-3 py-2 flex items-center justify-between hover:bg-stone-50 text-sm">
        <div className="flex items-center gap-2 font-medium text-stone-800">
          {open ? <ChevronDown className="w-4 h-4 text-stone-500"/> : <ChevronRight className="w-4 h-4 text-stone-500"/>}
          <span>{title}</span>
          <span className="text-xs font-normal text-stone-500">({count})</span>
        </div>
      </button>
      {open && <div className="border-t border-stone-100">{children}</div>}
