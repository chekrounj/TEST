<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   Helpers
   ========================================================= */
const formatILS = (n) => {
  const v = Math.round(Number(n) || 0);
  const sign = v < 0 ? '-' : '';
  return sign + '₪ ' + Math.abs(v).toLocaleString('fr-FR');
};
const uid = () =>
  (crypto.randomUUID ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36));
const monthKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
const monthLabel = (y, m) => {
  const s = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
};

const emptyMonth = () => ({
  openingBalance: 0,
  targetBalance: 0,
  expenses: [],
  incomes: [],
});

const loadMonth = (key) => {
  try {
    const raw = localStorage.getItem('month:' + key);
    if (!raw) return emptyMonth();
    return { ...emptyMonth(), ...JSON.parse(raw) };
  } catch { return emptyMonth(); }
};
const saveMonth = (key, data) => {
  localStorage.setItem('month:' + key, JSON.stringify(data));
};

/* ---------- Imported transactions (bank) — global dedup index ---------- */
// "transactions:imported" → { [refKey]: { date, amount, description, importedAt, monthKey } }
const loadImportedTx = () => {
  try { return JSON.parse(localStorage.getItem('transactions:imported') || '{}'); }
  catch { return {}; }
};
const saveImportedTx = (obj) => {
  localStorage.setItem('transactions:imported', JSON.stringify(obj));
};

/* ---------- Cards snapshot (current state, not a journal) ---------- */
// "cards:current" → { [cardNumber]: { upcomingAmount, debitDate, lastImportedAt, paidAt? } }
const loadCardsSnapshot = () => {
  try { return JSON.parse(localStorage.getItem('cards:current') || '{}'); }
  catch { return {}; }
};
const saveCardsSnapshot = (obj) => {
  localStorage.setItem('cards:current', JSON.stringify(obj));
};

/* ---------- Statement parsers (stubs — to be implemented in next prompts) ---------- */

  console.log("Parser bancaire non implémenté", file?.name);
  await new Promise(r => setTimeout(r, 600));
  return {

    fileName: file?.name || '',

const parseCardStatement = async (file) => {

  await new Promise(r => setTimeout(r, 600));
  return {
    kind: 'card',
    fileName: file?.name || '',
    summary: "Parser cartes non implémenté",
    rows: [],
  };
};

/* =========================================================
   Excel import helpers
   ========================================================= */
const parseAmount = (v) => {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  const s = String(v).trim();
  if (!s || s === '-' || s === '—' || s === '–') return 0;
  // Strip ₪, NBSP/narrow NBSP, regular spaces, thousand separators
  const cleaned = s.replace(/[\s  ₪]/g, '').replace(/,/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
};

const cleanCardName = (raw) =>
  raw.replace(/💳/g, '')
     .replace(/CARTE/gi, '')
     .replace(/\(fournisseurs?\)/gi, '')
     .replace(/\(.*?\)/g, '')
     .trim();

const parseSheetToMonth = (rows, colIdx) => {
  let section = null;          // 'income' | 'expense' | null
  let mode = 'bank';
  let card = '';
  const expenses = [];
  const incomes = [];

  for (const row of rows) {
    const rawName = row?.[0];
    if (rawName == null) continue;
    const name = String(rawName).trim();
    if (!name) continue;

    const upper = name.toUpperCase();

    // Section: ENTRÉES (RECETTES)
    if (upper.includes('ENTRÉES') || upper.includes('ENTREES') ||
        upper === 'RECETTES' || upper.startsWith('RECETTES')) {
      if (upper.startsWith('TOTAL')) continue;
      section = 'income';
      continue;
    }
    // Section: SORTIES (DÉPENSES)
    if (upper.includes('SORTIES') || upper.includes('DÉPENSES') || upper.includes('DEPENSES')) {
      if (upper.startsWith('TOTAL')) continue;
      section = 'expense';
      mode = 'bank';
      card = '';
      continue;
    }
    // Sub-section: BANQUE
    if (name.includes('🏦') || /\bBANQUE\b/i.test(name) || /\bBANK\b/i.test(name) || /HAPOALIM/i.test(name)) {
      mode = 'bank';
      card = '';
      continue;
    }
    // Sub-section: CARTE
    if (name.includes('💳') || /\bCARTE\b/i.test(name)) {
      mode = 'card';
      card = cleanCardName(name);
      continue;
    }
    // Skip total / sub-total rows
    if (upper.startsWith('TOTAL') || upper.startsWith('SOUS-TOTAL') ||
        upper.startsWith('SOUS TOTAL')) continue;
    if (upper.startsWith('AUTRES ENTRÉES') || upper.startsWith('AUTRES ENTREES') ||
        upper.startsWith('AUTRES SORTIES')) continue;
    if (upper === 'CATÉGORIE' || upper === 'CATEGORIE') continue;

    if (!section) continue;

    const amount = parseAmount(row[colIdx]);

    if (section === 'income') {
      incomes.push({ id: uid(), name, amount, day: 1, received: 0 });
    } else {
      expenses.push({
        id: uid(), name, type: '', amount, day: 1,
        mode, cardNumber: card, notes: '', paid: 0,
      });
    }
  }

  return { expenses, incomes };
};

// Détecte les colonnes contenant des montants (au moins une valeur numérique non nulle)
const detectMonthColumns = (rows) => {
  const header = rows[0] || [];
  const maxC = Math.max(header.length, ...rows.slice(0, 30).map(r => (r || []).length), 6);
  const cols = [];
  for (let c = 1; c < maxC; c++) {
    let hasNum = false;
    for (let r = 1; r < Math.min(rows.length, 200); r++) {
      const v = rows[r]?.[c];
      if (typeof v === 'number' && v !== 0) { hasNum = true; break; }
      if (typeof v === 'string' && parseAmount(v) !== 0) { hasNum = true; break; }
    }
    if (hasNum) {
      const label = String(header[c] ?? '').trim() || `Colonne ${c + 1}`;
      cols.push({ index: c, label });
    }
  }
  return cols;
};

const expenseStatus = (e) => {
  const a = Number(e.amount) || 0, p = Number(e.paid) || 0;
  if (p <= 0) return 'unpaid';
  if (p < a) return 'partial';
  return 'paid';
};
const incomeStatus = (i) => {
  const a = Number(i.amount) || 0, r = Number(i.received) || 0;
  if (r <= 0) return 'pending';
  if (r < a) return 'partial';
  return 'received';
};

/* =========================================================
   SVG icons (lucide-style)
   ========================================================= */
const Svg = ({ children, className = "w-4 h-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const ChevronLeft  = (p) => <Svg {...p}><polyline points="15 18 9 12 15 6" /></Svg>;
const ChevronRight = (p) => <Svg {...p}><polyline points="9 18 15 12 9 6" /></Svg>;
const Plus  = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const Trash = (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Svg>;
const Check = (p) => <Svg {...p}><polyline points="20 6 9 17 4 12"/></Svg>;
const Sparkles = (p) => <Svg {...p}><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/><path d="M5 4l.5 1.5L7 6l-1.5.5L5 8l-.5-1.5L3 6l1.5-.5z"/></Svg>;
const Building = (p) => <Svg {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V14h6v8"/><line x1="8" y1="6" x2="8" y2="6"/><line x1="12" y1="6" x2="12" y2="6"/><line x1="16" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/></Svg>;
const CreditCard = (p) => <Svg {...p}><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></Svg>;
const Target = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Svg>;
const Wallet = (p) => <Svg {...p}><path d="M20 12V8H4a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></Svg>;
const TrendingUp = (p) => <Svg {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Svg>;
const Copy = (p) => <Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const ArrowRight = (p) => <Svg {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Svg>;

/* =========================================================
   Reusable inputs
   ========================================================= */
const TextInput = ({ value, onChange, placeholder, className = "" }) => (
  <input
    type="text" dir="auto" value={value || ''}
    onChange={e => onChange(e.target.value)}
    placeholder={placeholder}
    className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 " + className}
  />
);
const NumInput = ({ value, onChange, min, max, className = "", placeholder }) => (
  <input
    type="number" inputMode="decimal" value={value === 0 ? '' : value}
    onChange={e => onChange(e.target.value === '' ? 0 : Number(e.target.value))}
    min={min} max={max} placeholder={placeholder ?? '0'}
    className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 text-right tabular-nums " + className}
  />
);

/* =========================================================
   Status badges
   ========================================================= */
const Badge = ({ tone, children }) => {
  const tones = {
    gray:    'bg-stone-100 text-stone-600 ring-stone-200',
    amber:   'bg-amber-50 text-amber-700 ring-amber-200',
    emerald: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
  };
  return (
    <span className={"inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full ring-1 " + tones[tone]}>
      {children}
    </span>
  );
};
const ExpenseBadge = ({ status }) => {
  if (status === 'paid')    return <Badge tone="emerald"><Check className="w-3 h-3"/>Payé</Badge>;
  if (status === 'partial') return <Badge tone="amber">Partiel</Badge>;
  return <Badge tone="gray">À payer</Badge>;
};
const IncomeBadge = ({ status }) => {
  if (status === 'received') return <Badge tone="emerald"><Check className="w-3 h-3"/>Reçu</Badge>;
  if (status === 'partial')  return <Badge tone="amber">Partiel</Badge>;
  return <Badge tone="gray">Attendu</Badge>;
};

/* =========================================================
   Mode toggle (Banque / CB)
   ========================================================= */
const ModeToggle = ({ value, onChange, cardNumber, onCardChange }) => {
  const isCard = value === 'card';
  return (
    <div className="flex items-center gap-2">
      <button
        type="button"
        onClick={() => onChange(isCard ? 'bank' : 'card')}
        className={
          "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ring-1 transition " +
          (isCard
            ? "bg-violet-50 text-violet-700 ring-violet-200 hover:bg-violet-100"
            : "bg-sky-50 text-sky-700 ring-sky-200 hover:bg-sky-100")
        }
        title="Cliquer pour basculer banque / carte"
      >
        {isCard ? <CreditCard className="w-3.5 h-3.5"/> : <Building className="w-3.5 h-3.5"/>}
        {isCard ? 'CB' : 'Banque'}
      </button>
      {isCard && (
        <input
          type="text"
          value={cardNumber || ''}
          onChange={e => onCardChange(e.target.value)}
          placeholder="N°"
          className="w-16 px-2 py-1 text-xs rounded ring-1 ring-violet-200 bg-violet-50 text-violet-700 placeholder-violet-300 outline-none focus:bg-white focus:ring-violet-400 tabular-nums"
        />
      )}
    </div>
  );
};

/* =========================================================
   Expenses table
   ========================================================= */
const VarianceLabel = ({ planned, actual }) => {
  const a = Number(actual) || 0, p = Number(planned) || 0;
  if (a <= 0 || a === p) return null;
  const diff = a - p;
  const isOver = diff > 0;
  const sign = isOver ? '+' : '−';
  return (
    <div className={"text-[11px] mt-0.5 tabular-nums text-right " + (isOver ? "text-rose-600" : "text-emerald-600")}>
      {sign}{Math.abs(Math.round(diff)).toLocaleString('fr-FR')} vs prévu
    </div>
  );
};

const ReportedBadge = ({ from }) => {
  if (!from) return null;
  const [y, m] = from.split('-').map(Number);
  return (
    <div className="inline-flex items-center gap-1 mt-0.5 text-[11px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 ring-1 ring-amber-200">
      <CornerDownRight className="w-3 h-3"/>
      Reporté de {monthLabel(y, m)}
    </div>
  );
};

const ExpensesTable = ({ expenses, onAdd, onUpdate, onRemove, onRemoveMany, onReportUnpaid, hasPrevMonth }) => {
  const [selected, setSelected] = useState(() => new Set());
  const [sort, onSort] = useSort();
  const [groupByType, setGroupByType] = useState(false);
  const [collapsed, setCollapsed] = useState(() => new Set());

  useEffect(() => {
    const ids = new Set(expenses.map(e => e.id));
    setSelected(prev => {
      const next = new Set([...prev].filter(id => ids.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [expenses]);

  const toggleOne = (id) => setSelected(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const allSelected = expenses.length > 0 && selected.size === expenses.length;
  const toggleAll = () =>
    setSelected(allSelected ? new Set() : new Set(expenses.map(e => e.id)));
  const deleteSelected = () => {
    if (selected.size === 0) return;
    if (!confirm(`Supprimer ${selected.size} ligne${selected.size > 1 ? 's' : ''} ?`)) return;
    onRemoveMany([...selected]);
    setSelected(new Set());
  };
  const toggleGroup = (type) => setCollapsed(prev => {
    const next = new Set(prev);
    next.has(type) ? next.delete(type) : next.add(type);
    return next;
  });

  const valueOf = (e, f) => {
    if (f === 'status') return ({ unpaid: 0, partial: 1, paid: 2 })[expenseStatus(e)];
    return e[f];
  };
  const sortedExpenses = useMemo(() => sortRows(expenses, sort, valueOf), [expenses, sort]);

  const groups = useMemo(() => {
    if (!groupByType) return null;
    const map = new Map();
    for (const e of sortedExpenses) {
      const t = (e.type || '').trim() || '— Sans type —';
      if (!map.has(t)) map.set(t, []);
      map.get(t).push(e);
    }
    return [...map.entries()].map(([type, items]) => ({
      type, items,
      planned: items.reduce((s, e) => s + (Number(e.amount) || 0), 0),
      paid:    items.reduce((s, e) => s + (Number(e.paid)   || 0), 0),
    }));
  }, [sortedExpenses, groupByType]);

  const totalPlanned   = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalPaid      = expenses.reduce((s, e) => s + (Number(e.paid)   || 0), 0);
  const totalRemaining = totalPlanned - totalPaid;

  const typeSuggestions = useMemo(
    () => [...new Set(expenses.map(e => (e.type || '').trim()).filter(Boolean))].sort(),
    [expenses]
  );

  const renderRow = (e) => (
    <tr key={e.id} className={"hover:bg-stone-50/60 " + (selected.has(e.id) ? "bg-stone-50" : "")}>
      <td className="px-3 py-1">
        <input type="checkbox" checked={selected.has(e.id)} onChange={() => toggleOne(e.id)}
          className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer"
          aria-label="Sélectionner la ligne"/>
      </td>
      <td className="px-2 py-1">
        <TextInput value={e.name} onChange={v => onUpdate(e.id, { name: v })} placeholder="Nom du fournisseur"/>
        <ReportedBadge from={e.reportedFrom}/>
      </td>
      <td className="px-2 py-1">
        <input type="text" dir="auto" list="expense-types" value={e.type || ''}
          onChange={ev => onUpdate(e.id, { type: ev.target.value })}
          placeholder="—"
          className="w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 text-stone-700"/>
      </td>
      <td className="px-2 py-1"><NumInput value={e.amount} onChange={v => onUpdate(e.id, { amount: v })}/></td>
      <td className="px-2 py-1"><NumInput value={e.day} onChange={v => onUpdate(e.id, { day: Math.max(1, Math.min(31, v || 1)) })} min={1} max={31}/></td>
      <td className="px-2 py-1">
        <ModeToggle value={e.mode} onChange={v => onUpdate(e.id, { mode: v })}
          cardNumber={e.cardNumber} onCardChange={v => onUpdate(e.id, { cardNumber: v })}/>
      </td>
      <td className="px-2 py-1">
        <NumInput value={e.paid} onChange={v => onUpdate(e.id, { paid: v })}/>
        <VarianceLabel planned={e.amount} actual={e.paid}/>
      </td>
      <td className="px-2 py-1"><ExpenseBadge status={expenseStatus(e)}/></td>
      <td className="px-2 py-1 text-right">
        <button onClick={() => onRemove(e.id)}
          className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded" title="Supprimer">
          <Trash className="w-4 h-4"/>
        </button>
      </td>
    </tr>
  );

  return (
    <section className="bg-white rounded-xl ring-1 ring-stone-200 overflow-hidden">
      <header className="flex items-center justify-between px-4 py-3 border-b border-stone-200 gap-3 flex-wrap">
        <div>
          <h2 className="font-semibold text-stone-900">Postes de dépense</h2>
          <p className="text-xs text-stone-500 mt-0.5">{expenses.length} poste{expenses.length > 1 ? 's' : ''}</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap justify-end">
          {selected.size > 0 && (
            <button onClick={deleteSelected}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-rose-600 text-white hover:bg-rose-700">
              <Trash className="w-4 h-4"/>Supprimer ({selected.size})
            </button>
          )}
          <button onClick={() => setGroupByType(g => !g)}
            className={"inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg ring-1 " +
              (groupByType
                ? "bg-stone-900 text-white ring-stone-900 hover:bg-stone-800"
                : "bg-white text-stone-700 ring-stone-200 hover:bg-stone-50")}>
            <Layers className="w-4 h-4"/>{groupByType ? 'Vue groupée' : 'Grouper par type'}
          </button>
          {onReportUnpaid && hasPrevMonth && (
            <button onClick={onReportUnpaid}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-50">
              <ArrowRight className="w-4 h-4"/>Reporter non-payés
            </button>
          )}
          <button onClick={onAdd}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-stone-900 text-white hover:bg-stone-800">
            <Plus className="w-4 h-4"/>Ajouter
          </button>
        </div>
      </header>

      <datalist id="expense-types">
        {typeSuggestions.map(t => <option key={t} value={t}/>)}
      </datalist>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="px-3 py-2 w-10">
                <input type="checkbox" checked={allSelected} onChange={toggleAll}
                  disabled={expenses.length === 0}
                  className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer disabled:cursor-not-allowed"
                  aria-label="Tout sélectionner"/>
              </th>
              <SortableTh field="name"   label="Fournisseur / poste" sort={sort} onSort={onSort} className="text-left"/>
              <SortableTh field="type"   label="Type"   sort={sort} onSort={onSort} className="text-left w-32"/>
              <SortableTh field="amount" label="Prévu"  sort={sort} onSort={onSort} className="text-right w-28"/>
              <SortableTh field="day"    label="Jour"   sort={sort} onSort={onSort} className="text-right w-16"/>
              <th className="text-left font-medium px-2 py-2 w-44">Mode</th>
              <SortableTh field="paid"   label="Payé"   sort={sort} onSort={onSort} className="text-right w-32"/>
              <SortableTh field="status" label="Statut" sort={sort} onSort={onSort} className="text-left w-28"/>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-stone-100">
            {expenses.length === 0 && (
              <tr><td colSpan="9" className="px-4 py-6 text-center text-sm text-stone-400">
                Aucun poste pour ce mois.
              </td></tr>
            )}

/* =========================================================
   Sortable column header helper
   ========================================================= */
const SortArrow = ({ active, dir }) => (
  <span className={"inline-block w-3 text-[10px] " + (active ? "text-stone-700" : "text-stone-300")}>
    {active ? (dir === 'asc' ? '▲' : '▼') : '↕'}
  </span>
);
const SortableTh = ({ field, label, sort, onSort, className = "" }) => (
  <th className={"font-medium px-2 py-2 " + className}>
    <button onClick={() => onSort(field)}
      className="inline-flex items-center gap-1 hover:text-stone-900 select-none uppercase tracking-wide cursor-pointer">
      <span>{label}</span>
      <SortArrow active={sort.by === field} dir={sort.dir}/>
    </button>
  </th>
);
const useSort = () => {
  const [sort, setSort] = useState({ by: null, dir: 'asc' });
  const onSort = (field) => setSort(s => {
    if (s.by !== field) return { by: field, dir: 'asc' };
    if (s.dir === 'asc')  return { by: field, dir: 'desc' };
    return { by: null, dir: 'asc' };
  });
  return [sort, onSort];
};
const sortRows = (rows, sort, valueOf = (r, f) => r[f]) => {
  if (!sort.by) return rows;
  const arr = [...rows];
  arr.sort((a, b) => {
    const av = valueOf(a, sort.by);
    const bv = valueOf(b, sort.by);
    let r;
    if (typeof av === 'number' && typeof bv === 'number') {
      r = (av || 0) - (bv || 0);
    } else {
      r = String(av || '').localeCompare(String(bv || ''), 'fr', { numeric: true, sensitivity: 'base' });
    }
    return sort.dir === 'asc' ? r : -r;
  });
  return arr;
};

const ImportButton = ({ onFile, label = "Importer Excel", variant = "outline" }) => {
  const ref = useRef(null);
  const handle = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      onFile(rows);
    } catch (err) {
      console.error(err);
      alert('Impossible de lire le fichier Excel : ' + err.message);
    }
  };
  const cls = variant === "primary"
    ? "bg-stone-900 text-white hover:bg-stone-800"
    : "bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-50";
  return (
    <>
      <input
        ref={ref} type="file" accept=".xlsx,.xls,.csv" onChange={handle} className="hidden"
      />
      <button
        onClick={() => ref.current?.click()}
        className={"inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg " + cls}
      >
        <Upload className="w-4 h-4"/>{label}
      </button>
    </>
  );
};

const DataMenu = ({ onImportExcel, onExportBackup, onRestoreBackup }) => {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const xlsxRef = useRef(null);
  const jsonRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const onExcel = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    setOpen(false);
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      onImportExcel(rows);
    } catch (err) { alert('Excel invalide : ' + err.message); }
  };
  const onJson = (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    setOpen(false);
    if (f) onRestoreBackup(f);
  };

  return (
    <div ref={ref} className="relative">
      <input ref={xlsxRef} type="file" accept=".xlsx,.xls,.csv" onChange={onExcel} className="hidden"/>
      <input ref={jsonRef} type="file" accept=".json,application/json" onChange={onJson} className="hidden"/>
      <button onClick={() => setOpen(o => !o)}
        className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-50">
        <Save className="w-4 h-4"/>Données
        <ChevronDown className="w-3 h-3"/>
      </button>
      {open && (
        <div className="absolute right-0 mt-1 w-60 bg-white ring-1 ring-stone-200 rounded-lg shadow-lg py-1 z-40">
          <MenuItem icon={<Upload className="w-4 h-4"/>} label="Importer Excel"
            sub="Mois courant" onClick={() => xlsxRef.current?.click()}/>
          <div className="border-t border-stone-100 my-1"/>
          <MenuItem icon={<Save className="w-4 h-4"/>} label="Sauvegarder (JSON)"
            sub="Tous les mois" onClick={() => { onExportBackup(); setOpen(false); }}/>
          <MenuItem icon={<Upload className="w-4 h-4"/>} label="Restaurer (JSON)"
            sub="Importer une sauvegarde" onClick={() => jsonRef.current?.click()}/>
        </div>
      )}
    </div>
  );
};

const ImportWizard = ({ open, onClose, onConfirmImport }) => {
  const [step, setStep] = useState(1);   // 1 = type, 2 = upload, 3 = parsing, 4 = recap
  const [type, setType] = useState(null); // 'bank' | 'card'
  const [file, setFile] = useState(null);
  const [parseResult, setParseResult] = useState(null);
  const [drag, setDrag] = useState(false);
  const fileRef = useRef(null);

  const reset = () => {
    setStep(1); setType(null); setFile(null); setParseResult(null); setDrag(false);
  };
  const cancelAll = () => { reset(); onClose(); };

  // Reset when reopened
  useEffect(() => { if (open) reset(); }, [open]);

  // Esc to close
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === 'Escape') cancelAll(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open]);

  // Trigger parsing as soon as we enter step 3
  useEffect(() => {
    if (!open || step !== 3 || !file || !type) return;
    let cancelled = false;
    const parser = type === 'bank' ? parseBankStatement : parseCardStatement;
    parser(file).then(res => {
      if (cancelled) return;
      setParseResult(res);
      setStep(4);
    }).catch(err => {
      if (cancelled) return;
      alert("Erreur de parsing : " + err.message);
      setStep(2);
    });
    return () => { cancelled = true; };
  }, [open, step, file, type]);

  const chooseType = (t) => { setType(t); setStep(2); };
  const acceptFile = (f) => {
    if (!f) return;
    if (!/\.(xlsx|xls|csv)$/i.test(f.name)) {
      alert("Format non supporté. Choisissez un fichier .xlsx, .xls ou .csv.");
      return;
    }
    setFile(f);
    setStep(3);
  };
  const confirmImport = () => {
    if (onConfirmImport && parseResult) onConfirmImport(parseResult);
    cancelAll();
  };

  if (!open) return null;

  const stepLabels = ["Type", "Fichier", "Analyse", "Récap"];
  const typeLabel = type === 'bank' ? 'Relevé bancaire Hapoalim'
                  : type === 'card' ? 'Cartes de crédit'
                  : '';

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center p-4"
         onClick={cancelAll}>
      <div className="bg-white rounded-xl shadow-xl ring-1 ring-stone-200 w-full max-w-xl flex flex-col max-h-[90vh]"

            {type && (
              <p className="text-xs text-stone-500 mt-0.5">{typeLabel}{file ? ` · ${file.name}` : ''}</p>
            )}
          </div>
          <button onClick={cancelAll}
            className="p-1.5 -m-1.5 rounded hover:bg-stone-100 text-stone-400 hover:text-stone-700">
            <X className="w-4 h-4"/>
          </button>
        </header>

        {/* Stepper */}
        <div className="px-5 py-3 border-b border-stone-100 flex items-center gap-2 text-xs">
          {stepLabels.map((label, i) => {
            const n = i + 1;
            const done = step > n, active = step === n;
            return (
              <React.Fragment key={label}>
                <div className={
                  "inline-flex items-center gap-1.5 " +
                  (active ? "text-stone-900 font-medium" : done ? "text-emerald-600" : "text-stone-400")
                }>
                  <span className={
                    "inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-semibold " +
                    (active ? "bg-stone-900 text-white"
                            : done ? "bg-emerald-100 text-emerald-700"
                                   : "bg-stone-100 text-stone-500")
                  }>

                  <span>{label}</span>
                </div>
                {i < stepLabels.length - 1 && <div className="flex-1 h-px bg-stone-200"/>}
              </React.Fragment>

        <div className="p-5 overflow-auto flex-1">

            </div>

              <p className="text-xs text-stone-400 mt-1">{file?.name}</p>
            </div>

          {step === 4 && parseResult && (
            <div>
              <div className="rounded-lg ring-1 ring-stone-200 bg-stone-50 p-4">

                <div className="mt-2 text-sm text-stone-800">{parseResult.summary || '—'}</div>

                  <div>Type : <span className="text-stone-700">{typeLabel}</span></div>
                  <div>Fichier : <span className="text-stone-700">{parseResult.fileName || file?.name}</span></div>

/* =========================================================
   App
   ========================================================= */
function App() {
  const today = new Date();
  const [year, setYear]   = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const key = monthKey(year, month);

  const [data, setData] = useState(() => loadMonth(key));
  const [saved, setSaved] = useState(false);
  const [pendingImport, setPendingImport] = useState(null); // { rows, cols }
  const [importToast, setImportToast] = useState(null);
  const [reportModal, setReportModal] = useState(null); // { items, fromKey }
  const [wizardOpen, setWizardOpen] = useState(false);
  const skipNextSave = useRef(true);

  // Mois précédent
  const prevYM = month === 1 ? { y: year - 1, m: 12 } : { y: year, m: month - 1 };
  const prevKey = monthKey(prevYM.y, prevYM.m);
  const prevData = useMemo(() => loadMonth(prevKey), [prevKey, saved]);
  const hasPrevMonth = (prevData.expenses.length + prevData.incomes.length) > 0;
  const prevEndBalance = useMemo(() => {
    const opening  = Number(prevData.openingBalance) || 0;
    const received = prevData.incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
    const paid     = prevData.expenses.reduce((s, e) => s + (Number(e.paid)    || 0), 0);
    return opening + received - paid;
  }, [prevData]);
  const prevLabel = monthLabel(prevYM.y, prevYM.m);

  // Recharger les données quand on change de mois
  useEffect(() => {
    skipNextSave.current = true;
    setData(loadMonth(key));
  }, [key]);

  // Auto-save (debounce 500ms)
  useEffect(() => {
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    const t = setTimeout(() => {
      saveMonth(key, data);
      setSaved(true);
      const f = setTimeout(() => setSaved(false), 1500);
      return () => clearTimeout(f);
    }, 500);
    return () => clearTimeout(t);
  }, [data, key]);

  // Navigation
  const prev = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); }
    else setMonth(m => m - 1);
  };
  const next = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); }
    else setMonth(m => m + 1);
  };

  // CRUD - Expenses
  const addExpense = () => setData(d => ({
    ...d,
    expenses: [{
      id: uid(), name: '', type: '', amount: 0, day: 1, mode: 'bank', cardNumber: '', notes: '', paid: 0,
    }, ...d.expenses],
  }));
  const updateExpense = (id, patch) => setData(d => ({
    ...d, expenses: d.expenses.map(e => e.id === id ? { ...e, ...patch } : e),
  }));
  const removeExpense = (id) => setData(d => ({ ...d, expenses: d.expenses.filter(e => e.id !== id) }));
  const removeManyExpenses = (ids) => {
    const set = new Set(ids);
    setData(d => ({ ...d, expenses: d.expenses.filter(e => !set.has(e.id)) }));
  };

  // CRUD - Incomes
  const addIncome = () => setData(d => ({
    ...d,
    incomes: [{ id: uid(), name: '', amount: 0, day: 1, received: 0 }, ...d.incomes],
  }));
  const updateIncome = (id, patch) => setData(d => ({
    ...d, incomes: d.incomes.map(i => i.id === id ? { ...i, ...patch } : i),
  }));
  const removeIncome = (id) => setData(d => ({ ...d, incomes: d.incomes.filter(i => i.id !== id) }));
  const removeManyIncomes = (ids) => {
    const set = new Set(ids);
    setData(d => ({ ...d, incomes: d.incomes.filter(i => !set.has(i.id)) }));
  };

  const patchData = (patch) => setData(d => ({ ...d, ...patch }));

  // ---- Import Excel ----
  const applyImport = (rows, colIdx) => {
    const { expenses, incomes } = parseSheetToMonth(rows, colIdx);
    if (expenses.length === 0 && incomes.length === 0) {
      alert("Aucune ligne exploitable détectée dans cette colonne.");
      return;
    }
    if (data.expenses.length || data.incomes.length) {
      const ok = confirm(
        `Le mois actuel contient déjà ${data.expenses.length} dépense(s) et ${data.incomes.length} encaissement(s). ` +
        `Remplacer par ${expenses.length} dépense(s) et ${incomes.length} encaissement(s) ?`
      );
      if (!ok) return;
    }
    setData(d => ({ ...d, expenses, incomes }));
    setImportToast(`${expenses.length} dépenses · ${incomes.length} encaissements importés`);
    setTimeout(() => setImportToast(null), 3000);
  };

  const handleImportFile = (rows) => {
    const cols = detectMonthColumns(rows);
    if (cols.length === 0) {
      alert("Aucune colonne de montants détectée dans ce fichier.");
      return;
    }
    if (cols.length === 1) {
      applyImport(rows, cols[0].index);
    } else {
      setPendingImport({ rows, cols });
    }
  };

  const handleChooseColumn = (colIdx) => {
    if (!pendingImport) return;
    applyImport(pendingImport.rows, colIdx);
    setPendingImport(null);
  };

  // ---- Sauvegarde / restauration JSON ----
  const exportBackup = () => {
    const dump = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('month:')) continue;
      try { dump[k] = JSON.parse(localStorage.getItem(k)); }
      catch { dump[k] = localStorage.getItem(k); }
    }
    const payload = {
      app: 'cashflow',
      version: 1,
      exportedAt: new Date().toISOString(),
      data: dump,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cashflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setImportToast(`Sauvegarde : ${Object.keys(dump).length} mois exportés`);
    setTimeout(() => setImportToast(null), 3000);
  };

  const restoreBackup = async (file) => {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const months = parsed?.data && typeof parsed.data === 'object' ? parsed.data : null;
      if (!months) { alert("Format de sauvegarde invalide."); return; }
      const monthKeys = Object.keys(months).filter(k => k.startsWith('month:'));
      if (monthKeys.length === 0) { alert("Aucun mois trouvé dans le fichier."); return; }
      if (!confirm(`Restaurer ${monthKeys.length} mois ? Les données existantes pour ces mois seront écrasées.`)) return;
      for (const k of monthKeys) {
        localStorage.setItem(k, JSON.stringify(months[k]));
      }
      skipNextSave.current = true;
      setData(loadMonth(key));
      setImportToast(`Restauration : ${monthKeys.length} mois importés`);
      setTimeout(() => setImportToast(null), 3000);
    } catch (err) {
      alert("Impossible de lire le fichier : " + err.message);
    }
  };

  // ---- Reporter non-payés ----
  const openReportModal = () => {
    const prev = loadMonth(prevKey);
    const unpaid = prev.expenses.filter(e => {
      const remaining = (Number(e.amount) || 0) - (Number(e.paid) || 0);
      return remaining > 0;
    });
    if (unpaid.length === 0) {
      alert("Tous les postes du mois précédent ont été payés.");
      return;
    }
    setReportModal({ items: unpaid, fromKey: prevKey });
  };

  const applyReportUnpaid = (selectedIds) => {
    if (!reportModal) return;
    const set = new Set(selectedIds);
    const fromKey = reportModal.fromKey;
    const newExpenses = reportModal.items
      .filter(it => set.has(it.id))
      .map(it => ({
        id: uid(),
        name: it.name,
        type: it.type || '',
        amount: Math.max(0, (Number(it.amount) || 0) - (Number(it.paid) || 0)),
        day: it.day,
        mode: it.mode,
        cardNumber: it.cardNumber || '',
        notes: it.notes || '',
        paid: 0,
        reportedFrom: fromKey,
      }));
    setData(d => ({ ...d, expenses: [...newExpenses, ...d.expenses] }));
    setReportModal(null);
    setImportToast(`${newExpenses.length} poste${newExpenses.length > 1 ? 's' : ''} reporté${newExpenses.length > 1 ? 's' : ''}`);
    setTimeout(() => setImportToast(null), 3000);
  };

  // ---- Copier mois précédent ----
  const applyCopyPrev = () => {
    const prev = loadMonth(prevKey);
    if (prev.expenses.length === 0 && prev.incomes.length === 0) {
      alert("Aucune donnée pour le mois précédent.");
      return;
    }
    const expenses = prev.expenses.map(e => ({
      id: uid(),
      name: e.name,
      type: e.type || '',
      amount: Number(e.amount) || 0,
      day: e.day,
      mode: e.mode,
      cardNumber: e.cardNumber || '',
      notes: e.notes || '',
      paid: 0,
    }));
    const incomes = prev.incomes.map(i => ({
      id: uid(),
      name: i.name,
      amount: Number(i.amount) || 0,
      day: i.day,
      received: 0,
    }));
    setData(d => ({
      ...d,
      openingBalance: 0,
      targetBalance: Number(prev.targetBalance) || 0,
      expenses,
      incomes,
    }));
    setImportToast(`Mois précédent copié : ${expenses.length} dépenses · ${incomes.length} encaissements`);
    setTimeout(() => setImportToast(null), 3000);
  };

  // Computations
  const totals = useMemo(() => {
    const expPlanned   = data.expenses.reduce((s, e) => s + (Number(e.amount)   || 0), 0);
    const expPaid      = data.expenses.reduce((s, e) => s + (Number(e.paid)     || 0), 0);
    const expRemaining = expPlanned - expPaid;
    const incPlanned   = data.incomes.reduce((s, i) => s + (Number(i.amount)   || 0), 0);
    const incReceived  = data.incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
    const incRemaining = incPlanned - incReceived;
    const opening      = Number(data.openingBalance) || 0;
    const current      = opening + incReceived - expPaid;
    const projected    = current + incRemaining - expRemaining;
    const target       = Number(data.targetBalance) || 0;
    const additionalNeeded = Math.max(0, target - projected);
    // Variances : écart entre réel et prévu, sur les lignes effectivement payées/reçues
    let varExp = 0, varExpCount = 0;
    for (const e of data.expenses) {
      const p = Number(e.paid) || 0, a = Number(e.amount) || 0;
      if (p > 0) { varExp += (p - a); varExpCount++; }
    }
    let varInc = 0, varIncCount = 0;
    for (const i of data.incomes) {
      const r = Number(i.received) || 0, a = Number(i.amount) || 0;
      if (r > 0) { varInc += (r - a); varIncCount++; }
    }
    return { expPlanned, expPaid, expRemaining, incPlanned, incReceived, incRemaining,
             opening, current, projected, target, additionalNeeded,
             varExp, varExpCount, varInc, varIncCount };
  }, [data]);

  const isEmpty = data.expenses.length === 0 && data.incomes.length === 0;

  return (
    <div className="min-h-screen">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">
        <Header year={year} month={month} onPrev={prev} onNext={next} saved={saved}
                onImportFile={handleImportFile}
                onExportBackup={exportBackup}
                onRestoreBackup={restoreBackup}
                onOpenImportWizard={() => setWizardOpen(true)}/>

        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_360px] gap-6">
          <main className="space-y-6 min-w-0">
            {isEmpty ? (
              <EmptyState
                onManual={addExpense}
                onCopyPrev={applyCopyPrev}
                onReportUnpaid={openReportModal}
                onImportFile={handleImportFile}
                hasPrevMonth={hasPrevMonth}
              />
            ) : (
              <>
                <ExpensesTable
                  expenses={data.expenses}
                  onAdd={addExpense}
                  onUpdate={updateExpense}
                  onRemove={removeExpense}
                  onRemoveMany={removeManyExpenses}
                  onReportUnpaid={openReportModal}
                  hasPrevMonth={hasPrevMonth}
                />
                <IncomesTable
                  incomes={data.incomes}
                  onAdd={addIncome}
                  onUpdate={updateIncome}
                  onRemove={removeIncome}
                  onRemoveMany={removeManyIncomes}
                />
              </>
            )}
          </main>

          <Sidebar data={data} totals={totals} onPatch={patchData}
                   prevEndBalance={prevEndBalance}
                   prevLabel={hasPrevMonth ? prevLabel : null}/>
        </div>

        <footer className="mt-10 pt-6 border-t border-stone-200 text-xs text-stone-400 text-center">
          Données stockées localement dans votre navigateur (localStorage).
          Clé du mois en cours : <code className="font-mono">month:{key}</code>
        </footer>
      </div>

      <ImportModal
        pending={pendingImport}
        onChoose={handleChooseColumn}
        onCancel={() => setPendingImport(null)}
      />

      <ReportUnpaidModal
        open={!!reportModal}
        items={reportModal?.items || []}
        fromKey={reportModal?.fromKey}
        toLabel={monthLabel(year, month)}
        onCancel={() => setReportModal(null)}
        onConfirm={applyReportUnpaid}
      />

      <ImportWizard
        open={wizardOpen}
        onClose={() => setWizardOpen(false)}
        onConfirmImport={(result) => {
          // Stub : aucun changement de données pour l'instant.
          // L'intégration réelle sera branchée dans les prochains prompts
          // via loadImportedTx / saveImportedTx et loadCardsSnapshot / saveCardsSnapshot.
          console.log('Import confirmé (stub) :', result);
          setImportToast(`Import confirmé (stub) — ${result?.kind === 'bank' ? 'bancaire' : 'cartes'}`);
          setTimeout(() => setImportToast(null), 3000);
        }}
      />

      {importToast && (
        <div className="fixed bottom-4 right-4 z-50 bg-emerald-600 text-white text-sm px-4 py-2 rounded-lg shadow-lg flex items-center gap-2">
          <Check className="w-4 h-4"/>{importToast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
