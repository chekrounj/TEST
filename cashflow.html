<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   Helpers
   ========================================================= */
const formatILS = (n) => {
  const v = Math.round(Number(n) || 0);
  const sign = v < 0 ? '-' : '';
  return sign + '₪ ' + Math.abs(v).toLocaleString('fr-FR');
};
const uid = () =>
  (crypto.randomUUID ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36));
const monthKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
const monthLabel = (y, m) => {
  const s = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
};

const emptyMonth = () => ({
  openingBalance: 0,
  targetBalance: 0,
  unaffectedExpenses: 0,
  expenses: [],
  incomes: [],
});

const loadMonth = (key) => {
  try {
    const raw = localStorage.getItem('month:' + key);
    if (!raw) return emptyMonth();
    return { ...emptyMonth(), ...JSON.parse(raw) };
  } catch { return emptyMonth(); }
};
const saveMonth = (key, data) => {
  localStorage.setItem('month:' + key, JSON.stringify(data));
};

/* ---------- Imported transactions (bank) — global dedup index ---------- */
// "transactions:imported" → { [refKey]: { date, amount, description, importedAt, monthKey } }
const loadImportedTx = () => {
  try { return JSON.parse(localStorage.getItem('transactions:imported') || '{}'); }
  catch { return {}; }
};
const saveImportedTx = (obj) => {
  localStorage.setItem('transactions:imported', JSON.stringify(obj));
};

/* ---------- Cards snapshot (current state, not a journal) ---------- */
// "cards:current" → { [cardNumber]: { upcomingAmount, debitDate, lastImportedAt, paidAt? } }
const loadCardsSnapshot = () => {
  try { return JSON.parse(localStorage.getItem('cards:current') || '{}'); }
  catch { return {}; }
};
const saveCardsSnapshot = (obj) => {
  localStorage.setItem('cards:current', JSON.stringify(obj));
};

/* ---------- Match rules (learned patterns → poste names) ---------- */
// "matchRules" → [{ id, pattern, patternType, matchTo: { type, postName }, createdAt, hitCount }]
const loadMatchRules = () => {
  try { return JSON.parse(localStorage.getItem('matchRules') || '[]'); }
  catch { return []; }
};
const saveMatchRules = (rules) => {
  localStorage.setItem('matchRules', JSON.stringify(rules));
};
const ruleMatchesText = (rule, text) => {
  const t = String(text || '');
  if (!rule || !rule.pattern) return false;
  if (rule.patternType === 'regex') {
    try { return new RegExp(rule.pattern, 'i').test(t); }
    catch { return false; }
  }
  return t.toLowerCase().includes(String(rule.pattern).toLowerCase());
};

/* ---------- Statement parsers ---------- */
// Date Excel → 'YYYY-MM-DD' en local (évite les décalages de timezone que provoquerait toISOString).
const dateToISO = (d) => {
  if (!(d instanceof Date) || isNaN(d)) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const parseStringDate = (s) => {
  if (typeof s !== 'string') return null;
  const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (!m) return null;
  let yy = m[3];
  if (yy.length === 2) yy = (Number(yy) > 50 ? '19' : '20') + yy;
  return `${yy}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
};

/* ---------- Matching helpers (bank → expenses / incomes) ---------- */
const CARD_KEYWORDS = [
  'אמריקן אקספרס', 'ישראכרט', 'אקספרס',
  'ויזה כאל', 'כרטיס אשראי', 'אשראי',
];
const isCardDebit = (description) => {
  if (!description) return false;
  return CARD_KEYWORDS.some(k => description.includes(k));
};

// Extrait le nom de la contrepartie depuis le champ "פרטים" (col D).
// Patterns rencontrés : "המבצע: <NOM> עבור: ...", "לטובת: <NOM> עבור: ...",
// "לטובת: <NOM>", éventuellement précédé d'autres infos.
const extractDetailsName = (details) => {
  if (!details) return '';
  const m = details.match(/(?:לטובת|המבצע)\s*:\s*([^]*?)(?:\s+עבור\s*:|$)/);
  if (m && m[1]) return m[1].trim();
  return '';
};

// Nom de poste à utiliser quand on transforme une transaction bancaire
// en ligne du mois : on combine description (col C) + détails (col D).
const buildPosteName = (description, details) => {
  const extracted = extractDetailsName(details);
  if (extracted) return extracted;
  const d = (description || '').trim();
  const det = (details || '').trim();
  if (!det) return d;
  if (!d)   return det;
  return `${d} — ${det}`;
};

const findMatchCandidates = (items, description, details) => {
  const desc = (description || '').toLowerCase().trim();
  const det  = (details     || '').toLowerCase().trim();
  const full = (desc + ' ' + det).trim();
  if (!full) return [];
  return items.filter(item => {
    const name = (item.name || '').toLowerCase().trim();
    if (!name) return false;
    // Le nom du poste apparaît dans description+details (cas le plus large)
    if (full.includes(name)) return true;
    // Ou la description courte est elle-même contenue dans le nom du poste
    if (desc && name.includes(desc)) return true;
    return false;
  });
};
const pickBestCandidate = (candidates, targetAmount, targetDay) => {
  const sorted = [...candidates].sort((a, b) => {
    const da = Math.abs((Number(a.amount) || 0) - targetAmount);
    const db = Math.abs((Number(b.amount) || 0) - targetAmount);
    if (da !== db) return da - db;
    return Math.abs((a.day || 1) - targetDay) - Math.abs((b.day || 1) - targetDay);
  });
  return sorted[0];
};
const matchBankTransactions = (newTransactions) => {
  const monthCache = {};
  const ensureMonth = (k) => (monthCache[k] = monthCache[k] || loadMonth(k));
  const rules = loadMatchRules();
  const ruleHits = {}; // ruleId → count
  const orphanRuleIds = new Set();

  // tente de matcher via les règles apprises
  const tryRules = (tx, items, kind) => {
    for (const rule of rules) {
      if (!rule || rule.matchTo?.type !== kind) continue;
      const haystack = (tx.description || '') + ' ' + (tx.details || '');
      if (!ruleMatchesText(rule, haystack)) continue;
      const targetName = (rule.matchTo.postName || '').trim();
      const target = items.find(item => (item.name || '').trim() === targetName);
      if (target) return { ruleId: rule.id, target };
      orphanRuleIds.add(rule.id);
    }
    return null;
  };

  const matched = [];
  const unmatched = [];
  const cardDebits = [];

  for (const tx of newTransactions) {
    const monthKey = tx.date.slice(0, 7);
    const month = ensureMonth(monthKey);
    const day = parseInt(tx.date.slice(8, 10), 10) || 1;
    const enriched = { ...tx, monthKey };

    if (tx.direction === 'out') {
      if (isCardDebit(tx.description)) {
        cardDebits.push({ ...enriched, type: 'card-debit', cardNumber: String(tx.reference) });
        continue;
      }
      const cands = findMatchCandidates(month.expenses, tx.description, tx.details);
      if (cands.length > 0) {
        const best = pickBestCandidate(cands, tx.debit, day);
        matched.push({
          transaction: enriched, monthKey, kind: 'expense',
          expenseId: best.id, expenseName: best.name,
          appliedAmount: tx.debit,
        });
      } else {
        const ruleHit = tryRules(tx, month.expenses, 'expense');
        if (ruleHit) {
          ruleHits[ruleHit.ruleId] = (ruleHits[ruleHit.ruleId] || 0) + 1;
          matched.push({
            transaction: enriched, monthKey, kind: 'expense',
            expenseId: ruleHit.target.id, expenseName: ruleHit.target.name,
            appliedAmount: tx.debit, viaRule: ruleHit.ruleId,
          });
        } else {
          unmatched.push(enriched);
        }
      }
    } else { // 'in'
      const cands = findMatchCandidates(month.incomes, tx.description, tx.details);
      if (cands.length > 0) {
        const best = pickBestCandidate(cands, tx.credit, day);
        matched.push({
          transaction: enriched, monthKey, kind: 'income',
          incomeId: best.id, incomeName: best.name,
          appliedAmount: tx.credit,
        });
      } else {
        const ruleHit = tryRules(tx, month.incomes, 'income');
        if (ruleHit) {
          ruleHits[ruleHit.ruleId] = (ruleHits[ruleHit.ruleId] || 0) + 1;
          matched.push({
            transaction: enriched, monthKey, kind: 'income',
            incomeId: ruleHit.target.id, incomeName: ruleHit.target.name,
            appliedAmount: tx.credit, viaRule: ruleHit.ruleId,
          });
        } else {
          unmatched.push(enriched);
        }
      }
    }
  }
  return { matched, unmatched, cardDebits, ruleHits, orphanRuleIds: [...orphanRuleIds] };
};

const parseBankStatement = async (file) => {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

  // Lignes 1-5 = titres / en-têtes ; les transactions commencent à l'index 5 (ligne 6).
  const transactions = [];
  for (let i = 5; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;

    let date = null;
    if (row[0] instanceof Date) date = dateToISO(row[0]);
    else if (typeof row[0] === 'string') date = parseStringDate(row[0]);
    if (!date) continue;

    const debit  = Number(row[6]) || 0;
    const credit = Number(row[7]) || 0;
    if (debit === 0 && credit === 0) continue;

    const reference = String(row[4] || '').trim();
    const amount    = debit - credit; // positif = sortie, négatif = entrée

    transactions.push({
      reference,
      date,
      description: String(row[2] || '').trim(),
      details:     String(row[3] || '').trim(),
      debit, credit,
      balance: Number(row[8]) || 0,
      amount,
      direction: debit > 0 ? 'out' : 'in',
      referenceKey: `${reference}|${date}|${amount}`,
    });
  }

  // Déduplication par rapport à l'index global
  const existing = loadImportedTx();
  const newTransactions = [];
  const duplicates = [];
  for (const t of transactions) {
    if (existing[t.referenceKey]) duplicates.push(t);
    else newTransactions.push(t);
  }

  const sortedDates = transactions.map(t => t.date).sort();
  const dateRange = sortedDates.length
    ? { from: sortedDates[0], to: sortedDates[sortedDates.length - 1] }
    : { from: null, to: null };

  const { matched, unmatched, cardDebits } = matchBankTransactions(newTransactions);

  return {
    kind: 'bank',
    fileName: file.name,
    summary: `${matched.length} matchées · ${unmatched.length} à traiter · ${cardDebits.length} débits cartes · ${duplicates.length} doublons`,
    rows: transactions,
    newTransactions,
    duplicates,
    dateRange,
    total: transactions.length,
    matched,
    unmatched,
    cardDebits,
    ignored: [],
  };
};

const parseCardStatement = async (file) => {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

  // Repérer toutes les lignes d'en-tête "שם כרטיס" (col 0) — il y en a deux dans
  // le format Hapoalim (achats en Israël + achats à l'étranger).
  const headerIndices = [];
  for (let i = 0; i < rows.length; i++) {
    const c0 = String((rows[i] || [])[0] || '').trim();
    if (c0 === 'שם כרטיס') headerIndices.push(i);
  }

  const isILSCurrency = (cur) => {
    const c = String(cur || '').trim();
    if (!c) return true; // section Israël : pas de col devise → ILS implicite
    return c === 'ש"ח' || c === "ש''ח" || c === 'ש״ח' || c.toUpperCase() === 'ILS';
  };

  const warnings = new Set();
  const entries = [];
  for (const start of headerIndices) {
    for (let i = start + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      const c0 = String(row[0] || '').trim();
      const c1 = row[1];
      const c2 = row[2];

      // Ligne vide → fin de section
      if (!c0 && (c1 == null || c1 === '') && (c2 == null || c2 === '')) break;
      // Ligne titre (un seul mot non-vide en col 0, col 1 vide) → fin
      if (c0 && (c1 == null || c1 === '') && (c2 == null || c2 === '')) break;
      // Nouvel en-tête → fin
      if (c0 === 'שם כרטיס') break;

      const cardNumber = c0;
      const amount = Number(c1) || 0;
      const debitDate = c2 instanceof Date ? dateToISO(c2)
                      : (typeof c2 === 'string' ? parseStringDate(c2) : null);
      const currency = String(row[3] || '').trim();

      if (!cardNumber || !debitDate) continue;
      if (!isILSCurrency(currency)) {
        warnings.add(`Achats en ${currency} ignorés pour l'instant — support à venir`);
        continue;
      }
      if (amount === 0) continue; // ligne future sans montant connu

      entries.push({ cardNumber, amount, debitDate, currency: 'ILS' });
    }
  }

  // Agrégation par cardNumber + debitDate
  const aggregated = new Map();
  for (const e of entries) {
    const key = `${e.cardNumber}|${e.debitDate}`;
    const existing = aggregated.get(key);
    if (existing) existing.amount += e.amount;
    else aggregated.set(key, { ...e });
  }

  // Delta par rapport au snapshot courant (pour affichage)
  const snap = loadCardsSnapshot();
  const cards = [...aggregated.values()].map(e => {
    const prev = snap[e.cardNumber];
    return {
      cardNumber: e.cardNumber,
      upcomingAmount: e.amount,
      debitDate: e.debitDate,
      currency: e.currency,
      prevAmount: prev ? prev.upcomingAmount : null,
      prevDebitDate: prev ? prev.debitDate : null,
    };
  });

  return {
    kind: 'card',
    fileName: file.name,
    summary: `${cards.length} carte${cards.length > 1 ? 's' : ''} détectée${cards.length > 1 ? 's' : ''}`,
    cards,
    warnings: [...warnings],
  };
};

/* ---------- Postes (expenses) Excel export / import ---------- */
const exportExpensesToExcel = (expenses, monthKeyStr) => {
  const headers = [
    'Fournisseur / poste', 'Type', 'Prévu (ILS)', 'Jour',
    'Mode', 'N° carte', 'Payé (ILS)', 'Notes', 'Reporté de',
  ];
  const rows = expenses.map(e => [
    e.name || '',
    e.type || '',
    Number(e.amount) || 0,
    Number(e.day) || 1,
    e.mode === 'card' ? 'CB' : 'Banque',
    e.cardNumber || '',
    Number(e.paid) || 0,
    e.notes || '',
    e.reportedFrom || '',
  ]);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = [
    { wch: 30 }, { wch: 16 }, { wch: 12 }, { wch: 6 },
    { wch: 8 },  { wch: 12 }, { wch: 12 }, { wch: 24 }, { wch: 10 },
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Postes');
  XLSX.writeFile(wb, `postes-${monthKeyStr}.xlsx`);
};

const parseExpensesFromExcel = async (file) => {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  if (rows.length === 0) return [];

  const header = (rows[0] || []).map(h => String(h || '').toLowerCase());
  const findCol = (kws) => {
    for (let i = 0; i < header.length; i++) {
      if (kws.some(k => header[i].includes(k))) return i;
    }
    return -1;
  };
  const colName     = findCol(['fournisseur', 'poste', 'libellé', 'libelle', 'description']);
  const colType     = findCol(['type', 'catégorie', 'categorie']);
  const colAmount   = findCol(['prévu', 'prevu', 'montant', 'amount']);
  const colDay      = findCol(['jour', 'day']);
  const colMode     = findCol(['mode']);
  const colCard     = findCol(['n° carte', 'no carte', 'numéro carte', 'numero carte', 'carte', 'card']);
  const colPaid     = findCol(['payé', 'paye', 'paid']);
  const colNotes    = findCol(['note', 'remarque']);
  const colReported = findCol(['reporté', 'reporte', 'reported']);

  if (colName < 0) {
    throw new Error("Colonne « Fournisseur / poste » introuvable dans la 1re ligne.");
  }

  const expenses = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row) continue;
    const name = String(row[colName] || '').trim();
    if (!name) continue;

    const modeRaw = String(colMode >= 0 ? row[colMode] : '').trim().toLowerCase();
    const mode = (modeRaw === 'cb' || modeRaw === 'card' || modeRaw === 'carte' || modeRaw === 'credit')
      ? 'card' : 'bank';

    const reportedRaw = colReported >= 0 ? String(row[colReported] || '').trim() : '';
    expenses.push({
      id: uid(),
      name,
      type:       colType   >= 0 ? String(row[colType]   || '').trim() : '',
      amount:     colAmount >= 0 ? (Number(row[colAmount]) || 0) : 0,
      day:        colDay    >= 0 ? Math.max(1, Math.min(31, Number(row[colDay]) || 1)) : 1,
      mode,
      cardNumber: colCard   >= 0 ? String(row[colCard]   || '').trim() : '',
      notes:      colNotes  >= 0 ? String(row[colNotes]  || '').trim() : '',
      paid:       colPaid   >= 0 ? (Number(row[colPaid])  || 0) : 0,
      ...(reportedRaw ? { reportedFrom: reportedRaw } : {}),
    });
  }
  return expenses;
};

/* =========================================================
   Excel import helpers
   ========================================================= */
const parseAmount = (v) => {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  const s = String(v).trim();
  if (!s || s === '-' || s === '—' || s === '–') return 0;
  // Strip ₪, NBSP/narrow NBSP, regular spaces, thousand separators
  const cleaned = s.replace(/[\s  ₪]/g, '').replace(/,/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
};

const cleanCardName = (raw) =>
  raw.replace(/💳/g, '')
     .replace(/CARTE/gi, '')
     .replace(/\(fournisseurs?\)/gi, '')
     .replace(/\(.*?\)/g, '')
     .trim();

const parseSheetToMonth = (rows, colIdx) => {
  let section = null;          // 'income' | 'expense' | null
  let mode = 'bank';
  let card = '';
  const expenses = [];
  const incomes = [];

  for (const row of rows) {
    const rawName = row?.[0];
    if (rawName == null) continue;
    const name = String(rawName).trim();
    if (!name) continue;

    const upper = name.toUpperCase();

    // Section: ENTRÉES (RECETTES)
    if (upper.includes('ENTRÉES') || upper.includes('ENTREES') ||
        upper === 'RECETTES' || upper.startsWith('RECETTES')) {
      if (upper.startsWith('TOTAL')) continue;
      section = 'income';
      continue;
    }
    // Section: SORTIES (DÉPENSES)
    if (upper.includes('SORTIES') || upper.includes('DÉPENSES') || upper.includes('DEPENSES')) {
      if (upper.startsWith('TOTAL')) continue;
      section = 'expense';
      mode = 'bank';
      card = '';
      continue;
    }
    // Sub-section: BANQUE
    if (name.includes('🏦') || /\bBANQUE\b/i.test(name) || /\bBANK\b/i.test(name) || /HAPOALIM/i.test(name)) {
      mode = 'bank';
      card = '';
      continue;
    }
    // Sub-section: CARTE
    if (name.includes('💳') || /\bCARTE\b/i.test(name)) {
      mode = 'card';
      card = cleanCardName(name);
      continue;
    }
    // Skip total / sub-total rows
    if (upper.startsWith('TOTAL') || upper.startsWith('SOUS-TOTAL') ||
        upper.startsWith('SOUS TOTAL')) continue;
    if (upper.startsWith('AUTRES ENTRÉES') || upper.startsWith('AUTRES ENTREES') ||
        upper.startsWith('AUTRES SORTIES')) continue;
    if (upper === 'CATÉGORIE' || upper === 'CATEGORIE') continue;

    if (!section) continue;

    const amount = parseAmount(row[colIdx]);

    if (section === 'income') {
      incomes.push({ id: uid(), name, amount, day: 1, received: 0 });
    } else {
      expenses.push({
        id: uid(), name, type: '', amount, day: 1,
        mode, cardNumber: card, notes: '', paid: 0,
      });
    }
  }

  return { expenses, incomes };
};

// Détecte les colonnes contenant des montants (au moins une valeur numérique non nulle)
const detectMonthColumns = (rows) => {
  const header = rows[0] || [];
  const maxC = Math.max(header.length, ...rows.slice(0, 30).map(r => (r || []).length), 6);
  const cols = [];
  for (let c = 1; c < maxC; c++) {
    let hasNum = false;
    for (let r = 1; r < Math.min(rows.length, 200); r++) {
      const v = rows[r]?.[c];
      if (typeof v === 'number' && v !== 0) { hasNum = true; break; }
      if (typeof v === 'string' && parseAmount(v) !== 0) { hasNum = true; break; }
    }
    if (hasNum) {
      const label = String(header[c] ?? '').trim() || `Colonne ${c + 1}`;
      cols.push({ index: c, label });
    }
  }
  return cols;
};

const expenseStatus = (e) => {
  const a = Number(e.amount) || 0, p = Number(e.paid) || 0;
  if (p <= 0) return 'unpaid';
  if (p < a) return 'partial';
  return 'paid';
};
const incomeStatus = (i) => {
  const a = Number(i.amount) || 0, r = Number(i.received) || 0;
  if (r <= 0) return 'pending';
  if (r < a) return 'partial';
  return 'received';
};

/* =========================================================
   SVG icons (lucide-style)
   ========================================================= */
const Svg = ({ children, className = "w-4 h-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const ChevronLeft  = (p) => <Svg {...p}><polyline points="15 18 9 12 15 6" /></Svg>;
const ChevronRight = (p) => <Svg {...p}><polyline points="9 18 15 12 9 6" /></Svg>;
const Plus  = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const Trash = (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Svg>;
const Check = (p) => <Svg {...p}><polyline points="20 6 9 17 4 12"/></Svg>;
const Sparkles = (p) => <Svg {...p}><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/><path d="M5 4l.5 1.5L7 6l-1.5.5L5 8l-.5-1.5L3 6l1.5-.5z"/></Svg>;
const Building = (p) => <Svg {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V14h6v8"/><line x1="8" y1="6" x2="8" y2="6"/><line x1="12" y1="6" x2="12" y2="6"/><line x1="16" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/></Svg>;
const CreditCard = (p) => <Svg {...p}><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></Svg>;
const Target = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Svg>;
const Wallet = (p) => <Svg {...p}><path d="M20 12V8H4a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></Svg>;
const TrendingUp = (p) => <Svg {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Svg>;
const Copy = (p) => <Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const ArrowRight = (p) => <Svg {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Svg>;

/* =========================================================
   Reusable inputs
   ========================================================= */
const TextInput = ({ value, onChange, placeholder, className = "" }) => (
  <input
    type="text" dir="auto" value={value || ''}
    onChange={e => onChange(e.target.value)}
    placeholder={placeholder}
    className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 " + className}
  />
);

// Champ texte qui retourne à la ligne automatiquement et s'agrandit
// pour afficher tout le contenu — utilisé pour les noms de postes longs.
const WrappingInput = ({ value, onChange, placeholder, className = "" }) => {
  const ref = useRef(null);
  const resize = () => {
    const el = ref.current; if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  };
  useEffect(() => { resize(); }, [value]);
  return (
    <textarea
      ref={ref} dir="auto" rows={1}
      value={value || ''}
      onChange={e => { onChange(e.target.value); resize(); }}
      onInput={resize}
      placeholder={placeholder}
      className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 resize-none overflow-hidden leading-snug " + className}
    />
  );
};
const NumInput = ({ value, onChange, min, max, className = "", placeholder }) => (
  <input
    type="number" inputMode="decimal" value={value === 0 ? '' : value}
    onChange={e => onChange(e.target.value === '' ? 0 : Number(e.target.value))}
    min={min} max={max} placeholder={placeholder ?? '0'}
    className={"w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 text-right tabular-nums " + className}
  />
);

/* =========================================================
   Status badges
   ========================================================= */
const Badge = ({ tone, children }) => {
  const tones = {
    gray:    'bg-stone-100 text-stone-600 ring-stone-200',
    amber:   'bg-amber-50 text-amber-700 ring-amber-200',
    emerald: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
  };
  return (
    <span className={"inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full ring-1 " + tones[tone]}>
      {children}
    </span>
  );
};
const ExpenseBadge = ({ status }) => {
  if (status === 'paid')    return <Badge tone="emerald"><Check className="w-3 h-3"/>Payé</Badge>;
  if (status === 'partial') return <Badge tone="amber">Partiel</Badge>;
  return <Badge tone="gray">À payer</Badge>;
};
const IncomeBadge = ({ status }) => {
  if (status === 'received') return <Badge tone="emerald"><Check className="w-3 h-3"/>Reçu</Badge>;
  if (status === 'partial')  return <Badge tone="amber">Partiel</Badge>;
  return <Badge tone="gray">Attendu</Badge>;
};

/* =========================================================
   Mode toggle (Banque / CB)
   ========================================================= */
const ModeToggle = ({ value, onChange, cardNumber, onCardChange }) => {
  const isCard = value === 'card';
  return (
    <div className="flex items-center gap-2">
      <button
        type="button"
        onClick={() => onChange(isCard ? 'bank' : 'card')}
        className={
          "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ring-1 transition " +
          (isCard
            ? "bg-violet-50 text-violet-700 ring-violet-200 hover:bg-violet-100"
            : "bg-sky-50 text-sky-700 ring-sky-200 hover:bg-sky-100")
        }
        title="Cliquer pour basculer banque / carte"
      >
        {isCard ? <CreditCard className="w-3.5 h-3.5"/> : <Building className="w-3.5 h-3.5"/>}
        {isCard ? 'CB' : 'Banque'}
      </button>
      {isCard && (
        <input
          type="text"
          value={cardNumber || ''}
          onChange={e => onCardChange(e.target.value)}
          placeholder="N°"
          className="w-16 px-2 py-1 text-xs rounded ring-1 ring-violet-200 bg-violet-50 text-violet-700 placeholder-violet-300 outline-none focus:bg-white focus:ring-violet-400 tabular-nums"
        />
      )}

};

/* =========================================================
   Expenses table
   ========================================================= */
const VarianceLabel = ({ planned, actual }) => {
  const a = Number(actual) || 0, p = Number(planned) || 0;
  if (a <= 0 || a === p) return null;
  const diff = a - p;
  const isOver = diff > 0;
  const sign = isOver ? '+' : '−';
  return (
    <div className={"text-[11px] mt-0.5 tabular-nums text-right " + (isOver ? "text-rose-600" : "text-emerald-600")}>
      {sign}{Math.abs(Math.round(diff)).toLocaleString('fr-FR')} vs prévu
    </div>
  );
};

const ReportedBadge = ({ from }) => {
  if (!from) return null;
  const [y, m] = from.split('-').map(Number);
  return (
    <div className="inline-flex items-center gap-1 mt-0.5 text-[11px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 ring-1 ring-amber-200">
      <CornerDownRight className="w-3 h-3"/>
      Reporté de {monthLabel(y, m)}
    </div>
  );
};

const SyntheticCardRow = ({ card, colSpan }) => {
  const isPaid = !!card.paidAt;
  return (
    <tr className="bg-violet-50/60 border-l-4 border-violet-400">
      <td colSpan={colSpan} className="px-3 py-2.5">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-2 text-violet-900 min-w-0">
            <CreditCard className="w-4 h-4 text-violet-600 flex-none"/>
            <span className="font-medium tabular-nums">Carte {card.cardNumber}</span>
            <span className="text-xs text-violet-700">— débit groupé prévu le <span className="tabular-nums">{fmtDateFR(card.debitDate)}</span></span>
          </div>
          <div className="flex items-center gap-3">
            <span className="font-semibold tabular-nums text-violet-900">
              {formatNum(card.upcomingAmount)} ₪
            </span>
            {isPaid
              ? <Badge tone="emerald"><Check className="w-3 h-3"/>Débité</Badge>
              : <Badge tone="gray">Attendu</Badge>}

};

const GroupedUnderCardBadge = ({ cardNumber }) => (
  <div className="inline-flex items-center gap-1 mt-0.5 text-[10px] px-1.5 py-0.5 rounded bg-stone-100 text-stone-500 ring-1 ring-stone-200">
    <CreditCard className="w-3 h-3"/>regroupé sous CB {cardNumber}
  </div>
);

// Calcule la clé de regroupement d'une expense pour la dimension choisie.
const expenseGroupKey = (e, by) => {
  if (by === 'type')   return (e.type || '').trim() || '— Sans type —';
  if (by === 'mode')   return e.mode === 'card' ? `Carte ${e.cardNumber || 'CB'}` : 'Banque';
  if (by === 'day')    return `Jour ${e.day || 1}`;
  if (by === 'status') return ({ unpaid: 'À payer', partial: 'Partiel', paid: 'Payé' })[expenseStatus(e)];
  if (by === 'name')   return ((e.name || '').trim() || '—').slice(0, 40);
  return '';
};
const sortGroupKeys = (keys, by) => {
  const arr = [...keys];
  if (by === 'day')    return arr.sort((a, b) => parseInt(String(a).replace(/\D/g, ''), 10) - parseInt(String(b).replace(/\D/g, ''), 10));
  if (by === 'status') { const o = { 'À payer': 0, 'Partiel': 1, 'Payé': 2 };
                          return arr.sort((a, b) => (o[a] ?? 9) - (o[b] ?? 9)); }
  if (by === 'mode')   { const o = { 'Banque': 0 };
                          return arr.sort((a, b) => (a in o ? 0 : 1) - (b in o ? 0 : 1) || String(a).localeCompare(String(b), 'fr')); }
  return arr.sort((a, b) => String(a).localeCompare(String(b), 'fr', { numeric: true }));
};

const ExpensesTable = ({ expenses, onAdd, onUpdate, onRemove, onRemoveMany, onReportUnpaid, hasPrevMonth, onExportExcel, onImportExcel, cardsForMonth }) => {
  const [selected, setSelected] = useState(() => new Set());
  const [sort, onSort] = useSort();
  const [groupBy, setGroupBy] = useState(null); // null | 'type' | 'mode' | 'day' | 'status' | 'name'
  const [collapsed, setCollapsed] = useState(() => new Set());

  useEffect(() => {
    const ids = new Set(expenses.map(e => e.id));
    setSelected(prev => {
      const next = new Set([...prev].filter(id => ids.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [expenses]);

  const toggleOne = (id) => setSelected(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const allSelected = expenses.length > 0 && selected.size === expenses.length;
  const toggleAll = () =>
    setSelected(allSelected ? new Set() : new Set(expenses.map(e => e.id)));
  const deleteSelected = () => {
    if (selected.size === 0) return;
    if (!confirm(`Supprimer ${selected.size} ligne${selected.size > 1 ? 's' : ''} ?`)) return;
    onRemoveMany([...selected]);
    setSelected(new Set());
  };
  const toggleGroup = (type) => setCollapsed(prev => {
    const next = new Set(prev);
    next.has(type) ? next.delete(type) : next.add(type);
    return next;
  });

  const valueOf = (e, f) => {
    if (f === 'status') return ({ unpaid: 0, partial: 1, paid: 2 })[expenseStatus(e)];
    return e[f];
  };
  const cardsByNumber = useMemo(
    () => new Map((cardsForMonth || []).map(c => [String(c.cardNumber), c])),
    [cardsForMonth]
  );
  const childrenByCard = useMemo(() => {
    const map = new Map();
    for (const e of expenses) {
      if (e.mode === 'card' && cardsByNumber.has(String(e.cardNumber))) {
        const arr = map.get(String(e.cardNumber)) || [];
        arr.push(e);
        map.set(String(e.cardNumber), arr);
      }
    }
    return map;
  }, [expenses, cardsByNumber]);
  const expensesNotGrouped = useMemo(
    () => expenses.filter(e => !(e.mode === 'card' && cardsByNumber.has(String(e.cardNumber)))),
    [expenses, cardsByNumber]
  );
  const sortedExpenses = useMemo(() => sortRows(expensesNotGrouped, sort, valueOf), [expensesNotGrouped, sort]);

  const groups = useMemo(() => {
    if (!groupBy) return null;
    const map = new Map();
    for (const e of sortedExpenses) {
      const k = expenseGroupKey(e, groupBy);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(e);
    }
    const sortedKeys = sortGroupKeys([...map.keys()], groupBy);
    return sortedKeys.map(type => {
      const items = map.get(type);
      return {
        type, items,
        planned: items.reduce((s, e) => s + (Number(e.amount) || 0), 0),
        paid:    items.reduce((s, e) => s + (Number(e.paid)   || 0), 0),
      };
    });
  }, [sortedExpenses, groupBy]);

  // Quand on change de dimension de regroupement, replier tous les groupes.
  useEffect(() => {
    if (groupBy && groups && groups.length > 0) {
      setCollapsed(new Set(groups.map(g => g.type)));
    } else if (!groupBy) {
      setCollapsed(new Set());
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [groupBy]);

  // Totaux : exclure les expenses regroupées sous une carte, ajouter les
  // synthétiques cartes (qui remplacent ces individuelles).
  const totalPlanned   =
    expensesNotGrouped.reduce((s, e) => s + (Number(e.amount) || 0), 0)
    + (cardsForMonth || []).reduce((s, c) => s + (Number(c.upcomingAmount) || 0), 0);
  const totalPaid      =
    expensesNotGrouped.reduce((s, e) => s + (Number(e.paid)   || 0), 0)
    + (cardsForMonth || []).reduce((s, c) => s + (c.paidAt ? (Number(c.upcomingAmount) || 0) : 0), 0);
  const totalRemaining = totalPlanned - totalPaid;

  const typeSuggestions = useMemo(
    () => [...new Set(expenses.map(e => (e.type || '').trim()).filter(Boolean))].sort(),
    [expenses]
  );

  const renderRow = (e, opts = {}) => (
    <tr key={e.id} className={"hover:bg-stone-50/60 align-top " + (selected.has(e.id) ? "bg-stone-50" : "") + (opts.childOf ? " bg-stone-50/40" : "")}>
      <td className="px-3 py-1.5">
        {opts.childOf ? <span className="inline-block w-4"/> : (
          <input type="checkbox" checked={selected.has(e.id)} onChange={() => toggleOne(e.id)}
            className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer"
            aria-label="Sélectionner la ligne"/>
        )}
      </td>
      <td className="px-2 py-1">
        {opts.childOf && <span className="inline-block w-4 text-stone-300 mr-1">↳</span>}
        <WrappingInput value={e.name} onChange={v => onUpdate(e.id, { name: v })} placeholder="Nom du fournisseur"/>
        <ReportedBadge from={e.reportedFrom}/>
        {opts.childOf && <GroupedUnderCardBadge cardNumber={opts.childOf}/>}
      </td>
      <td className="px-2 py-1">
        <input type="text" dir="auto" list="expense-types" value={e.type || ''}
          onChange={ev => onUpdate(e.id, { type: ev.target.value })}
          placeholder="—"
          className="w-full bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-stone-300 rounded px-2 py-1 text-stone-700"/>
      </td>
      <td className="px-2 py-1"><NumInput value={e.amount} onChange={v => onUpdate(e.id, { amount: v })}/></td>
      <td className="px-2 py-1"><NumInput value={e.day} onChange={v => onUpdate(e.id, { day: Math.max(1, Math.min(31, v || 1)) })} min={1} max={31}/></td>
      <td className="px-2 py-1.5">
        <ModeToggle value={e.mode} onChange={v => onUpdate(e.id, { mode: v })}
          cardNumber={e.cardNumber} onCardChange={v => onUpdate(e.id, { cardNumber: v })}/>
      </td>
      <td className="px-2 py-1">
        <NumInput value={e.paid} onChange={v => onUpdate(e.id, { paid: v })}/>
        <VarianceLabel planned={e.amount} actual={e.paid}/>
      </td>
      <td className="px-2 py-1.5"><ExpenseBadge status={expenseStatus(e)}/></td>
      <td className="px-2 py-1.5 text-right">
        <button onClick={() => onRemove(e.id)}
          className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded" title="Supprimer">
          <Trash className="w-4 h-4"/>
        </button>
      </td>
    </tr>
  );

  return (
    <section className="bg-white rounded-xl ring-1 ring-stone-200 overflow-hidden">
      <header className="flex items-center justify-between px-4 py-3 border-b border-stone-200 gap-3 flex-wrap">
        <div>
          <h2 className="font-semibold text-stone-900">Postes de dépense</h2>
          <p className="text-xs text-stone-500 mt-0.5">{expenses.length} poste{expenses.length > 1 ? 's' : ''}</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap justify-end">
          {selected.size > 0 && (
            <button onClick={deleteSelected}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-rose-600 text-white hover:bg-rose-700">
              <Trash className="w-4 h-4"/>Supprimer ({selected.size})
            </button>
          )}
          {onExportExcel && (
            <button onClick={onExportExcel} disabled={expenses.length === 0}
              title="Exporter le mois en Excel (.xlsx)"
              className={
                "inline-flex items-center gap-1 px-2.5 py-1.5 text-sm rounded-lg ring-1 ring-stone-200 " +
                (expenses.length === 0
                  ? "bg-white text-stone-300 cursor-not-allowed"
                  : "bg-white text-stone-700 hover:bg-stone-50")
              }>
              <Download className="w-4 h-4"/><span className="hidden sm:inline">Exporter</span>
            </button>
          )}
          {onImportExcel && (
            <button onClick={onImportExcel}
              title="Importer un fichier Excel de postes"
              className="inline-flex items-center gap-1 px-2.5 py-1.5 text-sm rounded-lg ring-1 ring-stone-200 bg-white text-stone-700 hover:bg-stone-50">
              <Upload className="w-4 h-4"/><span className="hidden sm:inline">Importer</span>
            </button>
          )}
          <label className={
              "inline-flex items-center gap-1.5 px-2 py-1 text-sm rounded-lg ring-1 " +
              (groupBy
                ? "bg-stone-900 text-white ring-stone-900"
                : "bg-white text-stone-700 ring-stone-200")
            }>
            <Layers className="w-4 h-4"/>
            <span className="text-xs opacity-80 hidden sm:inline">Grouper :</span>
            <select value={groupBy || ''}
              onChange={e => setGroupBy(e.target.value || null)}
              className={"text-sm bg-transparent outline-none cursor-pointer pr-1 " +
                (groupBy ? "text-white" : "text-stone-800")}>
              <option value="" className="text-stone-800">Aucun</option>
              <option value="type"   className="text-stone-800">Type</option>
              <option value="mode"   className="text-stone-800">Mode (Banque/CB)</option>
              <option value="day"    className="text-stone-800">Jour</option>
              <option value="status" className="text-stone-800">Statut</option>
              <option value="name"   className="text-stone-800">Fournisseur</option>
            </select>
          </label>
          {groupBy && groups && groups.length > 0 && (() => {
            const allCollapsed = groups.every(g => collapsed.has(g.type));
            const expandAll = () => setCollapsed(new Set());
            const collapseAll = () => setCollapsed(new Set(groups.map(g => g.type)));
            return (
              <button onClick={allCollapsed ? expandAll : collapseAll}
                title={allCollapsed ? "Tout déplier" : "Tout replier"}
                className="inline-flex items-center gap-1 px-2.5 py-1.5 text-sm rounded-lg bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-50">
                {allCollapsed
                  ? <><ChevronDown className="w-4 h-4"/><span className="hidden sm:inline">Tout déplier</span></>
                  : <><ChevronUp   className="w-4 h-4"/><span className="hidden sm:inline">Tout replier</span></>}
              </button>
            );
          })()}
          {onReportUnpaid && hasPrevMonth && (
            <button onClick={onReportUnpaid}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-50">
              <ArrowRight className="w-4 h-4"/>Reporter non-payés
            </button>
          )}
          <button onClick={onAdd}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-stone-900 text-white hover:bg-stone-800">
            <Plus className="w-4 h-4"/>Ajouter
          </button>
        </div>
      </header>

      <datalist id="expense-types">
        {typeSuggestions.map(t => <option key={t} value={t}/>)}
      </datalist>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="px-3 py-2 w-10">
                <input type="checkbox" checked={allSelected} onChange={toggleAll}
                  disabled={expenses.length === 0}
                  className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer disabled:cursor-not-allowed"
                  aria-label="Tout sélectionner"/>
              </th>
              <SortableTh field="name"   label="Fournisseur / poste" sort={sort} onSort={onSort} className="text-left"/>
              <SortableTh field="type"   label="Type"   sort={sort} onSort={onSort} className="text-left w-32"/>
              <SortableTh field="amount" label="Prévu"  sort={sort} onSort={onSort} className="text-right w-28"/>
              <SortableTh field="day"    label="Jour"   sort={sort} onSort={onSort} className="text-right w-16"/>
              <th className="text-left font-medium px-2 py-2 w-44">Mode</th>
              <SortableTh field="paid"   label="Payé"   sort={sort} onSort={onSort} className="text-right w-32"/>
              <SortableTh field="status" label="Statut" sort={sort} onSort={onSort} className="text-left w-28"/>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-stone-100">
            {expenses.length === 0 && (cardsForMonth || []).length === 0 && (
              <tr><td colSpan="9" className="px-4 py-6 text-center text-sm text-stone-400">
                Aucun poste pour ce mois.
              </td></tr>
            )}

/* =========================================================
   Incomes table

const IncomesTable = ({ incomes, onAdd, onUpdate, onRemove, onRemoveMany }) => {
  const [selected, setSelected] = useState(() => new Set());
  const [sort, onSort] = useSort();
  useEffect(() => {
    const ids = new Set(incomes.map(i => i.id));
    setSelected(prev => {
      const next = new Set([...prev].filter(id => ids.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [incomes]);

  const toggleOne = (id) => setSelected(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const allSelected = incomes.length > 0 && selected.size === incomes.length;
  const toggleAll = () =>
    setSelected(allSelected ? new Set() : new Set(incomes.map(i => i.id)));
  const deleteSelected = () => {
    if (selected.size === 0) return;
    if (!confirm(`Supprimer ${selected.size} ligne${selected.size > 1 ? 's' : ''} ?`)) return;
    onRemoveMany([...selected]);
    setSelected(new Set());
  };

  const valueOf = (i, f) => {
    if (f === 'status') return ({ pending: 0, partial: 1, received: 2 })[incomeStatus(i)];
    return i[f];
  };
  const sortedIncomes = useMemo(() => sortRows(incomes, sort, valueOf), [incomes, sort]);

  const totalPlanned   = incomes.reduce((s, i) => s + (Number(i.amount)   || 0), 0);
  const totalReceived  = incomes.reduce((s, i) => s + (Number(i.received) || 0), 0);
  const totalRemaining = totalPlanned - totalReceived;

  return (
    <section className="bg-white rounded-xl ring-1 ring-stone-200 overflow-hidden">
      <header className="flex items-center justify-between px-4 py-3 border-b border-stone-200">
        <div>
          <h2 className="font-semibold text-stone-900">Encaissements clients prévus</h2>
          <p className="text-xs text-stone-500 mt-0.5">{incomes.length} encaissement{incomes.length > 1 ? 's' : ''}</p>
        </div>
        <div className="flex items-center gap-2">
          {selected.size > 0 && (
            <button
              onClick={deleteSelected}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-rose-600 text-white hover:bg-rose-700"
            >
              <Trash className="w-4 h-4"/>Supprimer ({selected.size})
            </button>
          )}
          <button
            onClick={onAdd}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg bg-stone-900 text-white hover:bg-stone-800"
          >
            <Plus className="w-4 h-4"/>Ajouter
          </button>
        </div>
      </header>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide">
            <tr>
              <th className="px-3 py-2 w-10">
                <input
                  type="checkbox" checked={allSelected} onChange={toggleAll}
                  disabled={incomes.length === 0}
                  className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer disabled:cursor-not-allowed"
                  aria-label="Tout sélectionner"
                />
              </th>
              <SortableTh field="name"     label="Description" sort={sort} onSort={onSort} className="text-left"/>
              <SortableTh field="amount"   label="Prévu"       sort={sort} onSort={onSort} className="text-right w-28"/>
              <SortableTh field="day"      label="Jour"        sort={sort} onSort={onSort} className="text-right w-16"/>
              <SortableTh field="received" label="Reçu"        sort={sort} onSort={onSort} className="text-right w-28"/>
              <SortableTh field="status"   label="Statut"      sort={sort} onSort={onSort} className="text-left w-28"/>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-stone-100">
            {incomes.length === 0 && (
              <tr><td colSpan="7" className="px-4 py-6 text-center text-sm text-stone-400">
                Aucun encaissement prévu pour ce mois.
              </td></tr>
            )}
            {sortedIncomes.map((i) => (
              <tr key={i.id} className={"hover:bg-stone-50/60 align-top " + (selected.has(i.id) ? "bg-stone-50" : "")}>
                <td className="px-3 py-1.5">
                  <input
                    type="checkbox" checked={selected.has(i.id)} onChange={() => toggleOne(i.id)}
                    className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer"
                    aria-label="Sélectionner la ligne"
                  />
                </td>
                <td className="px-2 py-1">
                  <WrappingInput value={i.name} onChange={v => onUpdate(i.id, { name: v })} placeholder="Client / description"/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={i.amount} onChange={v => onUpdate(i.id, { amount: v })}/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={i.day} onChange={v => onUpdate(i.id, { day: Math.max(1, Math.min(31, v || 1)) })} min={1} max={31}/>
                </td>
                <td className="px-2 py-1">
                  <NumInput value={i.received} onChange={v => onUpdate(i.id, { received: v })}/>
                </td>
                <td className="px-2 py-1.5"><IncomeBadge status={incomeStatus(i)}/></td>
                <td className="px-2 py-1.5 text-right">
                  <button
                    onClick={() => onRemove(i.id)}
                    className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded"
                    title="Supprimer"
                  >
                    <Trash className="w-4 h-4"/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
          {incomes.length > 0 && (
            <tfoot className="bg-stone-50 text-sm">
              <tr className="font-medium">
                <td></td>
                <td className="px-2 py-2 text-stone-600">Totaux</td>
                <td className="px-2 py-2 text-right tabular-nums">{formatILS(totalPlanned)}</td>
                <td></td>
                <td className="px-2 py-2 text-right tabular-nums">{formatILS(totalReceived)}</td>
                <td className="px-2 py-2 text-emerald-700 tabular-nums">Reste {formatILS(totalRemaining)}</td>
                <td></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </section>
  );
};

            rose:    'bg-rose-50    ring-rose-200    text-rose-700',

};

const Row = ({ label, value, valueClass = "", bold = false }) => (
  <div className={"flex items-baseline justify-between " + (bold ? "font-semibold text-stone-900" : "text-stone-600")}>
    <dt>{label}</dt>
    <dd className={"tabular-nums " + valueClass}>{value}</dd>
  </div>
);

const EditableRow = ({ label, value, onChange, valueClass = "", bold = false, hint }) => {
  const [draft, setDraft] = useState(null);
  const display = draft != null ? draft : (Math.round(Number(value) || 0)).toString();
  const commit = () => {
    if (draft == null) return;
    const v = draft === '' ? 0 : Number(draft);
    if (!isNaN(v)) onChange(v);
    setDraft(null);
  };
  return (
    <div>
      <div className={"flex items-baseline justify-between gap-2 " + (bold ? "font-semibold text-stone-900" : "text-stone-600")}>
        <dt className="flex-none">{label}</dt>
        <dd className="flex-1 min-w-0">
          <input
            type="number" inputMode="decimal"
            value={display}
            onChange={e => setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setDraft(null); e.target.blur(); } }}
            placeholder="0"
            className={
              "w-full tabular-nums text-right bg-transparent rounded px-1.5 py-0.5 outline-none " +
              "hover:bg-stone-50 focus:bg-stone-50 focus:ring-1 focus:ring-stone-300 " +
              valueClass
            }
          />
        </dd>
      </div>
      {hint && <div className="text-[10px] text-stone-400 -mt-0.5">{hint}</div>}
    </div>
  );
};

const SortArrow = ({ active, dir }) => (
  <span className={"inline-block w-3 text-[10px] " + (active ? "text-stone-700" : "text-stone-300")}>
    {active ? (dir === 'asc' ? '▲' : '▼') : '↕'}
  </span>
);
const SortableTh = ({ field, label, sort, onSort, className = "" }) => (
  <th className={"font-medium px-2 py-2 " + className}>
    <button onClick={() => onSort(field)}
      className="inline-flex items-center gap-1 hover:text-stone-900 select-none uppercase tracking-wide cursor-pointer">
      <span>{label}</span>
      <SortArrow active={sort.by === field} dir={sort.dir}/>
    </button>
  </th>
);
const useSort = () => {
  const [sort, setSort] = useState({ by: null, dir: 'asc' });
  const onSort = (field) => setSort(s => {
    if (s.by !== field) return { by: field, dir: 'asc' };
    if (s.dir === 'asc')  return { by: field, dir: 'desc' };
    return { by: null, dir: 'asc' };
  });
  return [sort, onSort];
};
const sortRows = (rows, sort, valueOf = (r, f) => r[f]) => {
  if (!sort.by) return rows;
  const arr = [...rows];
  arr.sort((a, b) => {
    const av = valueOf(a, sort.by);
    const bv = valueOf(b, sort.by);
    let r;
    if (typeof av === 'number' && typeof bv === 'number') {
      r = (av || 0) - (bv || 0);
    } else {
      r = String(av || '').localeCompare(String(bv || ''), 'fr', { numeric: true, sensitivity: 'base' });
    }
    return sort.dir === 'asc' ? r : -r;
  });
  return arr;
};

  const ref = useRef(null);
  const handle = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      onFile(rows);
    } catch (err) {
      console.error(err);
      alert('Impossible de lire le fichier Excel : ' + err.message);
    }
  };
  const cls = variant === "primary"
    ? "bg-stone-900 text-white hover:bg-stone-800"
    : "bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-50";
  return (
    <>
      <input
        ref={ref} type="file" accept=".xlsx,.xls,.csv" onChange={handle} className="hidden"
      />
      <button
        onClick={() => ref.current?.click()}

  );
};

      const wb = XLSX.read(buf, { type: 'array' });

const groupTxByDescription = (txs) => {
  const groups = new Map();
  for (const t of txs) {
    const name = buildPosteName(t.description, t.details) || '—';
    const key = name;
    const existing = groups.get(key);
    const amt = Math.abs(Number(t.amount) || 0);
    if (existing) {
      existing.totalAmount += amt;
      existing.count++;
      if (!existing.firstDate || t.date < existing.firstDate) existing.firstDate = t.date;
    } else {
      groups.set(key, {
        name, cardNumber: '',
        totalAmount: amt, firstDate: t.date, count: 1,
      });
    }
  }
  return [...groups.values()];
};

const groupTxsForMode = (txs, mode) => {
  const groups = new Map();
  for (const t of txs) {
    const isCardTx = isCardDebit(t.description);
    const ref = (t.refKey || '').split('|')[0] || '';
    const useCard = mode === 'card' && isCardTx;
    const fullName = buildPosteName(t.description, t.details) || '—';
    const key = useCard ? `card:${ref}` : `name:${fullName}`;
    const amt = Math.abs(Number(t.amount) || 0);
    const existing = groups.get(key);
    if (existing) {
      existing.totalAmount += amt;
      existing.count++;
      if (!existing.firstDate || t.date < existing.firstDate) existing.firstDate = t.date;
    } else {
      groups.set(key, {
        name: useCard ? (t.description || '—') : fullName,
        cardNumber: useCard ? ref : '',
        totalAmount: amt, firstDate: t.date, count: 1,
      });
    }
  }
  return [...groups.values()];
};

const ImportedTransactionsModal = ({ open, currentMonthKey, onClose, onCreate, onDeleted }) => {
  const [allTxs, setAllTxs] = useState({});
  const [monthFilter, setMonthFilter] = useState(currentMonthKey);
  const [sourceFilter, setSourceFilter] = useState('all'); // all | bank | card
  const [dirFilter, setDirFilter] = useState('all');       // all | out | in
  const [selected, setSelected] = useState(() => new Set());
  const [sort, onSort] = useSort();

  useEffect(() => {
    if (!open) return;
    const txs = loadImportedTx();
    setAllTxs(txs);
    const months = [...new Set(Object.values(txs).map(t => t.monthKey).filter(Boolean))].sort().reverse();
    setMonthFilter(months.includes(currentMonthKey) ? currentMonthKey : (months[0] || currentMonthKey));
    setSourceFilter('all');
    setDirFilter('all');
    setSelected(new Set());
  }, [open, currentMonthKey]);

  const allTxList = useMemo(() =>
    Object.entries(allTxs).map(([refKey, t]) => ({ refKey, ...t })),
    [allTxs]);

  const availableMonths = useMemo(() => {
    const s = new Set(allTxList.map(t => t.monthKey).filter(Boolean));
    return [...s].sort().reverse();
  }, [allTxList]);

  const filtered = useMemo(() => {
    let list = allTxList.filter(t => t.monthKey === monthFilter);
    if (sourceFilter === 'bank') list = list.filter(t => !isCardDebit(t.description));
    if (sourceFilter === 'card') list = list.filter(t =>  isCardDebit(t.description));
    if (dirFilter === 'out') list = list.filter(t => Number(t.amount) > 0);
    if (dirFilter === 'in')  list = list.filter(t => Number(t.amount) < 0);
    if (sort.by) {
      const valueOf = (t, f) => {
        if (f === 'date')   return t.date;
        if (f === 'amount') return Math.abs(Number(t.amount) || 0);
        if (f === 'name')   return (t.description || '') + ' ' + (t.details || '');
        return t[f];
      };
      list = sortRows(list, sort, valueOf);
    } else {
      list.sort((a, b) => a.date.localeCompare(b.date));
    }
    return list;
  }, [allTxList, monthFilter, sourceFilter, dirFilter, sort]);

  const toggleOne = (refKey) => setSelected(prev => {
    const next = new Set(prev);
    next.has(refKey) ? next.delete(refKey) : next.add(refKey);
    return next;
  });
  const allSelected = filtered.length > 0 && filtered.every(t => selected.has(t.refKey));
  const toggleAll = () => setSelected(prev => {
    const next = new Set(prev);
    if (allSelected) for (const t of filtered) next.delete(t.refKey);
    else             for (const t of filtered) next.add(t.refKey);
    return next;
  });

  const selectedTxs = filtered.filter(t => selected.has(t.refKey));
  const selectedTotal = selectedTxs.reduce((s, t) => s + Math.abs(Number(t.amount) || 0), 0);

  const handleDelete = () => {
    if (selected.size === 0) return;
    const n = selected.size;
    if (!confirm(`Supprimer ${n} transaction${n > 1 ? 's' : ''} de l'index d'import ?\n\nVous pourrez les réimporter ensuite (elles ne seront plus considérées comme des doublons).`)) return;
    const idx = loadImportedTx();
    for (const refKey of selected) delete idx[refKey];
    saveImportedTx(idx);
    setAllTxs(idx);
    setSelected(new Set());
    onDeleted && onDeleted(n);
  };

  const monthIdx = availableMonths.indexOf(monthFilter);
  const goPrev = () => { if (monthIdx >= 0 && monthIdx < availableMonths.length - 1) {
    setMonthFilter(availableMonths[monthIdx + 1]); setSelected(new Set()); }};
  const goNext = () => { if (monthIdx > 0) {
    setMonthFilter(availableMonths[monthIdx - 1]); setSelected(new Set()); }};

  if (!open) return null;
  const targetLabel = (() => {
    if (!monthFilter) return '—';
    const [y, m] = monthFilter.split('-').map(Number);
    return monthLabel(y, m);
  })();

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl ring-1 ring-stone-200 w-full max-w-3xl flex flex-col max-h-[90vh]"
           onClick={e => e.stopPropagation()}>
        <header className="px-5 py-4 border-b border-stone-200 flex items-center justify-between gap-3 flex-wrap">
          <div className="min-w-0">
            <h3 className="font-semibold text-stone-900 text-lg">Transactions bancaires importées</h3>
            <p className="text-xs text-stone-500 mt-0.5">
              {availableMonths.length === 0
                ? "Aucune transaction indexée. Importez d'abord un relevé Hapoalim."
                : `${availableMonths.length} mois disponible${availableMonths.length > 1 ? 's' : ''} · les postes seront créés dans ${targetLabel}`}
            </p>
          </div>
          {availableMonths.length > 0 && (
            <div className="inline-flex items-center bg-white ring-1 ring-stone-200 rounded-lg overflow-hidden">
              <button onClick={goPrev} disabled={monthIdx === availableMonths.length - 1}
                className="p-1.5 text-stone-600 hover:bg-stone-50 disabled:text-stone-300 disabled:cursor-not-allowed">
                <ChevronLeft className="w-4 h-4"/>
              </button>
              <select value={monthFilter}
                onChange={e => { setMonthFilter(e.target.value); setSelected(new Set()); }}
                className="px-3 py-1 text-sm font-medium text-stone-900 bg-transparent outline-none cursor-pointer">
                {availableMonths.map(m => {
                  const [y, mm] = m.split('-').map(Number);
                  return <option key={m} value={m}>{monthLabel(y, mm)}</option>;
                })}
              </select>
              <button onClick={goNext} disabled={monthIdx <= 0}
                className="p-1.5 text-stone-600 hover:bg-stone-50 disabled:text-stone-300 disabled:cursor-not-allowed">
                <ChevronRight className="w-4 h-4"/>
              </button>
            </div>
          )}
        </header>

        <div className="px-5 py-3 border-b border-stone-100 flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-1.5">
            <span className="text-xs uppercase tracking-wide text-stone-500 font-medium mr-1">Source</span>
            <Pill active={sourceFilter === 'all'}  onClick={() => setSourceFilter('all')}>Toutes</Pill>
            <Pill active={sourceFilter === 'bank'} onClick={() => setSourceFilter('bank')}>Banque</Pill>
            <Pill active={sourceFilter === 'card'} onClick={() => setSourceFilter('card')}>Cartes</Pill>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="text-xs uppercase tracking-wide text-stone-500 font-medium mr-1">Direction</span>
            <Pill active={dirFilter === 'all'} onClick={() => setDirFilter('all')}>Toutes</Pill>
            <Pill active={dirFilter === 'out'} onClick={() => setDirFilter('out')}>Sorties</Pill>
            <Pill active={dirFilter === 'in'}  onClick={() => setDirFilter('in')}>Entrées</Pill>
          </div>
        </div>

        <div className="flex-1 overflow-auto">
          <table className="w-full text-sm">
            <thead className="bg-stone-50 text-stone-500 text-xs uppercase tracking-wide sticky top-0 z-10">
              <tr>
                <th className="px-3 py-2 w-10">
                  <input type="checkbox" checked={allSelected} disabled={filtered.length === 0}
                    onChange={toggleAll}
                    className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer disabled:cursor-not-allowed"
                    aria-label="Tout sélectionner"/>
                </th>
                <SortableTh field="date"   label="Date"    sort={sort} onSort={onSort} className="text-left w-16"/>
                <SortableTh field="name"   label="Libellé" sort={sort} onSort={onSort} className="text-left"/>
                <SortableTh field="amount" label="Montant" sort={sort} onSort={onSort} className="text-right w-28"/>
              </tr>
            </thead>
            <tbody className="divide-y divide-stone-100">
              {filtered.length === 0 ? (
                <tr><td colSpan="4" className="px-4 py-10 text-center text-sm text-stone-400">
                  Aucune transaction avec ces filtres.
                </td></tr>
              ) : filtered.map(t => {
                const isOut = Number(t.amount) > 0;
                const isCard = isCardDebit(t.description);
                return (
                  <tr key={t.refKey}
                      onClick={() => toggleOne(t.refKey)}
                      className={"hover:bg-stone-50/70 cursor-pointer " + (selected.has(t.refKey) ? "bg-stone-50" : "")}>
                    <td className="px-3 py-1.5">
                      <input type="checkbox" checked={selected.has(t.refKey)}
                        onChange={() => toggleOne(t.refKey)}
                        onClick={e => e.stopPropagation()}
                        className="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-400 cursor-pointer"/>
                    </td>
                    <td className="px-2 py-1.5 tabular-nums text-stone-600 text-xs">{fmtDayFR(t.date)}</td>
                    <td className="px-2 py-1.5">
                      <div className="flex items-center gap-1.5 min-w-0">
                        {isCard && <CreditCard className="w-3 h-3 text-violet-500 flex-none"/>}
                        <span className="truncate text-stone-800" dir="auto" title={t.description}>{t.description || '—'}</span>
                      </div>
                      {t.details && (
                        <div className="truncate text-[10px] text-stone-400 mt-0.5" dir="auto" title={t.details}>
                          {t.details}
                        </div>
                      )}
                    </td>
                    <td className={"px-2 py-1.5 text-right tabular-nums font-medium text-xs " +
                      (isOut ? "text-rose-600" : "text-emerald-600")}>
                      {isOut ? '−' : '+'} {formatNum(t.amount)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <footer className="px-5 py-3 border-t border-stone-200 flex items-center justify-between gap-3 flex-wrap">
          <div className="text-sm text-stone-600">
            <span className="font-medium text-stone-900">{selected.size}</span> sélectionnée{selected.size > 1 ? 's' : ''}
            {selected.size > 0 && (
              <> · <span className="tabular-nums font-medium text-stone-900">{formatILS(selectedTotal)}</span></>

          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <button onClick={handleDelete} disabled={selected.size === 0}
              title="Supprimer les transactions sélectionnées de l'index (permet de les réimporter)"

// Détecte si le poste cible d'une règle existe dans au moins un mois enregistré.
const isRuleOrphan = (rule) => {
  const targetName = (rule?.matchTo?.postName || '').trim();
  if (!targetName) return true;
  const itemsKey = rule.matchTo.type === 'expense' ? 'expenses' : 'incomes';
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('month:')) continue;
    try {
      const m = JSON.parse(localStorage.getItem(k));
      const arr = (m && m[itemsKey]) || [];
      if (arr.some(it => (it.name || '').trim() === targetName)) return false;
    } catch {}
  }
  return true;
};

const RuleForm = ({ initial, onSubmit, onCancel }) => {

  const suggestions = useMemo(() => {
    const set = new Set();
    const itemsKey = type === 'expense' ? 'expenses' : 'incomes';
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('month:')) continue;
      try {
        const m = JSON.parse(localStorage.getItem(k));
        for (const it of (m && m[itemsKey]) || []) {
          if (it.name) set.add(it.name);
        }
      } catch {}
    }
    return [...set].sort();

  const canSave = pattern.trim() && postName.trim();
  return (
    <div className="grid grid-cols-2 gap-3">
      <label className="col-span-2 text-xs font-medium text-stone-700">

      </label>
      <div className="col-span-2 flex items-center gap-3 text-xs text-stone-700">
        <label className="inline-flex items-center gap-1 cursor-pointer">
          <input type="radio" checked={patternType === 'contains'}
            onChange={() => setPatternType('contains')}/>
          Contient le texte
        </label>
        <label className="inline-flex items-center gap-1 cursor-pointer">
          <input type="radio" checked={patternType === 'regex'}
            onChange={() => setPatternType('regex')}/>

        </label>
      </div>
      <label className="text-xs font-medium text-stone-700">
        Direction
        <select value={type}
          onChange={e => { setType(e.target.value); setPostName(''); }}
          className="mt-1 w-full px-2 py-1.5 text-sm ring-1 ring-stone-200 rounded bg-white outline-none focus:ring-stone-400">

          className="mt-1 w-full px-2 py-1.5 text-sm ring-1 ring-stone-200 rounded outline-none focus:ring-stone-400"/>
